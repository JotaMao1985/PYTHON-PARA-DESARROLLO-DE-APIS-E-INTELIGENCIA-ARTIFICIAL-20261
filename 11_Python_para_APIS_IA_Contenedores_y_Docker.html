            );
        };

        /* ============================================================
           TRAZADOR — motor de traza paso a paso (exposición, no ejercicio)

           Aquí el estudiante MIRA una traza ejecutarse; en `TablaTraza` le toca
           hacerla. Por eso no califica nada y `verificar.py` no lo cuenta en la
           cuota de ejercicios: enseña el método que el E1 después evalúa.

           `pasos` lleva DELTAS, no el estado completo. Cada paso declara solo
           las variables que su instrucción cambia, el componente acumula el
           resto, y la celda que cambió se resalta. Escribir el estado entero en
           cada fila sería más largo y, sobre todo, escondería lo único que hay
           que ver: qué tocó esta instrucción y qué dejó igual.

               { linea: 4,                        // o {pseudo, python, r, vba}
                 estado: { interes: '2.160.000' },  // solo lo que cambia
                 nota: 'Ya hay capital y tasa, así que el interés se puede calcular.',
                 salida: SALIDA_INTERES }         // opcional, también por lenguaje

           `linea` admite objeto por lenguaje porque el número cambia —VBA añade
           `Sub` y `Dim`, Python no lleva declaraciones—, y `salida` también,
           porque lo impreso no coincide: Python saca `2,160,000` y R `2160000`.
           Los VALORES de las variables no: son los mismos en los cuatro, y
           hacérselo ver al estudiante es parte del objetivo.

           Lo ya ejecutado se calcula recorriendo los pasos dados, NO las líneas
           anteriores a la activa. En este capítulo daría igual —la secuencia va
           de arriba abajo—, pero los capítulos 4 y 5 heredan el componente y
           allí el flujo salta y se repite: «ya ejecutado» dejaría de coincidir
           con «todo lo que está más arriba».
        ============================================================ */
        const Trazador = ({ titulo = 'Traza paso a paso', enunciado, codigo, lang = 'pseudo', variables, pasos, nota }) => {
            const idiomas = lenguajesDe(codigo);
            const disponibles = idiomas.length ? idiomas : [lang];
            const [langActivo, cambiarLang] = useLenguajeActivo(disponibles, lang);

            // Cuántas instrucciones se han ejecutado, de 0 a n. El 0 no es un
            // caso degenerado: «antes de empezar, ninguna variable tiene valor»
            // es la primera fila de cualquier prueba de escritorio hecha a mano.
            const [hechos, setHechos] = useState(0);
            const ref = useRef(null);
            useTypeset(ref, [hechos, langActivo]);

            const total = pasos.length;
            const lineasAct = String(porLenguaje(codigo, langActivo)).split('\n');

            const lineaDe = (p) => {
                const v = Number(porLenguaje(p.linea, langActivo));
                return Number.isFinite(v) ? v : null;
            };

            // Estado acumulado tras cada paso, y qué claves cambió cada uno.
            const acumulado = [];
            const cambiadas = [];
            let estado = {};
            pasos.forEach(p => {
                estado = { ...estado, ...(p.estado || {}) };
                acumulado.push(estado);
                cambiadas.push(Object.keys(p.estado || {}));
            });

            const actual = hechos > 0 ? pasos[hechos - 1] : null;
            const lineaActiva = actual ? lineaDe(actual) : null;
            const ejecutadas = new Set(pasos.slice(0, hechos).map(lineaDe).filter(n => n !== null));
            const conSalida = pasos.some(p => p.salida !== undefined && p.salida !== null);

            const ir = (n) => setHechos(Math.max(0, Math.min(total, n)));

            // Sin tabla de teclas: un objeto indexado por `e.key` devolvería el
            // `toString` heredado si alguien pulsa una tecla con ese nombre.
            const teclado = (e) => {
                if (e.key === 'ArrowRight') { e.preventDefault(); ir(hechos + 1); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); ir(hechos - 1); }
                else if (e.key === 'Home') { e.preventDefault(); ir(0); }
                else if (e.key === 'End') { e.preventDefault(); ir(total); }
            };

            const instruccionDe = (p) => {
                const n = lineaDe(p);
                return n && lineasAct[n - 1] !== undefined ? lineasAct[n - 1].trim() : '—';
            };

            return (
                <div ref={ref} className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm">
                    <div className="flex items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-shoe-prints"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal rounded px-2 py-0.5">Traza guiada</span>
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}

                    <SelectorLenguaje disponibles={disponibles} activo={langActivo} onCambiar={cambiarLang} />

                    {/* La región entera es un solo destino de tabulación: dentro
                        hay hasta doce saltos directos, y hacer que el tabulador
                        los recorra uno a uno para llegar al final del bloque
                        convierte la navegación por teclado en un castigo. */}
                    <div tabIndex={0} onKeyDown={teclado} role="group"
                        aria-label={`${titulo}. Use las flechas izquierda y derecha para avanzar y retroceder.`}
                        className="rounded-xl outline-none focus:ring-2 focus:ring-secondary/60">

                    {/* Un solo desplazamiento horizontal para TODO el bloque, no
                        uno por línea: con `overflow-x` en cada línea, un móvil
                        de 375 px pinta una barra debajo de cada instrucción y
                        además cada línea se desplaza por su cuenta, de modo que
                        la sangría deja de alinear. El `min-w-max` interior le da
                        a todas las filas el ancho de la más larga, para que la
                        franja de la línea activa llegue hasta el final. */}
                        <div className="rounded-xl overflow-hidden border border-gray-700 bg-gray-900">
                            <div className="overflow-x-auto">
                                <div className="min-w-max">
                                    {lineasAct.map((l, i) => {
                                        const n = i + 1;
                                        const activa = n === lineaActiva;
                                        const hecha = ejecutadas.has(n);
                                        const cls = activa ? 'bg-amber-500/20 ring-1 ring-amber-400'
                                            : hecha ? 'bg-white/[0.04]' : '';
                                        return (
                                            <div key={i} className={`flex items-start gap-3 px-3 py-1 font-mono text-[0.82rem] transition-colors ${cls}`}>
                                                <span className="select-none w-6 text-right flex-shrink-0 text-gray-400">{n}</span>
                                                <span className={`select-none w-3 flex-shrink-0 ${activa ? 'text-amber-400' : 'text-gray-700'}`}>
                                                    {activa ? '▶' : hecha ? '·' : ' '}
                                                </span>
                                                <span className={`whitespace-pre ${activa ? 'text-white' : 'text-gray-100'}`}
                                                    dangerouslySetInnerHTML={{ __html: resaltar(l, langActivo) }} />
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        <div className="mt-3 flex items-center gap-2 flex-wrap">
                            <button onClick={() => ir(hechos - 1)} disabled={hechos === 0}
                                className="text-sm font-bold px-3.5 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5 disabled:opacity-40">
                                <i className="fas fa-chevron-left mr-1"></i>Anterior
                            </button>
                            <button onClick={() => ir(hechos + 1)} disabled={hechos === total}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white lp-gradient hover:opacity-90 disabled:opacity-40">
                                Siguiente<i className="fas fa-chevron-right ml-1"></i>
                            </button>
                            <button onClick={() => ir(0)} disabled={hechos === 0}
                                className="text-xs font-semibold text-gray-500 hover:text-primary underline disabled:opacity-40 disabled:no-underline">
                                <i className="fas fa-rotate-right mr-1"></i>Reiniciar
                            </button>
                            <span className="ml-auto text-xs text-gray-500">
                                Paso <strong className="text-primary">{hechos}</strong> de {total}
                                <span className="hidden sm:inline text-gray-500"> · flechas ← →</span>
                            </span>
                        </div>

                        <div className="mt-2 h-1 rounded-full bg-gray-100 overflow-hidden">
                            <div className="h-full lp-gradient transition-all duration-200"
                                style={{ width: `${total ? (hechos / total) * 100 : 0}%` }}></div>
                        </div>

                        <div className="mt-2 flex flex-wrap gap-1">
                            {pasos.map((p, i) => (
                                <button key={i} onClick={() => ir(i + 1)} aria-label={`Ir al paso ${i + 1}`}
                                    aria-current={hechos === i + 1 ? 'step' : undefined}
                                    className={`w-6 h-6 rounded text-[0.68rem] font-bold border transition-colors ${hechos === i + 1
                                        ? 'lp-gradient text-white border-transparent'
                                        : i < hechos ? 'bg-primary/10 text-primary border-primary/20'
                                            : 'bg-white text-gray-500 border-gray-200 hover:border-primary/40'}`}>
                                    {i + 1}
                                </button>
                            ))}
                        </div>

                        <p role="status" aria-live="polite" className="mt-3 mb-0 text-[0.9rem] text-gray-700 min-h-[2.6rem] rounded-lg px-3 py-2"
                            style={{ background: 'rgba(14,116,144,0.06)', borderLeft: '3px solid #0E7490' }}>
                            {actual
                                ? <><strong className="text-teal">Paso {hechos}.</strong> {actual.nota}</>
                                : <span className="text-gray-600">Aún no se ha ejecutado ninguna instrucción: ninguna variable tiene valor. Pulse <strong>Siguiente</strong>.</span>}
                        </p>

                        <div className="overflow-x-auto mt-3">
                            <table className="w-full text-sm border-collapse">
                                <thead>
                                    <tr>
                                        <th className="bg-primary/10 text-primary text-left px-2 py-2 border border-gray-200 font-semibold w-8">#</th>
                                        <th className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold">Instrucción</th>
                                        {variables.map(v => (
                                            <th key={v.clave} className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold whitespace-nowrap">
                                                {v.titulo || v.clave}
                                            </th>
                                        ))}
                                        {conSalida && <th className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold">Salida</th>}
                                    </tr>
                                </thead>
                                <tbody>
                                    {hechos === 0 && (
                                        <tr>
                                            <td colSpan={2 + variables.length + (conSalida ? 1 : 0)}
                                                className="px-3 py-3 border border-gray-200 text-gray-500 text-center italic">
                                                La tabla se llena a medida que avanza la traza.
                                            </td>
                                        </tr>
                                    )}
                                    {pasos.slice(0, hechos).map((p, i) => (
                                        <tr key={i} className={i === hechos - 1 ? 'bg-amber-50' : i % 2 ? 'bg-gray-50/60' : ''}>
                                            <td className="px-2 py-1.5 border border-gray-200 text-gray-500 text-center">{i + 1}</td>
                                            <td className="px-3 py-1.5 border border-gray-200 text-gray-700 font-mono text-[0.8rem]">{instruccionDe(p)}</td>
                                            {variables.map(v => {
                                                const cambio = cambiadas[i].includes(v.clave);
                                                const val = acumulado[i][v.clave];
                                                return (
                                                    <td key={v.clave}
                                                        className={`px-3 py-1.5 border border-gray-200 font-mono text-[0.82rem] ${cambio ? 'font-bold text-secondary-texto bg-secondary/5' : 'text-gray-700'}`}>
                                                        {val === undefined ? <span className="text-gray-300">—</span> : val}
                                                    </td>
                                                );
                                            })}
                                            {conSalida && (
                                                <td className="px-3 py-1.5 border border-gray-200 font-mono text-[0.8rem] text-teal">
                                                    {p.salida !== undefined && p.salida !== null
                                                        ? porLenguaje(p.salida, langActivo)
                                                        : <span className="text-gray-300">—</span>}
                                                </td>
                                            )}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {nota && <p className="text-xs text-gray-500 italic mt-3 mb-0">{nota}</p>}
                </div>
            );
        };
        /* === LP-CORE FIN === */

        /* ============================================================

                                                usuario). Cada contenedor obtiene su propia vista y no puede observar los
                                                procesos de otro contenedor o del anfitrión.</li>
                                            <li><strong>Control groups (<code>cgroups</code>).</strong> Limitan los recursos

                                            <li><strong>Despliegue como composición de piezas.</strong> Los orquestadores

                                        <h3>5.2 Encaje en el ciclo de desarrollo moderno</h3>

                                        <p>Un flujo típico para una API estadística contenerizada sigue estos pasos:</p>

                                        <ol>
                                            <li>Se escribe el código de la API junto con un <code>Dockerfile</code>.</li>
                                            <li>Cada <code>git push</code> dispara una integración continua (un servidor que ejecuta las pruebas de forma
                   automática en cada cambio) que ejecuta la suite de pytest sobre el código y, si pasa, ejecuta <code>docker build</code>.
                                            </li>
                                            <li>Si las pruebas pasan, la imagen se etiqueta con el hash del commit y se
                                                publica a un registro privado.</li>
                                            <li>El servidor de producción descarga la imagen y la ejecuta: es, byte a byte, la imagen
                   que se construyó en el flujo.</li>
                                        </ol>

                                        <Box type="info" label="Conexión con la Semana 10">

                                            El capítulo previo defendió la reproducibilidad <em>sin Docker</em> como una
                                            higiene mínima: fijar versiones, semillas y configuración. Docker no reemplaza
                                            esa higiene; la <em>amplifica</em>. Una imagen construida sobre dependencias
                                            flotantes seguirá siendo no determinista. Toda buena práctica de la semana 10
                   sigue vigente; lo que Docker añade es lo que aquella no podía fijar —el sistema operativo
                   y sus bibliotecas, por ejemplo BLAS— y la unidad de empaquetamiento.
                                        </Box>

                                        <h3>5.3 ¿Qué Docker no resuelve?</h3>
                                        <ul>
                                            <li>No corrige errores de modelado: una regresión mal especificada empaquetada en
                                                una imagen sigue mal especificada.</li>
                                            <li>No reemplaza una suite de pruebas: el contenedor garantiza el entorno, pero
                                                la lógica se sigue verificando con pytest.</li>
                                            <li>No reemplaza la documentación: el <code>Dockerfile</code> describe cómo se
                                                construye la imagen; el README sigue siendo necesario para describir <em>qué</em> hace la API.
                   </li>
                   <li>No congela lo que no se fijó: las dependencias transitivas sin fijar, las etiquetas
                       mutables y un <code>apt-get</code> sin versiones producen imágenes distintas en cada
                       construcción.</li>
                   </ul>

                   <p><strong>¿Por qué ahora?</strong> Porque ya existe algo que empaquetar: una API con
                   validación, persistencia y pruebas (semanas 4 a 10), y la semana 12 la despliega en
                   internet.</p>
            </div>
        );

        const DockerfileSection = () => (
            <div className="prose-lp">
                <p>Un <code>Dockerfile</code> es un archivo de texto plano, sin extensión, que
                                            contiene una secuencia ordenada de <strong>instrucciones</strong>. Las
                   instrucciones que cambian el contenido de la imagen (<code>FROM</code>, <code>COPY</code>, <code>RUN</code>) producen cada una una <strong>capa</strong>; las demás solo registran
                   metadatos (se precisa en 6.3). La metáfora útil
                                            es la de un manual de cocina: cada paso recibe el resultado del anterior y agrega
                                            algo encima.</p>

                                        <h3>6.1 Anatomía mínima</h3>

                                        <CodeBlock title="Dockerfile" lang="dockerfile" code={`# Dockerfile — versión didáctica mínima
FROM python:3.11.9-slim-bookworm

WORKDIR /app

COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

COPY app/ ./app/

EXPOSE 8000
CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]`} />

                                        <p>Cada palabra mayúscula es una instrucción reconocida por el motor de Docker.
                                            A continuación se describen las más importantes.</p>

                                        <h3>6.2 Instrucciones esenciales</h3>

                                        <table className="tabla-desplazable">
                                            <thead>
                                                <tr>
                                                    <th>Instrucción</th>
                                                    <th>Propósito</th>
                                                    <th>Ejemplo</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td><code>FROM</code></td>
                                                    <td>Declara la imagen base de la que se parte. Es la primera instrucción
                   (solo <code>ARG</code> puede precederla).</td>
                                                    <td><code>FROM python:3.11.9-slim-bookworm</code></td>
                                                </tr>
                                                <tr>
                                                    <td><code>WORKDIR</code></td>
                                                    <td>Establece el directorio de trabajo dentro de la imagen. Si no existe,
                                                        se crea.</td>
                                                    <td><code>WORKDIR /app</code></td>
                                                </tr>
                                                <tr>
                                                    <td><code>COPY</code></td>
                                                    <td>Copia archivos desde el contexto de construcción (lección 8) a la imagen.</td>
                                                    <td><code>COPY requirements.txt .</code></td>
                                                </tr>
                                                <tr>
                                                    <td><code>RUN</code></td>
                                                    <td>Ejecuta una orden en una capa nueva durante la construcción.</td>
                                                    <td><code>RUN pip install -r requirements.txt</code></td>
                                                </tr>
                                                <tr>
                                                    <td><code>ENV</code></td>
                                                    <td>Define una variable de entorno que persiste en imagen y contenedor.</td>
                                                    <td><code>ENV PYTHONUNBUFFERED=1</code></td>
                                                </tr>
                                                <tr>
                                                    <td><code>ARG</code></td>
                                                    <td>Define una variable disponible <em>solo</em> durante la construcción.</td>
                                                    <td><code>ARG APP_VERSION=0.1.0</code></td>
                                                </tr>
                                                <tr>
                                                    <td><code>EXPOSE</code></td>
                                                    <td>Documenta los puertos que la aplicación escucha. Es informativo: no
                                                        publica puertos por sí solo.</td>
                                                    <td><code>EXPOSE 8000</code></td>
                                                </tr>
                                                <tr>
                                                    <td><code>USER</code></td>
                                                    <td>Cambia el usuario que ejecutará las instrucciones siguientes y el
                                                        proceso del contenedor.</td>
                                                    <td><code>USER appuser</code></td>
                                                </tr>
                                                <tr>
                                                    <td><code>CMD</code></td>
                                                    <td>Define el comando por defecto del contenedor. Suele escribirse en <em>forma exec</em> (lista JSON).
                                                    </td>
                                                    <td><code>CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0"]</code></td>
                   </tr>
                                                <tr>
                                                    <td><code>ENTRYPOINT</code></td>
                                                    <td>Fija el ejecutable del contenedor. Combinado con <code>CMD</code> permite pasar argumentos por línea de comandos.</td>
                                                    <td><code>ENTRYPOINT ["uvicorn"]</code></td>
                   </tr>
                   <tr>
                       <td><code>HEALTHCHECK</code></td>
                       <td>Define un sondeo que Docker repite cada cierto tiempo para marcar el contenedor
                           como <code>healthy</code> o <code>unhealthy</code>. No lo reinicia por sí solo.</td>
                       <td><code>HEALTHCHECK CMD python -c "..."</code></td>
                   </tr>
                                            </tbody>
                                        </table>

                                        <Box type="tip" label="Del contenedor al navegador: EXPOSE, -p y --host">

                                            <code>EXPOSE 8000</code> solo <em>documenta</em> el puerto: no lo abre. Para llegar a la
                                            API desde el anfitrión hay que <strong>publicarlo</strong> al lanzar el contenedor, con <code>docker run -p 8000:8000</code> (formato <code>ANFITRIÓN:CONTENEDOR</code>). Y dentro
                                            del contenedor, Uvicorn debe escuchar en todas las interfaces: por defecto lo hace solo en <code>127.0.0.1</code>, es decir, únicamente para sí mismo, y el tráfico que entra por <code>-p</code> no llega hasta ahí. De ahí el <code>--host 0.0.0.0</code> del <code>CMD</code>.
                                        </Box>

                                        <h3>6.3 La imagen como una pila de capas</h3>

                                        <p>Las instrucciones <code>FROM</code>, <code>COPY</code>, <code>RUN</code> y <code>ADD</code> (y <code>WORKDIR</code>, cuando crea el directorio) añaden una capa nueva e inmutable con
                   contenido; <code>ENV</code>, <code>USER</code>, <code>EXPOSE</code> y <code>CMD</code> solo
                   anotan metadatos. La imagen final es la superposición de las capas, y al ejecutarla Docker
                   añade encima una capa delgada de lectura y escritura propia del contenedor. Una imagen
                   construida con el Dockerfile anterior tiene una estructura conceptual como esta:
                                        </p>

                                        <div className="layer-cake" role="img" aria-label="Pila de capas, de abajo arriba: imagen base, WORKDIR, COPY de requirements.txt, RUN pip install, COPY del código, metadatos de EXPOSE y CMD y, encima, la capa de lectura y escritura del contenedor">
                                            <div className="layer"><span className="layer-tag">CAPA 1</span> Imagen base <code>python:3.11.9-slim-bookworm</code></div>
                                            <div className="layer"><span className="layer-tag">CAPA 2</span> WORKDIR /app</div>
                                            <div className="layer"><span className="layer-tag">CAPA 3</span> COPY requirements.txt .</div>
                                            <div className="layer"><span className="layer-tag">CAPA 4</span> RUN pip install --no-cache-dir -r requirements.txt
                                            </div>
                                            <div className="layer"><span className="layer-tag">CAPA 5</span> COPY app/ ./app/</div>
                                            <div className="layer"><span className="layer-tag">METADATOS</span> EXPOSE 8000 · CMD [...] (no añaden contenido)</div>
                                            <div className="layer"><span className="layer-tag">CONTENEDOR</span> Capa de lectura y escritura: nace al ejecutar y se descarta con <code>docker rm</code></div>
                                        </div>
                                        <p className="text-xs text-gray-500 italic text-center mt-2 mb-4">Figura 6.1 — Las capas de la imagen son de solo lectura y se comparten
                                            entre imágenes; el contenedor añade encima la suya, que es donde escribe.</p>

                                        <Box type="info" label="Conexión con requirements.txt">

                                            Cada línea de <code>requirements.txt</code> describe un paquete Python; cada
                                            instrucción del <code>Dockerfile</code> describe una transformación del sistema
                                            de archivos. Ambas son listas declarativas y ordenadas que producen un entorno
                                            determinado a partir de un punto de partida conocido. La diferencia es de alcance: <code>requirements.txt</code> opera sobre el árbol de paquetes Python; el <code>Dockerfile</code> opera sobre la pila completa.
                                        </Box>

                                        <h3>6.4 Caché de capas: una optimización crítica</h3>

                                        <p>Docker calcula un <em>hash</em> de las entradas de cada instrucción: el contenido
                                            de los archivos copiados, los argumentos de <code>RUN</code> y el estado de la
                                            capa anterior. Si el hash coincide con uno ya almacenado, reutiliza la capa en
                                            lugar de reconstruirla.</p>

                                        <p>De ahí surge una regla de oro: <strong>se ordenan las instrucciones por
                                                estabilidad decreciente</strong>. Las instrucciones que cambian rara vez van
                                            arriba; las que cambian con frecuencia van abajo. Por eso el patrón <em>copiar primero <code>requirements.txt</code>, instalar dependencias y luego
                                                copiar el código</em> es estándar:
                                        </p>

                                        <ul>
                                            <li>Las dependencias cambian semanas o meses; el código cambia varias veces al
                                                día.</li>
                                            <li>Si el código cambia pero <code>requirements.txt</code> no, las capas 3 y 4 se
                   toman de la caché y la reconstrucción tarda segundos en lugar de minutos.</li>
                                        </ul>

                                        <CodeBlock lang="dockerfile" code={`# Fragmento de un Dockerfile (sin FROM ni WORKDIR)

# Anti-patrón: una sola instrucción COPY rompe la caché en cada cambio
COPY . .
RUN pip install --no-cache-dir -r requirements.txt

# Patrón correcto: dependencias primero, código después
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY app/ ./app/`} />

                                        <h3>6.5 Forma <em>exec</em> vs forma <em>shell</em></h3>

                                        <p>Las instrucciones <code>CMD</code>, <code>ENTRYPOINT</code> y <code>RUN</code> aceptan dos sintaxis:</p>

                                        <ul>
                                            <li><strong>Forma exec</strong> (lista JSON): <code>CMD ["uvicorn", "app.main:app"]</code>.
                                                El proceso se ejecuta sin shell intermedio. Es la forma recomendada porque
                                                permite que el proceso reciba directamente las señales del sistema operativo
                                                (<code>SIGTERM</code>, <code>SIGINT</code>) y termine limpiamente.</li>
                                            <li><strong>Forma shell</strong>: <code>CMD uvicorn app.main:app</code>. El motor
                                                envuelve la orden en <code>/bin/sh -c</code>. La señal <code>SIGTERM</code> llega al shell y no al proceso de Python, lo que puede impedir un cierre
                                                limpio.</li>
                                        </ul>

                                        <Box type="warn" label="Cierre limpio">

                                            Una API estadística que no responde a <code>SIGTERM</code> deja peticiones a
                                            medias y conexiones de base de datos abiertas. Al detener un contenedor, Docker envía <code>SIGTERM</code> y, si el proceso no termina en
                   10 segundos, lo mata con <code>SIGKILL</code>: con la forma exec, <code>docker stop</code> de una API
                   Uvicorn tardó menos de un segundo; con la forma shell, los 10 segundos completos. Se recomienda
                   usar la forma exec en producción.
                                        </Box>

                                        <Box type="tip" label="Cuando el puerto lo decide la plataforma">

                                            La forma exec no expande variables de entorno: <code>"--port", "$PORT"</code> pasaría
                                            a Uvicorn la cadena literal <code>$PORT</code>. Plataformas como Render o Railway
                                            (semana 12) asignan el puerto en esa variable, así que allí el <code>CMD</code> se
                                            escribe con un shell que la lea y con <code>exec</code>, para que Uvicorn siga siendo
                                            el proceso principal y reciba <code>SIGTERM</code>:
                                            <CodeBlock lang="dockerfile" code={`CMD ["sh", "-c", "exec uvicorn app.main:app --host 0.0.0.0 --port \${PORT:-8000}"]`} />
                                            El mismo patrón sirve para ejecutar una orden antes de arrancar, por ejemplo las
                                            migraciones de Alembic: <code>sh -c "alembic upgrade head &amp;&amp; exec uvicorn …"</code>.
                                        </Box>
            </div>
        );

            <div className="prose-lp">
                <p>La elección de la imagen base condiciona el tamaño, la seguridad y la rapidez de
                                            construcción de la imagen. La imagen empleada en este curso es <code>python:3.11.9-slim-bookworm</code>. Conviene desmenuzar su nombre.
                                        </p>

                                        <h3>7.1 Lectura de la etiqueta</h3>

                                        <table className="tabla-desplazable">
                                            <thead>
                                                <tr>
                                                    <th>Componente</th>
                                                    <th>Significado</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td><code>python</code></td>
                                                    <td>Repositorio oficial de imágenes con el intérprete CPython preinstalado,

                                                </tr>
                                                <tr>
                                                    <td><code>3.11.9</code></td>

                                                </tr>
                                                <tr>
                                                    <td><code>slim</code></td>
                                                    <td>Variante recortada: incluye lo mínimo para ejecutar Python y <code>pip</code>; omite documentación, <em>locales</em> extensos y
                                                        herramientas auxiliares de Debian.
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td><code>bookworm</code></td>
                                                    <td>Nombre en clave de la distribución base: <strong>Debian 12</strong>,
                                                        publicada el 10 de junio de 2023. Desde la salida de Debian 13
                   («trixie») es la versión anterior (<em>oldstable</em>), con soporte de largo plazo

                                                </tr>
                                            </tbody>
                                        </table>

                                        <h3>7.2 ¿Por qué esta variante y no otra?</h3>

                                        <p>El repositorio <code>python</code> ofrece varias variantes. Su elección obedece a
                                            un compromiso entre tamaño, compatibilidad y seguridad:</p>

                                        <table className="tabla-desplazable">
                                            <thead>
                                                <tr>
                                                    <th>Variante</th>
                                                    <th>Tamaño aproximado</th>
                                                    <th>Cuándo se elige</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <tr>
                                                    <td><code>python:3.11.9</code> (Debian completa)</td>
                                                    <td>≈ 1 GB</td>
                                                    <td>Útil cuando se requieren muchas bibliotecas del sistema; ineficiente
                                                        en producción.</td>
                                                </tr>
                                                <tr>
                                                    <td><code>python:3.11.9-slim-bookworm</code></td>
                                                    <td>≈ 130–150 MB</td>
                                                    <td>Punto de partida estándar para APIs Python en producción. <strong>Elección de este curso.</strong>
                                                    </td>
                                                </tr>
                                                <tr>
                                                    <td><code>python:3.11.9-alpine</code></td>
                                                    <td>≈ 50 MB</td>
                                                    <td>La más pequeña, pero usa <code>musl</code> en lugar de <code>glibc</code>: algunas bibliotecas científicas (scikit-learn, PyTorch) no
                   publican <em>wheels</em> —paquetes ya compilados que <code>pip</code> instala sin compilar— para <code>musl</code> y obligan a compilar, alargando los
                   tiempos de construcción, y las diferencias de <code>libc</code> pueden causar
                   fallos sutiles.
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>

                                        <GraficaImagenBase caption="Figura 7.1 — La variante slim-bookworm ocupa una fracción de la imagen completa sin renunciar a la compatibilidad binaria con glibc que exigen las wheels oficiales del ecosistema científico de Python. Tamaños aproximados, descomprimidos, para linux/amd64." />

                                        <p>Las cifras son tamaños descomprimidos para <code>linux/amd64</code>. Docker Hub anuncia el
                                            tamaño <em>comprimido</em>, mucho menor (unos 50 MB para <code>slim</code>), y en un Mac con
                                            procesador Apple la imagen es <code>arm64</code> y algo mayor (unos 170 MB para <code>slim</code>).</p>

                                        <Box type="tip" label="Recomendación">

                                            Para una API estadística que dependa del ecosistema científico de Python
                                            (NumPy, SciPy, pandas, scikit-learn, statsmodels), <code>slim-bookworm</code> es
                                            el equilibrio práctico. Las <em>wheels</em> oficiales de PyPI son compatibles y
                                            el tamaño final es razonable.
                                        </Box>

                                        <h3>7.3 ¿Qué incluye y qué no incluye?</h3>

                                        <p>La variante <em>slim</em> incluye:</p>
                                        <ul>
                                            <li>El intérprete CPython 3.11.9 con su biblioteca estándar.</li>
                                            <li><code>pip</code>, <code>setuptools</code> y un pequeño conjunto de utilidades
                                                de Debian (<code>apt-get</code>, <code>dpkg</code>).</li>
                                            <li>Un puñado de librerías compartidas necesarias para arrancar Python.</li>
                                        </ul>

                                        <p>Y deja fuera, entre otras cosas:</p>
                                        <ul>
                                            <li>Compiladores (<code>gcc</code>, <code>g++</code>, <code>build-essential</code>).</li>
                                            <li>Cabeceras de desarrollo (<code>python3-dev</code>, <code>libssl-dev</code>).</li>
                                            <li>Herramientas comunes como <code>git</code>, <code>curl</code>, <code>wget</code> o <code>vim</code>.
                                            </li>
                                        </ul>

                                        <Box type="info" label="Cuando una dependencia exige compilar">

                                            Si una biblioteca científica no provee <em>wheel</em> para Linux (x86_64 o arm64) y
                   requiere compilación (caso poco frecuente con NumPy, SciPy o scikit-learn, pero
                                            posible con paquetes menos comunes), conviene instalar <code>build-essential</code> en una etapa temporal (<em>builder</em>) y
                                            descartarla en la imagen final. Este patrón se desarrolla en la lección 9.
                                        </Box>

                                        <h3>7.4 Fijación explícita de la versión</h3>

                                        <p>Existe la tentación de escribir <code>FROM python:3.11-slim</code>. Esto produce
                                            una imagen reproducible <em>hoy</em>, pero no <em>mañana</em>: la etiqueta flotante <code>3.11</code> apunta al último parche disponible. Una reconstrucción meses
                                            después puede traer <code>3.11.10</code> o <code>3.11.12</code> y, con ello,
                                            cambios sutiles en el intérprete.
                                        </p>

                                        <p>Para una API estadística, donde la reproducibilidad numérica importa, se prefiere
                   la versión completa:</p>

                                        <CodeBlock lang="dockerfile" code={`# Ejemplos alternativos: en un Dockerfile real se escribe UNA sola línea FROM.

# No recomendado: la versión flota.
FROM python:3.11-slim

# Recomendado: versión exacta.
FROM python:3.11.9-slim-bookworm

# Reproducibilidad máxima: hash criptográfico de la imagen (el de abajo es ilustrativo).
# El hash se obtiene con: docker pull python:3.11.9-slim-bookworm
# y luego: docker inspect python:3.11.9-slim-bookworm --format='{{index .RepoDigests 0}}'
# (el resultado tiene la forma python@sha256:…; se pega tras la etiqueta, como abajo)
FROM python:3.11.9-slim-bookworm@sha256:abc123...def`} />

                                        <p>Fijar el hash digest (<code>@sha256:...</code>) es la forma más estricta de
                                            reproducibilidad: garantiza que el contenido de la imagen base es bit a bit el
                                            mismo, incluso si la etiqueta cambia.</p>

                                        <p>Fijar no es congelar: una imagen fijada no recibe los parches de seguridad de
                                            Debian ni de CPython que aparecen después. El curso la fija para que todos trabajen con
                                            la misma base y sus resultados sean comparables; en un proyecto que se mantiene, la
                                            versión se sube de forma deliberada cada cierto tiempo, con las pruebas en verde y tras
                                            escanear la imagen (apartado 12.2).</p>
            </div>
        );

        const ContextoSection = () => (
            <div className="prose-lp">
                <p>Al ejecutar <code>docker build .</code> el cliente de Docker (la orden <code>docker</code>)
                   no construye la imagen por sí mismo: empaqueta el directorio actual y lo envía al <em>daemon</em>, el proceso del motor de Docker que efectivamente la construye
                   (normalmente en la misma máquina).
                                            Ese paquete recibe el nombre de <strong>contexto de construcción</strong>.</p>

                                        <h3>8.1 Definición precisa</h3>

                                        <p>El contexto es el árbol de archivos enraizado en el directorio que se pasa como
                                            último argumento a <code>docker build</code>. La instrucción <code>COPY</code> solo puede leer archivos que estén dentro de ese árbol; no puede escapar hacia
                                            rutas absolutas del anfitrión ni navegar fuera con <code>..</code>.</p>

                                        <CodeBlock lang="shell" code={`cd regresion-api
docker build -t regresion-api:0.1.0 .`} />

                                        <p>La salida de BuildKit, abreviada, se parece a esta:</p>

                                        <CodeBlock lang="text" code={`[+] Building 12.4s (10/10) FINISHED
 => transferring context: 482.31kB                              0.1s
 => [internal] load build definition from Dockerfile             0.0s
 => [1/5] FROM docker.io/library/python:3.11.9-slim-bookworm     2.1s
 => [2/5] WORKDIR /app                                            0.0s
 => [3/5] COPY requirements.txt .                                 0.0s
 => [4/5] RUN pip install --no-cache-dir -r requirements.txt    8.7s
 => [5/5] COPY app/ ./app/                                        0.1s
 => exporting to image                                            1.4s`} />

                                        <p>La línea <em>transferring context</em> indica que se enviaron 482 KB al daemon. En
                                            proyectos descuidados ese número puede crecer hasta varios gigabytes.</p>

                                        <h3>8.2 El archivo <code>.dockerignore</code></h3>

                                        <p>El mecanismo principal para controlar qué se envía al daemon es el archivo <code>.dockerignore</code>, situado en la raíz del contexto. Su sintaxis se parece a la
                   de <code>.gitignore</code>, con una diferencia que importa: los patrones parten de la raíz del
                   contexto, así que <code>__pycache__</code> a secas solo excluye la carpeta de la raíz; para
                   excluir a cualquier profundidad se escribe <code>**/__pycache__</code>. Un <code>.dockerignore</code> razonable
                                            para una API estadística incluye:
                                        </p>

                                        <CodeBlock title=".dockerignore" lang="text" code={`# .dockerignore
# Los patrones parten de la raíz del contexto: «**/» los aplica a cualquier profundidad.

# Control de versiones
.git
.gitignore
.gitattributes

# Entornos virtuales locales (no se reutilizan dentro de la imagen)
.venv
venv
env

# Cachés de Python
**/__pycache__
**/*.pyc
**/*.pyo
.pytest_cache
.mypy_cache
.ruff_cache

# Notebooks de exploración (suelen contener datos crudos voluminosos)
notebooks/
**/.ipynb_checkpoints

# Datos crudos, bases de datos locales y artefactos pesados
data/raw/
data/interim/
**/*.csv
**/*.parquet
**/*.feather
**/*.db
**/*.sqlite3

# Configuración local sensible
**/.env
**/.env.*
**/*.pem
**/*.key

# Documentación e IDE
README.md
docs/
.idea/
.vscode/
**/*.swp

# El propio Dockerfile no se necesita dentro de la imagen
Dockerfile
.dockerignore`} />

                                        <h3>8.3 ¿Por qué importa tanto este archivo?</h3>

                                        <ol>
                                            <li><strong>Velocidad.</strong> Cada byte sobrante se transfiere y se sube por la
                                                red a registros remotos.</li>
                                            <li><strong>Seguridad.</strong> Sin <code>.dockerignore</code>, un archivo <code>.env</code> con credenciales puede acabar dentro de la imagen y
                                                publicarse al registro. La regla práctica es: <em>todo lo que no debería
                                                    copiarse, debe ignorarse explícitamente</em>.
                                            </li>
                                            <li><strong>Caché.</strong> Cuando la instrucción <code>COPY . .</code> incluye
                                                archivos volátiles (logs, cachés de tests), su hash cambia constantemente y
                                                la caché se invalida en cada construcción, alargando los tiempos.</li>
                                        </ol>

                                        <Box type="warn" label="Riesgo de fuga de credenciales">

                                            Un <code>.env</code> con la contraseña de la base de datos copiado a una imagen
                                            queda registrado en una capa permanente. Aunque luego se elimine con un <code>RUN rm</code>, la capa anterior <em>sigue</em> conservando el archivo. La
                                            única protección efectiva es no copiarlo nunca: para eso sirven <code>.dockerignore</code> y, cuando un secreto hace falta durante la construcción, <code>RUN --mount=type=secret</code> (nunca <code>ARG</code> ni <code>ENV</code>, que
                   quedan registrados en la imagen). En ejecución, las credenciales se inyectan como
                   variables de entorno (semana 8).
                                        </Box>

                                        <h3>8.4 Verificación práctica</h3>

                                        <p>Para inspeccionar exactamente qué archivos llegarían al daemon antes de construir
                                            la imagen, puede prepararse un contexto de prueba:</p>

                                        <CodeBlock lang="shell" code={`docker build --no-cache --progress=plain --output type=cacheonly -f - . <<'EOF'
FROM python:3.11.9-slim-bookworm
COPY . /ctx
RUN find /ctx -type f | sort
EOF`} />

                                        <p>Esta orden construye una imagen desechable (con <code>--output type=cacheonly</code> no deja ninguna) que solo copia el
                   contexto y, en el registro de la construcción, lista cada archivo que llegó a ella: el contexto real, con el <code>.dockerignore</code> aplicado tal como lo aplica Docker. (<code>tar --exclude-from</code> no sirve para esto: compara los patrones a cualquier profundidad y no entiende <code>**</code> ni <code>!</code>, así que puede mostrar como excluidos archivos que Docker sí enviaría.) Es
                   una herramienta valiosa para auditar contextos sospechosamente grandes.</p>
            </div>
        );

        const MultistageSection = () => (
            <div className="prose-lp">
                <p>Una primera versión de un Dockerfile suele mezclar dos preocupaciones distintas: <em>construir</em> el software (compilar, instalar herramientas de desarrollo,
                                            ejecutar pruebas) y <em>ejecutarlo</em> (servir peticiones HTTP). El resultado
                                            contiene compiladores, cabeceras y artefactos intermedios que en producción son
                                            superfluos y, peor aún, agrandan la superficie de ataque.
                                        </p>

                                        <p>Los <strong>multi-stage builds</strong>, disponibles desde Docker 17.05, resuelven
                                            el problema dividiendo el Dockerfile en <em>etapas</em>. Cada etapa empieza con
                                            una nueva instrucción <code>FROM</code> y puede copiar selectivamente artefactos
                                            de las anteriores con <code>COPY --from=...</code>.</p>

                                        <h3>9.1 Esquema general</h3>

                                        <CodeBlock lang="dockerfile" code={`# Etapa 1: builder — todo lo que solo hace falta durante la construcción
FROM python:3.11.9-slim-bookworm AS builder
# ... instalar compiladores, descargar dependencias, compilar wheels ...

# Etapa 2: runtime — la imagen final que se entrega a producción
FROM python:3.11.9-slim-bookworm AS runtime
COPY --from=builder /opt/venv /opt/venv
# ... copiar el código y arrancar la aplicación ...`} />

                                        <p>La imagen final, identificada por la etapa con la última instrucción <code>FROM</code> (o por una etapa nombrada con <code>--target</code>), contiene
                   la imagen base de esa etapa más lo que se copió explícitamente. Las herramientas de la etapa <em>builder</em> no aparecen en el resultado.
                                        </p>

                                        <h3>9.2 Ventajas concretas</h3>

                                        <ol>
                                            <li><strong>Reducción de tamaño.</strong> Un Dockerfile mono-etapa que necesita
                   compilar y conserva el compilador puede pesar unos 750 MB; el mismo proyecto en
                   multi-stage queda en unos 450 MB (−40 %). Si ninguna dependencia necesita compilar, un
                   mono-etapa sin compiladores pesa lo mismo: el multi-stage no adelgaza más, permite
                   compilar sin cargar con el compilador.</li>
                                            <li><strong>Separación de dependencias.</strong> Las dependencias de <em>construcción</em> (compiladores, cabeceras) viven solo en el builder; las
                                                de <em>ejecución</em> (la API y sus paquetes Python) viven en runtime.
                                            </li>
                                            <li><strong>Superficie de ataque más pequeña.</strong> Sin compiladores ni
                   cabeceras de desarrollo en producción (y, con un <code>USER</code> sin privilegios, sin
                   poder instalar nada con <code>apt</code>), un atacante que logre ejecutar
                   código tiene menos herramientas para escalar privilegios.</li>
                                            <li><strong>Reutilización de etapas.</strong> Una misma etapa <em>builder</em> puede alimentar varias imágenes finales (API, worker, job batch) sin
                                                duplicar la instalación de dependencias.</li>
                                            <li><strong>Construcción paralela.</strong> Etapas independientes pueden
                                                construirse en paralelo cuando se utiliza el motor BuildKit.</li>
                                        </ol>

                                        <h3>9.3 Patrón recomendado para Python</h3>

                                        <p>El patrón más común instala las dependencias en un entorno virtual dentro del
                                            builder y copia ese entorno virtual completo a la etapa de runtime. Así se evita
                                            reinstalar paquetes en la imagen final.</p>

                                        <CodeBlock title="Dockerfile" lang="dockerfile" code={`# Dockerfile: patrón multietapa recomendado para Python

# ============================================================
# Etapa 1 — builder
# ============================================================
FROM python:3.11.9-slim-bookworm AS builder

ENV PYTHONDONTWRITEBYTECODE=1 \\
    PYTHONUNBUFFERED=1 \\
    PIP_NO_CACHE_DIR=1 \\
    PIP_DISABLE_PIP_VERSION_CHECK=1

# build-essential solo se necesita para compilar wheels que no
# lleguen precompiladas; se descarta junto con esta etapa.
RUN apt-get update \\
 && apt-get install -y --no-install-recommends build-essential \\
 && rm -rf /var/lib/apt/lists/*

# Entorno virtual aislado en /opt/venv. Se puede copiar a la etapa runtime
# porque ambas etapas usan la misma imagen base y la misma ruta.
RUN python -m venv /opt/venv
ENV PATH="/opt/venv/bin:$PATH"

WORKDIR /build
COPY requirements.txt .
RUN pip install -r requirements.txt

# ============================================================
# Etapa 2 — runtime
# ============================================================
FROM python:3.11.9-slim-bookworm AS runtime

ENV PYTHONDONTWRITEBYTECODE=1 \\
    PYTHONUNBUFFERED=1 \\
    PATH="/opt/venv/bin:$PATH"

# Usuario no privilegiado para ejecutar la aplicación.
RUN groupadd --system --gid 1001 appgroup \\
 && useradd --uid 1001 --gid appgroup --create-home appuser

WORKDIR /app

# Solo se trae el entorno virtual: ni compiladores ni cachés de apt.
COPY --from=builder /opt/venv /opt/venv

# Código de la aplicación: propiedad de root y de solo lectura para appuser.
COPY app/ ./app/

USER appuser

EXPOSE 8000
CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]`} />

                                        <h3>10.2 Modelo entrenado fuera de línea</h3>

                                        <p>Para mantener el ejemplo autocontenido, el modelo se reduce a una regresión
                                            lineal univariada con coeficientes precalculados. En un proyecto real este
                   archivo lo produciría un script de entrenamiento separado (idealmente
                   versionado). El archivo, <code>app/modelo.json</code>, guarda los coeficientes de <em>y</em> = 2.3·<em>x</em> + 1.7 y el dominio de entrenamiento; un JSON no admite
                   comentarios, así que esa explicación va aquí y no dentro del archivo:</p>

                                        <CodeBlock title="app/modelo.json" lang="json" code={`{
    "version": "0.1.0",
    "intercepto": 1.7,
    "pendiente": 2.3,
    "x_min": -10.0,
    "x_max": 10.0
}`} />

                                        <h3>10.3 Carga del modelo (<code>app/modelo.py</code>)</h3>

                                        <CodeBlock title="app/modelo.py" lang="python" code={`# app/modelo.py
from __future__ import annotations

import json
from dataclasses import dataclass
from functools import lru_cache
from pathlib import Path

RUTA_MODELO = Path(__file__).parent / "modelo.json"


@dataclass(frozen=True)
class ModeloRegresion:
    """Regresión lineal simple con coeficientes inmutables."""
    version: str
    intercepto: float
    pendiente: float
    x_min: float
    x_max: float

    def predecir(self, x: float) -> float:
        return self.intercepto + self.pendiente * x


@lru_cache(maxsize=1)
def cargar_modelo() -> ModeloRegresion:
    """Carga el modelo desde disco una sola vez por proceso."""
    with RUTA_MODELO.open("r", encoding="utf-8") as f:
        datos = json.load(f)
    return ModeloRegresion(**datos)`} />

                                        <p>La función <code>cargar_modelo</code>, decorada con <code>@lru_cache</code>, se
                                            integra con el patrón de inyección de dependencias visto en la semana 8: actúa
                   como un <em>proveedor</em> reutilizable (<em>provider</em>), costoso la primera vez y barato
                   después.</p>

                                        <h3>10.4 Esquemas Pydantic (<code>app/schemas.py</code>)</h3>

                                        <CodeBlock title="app/schemas.py" lang="python" code={`# app/schemas.py
from pydantic import BaseModel, Field, field_validator


class EntradaPrediccion(BaseModel):
    x: float = Field(..., description="Variable explicativa")

    @field_validator("x")
    @classmethod
    def validar_rango(cls, valor: float) -> float:
        if not -1000.0 <= valor <= 1000.0:
            raise ValueError("x debe pertenecer a [-1000, 1000]")
        return valor


class SalidaPrediccion(BaseModel):
    y_hat: float = Field(..., description="Predicción del modelo")
    extrapolado: bool = Field(
        ...,
        description="True si x cae fuera del rango observado en entrenamiento",
    )
    version_modelo: str = Field(
        ...,
        description="Versión semántica del modelo servido",
    )`} />

                                        <p>La validación con <code>@field_validator</code> y la respuesta automática HTTP
                                            422 frente a cargas útiles inválidas son herencia directa de las semanas 4, 6 y 7
                   (Pydantic y FastAPI). La pieza nueva es que el contenedor las preserva
                   exactamente igual al desplegarse; el apartado 10.11 lo comprueba.</p>

                                        <Box type="info" label="Dos rangos, dos propósitos">

                                            Conviene distinguir los dos rangos que aparecen sobre <code>x</code>:
                                            <ul>
                                                <li>El <strong>rango de validación</strong> de Pydantic
                                                    (<code>[-1000, 1000]</code>) protege a la API de entradas absurdas o
                                                    mal formadas; al violarlo, la API devuelve <code>422 Unprocessable
                                            Entity</code>.</li>
                                                <li>El <strong>rango del modelo</strong> (<code>[x_min, x_max] = [-10, 10]</code>) describe el dominio en el que
                                                    se entrenó la regresión. Una <code>x = 50</code> es perfectamente
                                                    válida como tipo numérico, pero implica una <em>extrapolación</em>;
                                                    la API responde <code>200</code> con <code>extrapolado: true</code> para que el cliente quede advertido.
                                                </li>
                                            </ul>
                                            Confundir ambos rangos es un error frecuente: la primera es responsabilidad de
                                            FastAPI/Pydantic; la segunda, del estadístico que entrenó el modelo.
                                        </Box>

                                        <h3>10.5 Aplicación FastAPI (<code>app/main.py</code>)</h3>

                                        <CodeBlock title="app/main.py" lang="python" code={`# app/main.py
from fastapi import FastAPI, Depends

from app.modelo import ModeloRegresion, cargar_modelo
from app.schemas import EntradaPrediccion, SalidaPrediccion

app = FastAPI(
    title="regresion-api",
    version="0.1.0",
    description="API mínima que sirve un modelo de regresión lineal simple.",
)


@app.get("/health", status_code=200)
def health() -> dict[str, str]:
    """Sondeo de vida: responde 200 mientras el proceso atienda peticiones."""
    return {"status": "ok"}


@app.post("/predicciones", response_model=SalidaPrediccion)
def predecir(
    entrada: EntradaPrediccion,
    modelo: ModeloRegresion = Depends(cargar_modelo),
) -> SalidaPrediccion:
    y_hat = modelo.predecir(entrada.x)
    return SalidaPrediccion(
        y_hat=y_hat,
        extrapolado=not (modelo.x_min <= entrada.x <= modelo.x_max),
        version_modelo=modelo.version,
    )`} />

                                        <CodeBlock title="tests/test_api.py" lang="python" code={`# tests/test_api.py
from fastapi.testclient import TestClient

from app.main import app

cliente = TestClient(app)


def test_health_devuelve_200():
    respuesta = cliente.get("/health")
    assert respuesta.status_code == 200
    assert respuesta.json() == {"status": "ok"}


def test_prediccion_consistente_con_los_coeficientes():
    respuesta = cliente.post("/predicciones", json={"x": 2.0})
    assert respuesta.status_code == 200
    cuerpo = respuesta.json()
    # y = 2.3 * 2.0 + 1.7 = 6.3
    assert abs(cuerpo["y_hat"] - 6.3) < 1e-9
    assert cuerpo["extrapolado"] is False
    assert cuerpo["version_modelo"] == "0.1.0"


def test_prediccion_marca_extrapolacion():
    respuesta = cliente.post("/predicciones", json={"x": 50.0})
    assert respuesta.status_code == 200
    assert respuesta.json()["extrapolado"] is True


def test_x_fuera_de_rango_devuelve_422():
    respuesta = cliente.post("/predicciones", json={"x": 5000.0})
    assert respuesta.status_code == 422`} />

                                        <h3>10.8 <code>.dockerignore</code> del proyecto</h3>

                                        <CodeBlock title=".dockerignore" lang="text" code={`# .dockerignore

                                        <p>Las pruebas se excluyen del contexto de la imagen final: se ejecutan como un paso aparte,
                                            antes de construirla (en local o, en la semana 12, en la integración continua).</p>

                                        <p>Dos detalles. Los patrones con <code>**/</code> valen a cualquier profundidad: sin él, <code>__pycache__</code> solo excluiría la carpeta de la raíz, y las de <code>app/</code>,
                                            que aparecen al ejecutar las pruebas, entrarían a la imagen con el <code>COPY app/</code>. Y <code>**/*.db</code> impide que la base de datos de desarrollo llegue a la imagen (ver 10.12).</p>

                                        <h3>10.9 Dockerfile final (multi-stage)</h3>

                                        <CodeBlock title="Dockerfile" lang="dockerfile" code={`# Dockerfile

# ============================================================
# Etapa 1 — builder: prepara un entorno virtual con dependencias
# ============================================================
FROM python:3.11.9-slim-bookworm AS builder

ENV PYTHONDONTWRITEBYTECODE=1 \\
    PYTHONUNBUFFERED=1 \\
    PIP_NO_CACHE_DIR=1 \\
    PIP_DISABLE_PIP_VERSION_CHECK=1

# Dependencias de compilación: necesarias solo si una wheel debe compilarse
# desde fuente (aquí todas traen wheel, así que no se usan). Se descartan
# junto con esta etapa.
RUN apt-get update \\
 && apt-get install -y --no-install-recommends build-essential \\
 && rm -rf /var/lib/apt/lists/*

# Entorno virtual aislado en /opt/venv. Se copia a la etapa runtime con un único
# COPY porque ambas etapas usan la misma imagen base y la misma ruta.
RUN python -m venv /opt/venv
ENV PATH="/opt/venv/bin:$PATH"

WORKDIR /build

# Solo el archivo de dependencias, para aprovechar la caché de capas.
COPY requirements.txt .
RUN pip install -r requirements.txt

# ============================================================
# Etapa 2 — runtime: imagen final, solo lo necesario para ejecutar
# ============================================================
FROM python:3.11.9-slim-bookworm AS runtime

ENV PYTHONDONTWRITEBYTECODE=1 \\
    PYTHONUNBUFFERED=1 \\
    PATH="/opt/venv/bin:$PATH"

# Usuario y grupo del sistema para ejecutar la aplicación sin privilegios.
RUN groupadd --system --gid 1001 appgroup \\
 && useradd --uid 1001 --gid appgroup --create-home appuser

WORKDIR /app

# Entorno virtual completo, traído del builder.
COPY --from=builder /opt/venv /opt/venv

# Código de la aplicación: propiedad de root y de solo lectura para appuser.
COPY app/ ./app/

USER appuser

EXPOSE 8000

# Sondeo de salud: Docker consulta /health y marca el contenedor como healthy o unhealthy.
HEALTHCHECK --interval=30s --timeout=5s --start-period=10s --retries=3 \\
    CMD python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"

CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]`} />

                                        <Box type="info" label="Lo nuevo en este Dockerfile">

                                            <ul>
                                                <li><strong>Usuario no privilegiado.</strong> <code>groupadd</code> y <code>useradd</code> crean un grupo y un usuario sin privilegios con uid y gid 1001, y <code>USER</code> hace que el proceso corra como él. El código se copia <em>sin</em>
                   <code>--chown</code>: queda como propiedad de root y de solo lectura para <code>appuser</code>,
                   de modo que quien comprometa el proceso no puede modificar la aplicación.</li>
                                                <li><strong>Variables de Python y de pip.</strong> <code>PYTHONUNBUFFERED=1</code> envía los mensajes de la aplicación a <code>docker logs</code> sin esperar; <code>PYTHONDONTWRITEBYTECODE=1</code> impide que Python escriba archivos <code>.pyc</code> al ejecutar la aplicación (los cerca de 2000 que <code>pip</code> compila al instalar sí quedan en el
                   entorno virtual); <code>PIP_NO_CACHE_DIR=1</code> impide que pip guarde las wheels
                                                    descargadas.</li>
                                                <li><strong><code>HEALTHCHECK</code>.</strong> Cada 30 s hace una petición a <code>/health</code>; Docker marca el contenedor como <code>healthy</code> o <code>unhealthy</code> (se ve en <code>docker ps</code>). No lo reinicia: eso lo
                                                    hace un orquestador, o la plataforma con sus propios sondeos.</li>
                                                <li><strong>Entorno virtual copiado entre etapas.</strong> Funciona porque las dos
                                                    etapas usan la misma imagen base y la misma ruta (<code>/opt/venv</code>): un entorno
                                                    virtual guarda la ruta del intérprete con el que se creó y no es reubicable.</li>
                                            </ul>
                                        </Box>

                                        <h3>10.10 Construcción y ejecución</h3>

                                        <CodeBlock lang="shell" code={`cd regresion-api

# Construye la imagen y la etiqueta con la versión semántica.
docker build -t regresion-api:0.1.0 .

# Lanza un contenedor en primer plano y publica el puerto 8000.
docker run --rm -p 8000:8000 --name regresion regresion-api:0.1.0`} />

                                        <p>Desde otra terminal se consulta el endpoint de salud y se solicita una predicción (la
                                            línea con <code>#</code> que sigue a cada orden es la salida esperada):</p>

                                        <CodeBlock lang="shell" code={`curl -s -w '\\n' http://localhost:8000/health
# {"status":"ok"}

curl -s -w '\\n' -X POST http://localhost:8000/predicciones \\
  -H 'Content-Type: application/json' \\
  -d '{"x": 2.0}'
# {"y_hat":6.3,"extrapolado":false,"version_modelo":"0.1.0"}`} />

                                            se abre desde el navegador y necesita conexión a Internet, porque carga sus recursos
                                            desde un CDN.</p>

                                            Para comprobar que la imagen se ejecuta como usuario no privilegiado, basta con
                                            inspeccionar el contenedor en marcha:

# uid=1001(appuser) gid=1001(appgroup) groups=1001(appgroup)`} />
                                            Y medir el tamaño efectivo:
                                            <CodeBlock lang="shell" code={`docker images regresion-api:0.1.0
docker history regresion-api:0.1.0
# La suma de la columna SIZE de docker history da ≈ 260 MB en Apple Silicon (≈ 200–220 MB en x86).
# docker images puede mostrar otra cifra según la versión de Docker y el almacén de imágenes
