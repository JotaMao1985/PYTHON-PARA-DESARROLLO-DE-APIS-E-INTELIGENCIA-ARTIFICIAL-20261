                                        <h3>10.11 Comprobar que la API se comporta igual</h3>

                                        <p>La práctica de la semana pide comprobar que la API se comporta igual dentro del contenedor.
                                            La forma más simple es lanzar las <em>mismas peticiones</em> contra la versión local y contra
                                            la del contenedor, y comparar. Con el entorno virtual del proyecto activo, se arranca la API
                                            local en otro puerto, para no chocar con el contenedor, que usa el 8000:</p>

                                        <CodeBlock lang="shell" code={`uvicorn app.main:app --port 8001`} />

                                        <p>Desde otra terminal se repiten tres peticiones —una dentro del rango del modelo, una
                                            extrapolada y una inválida— contra los dos puertos, y <code>diff</code> compara las salidas:</p>

                                        <CodeBlock lang="shell" code={`peticiones() {
  for x in 2.0 50.0 5000.0; do
    curl -s -w ' [HTTP %{http_code}]\\n' -X POST "http://localhost:$1/predicciones" \\
      -H 'Content-Type: application/json' -d "{\\"x\\": $x}"
  done
}
diff <(peticiones 8001) <(peticiones 8000) && echo "Respuestas idénticas"`} />

                                        <p>Si <code>diff</code> no encuentra diferencias, imprime <code>Respuestas idénticas</code>: la API
                                            responde <code>200</code> con <code>extrapolado: false</code>, <code>200</code> con <code>extrapolado: true</code> y <code>422</code> exactamente igual en las dos versiones. Si solo
                                            uno de los dos está levantado, <code>curl</code> no obtiene respuesta del otro
                                            (<code>[HTTP 000]</code>) y <code>diff</code> lo muestra; antes conviene comprobar que ambos
                                            responden en <code>/health</code>, porque con los dos apagados la comparación saldría
                                            «idéntica». Los <code>&lt;( … )</code> requieren <code>bash</code> o <code>zsh</code>.</p>

                                        <Box type="tip" label="Tarea autónoma">

                                            Contenerizar el proyecto propio y verificar la equivalencia con el entorno local: repetir esta
                                            comparación con sus propios <em>endpoints</em> (uno que responda bien, uno que falle por
                                            validación y uno que dependa de la configuración o de la base de datos). Los ajustes que suele
                                            exigir el proyecto propio están en el apartado siguiente.
                                        </Box>

                                        <h3>10.12 De este ejemplo a tu proyecto</h3>

                                        <p>El proyecto propio casi nunca se parece al ejemplo. Estos son los ajustes más frecuentes.</p>

                                        <p><strong>1. Estructura.</strong> Si el proyecto es plano (<code>main.py</code> en la raíz, sin carpeta <code>app/</code>), el <code>COPY</code> y el <code>CMD</code> cambian con él: <code>COPY main.py .</code> y <code>"main:app"</code> en lugar de <code>"app.main:app"</code>. Hay
                                            que copiar también todo lo que el código lee al arrancar: modelos entrenados
                                            (<code>.joblib</code>, <code>.pkl</code>), la carpeta de migraciones, plantillas.</p>

                                        <p><strong>2. Variables de entorno.</strong> La imagen no lleva <code>.env</code> (lo excluye el <code>.dockerignore</code>): la configuración llega al lanzar el contenedor, con <code>--env-file</code> o con <code>-e</code>. Si la configuración se lee con <code>pydantic-settings</code> (semana 8), se toma del entorno real cuando no hay archivo <code>.env</code>, y el código no cambia. En <code>--env-file</code> las comillas se conservan
                                            como parte del valor: se escribe <code>CLAVE=valor</code>, sin comillas (Docker Compose, en cambio,
                                            interpreta las comillas y las quita).</p>

                                        <CodeBlock lang="shell" code={`docker run --rm -p 8000:8000 --env-file .env regresion-api:0.1.0`} />

                                        <p><strong>3. Una base SQLite.</strong> SQLite guarda la base en un archivo, y eso plantea tres asuntos:</p>
                                        <ul>
                                            <li>El usuario <code>appuser</code> no puede crear archivos en <code>/app</code> (lo creó <code>WORKDIR</code> como root). La base necesita un directorio propio: en la etapa <em>runtime</em>, antes de <code>USER</code>, se añade la línea siguiente, y la URL de la
                                                base apunta allí (por ejemplo <code>sqlite:////data/app.db</code>: cuatro barras, porque
                                                la ruta es absoluta).
                                                <CodeBlock lang="dockerfile" code={`RUN mkdir /data && chown appuser:appgroup /data`} />
                                            </li>
                                            <li>Lo que se escribe dentro de un contenedor vive en su capa de escritura y desaparece con <code>docker rm</code>. Para que los datos sobrevivan, se monta un <strong>volumen</strong> en ese directorio:
                                                <CodeBlock lang="shell" code={`docker run -d --name api -p 8000:8000 -v datos:/data regresion-api:0.1.0
docker restart api    # el contenedor es el mismo: los datos también
docker rm -f api      # se elimina el contenedor, pero no el volumen «datos»
docker run -d --name api -p 8000:8000 -v datos:/data regresion-api:0.1.0   # los datos reaparecen`} />
                                            </li>
                                            <li>El <code>.dockerignore</code> excluye <code>**/*.db</code>: la base de desarrollo no debe
                                                viajar en la imagen.</li>
                                        </ul>

                                        <p><strong>4. Arranque y puerto.</strong> Si el proyecto usa Alembic, las migraciones se aplican
                                            antes de arrancar; si la plataforma asigna el puerto en <code>$PORT</code>, el <code>CMD</code> debe leerlo. Ambos casos se resuelven con el <code>CMD</code> con <code>sh -c</code> y <code>exec</code> del apartado 6.5. Y si el puerto cambia, el <code>HEALTHCHECK</code> debe
                                            sondear ese mismo puerto: de lo contrario el contenedor responde pero Docker lo marca <code>unhealthy</code>; basta con que el sondeo lea la misma variable
                                            (<code>os.environ.get('PORT', '8000')</code>).</p>

                                        <p><strong>5. Un solo comando.</strong> Un archivo <code>docker-compose.yml</code> describe ese mismo
                                            lanzamiento —imagen, puertos, volumen— y se levanta con <code>docker compose up</code>; con <code>env_file: .env</code> se le pasan las variables.</p>

                                        <CodeBlock title="docker-compose.yml" lang="yaml" code={`services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - datos:/data

volumes:
  datos:`} />

                                        <h3>Preguntas conceptuales</h3>

                                        <Box type="info" label="Ejercicio 11.1 — Diferencia clave">

                                            Explíquese, en no más de 60 palabras, por qué dos contenedores que se ejecutan en el mismo
                   computador comparten el kernel del sistema Linux que los ejecuta, mientras que dos
                   máquinas virtuales no comparten el suyo.
                                        </Box>

                                        <Accordion items={[{ titulo: 'Solución comentada 11.1', contenido: (<>Cada máquina virtual incluye un sistema operativo huésped completo —con su propio
                   kernel— sobre un hipervisor: dos VMs cargan dos kernels. Un contenedor solo aísla el
                   espacio de usuario mediante <em>namespaces</em> y <em>cgroups</em> del kernel del
                   anfitrión; todos los contenedores de una máquina comparten ese único kernel y, por eso,
                   arrancan en milisegundos y consumen mucha menos memoria.</>) }]} />

                                        <Box type="info" label="Ejercicio 11.2 — Lectura de etiquetas">

                                            Indíquese qué significa cada componente de la etiqueta <code>python:3.11.9-slim-bookworm</code>, por qué la elección de <code>3.11.9</code> es preferible a <code>3.11</code> en una API estadística y qué fuente
                   de variación elimina esa elección y cuál no.

                                        <Accordion items={[{ titulo: 'Solución comentada 11.2', contenido: (<><code>python</code> es el repositorio oficial; <code>3.11.9</code> es la versión
                                            exacta del intérprete; <code>slim</code> indica una variante reducida de Debian; <code>bookworm</code> es el nombre en clave de Debian 12. Fijar <code>3.11.9</code> evita que la etiqueta flotante <code>3.11</code> apunte
                   automáticamente a un parche posterior del intérprete. No garantiza por sí solo
                   resultados numéricos idénticos: para eso hay que fijar también NumPy y SciPy con <code>==</code>, la base por digest y las semillas, y aun así BLAS puede variar con
                   la CPU y el número de hilos.</>) }]} />

                                        <Box type="info" label="Ejercicio 11.3 — Caché de capas">

                                            El siguiente fragmento se reconstruye lentamente cada vez que cambia un archivo
                                            de la carpeta <code>app/</code>. Identifíquese el problema y propóngase una
                                            corrección:
                                            <CodeBlock lang="dockerfile" code={`FROM python:3.11.9-slim-bookworm
WORKDIR /app
COPY . .
RUN pip install --no-cache-dir -r requirements.txt
CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]`} />
                                        </Box>

                                        <Accordion items={[{ titulo: 'Solución comentada 11.3', contenido: (<>El problema es que <code>COPY . .</code> incluye el código fuente; cualquier
                   cambio en <code>app/</code> invalida esa capa y todas las posteriores, y obliga a
                   reinstalar todas las dependencias. La corrección consiste en separar la copia de <code>requirements.txt</code> de la del código:
                                            <CodeBlock lang="dockerfile" code={`FROM python:3.11.9-slim-bookworm
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY app/ ./app/
CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]`} />
                                            Mientras <code>requirements.txt</code> no cambie, la capa de instalación se
                                            reutiliza y la reconstrucción tarda segundos en lugar de minutos.</>) }]} />

                                        <Box type="info" label="Ejercicio 11.4 — Contexto de construcción">

                                            Indíquense tres archivos o carpetas que <em>nunca</em> deberían incluirse en una
                   imagen de producción, descríbase qué problema concreto causa cada uno si llega
                   a colarse y nómbrese el archivo que evita que lleguen al contexto de construcción.
                                        </Box>

                                        <Accordion items={[{ titulo: 'Solución comentada 11.4', contenido: (<>Tres ejemplos típicos:
                                            <ul>
                                                <li><strong><code>.env</code></strong>: contiene credenciales (claves de API,
                                                    contraseñas de bases de datos). Si llega a la imagen, queda registrado
                                                    en una capa permanente y puede filtrarse cuando la imagen se publica al
                                                    registro.</li>
                                                <li><strong><code>.git/</code></strong>: incluye toda la historia del
                                                    proyecto y sus posibles ramas, archivos eliminados que aún viven en
                                                    commits, y datos de identidad de los autores. Aumenta el tamaño y la
                                                    superficie de información expuesta.</li>
                                                <li><strong><code>data/raw/</code></strong>: archivos crudos de varios
                                                    gigabytes vuelven la imagen muy pesada, ralentizan los despliegues y
                   pueden contener información personal sin anonimizar.</li>
                   </ul>
                   Otras respuestas válidas: <code>.venv/</code>, <code>__pycache__/</code>, <code>tests/</code>,
                   claves privadas (<code>*.pem</code>), bases de datos locales (<code>*.db</code>). El archivo que
                   lo evita es <code>.dockerignore</code>. Sigue siendo necesario aunque el <code>Dockerfile</code> use <code>COPY</code> selectivo: el contexto completo viaja al daemon, y un <code>COPY . .</code> futuro —o el de otro compañero— lo copiaría todo.</>) }]} />

                                        <Box type="info" label="Ejercicio 11.5 — Multi-stage en propias palabras">

                                            Resúmase, en no más de 60 palabras, qué problema resuelve un multi-stage build y
                   qué elemento del builder del Dockerfile de 10.9 no llega a la imagen final.
                                        </Box>

                                        <Accordion items={[{ titulo: 'Solución comentada 11.5', contenido: (<>Un multi-stage build separa las dependencias necesarias para <em>construir</em> el software de las necesarias para <em>ejecutarlo</em>. Solo la última etapa
                                            forma la imagen entregada; todas las anteriores se descartan. En el ejemplo del
                   curso, lo que no llega a la imagen final es todo el builder: en particular <code>build-essential</code> (el compilador y sus cabeceras), que reduce el tamaño y
                   la superficie de ataque. Borrar <code>/var/lib/apt/lists/</code> o instalar con <code>--no-cache-dir</code> es otra técnica, ortogonal: ahorra espacio dentro de una misma
                   etapa.</>) }]} />

                                        <Box type="info" label="Ejercicio 11.6 — Usuario no privilegiado">

                                            Suponiendo que el Dockerfile ya creó el usuario <code>appuser</code>, justifíquese por qué se
                   recomienda la instrucción <code>USER appuser</code> en una imagen de producción, incluso
                   aunque las pruebas funcionen igual con <code>USER root</code>.
                                        </Box>

                                        <Accordion items={[{ titulo: 'Solución comentada 11.6', contenido: (<>Si una vulnerabilidad permite a un atacante ejecutar código arbitrario dentro
                                            del contenedor y el proceso corre como <code>root</code>, ese código actúa como
                                            root: puede modificar todos los archivos del contenedor, instalar paquetes,
                   escribir o borrar en los volúmenes del anfitrión que se hayan montado en él y, en
                   escenarios con fugas de aislamiento, escalar privilegios al sistema anfitrión. Un usuario no
                                            privilegiado convierte ese mismo escenario en un compromiso mucho más limitado:
                                            el atacante hereda los permisos restringidos de <code>appuser</code>, lo que
                                            contiene el daño y facilita la respuesta a incidentes.</>) }]} />

                                        <h3>Redacción de Dockerfiles</h3>

                                        <Box type="info" label="Ejercicio 11.7 — Mini-API en un contenedor">

                                            Redáctese un Dockerfile mono-etapa, basado en <code>python:3.11.9-slim-bookworm</code>, que empaquete la mini-API FastAPI siguiente, con
                                            un único endpoint <code>GET /version</code> que devuelve <code>&#123;"version": "0.1.0"&#125;</code>:
                                            <CodeBlock title="app/main.py" lang="python" code={`from fastapi import FastAPI

app = FastAPI()


@app.get("/version")
def version() -> dict[str, str]:
    return {"version": "0.1.0"}`} />

                                                <li>El proceso debe correr como un usuario no privilegiado.</li>
                                                <li>La caché debe permitir que un cambio en el código no reinstale las
                                                    dependencias.</li>
                                                <li>La API debe responder en <code>http://localhost:8000/version</code> desde el
                                                    anfitrión.</li>
                                            </ol>
                                            Compruébese: construir la imagen, lanzarla con <code>docker run --rm -p 8000:8000</code>,
                                            consultar <code>/version</code> con <code>curl</code> y ejecutar <code>docker run --rm &lt;imagen&gt; id -u</code>, que debe imprimir <code>1001</code>.
                                        </Box>

                                        <Accordion items={[{ titulo: 'Solución comentada 11.7', contenido: (<><CodeBlock title="Dockerfile" lang="dockerfile" code={`# Dockerfile mono-etapa, didáctico
FROM python:3.11.9-slim-bookworm

ENV PYTHONDONTWRITEBYTECODE=1 \\
    PYTHONUNBUFFERED=1

# Usuario no privilegiado.
RUN groupadd --system --gid 1001 appgroup \\
 && useradd --uid 1001 --gid appgroup --create-home appuser

WORKDIR /app

# Dependencias primero para preservar la caché.
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

# Código después; cambios aquí no reinstalan paquetes.
COPY app/ ./app/

USER appuser
EXPOSE 8000
CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]`} />
                                            El orden <em>requirements.txt → pip install → código</em> garantiza que la capa
                                            de dependencias se reutilice mientras el archivo de dependencias no cambie. La
                   instrucción <code>USER appuser</code> aplica el principio de menor privilegio. <code>EXPOSE</code> solo documenta el puerto: lo que hace accesible la API desde el anfitrión es publicarlo con <code>-p 8000:8000</code> y que Uvicorn escuche en <code>0.0.0.0</code>. Durante la construcción, <code>pip</code> avisa de que se ejecuta como root; es inocuo, porque la imagen se construye como
                   root y solo el proceso final corre como <code>appuser</code>.</>) }]} />

                                        <Box type="info" label="Ejercicio 11.8 — Versión multi-stage">

                                            Reescríbase el Dockerfile del ejercicio anterior empleando dos etapas
                                            (<em>builder</em> y <em>runtime</em>). El builder debe instalar las dependencias
                                            en un entorno virtual y, para que el ahorro sea visible, <code>build-essential</code> (como en el ejemplo integrador); la etapa final debe contener únicamente el entorno
                                            virtual y el código. Compárense los tamaños de las
                                            imágenes de 11.7 y 11.8 (suma de <code>docker history</code>).
                                        </Box>

                                        <Accordion items={[{ titulo: 'Solución comentada 11.8', contenido: (<><CodeBlock title="Dockerfile" lang="dockerfile" code={`# --- builder ---
FROM python:3.11.9-slim-bookworm AS builder
ENV PIP_NO_CACHE_DIR=1
RUN apt-get update \\
 && apt-get install -y --no-install-recommends build-essential \\
 && rm -rf /var/lib/apt/lists/*
RUN python -m venv /opt/venv
ENV PATH="/opt/venv/bin:$PATH"
WORKDIR /build
COPY requirements.txt .
RUN pip install -r requirements.txt

# --- runtime ---
FROM python:3.11.9-slim-bookworm AS runtime
ENV PYTHONDONTWRITEBYTECODE=1 \\
    PYTHONUNBUFFERED=1 \\
    PATH="/opt/venv/bin:$PATH"
RUN groupadd --system --gid 1001 appgroup \\
 && useradd --uid 1001 --gid appgroup --create-home appuser
WORKDIR /app
COPY --from=builder /opt/venv /opt/venv
COPY app/ ./app/
USER appuser
EXPOSE 8000
CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]`} />
                                            Con <code>build-essential</code> en el builder, la imagen final no lo lleva: el
                   multi-stage se ahorra el compilador y sus cabeceras, que pesan cientos de megabytes. <strong>Sin</strong> él, las dos imágenes pesan casi lo mismo (la de dos etapas incluso unos 25 MB
                   más, porque el entorno virtual trae su propio <code>pip</code> y <code>setuptools</code>): el multi-stage solo
                   compensa cuando el builder contiene algo que el runtime no necesita. Error frecuente: la
                   ruta del entorno virtual debe ser la misma en las dos etapas, y ambas deben usar la misma
                   imagen base. El patrón es el del ejemplo integrador y resulta transferible a otras APIs
                   estadísticas.</>) }]} />
