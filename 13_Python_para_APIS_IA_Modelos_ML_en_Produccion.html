                        <h3 className="text-lg font-semibold text-secondary mt-6 mb-2">2.5 Compatibilidad de versiones</h3>
                        <p className="mb-3">
                            Un artefacto de scikit-learn no es portable entre cualquier par de versiones. La biblioteca
                            emite advertencias del tipo <span className="inline-code">InconsistentVersionWarning</span> cuando se intenta cargar
                            un modelo entrenado con una versión distinta de la que está instalada. En el peor de los
                            casos, la carga falla con un <span className="inline-code">AttributeError</span> porque una clase interna fue
                            renombrada o un atributo desapareció.
                        </p>

                        <Box type="danger" label="Escenario ilustrativo">
                            Considérese un equipo que entrena un modelo con <span className="inline-code">scikit-learn==1.3.2</span> y despliega
                            después la API con <span className="inline-code">scikit-learn==1.5.2</span>. La carga puede no emitir error, pero un
                            atributo interno renombrado entre versiones produce predicciones ligeramente distintas, sin
                            advertencia visible. La <strong>fijación de versiones</strong> en
                            <span className="inline-code"> requirements.txt</span> y el <em>smoke test</em> al arrancar habrían detectado la
                            divergencia antes de exponer al usuario final.
                        </Box>

                        <p className="mb-2">Buenas prácticas aplicables:</p>
                        <ul className="list-disc pl-6 space-y-2 mb-4">
                            <li><strong>Fijar versiones exactas</strong> en <span className="inline-code">requirements.txt</span>: <span className="inline-code">scikit-learn==1.4.2</span>, no <span className="inline-code">scikit-learn{'>'}=1.4</span>. (En semanas anteriores se introdujo este principio para todas las dependencias; en el ámbito de ML es directamente obligatorio.)</li>
                            <li><strong>Guardar metadatos</strong> con la versión de sklearn empleada (como en el <span className="inline-code">train.py</span> mostrado).</li>
                            <li><strong>Reentrenar y reserializar</strong> cuando se actualicen las dependencias, en lugar de confiar en la retrocompatibilidad.</li>
                            <li><strong>Validar el modelo recién cargado</strong> con una predicción conocida (un <em>smoke test</em>) durante el arranque de la API.</li>
                        </ul>

                        <CodeBlock title="smoke_test.py" code={`"""Verifica que el modelo cargado produce la predicción esperada
en una entrada de referencia. Puede ejecutarse como script independiente
en CI/CD o, mejor aún, integrarse dentro del lifespan de la API
(ver el mini-proyecto, sección 5.5).
"""
import joblib
import numpy as np

model = joblib.load("artifacts/model.joblib")

# Entrada de referencia conocida (Iris setosa).
sample = np.array([[5.1, 3.5, 1.4, 0.2]])
prediction = int(model.predict(sample)[0])
expected = 0  # 'setosa' según el dataset Iris.

assert prediction == expected, (
    f"Smoke test fallido: se esperaba {expected}, se obtuvo {prediction}. "
    "Posible incompatibilidad de versiones de scikit-learn."
)
print("Smoke test OK")
`} lang="python" />

                        <h3 className="text-lg font-semibold text-secondary mt-6 mb-2">2.6 Seguridad</h3>
                        <p className="mb-3">
                            La documentación oficial de Python lo establece sin ambigüedad: <em>«It is possible to
                            construct malicious pickle data which will execute arbitrary code during unpickling»</em>.
                            <span className="inline-code"> joblib</span>, al apoyarse en pickle, hereda exactamente la misma propiedad.
                        </p>
                        <p className="mb-3">
                            El mecanismo es sutil: durante la deserialización, Python invoca el método
                            <span className="inline-code"> __reduce__</span> de los objetos. Un atacante puede fabricar un archivo cuyo

                        <CodeBlock title="verify_hash.py" code={`"""Verifica el hash del archivo serializado antes de cargarlo en memoria."""
import hashlib
import sys
from pathlib import Path

EXPECTED_SHA256 = "f3b1a2c4...d9e0"  # Generado tras el entrenamiento.
MODEL_PATH = Path("artifacts/model.joblib")


def sha256_of(path: Path) -> str:
    h = hashlib.sha256()
    with path.open("rb") as f:
        for chunk in iter(lambda: f.read(1 << 16), b""):
            h.update(chunk)
    return h.hexdigest()


def main() -> None:
    digest = sha256_of(MODEL_PATH)
    if digest != EXPECTED_SHA256:
        print(f"Hash no coincide ({digest}); abortando carga.", file=sys.stderr)
        sys.exit(1)
    print("Hash verificado.")


if __name__ == "__main__":
    main()

from __future__ import annotations

from pathlib import Path
from threading import Lock
from typing import ClassVar

import joblib
from sklearn.pipeline import Pipeline


class ModelStore:
    """Mantiene la instancia única del modelo en memoria."""

    _instance: ClassVar[Pipeline | None] = None
    _lock: ClassVar[Lock] = Lock()
    MODEL_PATH: ClassVar[Path] = Path("artifacts/model.joblib")

    @classmethod
    def get(cls) -> Pipeline:
        """Devuelve el modelo, cargándolo perezosamente si aún no está en memoria.

        Doble verificación con cerrojo (double-checked locking) para evitar
        que dos hilos lo carguen a la vez.
        """
        if cls._instance is None:
            with cls._lock:
                if cls._instance is None:
                    cls._instance = joblib.load(cls.MODEL_PATH)
        return cls._instance

    @classmethod
    def reset(cls) -> None:
        """Útil para pruebas: olvida el modelo cargado."""
        with cls._lock:
            cls._instance = None

from __future__ import annotations

from contextlib import asynccontextmanager
from pathlib import Path
from typing import AsyncIterator

import joblib
from fastapi import Depends, FastAPI, Request
from sklearn.pipeline import Pipeline

MODEL_PATH = Path("artifacts/model.joblib")


@asynccontextmanager
async def lifespan(app: FastAPI) -> AsyncIterator[None]:
    """Carga el modelo antes de aceptar peticiones y libera recursos al terminar."""
    # --- Startup ---
    app.state.model = joblib.load(MODEL_PATH)
    # Smoke test: si esta línea falla, el contenedor no arranca.
    _ = app.state.model.predict([[5.1, 3.5, 1.4, 0.2]])
    print(f"[lifespan] Modelo cargado desde {MODEL_PATH}")

    yield  # <-- la aplicación vive en este punto

    # --- Shutdown ---
    app.state.model = None
    print("[lifespan] Modelo liberado")


app = FastAPI(title="Iris API", lifespan=lifespan)


def get_model(request: Request) -> Pipeline:
    """Dependencia que expone el modelo a los endpoints."""
    return request.app.state.model

# Etapa 1: builder — instala las dependencias en un entorno virtual.
# =====================================================================
FROM python:3.11.9-slim-bookworm AS builder

# build-essential aporta gcc/make por si algún wheel no está precompilado.
RUN apt-get update \\
    && apt-get install -y --no-install-recommends build-essential \\
    && rm -rf /var/lib/apt/lists/*

# Crear el entorno virtual en una ruta conocida.
RUN python -m venv /opt/venv
ENV PATH="/opt/venv/bin:$PATH"

WORKDIR /build
COPY requirements.txt .

# --no-cache-dir evita arrastrar la caché de pip dentro del venv.
RUN pip install --upgrade pip \\
    && pip install --no-cache-dir -r requirements.txt


# =====================================================================
# Etapa 2: runtime — copia el venv y el código fuente sin herramientas.
# =====================================================================
FROM python:3.11.9-slim-bookworm AS runtime

# Crear un usuario no privilegiado.
RUN useradd --create-home --uid 1000 appuser

# Copiar SOLO el venv listo desde la etapa de construcción.
COPY --from=builder /opt/venv /opt/venv
ENV PATH="/opt/venv/bin:$PATH"

# Buenas prácticas de Python en contenedores.
ENV PYTHONDONTWRITEBYTECODE=1 \\
    PYTHONUNBUFFERED=1 \\
    PIP_NO_CACHE_DIR=1

WORKDIR /app
COPY --chown=appuser:appuser . .

USER appuser

EXPOSE 8000
CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
`} lang="dockerfile" />

                        <h3 className="text-lg font-semibold text-secondary mt-6 mb-2">
                            4.5 Limpieza de cachés y <span className="inline-code">.dockerignore</span>
                        </h3>

                        <p className="mb-3">Dos fuentes de «basura» que se cuelan a menudo en la imagen:</p>

                        <h4 className="text-md font-semibold text-secondary mb-2">Caché de pip dentro del contenedor</h4>
                        <p className="mb-2">
                            Cada <span className="inline-code">pip install</span> deja archivos en <span className="inline-code">~/.cache/pip</span>. Para una
                            instalación con scikit-learn, numpy y scipy, esa caché puede pesar 400 MB. Se evita con la
                            variable de entorno o con el flag:
                        </p>

                        <CodeBlock title="snippet — pip cache" code={`# Opción A — flag por comando (queda al gusto del autor).
RUN pip install --no-cache-dir -r requirements.txt

# Opción B — variable de entorno (afecta a toda la etapa).
ENV PIP_NO_CACHE_DIR=1
RUN pip install -r requirements.txt
`} lang="dockerfile" />

                        <h4 className="text-md font-semibold text-secondary mt-4 mb-2">
                            Contexto de construcción y <span className="inline-code">.dockerignore</span>
                        </h4>

                        <p className="mb-3">
                            Cuando se ejecuta <span className="inline-code">docker build .</span>, el cliente envía al <em>daemon</em> todo el
                            contenido del directorio actual (el «contexto»). Si en ese directorio hay un
                            <span className="inline-code"> .venv</span> de 1 GB, una carpeta <span className="inline-code">data/</span> con los datos crudos del
                            entrenamiento o la caché de tests, todo eso se transmite —y, peor aún, es susceptible de
                            terminar copiado dentro de la imagen si hay un <span className="inline-code">COPY .</span>. El antídoto es un
                            archivo <span className="inline-code">.dockerignore</span>:
                        </p>

                        <CodeBlock title=".dockerignore" code={`# Entornos virtuales locales.

env

*.pyo

.mypy_cache
.ruff_cache

.github
.vscode

.env.*
!.env.example

# Documentación.
docs/
*.md
!README.md

htmlcov/
.coverage
`} lang="text" />

                            regla mnemotécnica: <em>«si no es código, configuración o el modelo serializado, lo más
                            probable es que sobre»</em>.

                                <CodeBlock title="app/schemas.py" code={`"""Modelos Pydantic para la entrada y la salida del endpoint /predict."""
from __future__ import annotations

from typing import Annotated

from pydantic import BaseModel, Field, ConfigDict


# Restricción de rango razonable para evitar entradas absurdas.
PositiveLength = Annotated[float, Field(ge=0.0, le=20.0)]


class IrisInput(BaseModel):
    """Cuatro mediciones morfológicas en centímetros."""

    sepal_length: PositiveLength
    sepal_width: PositiveLength
    petal_length: PositiveLength
    petal_width: PositiveLength

    model_config = ConfigDict(
        json_schema_extra={
            "examples": [
                {
                    "sepal_length": 5.1,
                    "sepal_width": 3.5,
                    "petal_length": 1.4,
                    "petal_width": 0.2,
                }
            ]
        }
    )


class IrisPrediction(BaseModel):
    """Respuesta: etiqueta entera, nombre de la clase y probabilidades."""

    label: int = Field(description="Índice 0/1/2 de la clase predicha.")
    class_name: str = Field(description="Nombre legible: setosa, versicolor o virginica.")
    probabilities: list[float] = Field(description="Probabilidad de cada clase, en el mismo orden.")
`} lang="python" />

                                <h3 className="text-lg font-semibold text-secondary mt-6 mb-2">5.4 Carga del modelo (Singleton centralizado)</h3>
                                <CodeBlock title="app/ml.py" code={`"""Helpers para cargar el modelo y la dependencia Depends(get_model).

La carga ocurre en main.py dentro del lifespan; este módulo sólo provee
las utilidades para acceder al modelo desde los endpoints.
"""
from __future__ import annotations

from pathlib import Path

import joblib
from fastapi import HTTPException, Request, status
from sklearn.pipeline import Pipeline

MODEL_PATH = Path("artifacts/model.joblib")
TARGET_NAMES: tuple[str, ...] = ("setosa", "versicolor", "virginica")


def load_model(path: Path = MODEL_PATH) -> Pipeline:
    """Lee el archivo serializado y devuelve el pipeline."""
    if not path.exists():
        raise FileNotFoundError(
            f"Artefacto no encontrado en {path}. Ejecutar \`python train.py\` primero."
        )
    return joblib.load(path)


def get_model(request: Request) -> Pipeline:
    """Dependencia inyectada en los endpoints.

    Lanza 503 si por algún motivo el lifespan no logró cargar el modelo,
    en lugar de explotar con AttributeError más adelante.
    """
    model = getattr(request.app.state, "model", None)
    if model is None:
        raise HTTPException(
            status_code=status.HTTP_503_SERVICE_UNAVAILABLE,
            detail="El modelo no está disponible en este momento.",
        )
    return model
`} lang="python" />

                                <h3 className="text-lg font-semibold text-secondary mt-6 mb-2">5.5 Aplicación FastAPI</h3>
                                <CodeBlock title="app/main.py" code={`"""API Iris: predice la especie a partir de cuatro mediciones."""
from __future__ import annotations

from contextlib import asynccontextmanager
from typing import AsyncIterator

from fastapi import Depends, FastAPI
from sklearn.pipeline import Pipeline

from app.ml import TARGET_NAMES, get_model, load_model
from app.schemas import IrisInput, IrisPrediction


@asynccontextmanager
async def lifespan(app: FastAPI) -> AsyncIterator[None]:
    """Carga el modelo al arrancar y lo libera al detenerse."""
    app.state.model = load_model()
    # Smoke test con una muestra conocida.
    sample = [[5.1, 3.5, 1.4, 0.2]]
    label = int(app.state.model.predict(sample)[0])
    assert label == 0, f"Smoke test fallido: se esperaba 0, se obtuvo {label}"
    print("[lifespan] Modelo cargado y verificado.")
    yield
    app.state.model = None


app = FastAPI(
    title="Iris API",
    version="1.0.0",
    description="Clasificador de Iris servido con FastAPI y scikit-learn.",
    lifespan=lifespan,
)


@app.get("/health")
def health() -> dict[str, str]:
    """Indicador mínimo de vida útil para sondas del PaaS."""
    return {"status": "ok"}


@app.post("/predict", response_model=IrisPrediction)
def predict(
    payload: IrisInput,
    model: Pipeline = Depends(get_model),
) -> IrisPrediction:
    features = [[
        payload.sepal_length,
        payload.sepal_width,
        payload.petal_length,
        payload.petal_width,
    ]]
    label = int(model.predict(features)[0])
    proba = model.predict_proba(features)[0].tolist()
    return IrisPrediction(
        label=label,
        class_name=TARGET_NAMES[label],
        probabilities=proba,
    )
`} lang="python" />

                                <h3 className="text-lg font-semibold text-secondary mt-6 mb-2">5.6 Pruebas con pytest y TestClient</h3>
                                <p className="mb-3">
                                    El test sustituye la dependencia <span className="inline-code">get_model</span> por un <em>mock</em>: así se prueba
                                    la lógica del <em>endpoint</em> sin necesidad de que exista el archivo
                                    <span className="inline-code"> artifacts/model.joblib</span>. Es un ejemplo concreto de la ventaja didáctica de
                                    <span className="inline-code"> Depends</span>.
                                </p>

                                <CodeBlock title="tests/test_api.py" code={`"""Pruebas del endpoint /predict sustituyendo la dependencia del modelo."""
from __future__ import annotations

import numpy as np
import pytest
from fastapi.testclient import TestClient

from app.main import app
from app.ml import get_model


class FakeModel:
    """Doble de prueba con la misma interfaz que un Pipeline de sklearn."""

    def predict(self, X):
        # Devuelve siempre la clase 0 (setosa).
        return np.zeros(len(X), dtype=int)

    def predict_proba(self, X):
        return np.tile([0.9, 0.05, 0.05], (len(X), 1))


@pytest.fixture
def client():
    app.dependency_overrides[get_model] = lambda: FakeModel()
    with TestClient(app) as c:
        yield c
    app.dependency_overrides.clear()


def test_health(client):
    response = client.get("/health")
    assert response.status_code == 200
    assert response.json() == {"status": "ok"}


def test_predict_ok(client):
    payload = {
        "sepal_length": 5.1,
        "sepal_width": 3.5,
        "petal_length": 1.4,
        "petal_width": 0.2,
    }
    response = client.post("/predict", json=payload)
    assert response.status_code == 200
    body = response.json()
    assert body["label"] == 0
    assert body["class_name"] == "setosa"
    assert sum(body["probabilities"]) == pytest.approx(1.0, abs=1e-6)


def test_predict_invalid_input(client):
    payload = {
        "sepal_length": -1.0,   # viola la restriccion ge=0
        "sepal_width": 3.5,
        "petal_length": 1.4,
        "petal_width": 0.2,
    }
    response = client.post("/predict", json=payload)
    assert response.status_code == 422   # error de validacion de Pydantic
`} lang="python" />

                                <Box type="tip" label="Detalle importante">
                                    <span className="inline-code">TestClient</span> debe usarse como <em>context manager</em>
                                    (<span className="inline-code">with TestClient(app) as c:</span>) para que se ejecuten correctamente los eventos
                                    del <span className="inline-code">lifespan</span>. Si no, el bloque <em>startup</em> nunca se dispara y
                                    <span className="inline-code"> app.state.model</span> permanecería sin definir. Como aquí se sobrescribe
                                    <span className="inline-code"> get_model</span>, no es estrictamente necesario, pero es una buena costumbre.
                                </Box>

<script>
// La URL de tu API desplegada en Render. En local: http://127.0.0.1:8000
const API = "https://encuestas-api.onrender.com";

const salida = document.getElementById("salida");

document.getElementById("formulario").addEventListener("submit", async (evento) => {

  salida.hidden = false;
  salida.className = "";

      salida.className = "error";
      salida.textContent = "Datos invalidos: " +
        detail.map(e => e.loc.join(".") + " " + e.msg).join(" | ");
      return;
    }
    if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);

    const { especie, probabilidad } = await respuesta.json();
    salida.textContent =
      "Especie: " + especie + "  ·  confianza " + (probabilidad * 100).toFixed(1) + " %";

    salida.className = "error";
    salida.textContent = "No se pudo contactar con la API: " + e.message;

                    <h3 className="text-lg font-semibold text-secondary mb-3">6.1 Preguntas conceptuales</h3>

                    <QA
                        q={<>P1. ¿Por qué se prefiere <span className="inline-code">joblib</span> a <span className="inline-code">pickle</span> para modelos de scikit-learn, si ambos usan internamente el mismo protocolo?</>}
                        a={<><strong>R.</strong> Porque <span className="inline-code">joblib</span> serializa los buffers de <span className="inline-code">numpy</span> en bloque (en vez de objeto a objeto) y ofrece compresión integrada, lo que reduce significativamente el tamaño y el tiempo de E/S. Los modelos de scikit-learn están repletos de arrays NumPy, así que la mejora es notoria.</>}
                    />

                    <QA
                        q={<>P2. ¿Qué ventaja aporta cargar el modelo en el bloque <span className="inline-code">lifespan</span> frente a hacerlo dentro del propio <em>endpoint</em>?</>}
                        a={<><strong>R.</strong> En el <em>endpoint</em>, el modelo se carga en cada petición: latencia de cientos de milisegundos y E/S innecesaria. En <span className="inline-code">lifespan</span> se carga una sola vez al arrancar el proceso y se reutiliza, dejando la latencia de cada petición en el orden de la inferencia (típicamente milisegundos).</>}
                    />

                    <QA
                        q={<>P3. ¿Por qué la carga de un archivo pickle/joblib desde una fuente no confiable es peligrosa? ¿Qué se hace para mitigarlo?</>}
                        a={<><strong>R.</strong> Porque el protocolo permite que el método <span className="inline-code">__reduce__</span> de un objeto ejecute código arbitrario durante la deserialización. Mitigaciones: cargar solo artefactos generados por el equipo, verificar un hash sha256 antes de la carga, ejecutar el contenedor como usuario sin privilegios y, cuando sea posible, usar formatos «sin código» como ONNX o <span className="inline-code">skops.io</span>.</>}
                    />

                    <QA
                        q={<>P4. Un compañero comenta: «la imagen base <span className="inline-code">python:3.11.9-alpine</span> es la más pequeña, así que la usaré para mi API de scikit-learn». ¿Qué se le respondería?</>}
                        a={<><strong>R.</strong> Que Alpine usa <span className="inline-code">musl libc</span> en vez de <span className="inline-code">glibc</span>, y por tanto la mayoría de <em>wheels</em> precompilados de scikit-learn, numpy y scipy <strong>no están disponibles</strong> para esa libc. Pip terminará compilando desde fuente, lo que consume mucho tiempo y suele fallar. Para una API de ML en Python se prefiere <span className="inline-code">python:3.11.9-slim-bookworm</span>.</>}
                    />

                    <QA
                        q={<>P5. ¿Qué papel juega <span className="inline-code">app.dependency_overrides</span> en las pruebas? ¿Por qué es preferible a inyectar globalmente un <em>mock</em>?</>}
                        a={<><strong>R.</strong> Permite reemplazar la implementación de cualquier <em>dependency</em> (<span className="inline-code">get_model</span>, <span className="inline-code">get_db</span>, …) solo durante los tests. Es preferible al <em>monkeypatching</em> global porque queda contenido en el <em>fixture</em> de pytest (<span className="inline-code">app.dependency_overrides.clear()</span> al final), lo que evita filtraciones entre pruebas y mantiene el código de producción intacto.</>}
                    />

                    <QA
                        q={<>P6. ¿Qué efecto tiene la opción <span className="inline-code">compress=3</span> en <span className="inline-code">joblib.dump</span> y por qué no se elige siempre <span className="inline-code">compress=9</span>?</>}
                        a={<><strong>R.</strong> <span className="inline-code">compress=3</span> aplica compresión zlib de nivel medio: reduce el archivo a ~25–30 % del tamaño original con un coste pequeño de tiempo. Niveles altos (8 o 9) ahorran poco espacio adicional y aumentan tanto el tiempo de <em>dump</em> como el de <em>load</em>; en producción, esa carga se paga al arrancar. <span className="inline-code">compress=3</span> es un buen compromiso por defecto.</>}
                    />

                    <QA
                        q={<>P7. ¿Cuál es el papel de la primera etapa (<span className="inline-code">builder</span>) en un Dockerfile multi-etapa? ¿Qué pasaría si se omitiera?</>}
                        a={<><strong>R.</strong> En la etapa <span className="inline-code">builder</span> se instalan las dependencias junto con herramientas de compilación (<span className="inline-code">build-essential</span>, ~250 MB) que pueden ser necesarias para construir <em>wheels</em> desde fuente. La etapa <span className="inline-code">runtime</span> copia únicamente el entorno virtual ya construido. Si se omitiera esa separación, el <span className="inline-code">build-essential</span> y la caché de pip viajarían a la imagen final, sumando cientos de megabytes innecesarios.</>}
                    />

                    <QA
                        q={<>P8. ¿Qué hace exactamente <span className="inline-code">--extra-index-url https://download.pytorch.org/whl/cpu</span> en un <span className="inline-code">requirements.txt</span> y por qué es relevante para el tamaño de la imagen?</>}
                        a={<><strong>R.</strong> Indica a pip un índice <em>adicional</em> donde buscar <em>wheels</em>. Combinado con un identificador <span className="inline-code">+cpu</span> en la versión de <span className="inline-code">torch</span>, permite instalar la rueda CPU-only (~200 MB) en lugar de la predeterminada con CUDA (~2.5 GB). En un contenedor sin GPU, la diferencia se traduce en despliegues mucho más rápidos y baratos.</>}
                    />

                    <QA
                        q={<>P9. Si la API se ejecuta con <span className="inline-code">uvicorn --workers 4</span>, ¿cuántas instancias del modelo habrá en memoria? ¿Por qué?</>}
                        a={<><strong>R.</strong> Cuatro. Cada <em>worker</em> de uvicorn es un proceso independiente; el <span className="inline-code">lifespan</span> se ejecuta una vez por proceso, así que cada uno carga su propia copia. Para modelos grandes conviene reducir el número de <em>workers</em> o aumentar la RAM del contenedor.</>}
                    />

                    <QA
                        q={<>P10. Un <span className="inline-code">RandomForestClassifier</span> entrenado y serializado con <span className="inline-code">scikit-learn==1.4.2</span> se carga en un contenedor que tiene <span className="inline-code">scikit-learn==1.5.2</span>. ¿Qué se debe hacer?</>}
                        a={<><strong>R.</strong> Aunque la carga puede funcionar, no debe asumirse: hay cambios internos entre versiones que pueden alterar predicciones o lanzar <span className="inline-code">AttributeError</span>. La acción correcta es <strong>reentrenar y reserializar</strong> el modelo con la versión instalada en producción y, en cualquier caso, <strong>fijar la versión exacta</strong> en <span className="inline-code">requirements.txt</span> para impedir derivas silenciosas.</>}
                    />

                    />

                    <QA
                        q={<>E3. Reducir el tamaño de la imagen Docker a menos de 200 MB para una API que solo usa scikit-learn (sin PyTorch).</>}
                        a={<><strong>Pista.</strong> Partiendo del Dockerfile optimizado, se obtienen ahorros adicionales: (a) instalar únicamente las dependencias estrictamente necesarias (revisar el <span className="inline-code">requirements.txt</span> y purgar lo que se quedó por inercia); (b) verificar el contenido del <span className="inline-code">.dockerignore</span> ejecutando <span className="inline-code">docker build --progress=plain</span> y observando los archivos copiados; (c) ejecutar <span className="inline-code">docker history --no-trunc</span> sobre la imagen y eliminar las capas más pesadas; (d) considerar <span className="inline-code">find /opt/venv -name __pycache__ -type d -exec rm -rf {'{}'} +</span> dentro del <em>builder</em> para reducir aún más el venv.</>}
                    />

                    <QA
                        q={<>E4. Implementar una verificación de hash sha256 para el archivo del modelo que se ejecute al arrancar la API. Si el hash no coincide con el esperado, el contenedor no debe aceptar tráfico.</>}
                        a={<><strong>Pista.</strong> En el <span className="inline-code">lifespan</span>, antes de <span className="inline-code">joblib.load</span>, calcular el hash con <span className="inline-code">hashlib.sha256</span> sobre el archivo. Comparar contra una constante (idealmente leída de una variable de entorno <span className="inline-code">EXPECTED_MODEL_SHA256</span>; recordar el uso de <span className="inline-code">python-dotenv</span> de la Semana III para gestionar variables sensibles). Si difiere, lanzar <span className="inline-code">RuntimeError</span>: FastAPI no completará el arranque y el orquestador del PaaS interpretará la falla, evitando que tráfico real toque un modelo de origen sospechoso.</>}

                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white lp-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="lp-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            {CONFIG.lema}
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · {CONFIG.asignatura}
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            {CONFIG.notaPie}
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
