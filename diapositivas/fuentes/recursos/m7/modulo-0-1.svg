<svg viewBox="0 0 1200 500" xmlns="http://www.w3.org/2000/svg">
                                                    <defs>
                                                        <style>
                                                            .box {
                                                                fill: #ffffff;
                                                                stroke: #3498db;
                                                                stroke-width: 2.5;
                                                                rx: 12;
                                                                ry: 12;
                                                                filter: drop-shadow(4px 4px 3px rgba(0, 0, 0, 0.08));
                                                            }

                                                            .box-final {
                                                                fill: #ffffff;
                                                                stroke: #2ecc71;
                                                                stroke-width: 2.5;
                                                                rx: 12;
                                                                ry: 12;
                                                                filter: drop-shadow(4px 4px 3px rgba(0, 0, 0, 0.08));
                                                            }

                                                            .arrow {
                                                                stroke: #95a5a6;
                                                                stroke-width: 2.5;
                                                                fill: none;
                                                                marker-end: url(#arrowhead);
                                                            }

                                                            .title-text {
                                                                font-family: 'Segoe UI', Arial, sans-serif;
                                                                font-size: 24px;
                                                                font-weight: 700;
                                                                fill: #2c3e50;
                                                                text-anchor: middle;
                                                            }

                                                            .subtitle-text {
                                                                font-family: 'Segoe UI', Arial, sans-serif;
                                                                font-size: 14px;
                                                                fill: #7f8c8d;
                                                                text-anchor: middle;
                                                            }

                                                            .label-text {
                                                                font-family: 'Segoe UI', Arial, sans-serif;
                                                                font-size: 15px;
                                                                font-weight: 700;
                                                                fill: #2c3e50;
                                                                text-anchor: middle;
                                                                dominant-baseline: middle;
                                                            }

                                                            .desc-text {
                                                                font-family: 'Segoe UI', Arial, sans-serif;
                                                                font-size: 12px;
                                                                fill: #5d6d7e;
                                                                text-anchor: middle;
                                                                dominant-baseline: middle;
                                                            }

                                                            .step-num {
                                                                font-family: 'Segoe UI', Arial, sans-serif;
                                                                font-size: 32px;
                                                                font-weight: 700;
                                                                fill: #3498db;
                                                                opacity: 0.15;
                                                            }

                                                            .step-num-final {
                                                                font-family: 'Segoe UI', Arial, sans-serif;
                                                                font-size: 32px;
                                                                font-weight: 700;
                                                                fill: #2ecc71;
                                                                opacity: 0.15;
                                                            }
                                                        </style>
                                                        <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
                                                            <polygon points="0 0, 12 4, 0 8" fill="#95a5a6"/>
                                                        </marker>
                                                    </defs>


                                                    <text x="600" y="45" class="title-text">Pipeline de Validación Estadística</text>
                                                    <text x="600" y="72" class="subtitle-text">Flujo secuencial de cinco etapas para la
                                                        ingesta de datos segura y auditable</text>


                                                    <g transform="translate(60, 130)">
                                                        <rect width="180" height="200" class="box"/>
                                                        <text x="90" y="40" class="step-num">01</text>
                                                        <text x="90" y="70" class="label-text">Ingesta de Datos</text>
                                                        <text x="90" y="105" class="desc-text">Recepción de fuentes</text>
                                                        <text x="90" y="125" class="desc-text">heterogéneas</text>
                                                        <text x="90" y="145" class="desc-text">(CSV, API, DB)</text>
                                                        <rect x="65" y="165" width="50" height="20" fill="#3498db" opacity="0.12" rx="4"/>
                                                        <circle cx="90" cy="175" r="5" fill="#3498db"/>
                                                    </g>


                                                    <path d="M240 230 L260 230" class="arrow"/>


                                                    <g transform="translate(260, 130)">
                                                        <rect width="180" height="200" class="box"/>
                                                        <text x="90" y="40" class="step-num">02</text>
                                                        <text x="90" y="70" class="label-text">Validación de Esquema</text>
                                                        <text x="90" y="105" class="desc-text">Chequeo de tipos</text>
                                                        <text x="90" y="125" class="desc-text">y restricciones de</text>
                                                        <text x="90" y="145" class="desc-text">integridad</text>
                                                        <rect x="65" y="165" width="50" height="20" fill="#3498db" opacity="0.12" rx="4"/>
                                                        <rect x="75" y="170" width="30" height="10" stroke="#3498db" fill="none" stroke-width="2"/>
                                                    </g>


                                                    <path d="M440 230 L460 230" class="arrow"/>


                                                    <g transform="translate(460, 130)">
                                                        <rect width="180" height="200" class="box"/>
                                                        <text x="90" y="40" class="step-num">03</text>
                                                        <text x="90" y="70" class="label-text">Análisis Estadístico</text>
                                                        <text x="90" y="105" class="desc-text">Detección de Outliers</text>
                                                        <text x="90" y="125" class="desc-text">y distribución de</text>
                                                        <text x="90" y="145" class="desc-text">frecuencias</text>
                                                        <path d="M70,175 L90,155 L110,175" fill="none" stroke="#3498db" stroke-width="2.5" stroke-linecap="round"/>
                                                        <circle cx="90" cy="155" r="4" fill="#e74c3c"/>
                                                    </g>


                                                    <path d="M640 230 L660 230" class="arrow"/>


                                                    <g transform="translate(660, 130)">
                                                        <rect width="180" height="200" class="box"/>
                                                        <text x="90" y="40" class="step-num">04</text>
                                                        <text x="90" y="70" class="label-text">Auditoría y Trazabilidad</text>
                                                        <text x="90" y="105" class="desc-text">Generación de logs</text>
                                                        <text x="90" y="125" class="desc-text">y sellos de tiempo</text>
                                                        <text x="90" y="145" class="desc-text">de validación</text>
                                                        <circle cx="90" cy="175" r="14" stroke="#3498db" fill="none" stroke-width="2.5"/>
                                                        <path d="M85,175 L90,180 L97,168" stroke="#3498db" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                                                    </g>


                                                    <path d="M840 230 L860 230" class="arrow"/>


                                                    <g transform="translate(860, 130)">
                                                        <rect width="180" height="200" class="box-final"/>
                                                        <text x="90" y="40" class="step-num-final">05</text>
                                                        <text x="90" y="70" class="label-text" style="fill:#27ae60">Almacenamiento
                                                            Seguro</text>
                                                        <text x="90" y="105" class="desc-text">Datos validados listos</text>
                                                        <text x="90" y="125" class="desc-text">para consumo o ML</text>
                                                        <text x="90" y="145" class="desc-text" style="fill:#27ae60;font-weight:600">✓
                                                            Completado</text>
                                                        <rect x="65" y="165" width="50" height="20" fill="#2ecc71" opacity="0.12" rx="4"/>
                                                        <path d="M80,175 L87,180 L100,168" stroke="#2ecc71" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                                                    </g>


                                                    <line x1="60" y1="360" x2="1040" y2="360" stroke="#ecf0f1" stroke-width="2" stroke-dasharray="6,6"/>


                                                    <text x="600" y="390" style="font-family:\&#x27;Segoe UI\&#x27;, Arial, sans-serif;font-size:13px;fill:#95a5a6;text-anchor:middle;font-style:italic">
                                                        El flujo asegura que ningún dato cruce al almacén final sin haber pasado por los
                                                        filtros de calidad estadística.
                                                    </text>
                                                </svg>
