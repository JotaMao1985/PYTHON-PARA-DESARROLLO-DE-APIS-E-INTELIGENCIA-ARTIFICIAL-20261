            const ir = (n) => setHechos(Math.max(0, Math.min(total, n)));

            // Sin tabla de teclas: un objeto indexado por `e.key` devolvería el
            // `toString` heredado si alguien pulsa una tecla con ese nombre.
            const teclado = (e) => {
                if (e.key === 'ArrowRight') { e.preventDefault(); ir(hechos + 1); }
                else if (e.key === 'ArrowLeft') { e.preventDefault(); ir(hechos - 1); }
                else if (e.key === 'Home') { e.preventDefault(); ir(0); }
                else if (e.key === 'End') { e.preventDefault(); ir(total); }
            };

            const instruccionDe = (p) => {
                const n = lineaDe(p);
                return n && lineasAct[n - 1] !== undefined ? lineasAct[n - 1].trim() : '—';
            };

            return (
                <div ref={ref} className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm">
                    <div className="flex items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-shoe-prints"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>
                        <span className="ml-auto text-[0.65rem] uppercase tracking-wider font-bold text-white bg-teal/80 rounded px-2 py-0.5">Traza guiada</span>
                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}

                    <SelectorLenguaje disponibles={disponibles} activo={langActivo} onCambiar={cambiarLang} />

                    {/* La región entera es un solo destino de tabulación: dentro
                        hay hasta doce saltos directos, y hacer que el tabulador
                        los recorra uno a uno para llegar al final del bloque
                        convierte la navegación por teclado en un castigo. */}
                    <div tabIndex={0} onKeyDown={teclado} role="group"
                        aria-label={`${titulo}. Use las flechas izquierda y derecha para avanzar y retroceder.`}
                        className="rounded-xl outline-none focus:ring-2 focus:ring-secondary/60">

                    {/* Un solo desplazamiento horizontal para TODO el bloque, no
                        uno por línea: con `overflow-x` en cada línea, un móvil
                        de 375 px pinta una barra debajo de cada instrucción y
                        además cada línea se desplaza por su cuenta, de modo que
                        la sangría deja de alinear. El `min-w-max` interior le da
                        a todas las filas el ancho de la más larga, para que la
                        franja de la línea activa llegue hasta el final. */}
                        <div className="rounded-xl overflow-hidden border border-gray-700 bg-gray-900">
                            <div className="overflow-x-auto">
                                <div className="min-w-max">
                                    {lineasAct.map((l, i) => {
                                        const n = i + 1;
                                        const activa = n === lineaActiva;
                                        const hecha = ejecutadas.has(n);
                                        const cls = activa ? 'bg-amber-500/20 ring-1 ring-amber-400'
                                            : hecha ? 'bg-white/[0.04]' : '';
                                        return (
                                            <div key={i} className={`flex items-start gap-3 px-3 py-1 font-mono text-[0.82rem] transition-colors ${cls}`}>
                                                <span className="select-none w-6 text-right flex-shrink-0 text-gray-600">{n}</span>
                                                <span className={`select-none w-3 flex-shrink-0 ${activa ? 'text-amber-400' : 'text-gray-700'}`}>
                                                    {activa ? '▶' : hecha ? '·' : ' '}
                                                </span>
                                                <span className={`whitespace-pre ${activa ? 'text-white' : 'text-gray-100'}`}
                                                    dangerouslySetInnerHTML={{ __html: resaltar(l, langActivo) }} />
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>

                        <div className="mt-3 flex items-center gap-2 flex-wrap">
                            <button onClick={() => ir(hechos - 1)} disabled={hechos === 0}
                                className="text-sm font-bold px-3.5 py-1.5 rounded-full border border-primary text-primary hover:bg-primary/5 disabled:opacity-40">
                                <i className="fas fa-chevron-left mr-1"></i>Anterior
                            </button>
                            <button onClick={() => ir(hechos + 1)} disabled={hechos === total}
                                className="text-sm font-bold px-4 py-1.5 rounded-full text-white lp-gradient hover:opacity-90 disabled:opacity-40">
                                Siguiente<i className="fas fa-chevron-right ml-1"></i>
                            </button>
                            <button onClick={() => ir(0)} disabled={hechos === 0}
                                className="text-xs font-semibold text-gray-500 hover:text-primary underline disabled:opacity-40 disabled:no-underline">
                                <i className="fas fa-rotate-right mr-1"></i>Reiniciar
                            </button>
                            <span className="ml-auto text-xs text-gray-500">
                                Paso <strong className="text-primary">{hechos}</strong> de {total}
                                <span className="hidden sm:inline text-gray-400"> · flechas ← →</span>
                            </span>
                        </div>

                        <div className="mt-2 h-1 rounded-full bg-gray-100 overflow-hidden">
                            <div className="h-full lp-gradient transition-all duration-200"
                                style={{ width: `${total ? (hechos / total) * 100 : 0}%` }}></div>
                        </div>

                        <div className="mt-2 flex flex-wrap gap-1">
                            {pasos.map((p, i) => (
                                <button key={i} onClick={() => ir(i + 1)} aria-label={`Ir al paso ${i + 1}`}
                                    aria-current={hechos === i + 1 ? 'step' : undefined}
                                    className={`w-6 h-6 rounded text-[0.68rem] font-bold border transition-colors ${hechos === i + 1
                                        ? 'lp-gradient text-white border-transparent'
                                        : i < hechos ? 'bg-primary/10 text-primary border-primary/20'
                                            : 'bg-white text-gray-400 border-gray-200 hover:border-primary/40'}`}>
                                    {i + 1}
                                </button>
                            ))}
                        </div>

                        <p role="status" aria-live="polite" className="mt-3 mb-0 text-[0.9rem] text-gray-700 min-h-[2.6rem] rounded-lg px-3 py-2"
                            style={{ background: 'rgba(14,116,144,0.06)', borderLeft: '3px solid #0E7490' }}>
                            {actual
                                ? <><strong className="text-teal">Paso {hechos}.</strong> {actual.nota}</>
                                : <span className="text-gray-500">Aún no se ha ejecutado ninguna instrucción: ninguna variable tiene valor. Pulse <strong>Siguiente</strong>.</span>}
                        </p>

                        <div className="overflow-x-auto mt-3">
                            <table className="w-full text-sm border-collapse">
                                <thead>
                                    <tr>
                                        <th className="bg-primary/10 text-primary text-left px-2 py-2 border border-gray-200 font-semibold w-8">#</th>
                                        <th className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold">Instrucción</th>
                                        {variables.map(v => (
                                            <th key={v.clave} className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold whitespace-nowrap">
                                                {v.titulo || v.clave}
                                            </th>
                                        ))}
                                        {conSalida && <th className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold">Salida</th>}
                                    </tr>
                                </thead>
                                <tbody>
                                    {hechos === 0 && (
                                        <tr>
                                            <td colSpan={2 + variables.length + (conSalida ? 1 : 0)}
                                                className="px-3 py-3 border border-gray-200 text-gray-400 text-center italic">
                                                La tabla se llena a medida que avanza la traza.
                                            </td>
                                        </tr>
                                    )}
                                    {pasos.slice(0, hechos).map((p, i) => (
                                        <tr key={i} className={i === hechos - 1 ? 'bg-amber-50' : i % 2 ? 'bg-gray-50/60' : ''}>
                                            <td className="px-2 py-1.5 border border-gray-200 text-gray-500 text-center">{i + 1}</td>
                                            <td className="px-3 py-1.5 border border-gray-200 text-gray-700 font-mono text-[0.8rem]">{instruccionDe(p)}</td>
                                            {variables.map(v => {
                                                const cambio = cambiadas[i].includes(v.clave);
                                                const val = acumulado[i][v.clave];
                                                return (
                                                    <td key={v.clave}
                                                        className={`px-3 py-1.5 border border-gray-200 font-mono text-[0.82rem] ${cambio ? 'font-bold text-secondary bg-secondary/5' : 'text-gray-700'}`}>
                                                        {val === undefined ? <span className="text-gray-300">—</span> : val}
                                                    </td>
                                                );
                                            })}
                                            {conSalida && (
                                                <td className="px-3 py-1.5 border border-gray-200 font-mono text-[0.8rem] text-teal">
                                                    {p.salida !== undefined && p.salida !== null
                                                        ? porLenguaje(p.salida, langActivo)
                                                        : <span className="text-gray-300">—</span>}
                                                </td>
                                            )}
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {nota && <p className="text-xs text-gray-500 italic mt-3 mb-0">{nota}</p>}
                </div>
            );
        };
        /* === LP-CORE FIN === */

        /* ============================================================
           CONFIGURACIÓN DEL CAPÍTULO
           Al crear un capítulo nuevo, esto es lo único que cambia aquí
           arriba; el contenido va en las secciones de más abajo.
        ============================================================ */
        const CONFIG = {
            asignatura: "Python para Desarrollo de APIs e IA",
            docente: "Javier Mauricio Sierra",
            numero: "3",
            titulo: "Programación orientada a objetos y clases",
            subtitulo: "Modelar entidades estadísticas con clases",
            lema: "Una clase no es un archivo de funciones: es un dato que sabe lo que puede hacer consigo mismo.",
            notaPie: "Material de la Semana 3. Pregrado en Estadística · 2026-II.",
            horas: 4,
            ra: "Modelar entidades estadísticas con clases para sostener la validación y la persistencia posteriores.",
            contenidoSyllabus: "Clases, atributos y métodos aplicados al modelado estadístico. Composición frente a herencia. Métodos especiales. Por qué Pydantic, SQLAlchemy y FastAPI exigen entender esto primero.",
            temas: ["Clases", "Herencia", "Polimorfismo", "dataclasses"],
            stack: "Python 3.11.9 · POO · dataclasses",
            storageKey: "usta_2026i_apis_cap03",
        };

        /* ============================================================
           EJEMPLOS DE CÓDIGO — hilo financiero del curso:
           crédito de libre inversión de un banco colombiano
        ============================================================ */
        /* === COMPONENTES DEL MÓDULO INICIO — escritos a mano, ver la receta === */
        /* ============================================================
           CONSTRUCTOR IA DE CLASES — componente propio del módulo 3

           Se copia del heredado casi literal. Lo que cambia, y por qué:

           · **El marco.** En el heredado vivía en un panel lateral fijo de 384 px
             (`flex flex-col h-full` dentro de un `w-96`), y en LP-CORE la sección es
             una columna: `h-full` lo dejaría de altura cero y `flex-1 overflow-y-auto`
             le pondría un scroll dentro del scroll. Pasa a ser una tarjeta con su
             borde, que es lo que es cuando no hay panel donde meterla.
           · **`Icons.Sparkles`.** El objeto `Icons` de LP-CORE no lo trae —son
             diecisiete y ninguno es ése—, y `renderIcon` devuelve `null` en silencio
             para un nombre que no conoce. Se usa el icono de Font Awesome, que la
             plantilla ya carga y que este mismo componente usa para todo lo demás.
           · **`lang="python"`.** El `CodeBlock` del heredado sólo aceptaba `title` y
             `code`; el de LP-CORE resalta según `lang`, y sin declararlo cae en
             `pseudo`, que es la gramática de Lógica de Programación.
           · **`not-prose`.** `.prose-lp` estiliza `label`, `input` y `select` para
             texto corrido; aquí son controles de formulario.

           Lo que NO cambia: la clave viaja en la cabecera `x-goog-api-key` y no en la
           URL, que es la regla que este mismo módulo enseña más abajo. Y no se guarda
           en `localStorage`: sólo el modelo elegido.
        ============================================================ */

        /* Los modelos caducan, y ésa fue la avería: `gemini-2.0-flash` se apagó el 1 de
           junio de 2026 y los `gemini-1.5-*` ya no existen, así que tres de las cuatro
           opciones que ofrecía esta lista devolvían 404.

           Los cuatro de abajo se probaron uno por uno contra la API el 13 de agosto de
           2026 con una clave del plan gratuito, que es la que va a tener el estudiante.
           No basta con que el modelo salga en el catálogo: `gemini-2.5-pro` y
           `gemini-2.5-flash-lite` siguen listados y contestan «no longer available to
           new users», y los `pro` de la familia 3 contestan 429 —el plan gratuito no
           tiene cuota para ellos—. Por eso aquí no hay ninguna opción «pro»: sería
           ofrecerle al curso un botón que no puede pulsar.
           Antes de cada semestre: repetir la prueba, no mirar sólo la documentación.

           `pensamiento` es lo que se manda en `generationConfig.thinkingConfig` para
           que el modelo no gaste medio minuto razonando antes de escribir una clase de
           veinte líneas. La forma NO es la misma en las dos familias —los 3.x usan
           `thinkingLevel`, los 2.5 el `thinkingBudget` en tokens— y cruzarlas es un
           400. Por eso viaja junto al `id`: es una propiedad del modelo, no de la app. */
        const MODELOS_GEMINI = [
            { id: 'gemini-3.6-flash', name: 'Gemini 3.6 Flash (recomendado)', pensamiento: { thinkingLevel: 'low' } },
            { id: 'gemini-3.5-flash', name: 'Gemini 3.5 Flash (equilibrado)', pensamiento: { thinkingLevel: 'low' } },
            { id: 'gemini-3.5-flash-lite', name: 'Gemini 3.5 Flash-Lite (el más rápido)', pensamiento: { thinkingLevel: 'low' } },
            { id: 'gemini-2.5-flash', name: 'Gemini 2.5 Flash (estable)', pensamiento: { thinkingBudget: 0 } }
        ];
        const MODELO_POR_DEFECTO = MODELOS_GEMINI[0].id;

        /* Un error de la API dice mucho en su código de estado, y el mensaje que Google
           manda está en inglés y habla de `projects` y `credentials`. Se traduce a lo
           que el estudiante puede hacer al respecto, que es el único dato que le sirve.
           El texto original se conserva al final: sin él no hay forma de depurar. */
        const mensajeDeError = (status, detalle, modelo) => {
            if (status === 400 && /api.?key/i.test(detalle)) {
                return `La API Key no es válida. Revisa que la copiaste completa desde aistudio.google.com/apikey, sin espacios al principio ni al final.`;
            }
            if (status === 403) {
                return `La API Key existe pero no tiene permiso para usar la API de Gemini. Genera una nueva en aistudio.google.com/apikey. (${detalle})`;
            }
            if (status === 404) {
                return `El modelo «${modelo}» ya no está disponible. Elige otro en la lista de arriba. (${detalle})`;
            }
            if (status === 429) {
                return `⏳ Cuota excedida para ${modelo}. Espera ~30 s y reintenta, o selecciona otro modelo.`;
            }
            if (status >= 500) {
                return `El servidor de Gemini falló (HTTP ${status}). No es culpa tuya: reintenta en un minuto.`;
            }
            return `Error al consultar Gemini (HTTP ${status}): ${detalle}`;
        };

        /* Un 200 sin texto no es un éxito. Las tres causas, en orden de frecuencia:
           el filtro de seguridad bloqueó la petición antes de generar nada
           (`promptFeedback.blockReason`), la bloqueó después de generarla
           (`finishReason: SAFETY`), o el modelo se quedó sin tokens (`MAX_TOKENS`). */
        const mensajeDeRespuestaVacia = (data, candidato) => {
            const bloqueoPrevio = data?.promptFeedback?.blockReason;
            if (bloqueoPrevio) {
                return `Gemini rechazó el concepto por su filtro de contenido (${bloqueoPrevio}). Prueba con otro concepto.`;
            }
            const razon = candidato?.finishReason;
            if (razon === 'SAFETY' || razon === 'PROHIBITED_CONTENT') {
                return `Gemini bloqueó la respuesta por su filtro de contenido (${razon}). Prueba con otro concepto.`;
            }
            if (razon === 'MAX_TOKENS') {
                return `La respuesta se cortó por longitud antes de escribir el código. Reintenta, o elige un concepto más concreto.`;
            }
            return `Gemini respondió sin código${razon ? ` (${razon})` : ''}. Reintenta en unos segundos.`;
        };

        const AIClassBuilder = () => {
            const [concept, setConcept] = useState('');
            const [apiKey, setApiKey] = useState('');
            // El modelo elegido se recuerda, y por eso hay que validarlo al leerlo:
            // quien probara «Gemini 2.0 Flash» el semestre pasado se quedó con ese id
            // grabado, y desde que Google lo apagó el constructor le contestaba 404 en
            // cada intento —para siempre, porque el valor muerto seguía en el disco—.
            const [model, setModel] = useState(() => {
                const guardado = localStorage.getItem('gemini_model');
                return MODELOS_GEMINI.some(m => m.id === guardado) ? guardado : MODELO_POR_DEFECTO;
            });
            const [showKey, setShowKey] = useState(false);
            const [generatedCode, setGeneratedCode] = useState(null);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const saveModel = (m) => {
                setModel(m);
                localStorage.setItem('gemini_model', m);
            };

            const generateClass = async () => {
                if (!apiKey.trim()) { setError('Por favor ingresa tu API Key de Gemini.'); return; }
                if (!concept.trim()) { setError('Por favor escribe un concepto.'); return; }
                setLoading(true); setError(null); setGeneratedCode(null);

                const systemInstruction = "Eres un profesor de Python para estudiantes universitarios de estadística en la Universidad Santo Tomás (Colombia). Genera SOLO código Python puro. No uses bloques markdown (no uses ```). No agregues explicaciones fuera del código.";

                const userPrompt = `Genera una clase Python para el concepto: "${concept.trim()}".\nLa clase debe incluir:\n- Un docstring descriptivo\n- Un constructor __init__ con atributos relevantes (al menos 3)\n- Al menos 2 métodos útiles con docstrings\n- Comentarios explicativos en español\n- Un ejemplo de uso al final (como código, no como comentario)`;

                // La clave NO va en la URL. Una URL se escribe en el historial del
                // navegador, en los logs de cualquier proxy y en la cabecera Referer;
                // una cabecera de petición, no. Es la misma regla que este módulo
                // enseña más abajo («nunca escribas tu API Key en el código») y que
                // el módulo 2 explica una semana antes. La API de Gemini admite las
                // dos formas: se usa la buena.
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;

                const elegido = MODELOS_GEMINI.find(m => m.id === model);
                const payload = {
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] },
                    generationConfig: elegido?.pensamiento ? { thinkingConfig: elegido.pensamiento } : {}
                };

                // Sólo se reintenta lo que puede salir distinto la segunda vez: la
                // cuota (429) y una caída del servidor (5xx). Una clave inválida o un
                // modelo que no existe van a fallar igual tres veces; reintentarlos
                // sólo hacía que el estudiante mirara girar la ruedita tres segundos
                // antes de leer el error.
                const esReintentable = (status) => status === 429 || status >= 500;

                for (let intento = 0; intento < 3; intento++) {
                    try {
                        const res = await fetch(url, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'x-goog-api-key': apiKey.trim()
                            },
                            body: JSON.stringify(payload)
                        });

                        if (!res.ok) {
                            const errData = await res.json().catch(() => ({}));
                            const detalle = errData?.error?.message || `Error HTTP ${res.status}`;
                            if (esReintentable(res.status) && intento < 2) {
                                await new Promise(r => setTimeout(r, 1000 * Math.pow(2, intento)));
                                continue;
                            }
                            setError(mensajeDeError(res.status, detalle, model));
                            setLoading(false);
                            return;
                        }

                        const data = await res.json();
                        const candidato = data?.candidates?.[0];

                        // `parts[0].text` no basta. La respuesta puede traer varias
                        // partes, y con los modelos que piensan la primera puede ser el
                        // resumen del razonamiento (`thought: true`) y no el código.
                        const partes = candidato?.content?.parts || [];
                        let code = partes.filter(p => p.text && !p.thought).map(p => p.text).join('');

                        // Y puede no traer texto ninguno: si el filtro de seguridad
                        // bloqueó la petición, la respuesta es un 200 con `parts`
                        // vacío. El código anterior lo guardaba como cadena vacía, que

    def __init__(self, datos):

    def media(self):

        return sum(self.datos) / len(self.datos)

    def mediana(self):
        sorted_data = sorted(self.datos)
        n = len(sorted_data)

                <CodeBlock title="Varianza Poblacional vs Muestral" lang="python" code={`class EstadisticaBase:
    def __init__(self, datos):
        self.datos = datos
        self.mu = sum(datos) / len(datos)

    def suma_de_cuadrados(self):
        # Lo que las dos varianzas comparten, escrito UNA sola vez.
        return sum((x - self.mu) ** 2 for x in self.datos)

    def varianza(self):
        raise NotImplementedError("Usar subclase")

class Poblacion(EstadisticaBase):
    def varianza(self):
        # Divide por N
        return self.suma_de_cuadrados() / len(self.datos)

class Muestra(EstadisticaBase):
    def varianza(self):
        # Divide por N - 1 (Corrección de Bessel)
        return self.suma_de_cuadrados() / (len(self.datos) - 1)

# Calificaciones de TODOS los estudiantes de un curso pequeño (población)
calificaciones_curso = [85, 90, 78, 92, 88]
pob = Poblacion(calificaciones_curso)

print(f"Media del curso: {pob.mu:.2f}")
print(f"Varianza poblacional: {pob.varianza():.2f}")
print(f"Desv. estándar poblacional: {pob.varianza()**0.5:.2f}")

# Calificaciones de una muestra aleatoria de estudiantes de toda la universidad
muestra_uni = [85, 90, 78, 92, 88, 76, 95, 89]
muest = Muestra(muestra_uni)

print(f"\\nMedia muestral: {muest.mu:.2f}")
print(f"Varianza muestral: {muest.varianza():.2f}")
print(f"Desv. estándar muestral: {muest.varianza()**0.5:.2f}")`} />

# DE UNA CLASE A MANO A UNA dataclass
# El mismo objeto, escrito de las dos formas.
# ═══════════════════════════════════════════════════════
from dataclasses import dataclass, field

# --- 1. Lo que has escrito hoy: todo a mano ---
class ObservacionManual:
    """Una observación de la encuesta, escrita a la manera clásica."""

    def __init__(self, id_encuestado: int, edad: int, ingreso: float):
        self.id_encuestado = id_encuestado
        self.edad = edad
        self.ingreso = ingreso

    def __repr__(self):
        return (f"ObservacionManual(id_encuestado={self.id_encuestado}, "
                f"edad={self.edad}, ingreso={self.ingreso})")


# --- 2. Lo mismo con @dataclass: __init__ y __repr__ salen gratis ---
@dataclass
class Observacion:
    """La misma observación. Fíjate en que los TIPOS ahora están declarados."""
    id_encuestado: int
    edad: int
    ingreso: float
    etiquetas: list[str] = field(default_factory=list)   # mutable: nunca [] directo

    def es_adulto(self) -> bool:
        """Los métodos siguen funcionando igual: una dataclass es una clase."""
        return self.edad >= 18


obs = Observacion(id_encuestado=1, edad=34, ingreso=2_500_000)
print(obs)                    # el __repr__ lo escribio @dataclass
print("Adulto:", obs.es_adulto())

# ═══════════════════════════════════════════════════════

sospechosa = Observacion(id_encuestado="uno", edad="treinta y cuatro", ingreso=None)
print(sospechosa)

                <CodeBlock title="Script Completo: Generador de Clases con Gemini" lang="python" code={`from google import genai
from google.genai import errors
import os
import re
import sys
import time

from dotenv import load_dotenv
load_dotenv()

INSTRUCCION = (
    "Eres un profesor de Python para estudiantes "
    "de estadística en la Universidad Santo Tomás. "
    "Genera SOLO código Python puro, sin markdown."
)

class ErrorDeGeneracion(RuntimeError):
    """La generación falló.

    Se LANZA en vez de devolver el texto del error como si fuera código: quien
    llama no puede confundir un fallo con una clase generada.
    """

class GeneradorClases:
    """
    Genera clases Python usando la API de Google Gemini.
    Encapsula la configuración, el prompt y la comunicación con la IA.
    """

    # Sólo se reintenta lo que puede salir distinto la segunda vez: la cuota
    # (429) y una caída del servidor (5xx). Una clave inválida o un modelo que
    # no existe van a fallar igual las tres veces, y reintentarlos sólo hace
    # esperar al estudiante siete segundos antes de leer el error.
    REINTENTABLES = (429, 500, 502, 503, 504)

    def __init__(self, modelo="gemini-3.6-flash", intentos_max=3):
        # Leer la API Key de variable de entorno (seguro)
        api_key = os.environ.get("GEMINI_API_KEY")

        if not api_key:
            raise ValueError(
                "No se encontró GEMINI_API_KEY. "
                "Configúrala con: export GEMINI_API_KEY='tu_clave'"
            )

        # Un único cliente para toda la sesión
        self.cliente = genai.Client(api_key=api_key)
        self.modelo = modelo
        self.intentos_max = intentos_max

    def generar(self, concepto):
        """Genera una clase Python para el concepto dado."""
        prompt = f"""Genera una clase Python para: "{concepto}".
Incluye:
- Docstring descriptivo
- Constructor __init__ con al menos 3 atributos
- Al menos 2 métodos útiles con docstrings
- Comentarios en español
- Ejemplo de uso al final"""

        # Reintentos con backoff exponencial, sólo para lo reintentable
        for intento in range(self.intentos_max):
            try:
                interaccion = self.cliente.interactions.create(
                    model=self.modelo,
                    system_instruction=INSTRUCCION,
                    input=prompt,
                    # El modelo razona antes de responder. Para una clase de
                    # veinte líneas "low" sobra, y ahorra segundos y tokens.
                    generation_config={"thinking_level": "low"},
                )
            except errors.APIError as e:
                codigo_http = getattr(e, "code", None)
                if codigo_http in self.REINTENTABLES and intento < self.intentos_max - 1:
                    espera = 2 ** intento  # 1s, 2s, 4s
                    print(f"Gemini devolvió {codigo_http}; reintento en {espera}s...")
                    time.sleep(espera)
                    continue
                raise ErrorDeGeneracion(self._explicar(codigo_http, e)) from e

            # Un 200 no garantiza texto. Si el filtro de contenido bloqueó la
            # petición, la respuesta llega sin salida; eso NO es un éxito, y
            # devolverlo como cadena vacía deja al estudiante sin saber qué pasó.
            codigo = (interaccion.output_text or "").strip()
            if not codigo:
                raise ErrorDeGeneracion(
                    f"Gemini respondió sin código (estado: {interaccion.status}). "
                    "Suele ser el filtro de contenido: prueba con otro concepto."
                )
            return self._sin_vallas(codigo)

        raise ErrorDeGeneracion(
            f"Sin respuesta de Gemini tras {self.intentos_max} intentos."
        )

    @staticmethod
    def _sin_vallas(texto):
        """Quita las vallas markdown si el modelo las puso igual.

        Se le pidió código puro, pero a veces lo envuelve. Se busca el primer
        bloque cercado en cualquier posición, no sólo al principio del texto.
        """
        cercado = re.search(r'\\x60{3}[a-zA-Z]*\\n(.*?)\\x60{3}', texto, re.S)
        return cercado.group(1).strip() if cercado else texto

    @staticmethod
    def _explicar(codigo_http, error):
        """Traduce el error de la API a algo que el estudiante pueda accionar.

        El mensaje que manda Google está en inglés y habla de \`projects\` y
        \`credentials\`; lo único que sirve es qué hacer a continuación.
        """
        if codigo_http == 400:
            return ("La API Key no es válida. Revisa que la copiaste completa "
                    "desde aistudio.google.com/apikey.")
        if codigo_http == 403:
            return "La API Key no tiene permiso para usar la API de Gemini."
        if codigo_http == 404:
            return ("Ese modelo ya no está disponible. Los modelos se retiran: "
                    "consulta ai.google.dev/gemini-api/docs/models.")
        if codigo_http == 429:
            return "Cuota excedida. Espera ~30 s y reintenta."
        return f"Error de la API de Gemini: {error}"

# --- Uso del generador ---
if __name__ == "__main__":
    concepto = input("¿Qué clase quieres generar? ")

    # El aviso de progreso va por stderr, no por stdout. Por stdout sale SÓLO
    # la clase generada, y así se puede encadenar sin que el archivo resultante
    # se llene de mensajes:
    #     python Constructor_Clases_IA.py > Cuenta.py
    print(f"\\nGenerando clase para '{concepto}'...\\n", file=sys.stderr)

    try:
        print(GeneradorClases().generar(concepto))
    except (ValueError, ErrorDeGeneracion) as e:
        # El fallo también sale por stderr, y con código de salida 1. Así el
        # estudiante —y cualquier script que llame a éste— distingue un error
        # de una clase.
        sys.exit(f"ERROR: {e}")`} />

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            useEffect(() => {
                localStorage.setItem(CONFIG.storageKey, String(safeIndex));
                typesetMath();
                const cont = document.getElementById('contenido-scroll');
                if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
            }, [safeIndex]);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen overflow-hidden relative">
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all hover:scale-110 lp-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col lp-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            {/* contraste-ok: el gold va sobre el navy de `lp-header`, no sobre el fondo claro */}
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">
                                {CONFIG.asignatura}
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Capítulo {CONFIG.numero} · <span className="text-secondary font-semibold">{CONFIG.titulo}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg lp-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/40 border-t border-white/10">
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>{CONFIG.stack}</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full lp-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white lp-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white lp-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="lp-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            {CONFIG.lema}
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · {CONFIG.asignatura}
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            {CONFIG.notaPie}
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
