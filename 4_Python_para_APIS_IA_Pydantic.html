# DEL ValidationError DE PYDANTIC AL 422 DE HTTP
# Este bloque se ejecuta sin FastAPI: muestra la MISMA estructura
# de error que FastAPI devuelve en el cuerpo de la respuesta 422.
# ═══════════════════════════════════════════════════════════
import json
from pydantic import BaseModel, Field, ValidationError


class Encuestado(BaseModel):
    """El contrato: esto es lo que la API acepta."""
    id_encuestado: int
    edad: int = Field(ge=0, le=120, description="Edad en años cumplidos")
    ingreso: float = Field(gt=0)


# --- Petición con TRES cosas mal a la vez ---
payload_malo = {"id_encuestado": "abc", "edad": -5, "ingreso": 0}

try:
    Encuestado(**payload_malo)
except ValidationError as e:
    # .errors() es la lista que FastAPI pone tal cual en {"detail": [...]}
    print("Número de errores:", len(e.errors()))
    for err in e.errors():
        print(f"  loc={list(err['loc'])}  type={err['type']}")

    # Así se ve el cuerpo de la respuesta HTTP 422 que recibe el cliente:
    cuerpo_422 = {"detail": [
        {"loc": ["body", *err["loc"]], "msg": err["msg"], "type": err["type"]}
        for err in e.errors()
    ]}
    print("\\nCuerpo de la respuesta 422:")
    print(json.dumps(cuerpo_422, indent=2, ensure_ascii=False)[:400])

# El punto: Pydantic reporta los TRES errores de una vez, no se para en el
# primero. Quien consume tu API arregla todo de una pasada en vez de
# descubrir los fallos de uno en uno.`} />

from pydantic import BaseModel, ValidationError

# 1. Definimos el Modelo de Calidad
class Transaccion(BaseModel):
    id_tx: int
    monto: float
    categoria: str

# 2. Leemos datos crudos (Simulando un CSV con errores)
df = pd.DataFrame([
    {'id_tx': 1, 'monto': 100.50, 'categoria': 'comida'},     # Correcto
    {'id_tx': '2', 'monto': 200, 'categoria': 'transporte'},  # Coerción OK (str->int)
    {'id_tx': 3, 'monto': 'error', 'categoria': 'ocio'},      # ERROR (Monto inválido)
])

# 3. Validamos Fila por Fila
registros_limpios = []
errores = []

# Iteramos sobre el DF convirtiendo a dict
for i, fila in df.iterrows():
    try:
        # Convertimos la fila (Series) a diccionario y validamos
        # **fila.to_dict() desempaqueta los valores en el modelo
        dato = Transaccion(**fila.to_dict())
        registros_limpios.append(dato.model_dump())
    except ValidationError as e:
        errores.append({'indice_fila': i, 'error': str(e)})

# 4. Resultados
print(f"Registros válidos: {len(registros_limpios)}")
print(f"Registros fallidos: {len(errores)}")

# Creamos el DF final solo con datos confiables
df_final = pd.DataFrame(registros_limpios)
print(df_final)`} />

                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white lp-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="lp-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            {CONFIG.lema}
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · {CONFIG.asignatura}
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            {CONFIG.notaPie}
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
