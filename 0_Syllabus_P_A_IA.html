                                <a href={r.url} target="_blank" rel="noopener noreferrer" className="font-semibold text-navy hover:text-secondary transition-colors">
                                    {r.titulo} <i className="fas fa-external-link-alt text-[0.65rem] ml-0.5"></i>
                                </a>
                                <p className="text-[0.85rem] text-gray-600">{r.desc}</p>

                <h3 className="text-lg font-bold text-secondary mt-8 mb-3">Bibliografía complementaria</h3>

                        { tipo: 'Web', color: '#B45309', url: 'https://realpython.com/fastapi-python-web-apis/', titulo: 'Real Python — FastAPI tutorial', desc: 'Recorrido guiado alternativo, útil como segunda explicación.' },
                        { tipo: 'Doc', color: '#0E7490', url: 'https://docs.python.org/3/whatsnew/3.11.html', titulo: 'What’s New in Python 3.11', desc: 'Acceso abierto. Justifica la versión fijada del curso.' },
                    ].map(r => (
                        <li key={r.titulo} className="flex items-start gap-3">
                            <span className="mt-1 text-[0.65rem] font-bold px-2 py-0.5 rounded text-white flex-shrink-0" style={{ background: r.color }}>{r.tipo}</span>
                            <div>
                                <a href={r.url} target="_blank" rel="noopener noreferrer" className="font-semibold text-navy hover:text-secondary transition-colors">
                                    {r.titulo} <i className="fas fa-external-link-alt text-[0.65rem] ml-0.5"></i>
                                </a>
                                <p className="text-[0.85rem] text-gray-600">{r.desc}</p>
                            </div>
                        </li>
                    ))}
                </ul>

                <h3 className="text-lg font-bold text-secondary mt-8 mb-3">Uso de herramientas de IA</h3>
                <CalloutPro tema="gold" titulo="Permitido y fomentado, con una condición" icon="fa-robot">
                    <p className="mb-2">
                        Se puede usar asistencia de IA para escribir, depurar y documentar. La condición es una sola y
                        no se negocia: <strong>el estudiante debe poder defender oralmente cada línea que entrega</strong>.
                        En la sustentación no se pregunta quién escribió el código, se pregunta por qué está escrito así.
                    </p>
                    <p>
                        El README del proyecto debe incluir una sección <strong>«Uso de herramientas de IA»</strong> que

                <h3 className="text-lg font-bold text-secondary mt-8 mb-3">Otras políticas</h3>
                <Box type="warn" label="Pendiente del formato institucional">
                    Asistencia, entregas tardías e integridad académica se rigen por el reglamento estudiantil y por el
                    formato institucional de la asignatura. <Pendiente>redacción definitiva</Pendiente>
                </Box>

        /* ============================================================
           SECCIONES DEL DOCUMENTO
           Los iconos salen del catálogo `Icons` de LP-CORE, que no se
           amplía desde aquí: añadir uno obliga a tocar la librería. El
           catálogo trae 17, suficientes para elegir por significado en
           lugar de por descarte —Grid para la retícula de 16 semanas,
           Layers para las cinco capas del proyecto, Calculator para los
           pesos de la rúbrica—.
        ============================================================ */
        const curriculum = [
            { id: 'portada', title: 'Encuadre e identificación', icon: 'BookOpen', component: PortadaSection },
            { id: 'cronograma', title: 'Cronograma de 16 semanas', icon: 'Grid', component: CronogramaSection },
            { id: 'proyecto', title: 'Proyecto integrador', icon: 'Layers', component: ProyectoSection },
            { id: 'evaluacion', title: 'Evaluación y rúbrica', icon: 'Calculator', component: EvaluacionSection },
            { id: 'recursos', title: 'Recursos y políticas', icon: 'FileCode', component: RecursosSection },
        ];

        /* ============================================================
           APP — adaptado de la plantilla LP-CORE.
           Cambios respecto de `lp-base.html`: el documento es un
           syllabus y no un capítulo, así que se habla de SECCIONES y no
           de lecciones, desaparece el pie de lenguajes del material de
           Lógica de Programación, y la cabecera identifica la
           asignatura. `migrar.py` no debe correrse sobre este archivo:
           reestamparía el App de LPF encima.
        ============================================================ */
        const App = () => {
            const [activeLessonIndex, setActiveLessonIndex] = useState(() => {
                const saved = parseInt(localStorage.getItem(CONFIG.storageKey), 10);
                return Number.isInteger(saved) && saved >= 0 ? saved : 0;
            });
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            useEffect(() => {
                localStorage.setItem(CONFIG.storageKey, String(safeIndex));
                typesetMath();
                const cont = document.getElementById('contenido-scroll');
                if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
            }, [safeIndex]);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen overflow-hidden relative">
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all hover:scale-110 lp-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col lp-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            <div className="flex items-center gap-3 mb-3">
                                <img src="Logo_USTA.png" alt="" width="800" height="800"
                                    className="rounded-lg flex-shrink-0" style={{ width: 38, height: 38, objectFit: 'contain', background: '#ECF2F6', padding: 2 }} />
                                {/* contraste-ok: el gold va sobre el navy de `lp-header`, no sobre el fondo claro */}
                                <p className="text-[0.62rem] uppercase tracking-widest text-gold font-bold leading-tight">
                                    Universidad<br />Santo Tomás
                                </p>
                            </div>
                            <h1 className="text-white font-bold text-base tracking-tight leading-snug">
                                Python para APIs e IA
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Syllabus · <span className="text-secondary font-semibold">{CONFIG.programa}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg lp-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/40 border-t border-white/10">
                            <p>{CONFIG.codigo} · {CONFIG.periodo} · {CONFIG.creditos} créditos · {CONFIG.semanas} semanas</p>
                            <p>FastAPI · Pydantic · SQLAlchemy · Docker</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full lp-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                {/* Con la barra cerrada, el botón fijo de menú (x 16–48) se come el
                                    rótulo, que arranca en x 24. La holgura depende de si la barra está
                                    abierta y no del punto de corte: un usuario de escritorio que la
                                    cierra tiene exactamente el mismo solape. */}
                                <div className={`mb-6 flex items-center justify-between flex-wrap gap-3 ${sidebarOpen ? '' : 'pl-12'}`}>
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Sección {safeIndex + 1} de {curriculum.length}
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white lp-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">
                                            Syllabus · {CONFIG.periodo} · {CONFIG.semanas} semanas
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.asignatura}</h1>
                                        <p className="text-gray-600 font-light">
                                            Del script de análisis al producto de datos desplegado
                                        </p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {['FastAPI', 'Pydantic', 'SQLAlchemy', 'Docker', 'CI/CD', 'ML en producción'].map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white lp-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="lp-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>{CONFIG.asignatura}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            Del script de análisis al producto de datos desplegado.
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            {CONFIG.facultad} · {CONFIG.programa} · {CONFIG.periodo}
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            Companion del estudiante. El documento normativo es el formato institucional de la asignatura.
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
