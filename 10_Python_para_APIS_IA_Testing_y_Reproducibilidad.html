        const PytestSection = () => (
            <div className="prose-lp">
                <p>pytest es el framework de testing dominante en Python. A diferencia del módulo estándar <code>unittest</code>, no exige clases ni nomenclatura ceremonial: basta con funciones
                                        cuyo nombre empieza por <code>test_</code> dentro de archivos cuyo nombre también empieza
                                        por <code>test_</code>. Las aserciones se escriben con la palabra clave <code>assert</code> de Python, y pytest reescribe el bytecode para mostrar el valor real cuando una falla.
                                    </p>

                                    <h3>3.1 Estructura de proyecto recomendada</h3>
                                    <CodeBlock lang="text" code={`encuestas-api/
                ├── app/
                │   ├── __init__.py
                │   ├── main.py
                │   ├── stats.py
                │   ├── models.py
                │   └── db.py
                ├── tests/
                │   ├── __init__.py
                │   ├── conftest.py            # fixtures compartidas
                │   ├── test_stats.py
                │   ├── test_endpoints.py
                │   └── test_reproducibilidad.py
                ├── pyproject.toml
                ├── pytest.ini
                └── requirements.txt`} />

                                    <h3>3.2 Configuración mínima</h3>
                                    <p>El archivo <code>pytest.ini</code> declara la configuración del proyecto. Se recomienda
                                        como mínimo:</p>

                                    <CodeBlock title="pytest.ini" lang="toml" code={`# pytest.ini
                [pytest]
                minversion = 8.0
                testpaths = tests
                python_files = test_*.py
                python_functions = test_*
                addopts = -ra --strict-markers --strict-config -q
                markers =
                    slow: pruebas lentas (excluir con -m "not slow")
                    integration: pruebas que tocan la base de datos
                    statistics: pruebas que validan resultados numéricos`} />

                                    <p>La opción <code>--strict-markers</code> obliga a declarar cada marcador, evitando
                                        typos silenciosos del tipo <code>@pytest.mark.intgration</code>. La opción <code>-ra</code> imprime un resumen de pruebas que no fueron <em>passed</em>.
                                    </p>

                                    <h3>3.3 Aserciones expresivas</h3>
                                    <p>pytest enriquece <code>assert</code> mostrando los operandos cuando una prueba falla. En
                                        el dominio estadístico, donde rara vez se compara con igualdad estricta, conviene usar
                                        los <em>helpers</em> <code>pytest.approx</code> y <code>math.isclose</code>:</p>

                                    <CodeBlock lang="python" code={`import pytest
                from app.stats import media_y_ee

                def test_media_de_normales_centrada_en_cero():
                    import random
                    random.seed(42)
                    datos = [random.gauss(0, 1) for _ in range(1000)]
                    media, ee = media_y_ee(datos)
                    # Tolerancia: 4 errores estándar evita una prueba inestable (flaky)
                    # sin volverla trivialmente cierta.
                    assert abs(media) < 4 * ee, f"Media {media} fuera de banda"`} />

                                    <h3>3.4 Parametrización</h3>
                                    <p>El decorador <code>@pytest.mark.parametrize</code> ejecuta una misma prueba con varios
                                        juegos de entradas. Cada combinación cuenta como una prueba independiente: si una falla,
                                        pytest indica exactamente cuál.</p>

                                    <CodeBlock lang="python" code={`import pytest
                from app.stats import media_y_ee

                @pytest.mark.parametrize(
                    "datos, media_esperada",
                    [
                        ([1.0, 2.0, 3.0],          2.0),
                        ([10.0, 20.0],               15.0),
                        ([-1.0, 0.0, 1.0],          0.0),
                        ([100.0] * 5 + [200.0] * 5, 150.0),
                    ],
                    ids=["trio", "par", "simetrica", "bimodal"],
                )
                def test_media_de_casos_canonicos(datos, media_esperada):
                    media, _ = media_y_ee(datos)
                    assert media == pytest.approx(media_esperada)`} />

                                    <p>Los identificadores explícitos en <code>ids=[...]</code> facilitan filtrar pruebas con <code>pytest -k bimodal</code> y producen reportes legibles.
                                    </p>

                                    <GraficaPytest caption="Figura 3.1 — Cada fila corresponde a una invocación independiente de la misma función de prueba con un juego distinto de datos. El diamante magenta es el valor de la aserción media == media_esperada; los círculos púrpura son las observaciones del caso." />

                                    <h3>3.5 Marcadores</h3>
                                    <p>Los marcadores etiquetan pruebas para seleccionarlas o saltarlas. Los más útiles en una
                                        suite estadística son:</p>

                                    <ul>
                                        <li><code>@pytest.mark.skip(reason=...)</code> — omite la prueba siempre.</li>
                                        <li><code>@pytest.mark.skipif(condición, reason=...)</code> — omite condicionalmente.</li>
                                        <li><code>@pytest.mark.xfail</code> — se espera que falle (útil para bugs conocidos).</li>
                                        <li>Marcadores propios declarados en <code>pytest.ini</code>, como <code>@pytest.mark.slow</code>.
                                        </li>
                                    </ul>

                                    <CodeBlock lang="python" code={`import pytest
                import sys

                @pytest.mark.slow
                def test_simulacion_montecarlo_grande():
                    # Se ejecuta solo cuando se invoca con -m slow
                    ...

                @pytest.mark.skipif(sys.platform == "win32", reason="Backend BLAS distinto")
                def test_residuales_consistentes_con_R():
                    ...

                @pytest.mark.xfail(reason="Bug #142: precisión flotante en estrato vacío")
                def test_resumen_estrato_vacio():
                    ...`} />

                                    <p>Para ejecutar selectivamente:</p>
                                    <CodeBlock lang="shell" code={`# Solo unitarias rápidas:
                pytest -m "not slow"

                # Solo integración:
                pytest -m integration

                # Una prueba específica por nombre:
                pytest tests/test_stats.py::test_media_de_casos_canonicos[bimodal]`} />

                                    <Box type="tip" label="Sugerencia didáctica">

                                        Conviene agrupar las pruebas que requieren red, base de datos o simulaciones largas
                                        bajo un marcador propio. Así la ejecución por defecto en el flujo de trabajo del
                                        estudiante es siempre rápida, y las pruebas pesadas se reservan para CI o para una
                                        invocación explícita con <code>-m</code>.
                                    </Box>
            </div>

        const TestclientSection = () => (
            <div className="prose-lp">
                <p>Probar una API por HTTP real exige levantar Uvicorn, abrir un puerto, hacer peticiones
                                        con <code>httpx</code> o <code>requests</code> y limpiar el proceso al final. FastAPI
                                        ofrece una alternativa elegante: <code>TestClient</code>, una envoltura sobre <code>httpx.Client</code> que se comunica con la aplicación ASGI directamente, sin
                                        tocar la red. Las peticiones, las cabeceras y los códigos de estado son auténticos,

                                    <h3>4.1 Configuración de la aplicación de ejemplo</h3>

                                    <CodeBlock title="app/main.py" lang="python" code={`# app/main.py
                from fastapi import FastAPI, Depends, HTTPException
                from pydantic import BaseModel, Field, field_validator
                from .stats import media_y_ee

                app = FastAPI(title="encuestas-api", version="1.0.0")

                class Observacion(BaseModel):
                    edad: int = Field(ge=18, le=120)
                    ingreso: float = Field(gt=0)
                    estrato: int = Field(ge=1, le=6)

                    @field_validator("ingreso")
                    @classmethod
                    def ingreso_no_atipico(cls, v: float) -> float:
                        if v > 1e9:
                            raise ValueError("Ingreso fuera de rango plausible")
                        return v

                # Almacenamiento en memoria para el ejemplo;
                # en producción se inyecta una sesión de SQLAlchemy.
                _almacen: list[Observacion] = []

                def obtener_almacen() -> list[Observacion]:
                    return _almacen

                @app.post("/muestras", status_code=201)
                def crear_muestra(obs: Observacion, almacen=Depends(obtener_almacen)):
                    almacen.append(obs)
                    return {"id": len(almacen) - 1, "obs": obs}

                @app.get("/resumen/media")
                def resumen_media(almacen=Depends(obtener_almacen)):
                    if len(almacen) < 2:
                        raise HTTPException(status_code=409,
                                            detail="Se requieren al menos 2 observaciones")
                    media, ee = media_y_ee([o.ingreso for o in almacen])
                    return {"n": len(almacen), "media": media, "error_estandar": ee,
                            "ic95": [media - 1.96 * ee, media + 1.96 * ee]}`} />

                                    <h3>4.2 Pruebas con TestClient</h3>

                                    <CodeBlock title="tests/test_endpoints.py" lang="python" code={`# tests/test_endpoints.py
                from fastapi.testclient import TestClient
                from app.main import app

                client = TestClient(app)

                def test_post_muestra_valida_devuelve_201():
                    payload = {"edad": 35, "ingreso": 2_500_000, "estrato": 3}
                    response = client.post("/muestras", json=payload)
                    assert response.status_code == 201
                    cuerpo = response.json()
                    assert cuerpo["obs"]["edad"] == 35
                    assert cuerpo["obs"]["ingreso"] == 2_500_000

                def test_post_muestra_con_edad_invalida_devuelve_422():
                    response = client.post("/muestras",
                                           json={"edad": -1, "ingreso": 100, "estrato": 3})
                    assert response.status_code == 422
                    errores = response.json()["detail"]
                    assert any(e["loc"] == ["body", "edad"] for e in errores)

                def test_resumen_media_falla_con_pocas_observaciones():
                    response = client.get("/resumen/media")
                    assert response.status_code == 409`} />

                                    <Box type="warn" label="Cuidado con el estado compartido">

                                        El <code>_almacen</code> del ejemplo es global, así que las pruebas se contaminan unas a
                                        otras según el orden de ejecución. Esto se resuelve sustituyendo la dependencia <code>obtener_almacen</code> por una versión limpia en cada prueba (sección 4.3) o
                                        encapsulando el estado en una fixture (sección 5).
                                    </Box>

                                    <h3>4.3 Sustitución de dependencias con <code>app.dependency_overrides</code></h3>
                                    <p>FastAPI permite reemplazar cualquier <code>Depends</code> por una función arbitraria en
                                        tiempo de prueba. Es la herramienta canónica para inyectar bases de datos en memoria,
                                        autenticación falsa o relojes deterministas:</p>

                                    <CodeBlock lang="python" code={`from fastapi.testclient import TestClient
                from app.main import app, obtener_almacen, Observacion

                def test_resumen_media_con_almacen_inyectado():
                    # El endpoint accede a o.ingreso (atributo), por lo que el almacén falso
                    # debe contener instancias de Observacion, no diccionarios crudos.
                    almacen_falso = [
                        Observacion(edad=30, ingreso=1_000, estrato=2),
                        Observacion(edad=40, ingreso=3_000, estrato=4),
                    ]
                    app.dependency_overrides[obtener_almacen] = lambda: almacen_falso

                    try:
                        client = TestClient(app)
                        r = client.get("/resumen/media")
                        assert r.status_code == 200
                        assert r.json()["media"] == pytest.approx(2_000)
                    finally:
                        app.dependency_overrides.clear()`} />

                                    <p>El bloque <code>try/finally</code> garantiza que las modificaciones no se filtren a otras
                                        pruebas. En la próxima sección este patrón se encapsula en una fixture, que lo hace
                                        automático y declarativo.</p>

                                    <h3>4.4 Pruebas asíncronas</h3>
                                    <p>El <code>TestClient</code> es síncrono incluso para endpoints declarados con <code>async def</code>: ejecuta el ciclo de eventos por debajo. Cuando se necesita
                                        código de prueba realmente asíncrono (por ejemplo, para llamar a varios endpoints en
                                        paralelo o para colaborar con corrutinas), se utiliza <code>httpx.AsyncClient</code> con
                                        el plugin <code>pytest-asyncio</code>:
                                    </p>

                                    <CodeBlock lang="python" code={`import asyncio, pytest, httpx
                from app.main import app

                @pytest.mark.asyncio
                async def test_dos_post_concurrentes():
                    async with httpx.AsyncClient(
                        transport=httpx.ASGITransport(app=app), base_url="http://test"
                    ) as ac:
                        # asyncio.gather las dispara en paralelo; el orden de respuesta no se asume.
                        r1, r2 = await asyncio.gather(
                            ac.post("/muestras",
                                    json={"edad": 30, "ingreso": 1000, "estrato": 2}),
                            ac.post("/muestras",
                                    json={"edad": 40, "ingreso": 3000, "estrato": 4}),
                        )
                    assert r1.status_code == 201 and r2.status_code == 201`} />

                                    <Box type="info" label="Ejercicio 4.1">

                                        Se desea proteger el endpoint <code>POST /muestras</code> exigiendo una cabecera <code>X-API-Token</code> validada por una dependencia <code>verificar_token</code>.
                                        Se pide:
                                        <ol>
                                            <li>Escribir la dependencia y aplicarla con <code>Depends</code>.</li>
                                            <li>Probar con TestClient que un POST sin la cabecera devuelve 401.</li>
                                            <li>Probar con TestClient que un POST con la cabecera correcta devuelve 201.</li>
                                        </ol>
                                        Sugerencia: utilícese <code>app.dependency_overrides</code> para inyectar un
                                        verificador permisivo en el caso 3.
                                    </Box>
            </div>
        );

        const FixturesSection = () => (
            <div className="prose-lp">
                <p>Una fixture es una función decorada con <code>@pytest.fixture</code> que produce un valor
                                        o un recurso a disposición de las pruebas. pytest las inyecta por nombre: cuando una
                                        función de prueba declara un parámetro cuyo nombre coincide con una fixture disponible,
                                        pytest la ejecuta y le pasa el resultado. El sistema de fixtures cumple tres funciones:
                                        aislar las pruebas, evitar duplicación y modelar el ciclo de vida (setup/teardown) de
                                        los recursos.</p>

                                    <h3>5.1 Fixture mínima</h3>
                                    <CodeBlock title="tests/conftest.py" lang="python" code={`# tests/conftest.py
                import pytest

                @pytest.fixture
                def muestra_normal_pequena() -> list[float]:
                    """Muestra fija para pruebas determinísticas."""
                    return [2.0, 4.0, 4.0, 4.0, 5.0, 5.0, 7.0, 9.0]

                # tests/test_stats.py
                from app.stats import media_y_ee
                import pytest

                def test_media_constante_via_fixture(muestra_normal_pequena):
                    media, _ = media_y_ee(muestra_normal_pequena)
                    assert media == pytest.approx(5.0)`} />

                                    <p>Al colocar la fixture en <code>conftest.py</code>, pytest la pone disponible para todas
                                        las pruebas del directorio sin necesidad de importarla.</p>

                                    <h3>5.2 Alcance (scope)</h3>
                                    <p>Cada fixture tiene un <em>scope</em> que controla cuántas veces se ejecuta:</p>

                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Scope</th>
                                                <th>Frecuencia de ejecución</th>
                                                <th>Cuándo usarlo</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td><code>function</code> (por defecto)</td>
                                                <td>Una vez por cada prueba.</td>
                                                <td>Datos que pueden mutarse entre pruebas.</td>
                                            </tr>
                                            <tr>
                                                <td><code>class</code></td>
                                                <td>Una vez por clase de pruebas.</td>
                                                <td>Suite agrupada que comparte estado.</td>
                                            </tr>
                                            <tr>
                                                <td><code>module</code></td>
                                                <td>Una vez por archivo de pruebas.</td>
                                                <td>Cargar un dataset grande de solo lectura.</td>
                                            </tr>
                                            <tr>
                                                <td><code>session</code></td>
                                                <td>Una vez para toda la corrida.</td>
                                                <td>Configuración costosa: motor de BD, modelo entrenado.</td>
                                            </tr>
                                        </tbody>
                                    </table>

                                    <Box type="warn" label="Regla de oro">

                                        El alcance amplio (module, session) gana velocidad, pero solo es seguro si el recurso es
                                        inmutable. Una BD compartida entre pruebas con scope <code>session</code> exige
                                        transacciones que se reviertan al final de cada prueba; de lo contrario, las pruebas se
                                        contaminan y el orden empieza a importar.
                                    </Box>

                                    <h3>5.3 Setup y teardown con <code>yield</code></h3>
                                    <p>El patrón canónico para recursos con ciclo de vida (conexiones, archivos, procesos) es
                                        una fixture que entrega el recurso con <code>yield</code> y lo libera en las líneas
                                        posteriores:</p>

                                    <CodeBlock lang="python" code={`import pytest
                from sqlalchemy import create_engine
                from sqlalchemy.orm import sessionmaker
                from app.db import Base

                @pytest.fixture(scope="function")
                def db_sesion():
                    # SETUP: motor SQLite en memoria, esquema creado.
                    engine = create_engine("sqlite:///:memory:", future=True)
                    Base.metadata.create_all(engine)
                    Session = sessionmaker(bind=engine, future=True)
                    sesion = Session()

                    yield sesion

                    # TEARDOWN: cerrar sesión y eliminar BD.
                    sesion.close()
                    Base.metadata.drop_all(engine)
                    engine.dispose()`} />

                                    <h3>5.4 Composición de fixtures</h3>
                                    <p>Las fixtures pueden depender unas de otras. pytest resuelve el grafo de dependencias y
                                        las construye en orden. Esta es la forma idiomática de combinar una BD limpia, un
                                        cliente HTTP y datos sembrados:</p>

                                    <CodeBlock lang="python" code={`import pytest
                from fastapi.testclient import TestClient
                from app.main import app, obtener_almacen

                @pytest.fixture
                def almacen_vacio() -> list:
                    return []

                @pytest.fixture
                def cliente(almacen_vacio):
                    app.dependency_overrides[obtener_almacen] = lambda: almacen_vacio
                    with TestClient(app) as c:
                        yield c
                    app.dependency_overrides.clear()

                def test_post_y_resumen_via_fixture(cliente):
                    cliente.post("/muestras", json={"edad": 30, "ingreso": 1000, "estrato": 2})
                    cliente.post("/muestras", json={"edad": 40, "ingreso": 3000, "estrato": 4})
                    r = cliente.get("/resumen/media")
                    assert r.status_code == 200
                    assert r.json()["n"] == 2
                    assert r.json()["media"] == 2000`} />

                                    <h3>5.5 Fábricas de datos parametrizables</h3>
                                    <p>Una fixture que devuelve una <em>función</em> permite generar datos a la medida dentro de
                                        cada prueba. Es el patrón <em>factory-as-fixture</em>:</p>

                                    <CodeBlock lang="python" code={`import pytest
                import random

                @pytest.fixture
                def fabrica_observaciones():
                    """Devuelve una función que produce listas de observaciones reproducibles."""
                    def _fabricar(n: int, semilla: int = 2026, ingreso_medio: float = 2_000_000):
                        rng = random.Random(semilla)
                        return [
                            {
                                "edad": rng.randint(18, 75),
                                "ingreso": max(1.0, rng.gauss(ingreso_medio, ingreso_medio * 0.2)),
                                "estrato": rng.randint(1, 6),
                            }
                            for _ in range(n)
                        ]
                    return _fabricar

                def test_resumen_con_30_observaciones(cliente, fabrica_observaciones):
                    for obs in fabrica_observaciones(30, semilla=1):
                        cliente.post("/muestras", json=obs)
                    r = cliente.get("/resumen/media")
                    assert r.json()["n"] == 30
                    assert r.json()["ic95"][0] < r.json()["media"] < r.json()["ic95"][1]`} />

                                    <p>Como la fábrica recibe la semilla, las pruebas que la utilicen son completamente
                                        deterministas: cada vez que se ejecuten producirán los mismos datos sintéticos.</p>

                                    <GraficaFixtures caption="Figura 5.1 — Ingresos sintéticos generados por fabrica_observaciones(n=300, semilla=2026). El intervalo de confianza al 95 % rodea la media muestral; al fijar la semilla la figura se reproduce bit a bit en cualquier máquina." />

                                    <h3>5.6 Parametrización de fixtures</h3>
                                    <p>Una fixture puede declarar <code>params=</code> para que pytest la ejecute repetidamente
                                        con diferentes valores. Esto multiplica todas las pruebas que la consuman:</p>

                                    <CodeBlock lang="python" code={`@pytest.fixture(params=[30, 100, 500], ids=["n30", "n100", "n500"])
                def tamano_muestra(request) -> int:
                    return request.param

                def test_resumen_responde_para_varios_tamanos(cliente, fabrica_observaciones, tamano_muestra):
                    for obs in fabrica_observaciones(tamano_muestra, semilla=7):
                        cliente.post("/muestras", json=obs)
                    cuerpo = cliente.get("/resumen/media").json()
                    assert cuerpo["n"] == tamano_muestra
                    assert cuerpo["ic95"][0] < cuerpo["media"] < cuerpo["ic95"][1]
                    # Verificar que el IC se estrecha con n requiere comparar entre tamaños:
                    # se delega al ejercicio 7.2 de la autoevaluación.`} />

                                    <Box type="info" label="Diagnóstico de fixtures">

                                        El comando <code>pytest --fixtures</code> lista todas las fixtures visibles desde el
                                        directorio actual con su docstring. Es una herramienta valiosa cuando el proyecto crece
                                        y hay riesgo de duplicar fixtures con nombres parecidos.
                                    </Box>
            </div>
        );

        const ReproducibilidadSection = () => (
            <div className="prose-lp">
                <p>Reproducibilidad significa que dos personas, ejecutando el mismo código en dos máquinas
                                        distintas, obtienen los mismos resultados numéricos. En estadística esto es un requisito
                                        científico: una API que ajusta una regresión debe devolver los mismos coeficientes hoy
                                        y dentro de seis meses, en macOS y en Linux. Docker resuelve esta exigencia
                                        encapsulando el sistema operativo, pero introduce una capa adicional cuya curva de
                                        aprendizaje y costo no siempre se justifican en proyectos académicos. Esta sección
                                        presenta una alternativa basada únicamente en <code>venv</code>, fijación estricta de
                                        versiones, semillas explícitas y archivos de configuración deterministas.</p>

                                    <h3>6.1 Fijación estricta de dependencias</h3>
                                    <p>El archivo <code>requirements.txt</code> visto en semanas anteriores se generaliza con
                                        dos archivos:</p>

                                    <ul>
                                        <li><code>requirements.in</code> — declara únicamente las dependencias de alto nivel
                                            del proyecto (lo que el desarrollador realmente usa).</li>
                                        <li><code>requirements.txt</code> — contiene la versión exacta de cada dependencia y
                                            de cada dependencia transitiva, generada a partir del anterior.</li>
                                    </ul>

                                    <CodeBlock title="requirements.in" lang="text" code={`# requirements.in
                fastapi>=0.110,<0.120
                uvicorn[standard]>=0.30,<0.32
                pydantic>=2.7,<3.0
                sqlalchemy>=2.0,<3.0
                python-dotenv>=1.0,<2.0
                numpy>=1.26,<2.0
                pytest>=8.0,<9.0
                httpx>=0.27,<0.29
                pytest-asyncio>=0.23,<0.25`} />

                                    <p>Para resolver versiones transitivas existen dos caminos. El más sencillo, sin
                                        herramientas adicionales:</p>

                                    <CodeBlock lang="shell" code={`# Crear y activar un entorno virtual limpio.
                python3.11 -m venv .venv
                source .venv/bin/activate         # macOS / Linux
                # .venv\\Scripts\\activate         # Windows

                # Instalar las dependencias declaradas.
                pip install -r requirements.in

                # Congelar el árbol completo con versiones exactas.
                pip freeze --exclude-editable > requirements.txt`} />

                                    <p>El más robusto utiliza <code>pip-tools</code>, que recalcula el lockfile cuando cambia el
                                        archivo de entrada y produce un fichero ordenado y comentado:</p>

                                    <CodeBlock lang="shell" code={`pip install pip-tools
                pip-compile --generate-hashes --output-file=requirements.txt requirements.in
                pip-sync requirements.txt`} />

                                    <Box type="tip" label="Hashes y verificación">

                                        El flag <code>--generate-hashes</code> añade <code>--hash=sha256:...</code> a cada
                                        paquete. Cuando alguien clona el repositorio y ejecuta <code>pip install -r
                                    requirements.txt</code>, pip rechaza paquetes cuyo contenido no coincida bit a bit con
                                        el hash registrado. Esto cierra una clase entera de incidentes en los que un paquete se
                                        sobreescribe en PyPI.
                                    </Box>

                                    <h3>6.2 Versionado del intérprete</h3>
                                    <p>El proyecto declara la versión exacta de Python en dos lugares:</p>

                                    <CodeBlock title="pyproject.toml" lang="toml" code={`# pyproject.toml
                [project]
                name = "encuestas-api"
                version = "1.0.0"
                requires-python = "==3.11.9"`} />

                                    <CodeBlock lang="text" code={`# .python-version  (lo lee pyenv para activar el intérprete correcto)
                3.11.9`} />  /* TODO revisar lang */

                                    <p>El test reproducible verifica esta condición al iniciar la suite:</p>

                                    <CodeBlock title="tests/test_reproducibilidad.py" lang="python" code={`# tests/test_reproducibilidad.py
                import sys

                def test_version_de_python():
                    assert sys.version_info[:3] == (3, 11, 9), \\
                        f"Versión de Python inesperada: {sys.version}"`} />

                                    <h3>6.3 Semillas y aleatoriedad determinista</h3>
                                    <p>Cualquier procedimiento estadístico que use números aleatorios debe sembrar
                                        explícitamente sus generadores. La semilla se fija antes de cualquier llamada que
                                        consuma aleatoriedad y se documenta en la configuración del proyecto.</p>

                                    <CodeBlock title="app/aleatorio.py" lang="python" code={`# app/aleatorio.py
                import os
                import random
                import numpy as np

                def configurar_semillas(semilla: int | None = None) -> int:
                    """Fija las semillas de random y numpy. Devuelve la semilla efectiva."""
                    if semilla is None:
                        semilla = int(os.environ.get("APP_SEED", "2026"))
                    random.seed(semilla)
                    np.random.seed(semilla)
                    return semilla

                # app/regresion.py
                import numpy as np

                def simular_regresion(n: int, beta0: float, beta1: float):
                    rng = np.random.default_rng(seed=2026)  # API moderna preferible
                    x = rng.uniform(0, 10, size=n)
                    eps = rng.normal(0, 1, size=n)
                    y = beta0 + beta1 * x + eps
                    return x, y`} />

                                    <Box type="warn" label="Sembrar el RNG global no basta">

                                        Las llamadas a <code>np.random.seed</code> sólo afectan al RNG global de NumPy. Las
                                        bibliotecas modernas (NumPy 1.17+, scikit-learn, PyTorch) recomiendan trabajar con
                                        objetos <code>Generator</code> propios (<code>np.random.default_rng(seed)</code>),
                                        porque son aislables y seguros frente a hilos. En la API se prefiere recibir el
                                        generador como parámetro en lugar de depender del estado global.
                                    </Box>

                                    <h3>6.4 Configuración determinista vía <code>.env</code></h3>
                                    <p>El archivo <code>.env</code> se versiona como plantilla (<code>.env.example</code>) y los
                                        valores reales quedan en <code>.env</code>, ignorado por git. Para reproducibilidad, los
                                        valores numéricos relevantes deben tener formatos exactos:</p>

                                    <CodeBlock title=".env.example" lang="text" code={`# .env.example
                APP_SEED=2026
                APP_NIVEL_CONFIANZA=0.95
                APP_TOLERANCIA_NUMERICA=1e-9
                APP_BD_URL=sqlite:///./encuestas.db
                APP_LOG_LEVEL=INFO`} />

                                    <p>El módulo de configuración carga estos valores con <code>python-dotenv</code> y los
                                        expone como objeto Pydantic, ya conocido por los estudiantes:</p>

                                    <CodeBlock title="app/config.py" lang="python" code={`# app/config.py
                from functools import lru_cache
                from pydantic import Field
                from pydantic_settings import BaseSettings, SettingsConfigDict

                class Configuracion(BaseSettings):
                    model_config = SettingsConfigDict(env_file=".env", env_prefix="APP_")

                    seed: int = Field(default=2026, ge=0)
                    nivel_confianza: float = Field(default=0.95, gt=0.5, lt=1.0)
                    tolerancia_numerica: float = Field(default=1e-9, gt=0)
                    bd_url: str = "sqlite:///./encuestas.db"

                @lru_cache
                def obtener_config() -> Configuracion:
                    return Configuracion()`} />

                                    <h3>6.5 Pruebas que validan reproducibilidad numérica</h3>
                                    <p>Una suite reproducible incluye pruebas explícitas que ejecutan el procedimiento dos veces
                                        y comparan los resultados con tolerancias acotadas. Estas pruebas son baratas y atrapan
                                        regresiones sutiles, como un cambio de versión de NumPy que altere el orden de
                                        evaluación de un sumatorio:</p>

                                    <CodeBlock title="tests/test_reproducibilidad.py" lang="python" code={`# tests/test_reproducibilidad.py
                import numpy as np
                from app.aleatorio import configurar_semillas
                from app.regresion import simular_regresion

                def test_regresion_simulada_es_reproducible():
                    x1, y1 = simular_regresion(100, beta0=2.0, beta1=0.5)
                    x2, y2 = simular_regresion(100, beta0=2.0, beta1=0.5)
                    assert np.allclose(x1, x2, rtol=0, atol=0)
                    assert np.allclose(y1, y2, rtol=0, atol=0)

                def test_semilla_global_se_aplica():
                    s1 = configurar_semillas(42)
                    a = np.random.random(5)
                    s2 = configurar_semillas(42)
                    b = np.random.random(5)
                    assert s1 == s2 == 42
                    assert np.array_equal(a, b)`} />

                                                    código de negocio.</td>
                                            </tr>
                                            <tr>
                                                <td>Configuración numérica</td>
                                                <td><code>.env.example</code> versionado con valores deterministas.</td>
                                            </tr>
                                            <tr>
                                                <td>Validación automática</td>
                                                <td>Tests que comparan ejecuciones repetidas con tolerancia acotada.</td>
                                            </tr>
                                        </tbody>
                                    </table>

                                    <Box type="info" label="¿Y el sistema operativo?">

                                        Sin Docker, las diferencias entre macOS, Linux y Windows pueden manifestarse en el
                                        último bit decimal de operaciones flotantes y en backends BLAS distintos. Para una API
                                        estadística académica esto rara vez es relevante; las tolerancias del orden de <code>1e-9</code> a <code>1e-6</code> en <code>pytest.approx</code> y <code>numpy.allclose</code> absorben esa variación. Cuando se requiera reproducibilidad
                                        bit a bit, el siguiente paso natural sí es Docker o <code>conda-lock</code>.
                                    </Box>
            </div>
        );

        const AutoevaluacionSection = () => (
            <div className="prose-lp">
                <p>Los siguientes ejercicios consolidan los temas de la unidad. Se recomienda resolverlos
                                        sobre el repositorio <code>encuestas-api</code> que sirve de hilo conductor.</p>

                                    <Box type="info" label="Ejercicio 7.1 — Pirámide">

                                        Elabórese una tabla con cinco pruebas para la API de encuestas. Para cada una se debe
                                        indicar nivel de la pirámide, qué garantiza, qué no garantiza y costo aproximado de
                                        ejecución.
                                    </Box>

                                    <Box type="info" label="Ejercicio 7.2 — pytest básico">

                                        Escríbase un módulo <code>app/intervalos.py</code> con la función <code>intervalo_confianza(datos, nivel)</code> que devuelva el IC de la media. A
                                        continuación se piden:
                                        <ol>
                                            <li>Tres pruebas unitarias que cubran un nivel de 0.90, 0.95 y 0.99.</li>
                                            <li>Una prueba parametrizada que verifique la propiedad: a mayor nivel, mayor
                                                ancho del intervalo.</li>
                                            <li>Un marcador <code>statistics</code> aplicado a estas pruebas y configurado en <code>pytest.ini</code>.
                                            </li>
                                        </ol>
                                    </Box>

                                    <Box type="info" label="Ejercicio 7.3 — TestClient">

                                        Añádase un endpoint <code>POST /modelos/regresion</code> que reciba dos arreglos de la
                                        misma longitud y devuelva pendiente, intercepto y R² calculados con NumPy. Pruébese,
                                        usando <code>TestClient</code>:
                                        <ol>
                                            <li>Que arreglos de longitud distinta producen un 422.</li>
                                            <li>Que <code>x = [0, 1, 2, 3]</code> y <code>y = [1, 3, 5, 7]</code> producen
                                                pendiente 2 e intercepto 1, con tolerancia <code>1e-9</code>.</li>
                                            <li>Que cuando todos los <code>x</code> son iguales, el endpoint responde 409 con
                                                un mensaje claro.</li>
                                        </ol>
                                    </Box>

                                    <Box type="info" label="Ejercicio 7.4 — Fixtures">

                                        Diséñese una fixture con scope <code>session</code> que cree un motor SQLAlchemy
                                        contra SQLite en memoria y construya el esquema una sola vez. Sobre ella, defínase
                                        una segunda fixture con scope <code>function</code> que abra una transacción al
                                        inicio y haga rollback al terminar. Justifíquese por qué esta combinación equilibra
                                        velocidad y aislamiento.
                                    </Box>

                                    <Box type="info" label="Ejercicio 7.5 — Fábrica de datos">

                                        Escríbase una fixture <code>fabrica_serie_temporal</code> que devuelva una función
                                        capaz de generar una serie con tendencia lineal y ruido normal, parametrizable por
                                        longitud, pendiente, varianza del ruido y semilla. Documéntese su contrato en el <em>docstring</em>.
                                    </Box>

                                    <Box type="info" label="Ejercicio 7.6 — Reproducibilidad">

                                        Sobre el repositorio del curso, agréguese un test <code>test_dependencias_fijas</code> que lea <code>requirements.txt</code> y
                                        verifique que ningún paquete usa <code>&gt;=</code> ni <code>~=</code>; sólo <code>==</code>. Discútase, en máximo 200 palabras, qué garantiza esta restricción y
                                        qué problema sigue sin garantizar.
                                    </Box>

                                    <Box type="info" label="Ejercicio 7.7 — Síntesis">

                                        Tómese un commit en el que la suite de pruebas pase y modifíquese el código de <code>media_y_ee</code> para introducir un sesgo (por ejemplo, dividir entre <code>n</code> en lugar de <code>n-1</code>). Identifíquense las pruebas que detectan
                                        el sesgo, las que no lo detectan y propóngase qué prueba faltaba.
                                    </Box>
            </div>
        );

        const ResumenSection = () => (
            <div className="prose-lp">
                <h3>8.1 Resumen ejecutivo</h3>
                                    <ol>
                                        <li>La pirámide de testing prescribe muchas pruebas baratas (unitarias), algunas
                                            intermedias (integración) y pocas costosas (E2E). Una API estadística saludable
                                            respeta esa proporción.</li>
                                        <li>pytest reemplaza la ceremonia de <code>unittest</code> por funciones simples,
                                            aserciones legibles y un sistema de fixtures expresivo. Sus marcadores y la
                                            parametrización permiten cubrir muchos casos sin duplicar código.</li>
                                        <li><code>TestClient</code> de FastAPI ejecuta peticiones contra la aplicación ASGI
                                            sin levantar un servidor real. Sustituyendo dependencias con <code>app.dependency_overrides</code> se aíslan endpoints de la base de datos y
                                            de servicios externos.
                                        </li>
                                        <li>Las fixtures con <code>yield</code> modelan el ciclo de vida de los recursos. El
                                            scope determina cuántas veces se crean; las fábricas-fixture entregan datos
                                            sintéticos parametrizables y deterministas.</li>
                                        <li>Reproducibilidad sin Docker se logra fijando la versión de Python, congelando
                                            dependencias con hashes, sembrando explícitamente cada generador aleatorio,
                                            documentando la configuración numérica en <code>.env</code> y validando todo lo
                                            anterior con tests automatizados.</li>
                                    </ol>

                                    <h3>8.2 Comandos útiles</h3>
                                    <CodeBlock lang="shell" code={`# Ejecutar toda la suite con resumen detallado:
                pytest -ra

                # Solo pruebas que coincidan con un patrón en el nombre:
                pytest -k "regresion and not slow"

                # Mostrar las 10 pruebas más lentas:
                pytest --durations=10

                # Detener al primer fallo (útil para depurar):
                pytest -x

                # Reejecutar solo las pruebas que fallaron en la última corrida:
                pytest --lf

                # Listar fixtures disponibles:
                pytest --fixtures`} />

                                    <h3>8.3 Referencias oficiales</h3>
                                    <ul>
                                        <li>pytest — Documentación oficial: <code>https://docs.pytest.org/</code></li>
                                        <li>FastAPI — Testing: <code>https://fastapi.tiangolo.com/tutorial/testing/</code></li>
                                        <li>FastAPI — Sustituir dependencias en pruebas: <code>https://fastapi.tiangolo.com/advanced/testing-dependencies/</code>
                                        </li>
                                        <li>httpx — Cliente síncrono y asíncrono: <code>https://www.python-httpx.org/</code></li>
                                        <li>NumPy — Random Generator API: <code>https://numpy.org/doc/stable/reference/random/generator.html</code>
                                        </li>
                                        <li>pip-tools — Gestión reproducible de dependencias: <code>https://github.com/jazzband/pip-tools</code>
                                        </li>
                                        <li>PEP 517 / PEP 621 — <code>pyproject.toml</code> como fuente de verdad: <code>https://peps.python.org/pep-0621/</code>
                                        </li>
                                    </ul>

                                    <h3>8.4 Próximos pasos</h3>
                                    <p>Una vez consolidada la suite reproducible, la siguiente unidad cubre la integración
                                        continua: ejecutar <code>pytest</code> en cada <code>git push</code>, generar
                                        reportes de cobertura con <code>pytest-cov</code> y bloquear merges si la cobertura
                                        cae por debajo de un umbral. La pirámide construida en esta semana es la base sobre
                                        la que ese pipeline se vuelve verdaderamente útil.</p>
            </div>
        );
        /* === SECCIONES FIN === */

        const curriculum = [
            { id: 'intro', title: '1. Introducción', icon: 'BookOpen', component: IntroSection },
            { id: 'piramide', title: '2. Pirámide de testing', icon: 'Layers', component: PiramideSection },
            { id: 'pytest', title: '3. Framework pytest', icon: 'Bug', component: PytestSection },
            { id: 'testclient', title: '4. TestClient de FastAPI', icon: 'Workflow', component: TestclientSection },
            { id: 'fixtures', title: '5. Fixtures en pytest', icon: 'Grid', component: FixturesSection },
            { id: 'reproducibilidad', title: '6. Reproducibilidad sin Docker', icon: 'Repeat', component: ReproducibilidadSection },
            { id: 'autoevaluacion', title: '7. Autoevaluación', icon: 'Award', component: AutoevaluacionSection },
            { id: 'resumen', title: '8. Resumen y referencias', icon: 'GitBranch', component: ResumenSection },
        ];

        /* ============================================================
           APP — barra lateral, progreso, navegación y reanudación
        ============================================================ */
        const App = () => {
            const [activeLessonIndex, setActiveLessonIndex] = useState(() => {
                const saved = parseInt(localStorage.getItem(CONFIG.storageKey), 10);
                return Number.isInteger(saved) && saved >= 0 ? saved : 0;
            });
            // La barra es hermana flex del contenido: no lo superpone, lo
            // COMPRIME. Abierta ocupa 18 rem, así que en un viewport de 375 px
            // dejaría el texto en 79 px, ilegible. Arranca abierta solo desde
            // el punto de corte `lg` de Tailwind, que es el que usa `irA` para
            // cerrarla al navegar.
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            useEffect(() => {
                localStorage.setItem(CONFIG.storageKey, String(safeIndex));
                typesetMath();
                const cont = document.getElementById('contenido-scroll');
                if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
            }, [safeIndex]);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen overflow-hidden relative">
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all hover:scale-110 lp-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col lp-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            {/* contraste-ok: el gold va sobre el navy de `lp-header`, no sobre el fondo claro */}
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">
                                {CONFIG.asignatura}
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Capítulo {CONFIG.numero} · <span className="text-secondary font-semibold">{CONFIG.titulo}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg lp-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/40 border-t border-white/10">
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>Pseudocódigo · Python · R · VBA</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full lp-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white lp-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white lp-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="lp-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            {CONFIG.lema}
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · {CONFIG.asignatura}
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            {CONFIG.notaPie}
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
