                <div ref={ref} className="my-6 rounded-2xl border-2 border-primary/20 bg-white p-5 shadow-sm">
                    <div className="flex items-center gap-2 mb-2">
                        <span className="lp-gradient text-white p-2 rounded-lg"><i className="fas fa-shoe-prints"></i></span>
                        <h4 className="text-base font-bold text-primary" style={{ margin: 0 }}>{titulo}</h4>

                    </div>
                    {enunciado && <div className="text-[0.95rem] text-gray-700 mb-3">{enunciado}</div>}

                    <SelectorLenguaje disponibles={disponibles} activo={langActivo} onCambiar={cambiarLang} />

                    {/* La región entera es un solo destino de tabulación: dentro
                        hay hasta doce saltos directos, y hacer que el tabulador
                        los recorra uno a uno para llegar al final del bloque
                        convierte la navegación por teclado en un castigo. */}
                    <div tabIndex={0} onKeyDown={teclado} role="group"
                        aria-label={`${titulo}. Use las flechas izquierda y derecha para avanzar y retroceder.`}
                        className="rounded-xl outline-none focus:ring-2 focus:ring-secondary/60">

                    {/* Un solo desplazamiento horizontal para TODO el bloque, no
                        uno por línea: con `overflow-x` en cada línea, un móvil
                        de 375 px pinta una barra debajo de cada instrucción y
                        además cada línea se desplaza por su cuenta, de modo que
                        la sangría deja de alinear. El `min-w-max` interior le da
                        a todas las filas el ancho de la más larga, para que la
                        franja de la línea activa llegue hasta el final. */}
                        <div className="rounded-xl overflow-hidden border border-gray-700 bg-gray-900">
                            <div className="overflow-x-auto">
                                <div className="min-w-max">
                                    {lineasAct.map((l, i) => {
                                        const n = i + 1;
                                        const activa = n === lineaActiva;
                                        const hecha = ejecutadas.has(n);
                                        const cls = activa ? 'bg-amber-500/20 ring-1 ring-amber-400'
                                            : hecha ? 'bg-white/[0.04]' : '';
                                        return (
                                            <div key={i} className={`flex items-start gap-3 px-3 py-1 font-mono text-[0.82rem] transition-colors ${cls}`}>
                                                <span className="select-none w-6 text-right flex-shrink-0 text-gray-600">{n}</span>

                                    className={`w-6 h-6 rounded text-[0.68rem] font-bold border transition-colors ${hechos === i + 1

                        </div>

                        <p role="status" aria-live="polite" className="mt-3 mb-0 text-[0.9rem] text-gray-700 min-h-[2.6rem] rounded-lg px-3 py-2"
                            style={{ background: 'rgba(14,116,144,0.06)', borderLeft: '3px solid #0E7490' }}>
                            {actual
                                ? <><strong className="text-teal">Paso {hechos}.</strong> {actual.nota}</>
                                : <span className="text-gray-500">Aún no se ha ejecutado ninguna instrucción: ninguna variable tiene valor. Pulse <strong>Siguiente</strong>.</span>}
                        </p>

                        <div className="overflow-x-auto mt-3">
                            <table className="w-full text-sm border-collapse">
                                <thead>
                                    <tr>
                                        <th className="bg-primary/10 text-primary text-left px-2 py-2 border border-gray-200 font-semibold w-8">#</th>
                                        <th className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold">Instrucción</th>
                                        {variables.map(v => (
                                            <th key={v.clave} className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold whitespace-nowrap">
                                                {v.titulo || v.clave}
                                            </th>
                                        ))}
                                        {conSalida && <th className="bg-primary/10 text-primary text-left px-3 py-2 border border-gray-200 font-semibold">Salida</th>}
                                    </tr>
                                </thead>
                                <tbody>
                                    {hechos === 0 && (
                                        <tr>
                                            <td colSpan={2 + variables.length + (conSalida ? 1 : 0)}
                                                className="px-3 py-3 border border-gray-200 text-gray-400 text-center italic">
                                                La tabla se llena a medida que avanza la traza.
                                            </td>
                                        </tr>
                                    )}
                                    {pasos.slice(0, hechos).map((p, i) => (
                                        <tr key={i} className={i === hechos - 1 ? 'bg-amber-50' : i % 2 ? 'bg-gray-50/60' : ''}>
                                            <td className="px-2 py-1.5 border border-gray-200 text-gray-500 text-center">{i + 1}</td>
                                            <td className="px-3 py-1.5 border border-gray-200 text-gray-700 font-mono text-[0.8rem]">{instruccionDe(p)}</td>
                                            {variables.map(v => {
                                                const cambio = cambiadas[i].includes(v.clave);

                                                return (
                                                    <td key={v.clave}
                                                        className={`px-3 py-1.5 border border-gray-200 font-mono text-[0.82rem] ${cambio ? 'font-bold text-secondary bg-secondary/5' : 'text-gray-700'}`}>

                                                    </td>
                                                );

                                                    {p.salida !== undefined && p.salida !== null
                                                        ? porLenguaje(p.salida, langActivo)
                                                        : <span className="text-gray-300">—</span>}
                                                </td>
                                            )}
                                        </tr>
                                    ))}

                        </div>
                    </div>

                    {nota && <p className="text-xs text-gray-500 italic mt-3 mb-0">{nota}</p>}
                </div>
            );
        };

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-2">1.1 ¿Qué es un servidor web?</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">Piensa en un <strong>restaurante</strong>. Cuando un cliente (el navegador o una aplicación) hace un pedido (una petición HTTP), alguien tiene que recibirlo, llevarlo a la cocina y traer el plato de vuelta. Ese "alguien" es el <strong>servidor web</strong>.</p>
                                            <p className="text-gray-700 leading-relaxed mb-5">En términos técnicos, un servidor web es un programa que: escucha conexiones entrantes en un puerto (típicamente el 80 o 443), recibe peticiones HTTP (GET, POST, PUT, DELETE…), las delega a tu aplicación Python, y devuelve la respuesta al cliente. Ejemplos de servidores web que encontrarás en producción: <strong>Nginx</strong>, <strong>Apache</strong>, <strong>Gunicorn</strong>, <strong>Uvicorn</strong>.</p>

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">1.2 WSGI: El protocolo entre el servidor y tu aplicación</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">¿Cómo se comunican el servidor web y tu código Python? Necesitan un "idioma común". Ese idioma es <strong>WSGI</strong> (<em>Web Server Gateway Interface</em>), definido en la PEP 3333.</p>

                                            <Box type="tip" label="Analogía">Si el servidor web es el <em>maître</em> que recibe al cliente en el restaurante, <strong>WSGI es el protocolo de comunicación entre el maître y la cocina</strong>. Define exactamente cómo se pasa el pedido (la petición) y cómo se devuelve el plato (la respuesta).
                                            </Box>

                                            <p className="text-gray-700 leading-relaxed mb-5">WSGI tiene una limitación de origen, y conviene verla ahora porque explica todo lo que viene después: <strong>es síncrono por diseño</strong>. La PEP 3333 se escribió en 2010, cuando el problema era estandarizar, no concurrir. Una aplicación WSGI atiende una petición, la termina, y sólo entonces empieza la siguiente. Por eso apareció <strong>ASGI</strong> (<em>Asynchronous Server Gateway Interface</em>): el mismo papel de idioma común entre servidor y aplicación, pero con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-sm border border-gray-200">async</code> desde la base. <strong>Es el que vas a usar en este curso</strong>, y el módulo 4 explica qué se gana con él.</p>

                                            <p className="text-gray-700 leading-relaxed mb-5">Cuando usas <strong>FastAPI</strong>, en realidad trabajas sobre dos piezas: <strong>Starlette</strong>, el toolkit ASGI que se encarga de toda la comunicación HTTP —parsear peticiones, construir respuestas, manejar cabeceras y rutas—, y <strong>Pydantic</strong>, que valida y serializa los datos, y que ya conoces de la semana 4. FastAPI envuelve las dos y añade la generación automática de la documentación a partir de tus tipos. Es el mismo reparto que en la generación anterior —Flask envolvía <strong>Werkzeug</strong> (HTTP) y <strong>Jinja2</strong> (plantillas HTML)—, con una diferencia que importa: la segunda pieza ya no sirve para pintar páginas, sino para <em>validar datos</em>, porque lo que devuelve una API estadística no es HTML, es JSON.</p>

                                            <Accordion items={[{ titulo: "¿Qué son Starlette y Werkzeug exactamente?", contenido: (<><div className="mt-3 text-sm text-blue-900 leading-relaxed border-t border-blue-200 pt-3">
                                                    <p><strong>Starlette</strong> es el framework ASGI ligero sobre el que está construido FastAPI. Cuando llega una petición, es Starlette quien parsea la URL, las cabeceras, el cuerpo y los parámetros de consulta, y quien construye el objeto <code className="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-mono text-xs">Request</code>. También es suyo el sistema de rutas, el middleware y el manejo de WebSockets. FastAPI le añade encima la capa que te interesa como estadístico: leer tus type hints, validar con Pydantic y generar la documentación en <code className="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-mono text-xs">/docs</code>.</p>
                                                    <p className="mt-2"><strong>Werkzeug</strong> (del alemán: "herramienta") es su equivalente en el mundo WSGI, y es lo que hay debajo de Flask. Hace el mismo trabajo —parsear la petición, construir la respuesta— pero de forma síncrona. El servidor de desarrollo de Flask (<code className="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-mono text-xs">flask run</code>) lo provee Werkzeug, igual que el de FastAPI lo provee <code className="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-mono text-xs">uvicorn</code>. Merece la pena conocerlo porque vas a encontrar muchísimo código Python en producción escrito sobre él.</p>
                                                    <p className="mt-2"><strong>Jinja2</strong> es la otra mitad de Flask: el motor de plantillas que genera HTML dinámico. No lo usamos aquí porque nuestras APIs devuelven JSON, no páginas. En FastAPI ese hueco lo ocupa Pydantic, que no pinta nada: valida. Es un buen resumen de en qué cambió el oficio entre 2010 y hoy.</p>
                                                    <table className="w-full mt-3 text-xs border-collapse">
                                                        <tr className="border-b border-blue-200"><th className="text-left py-1 font-bold">Papel</th><th className="text-left py-1 font-bold">Generación WSGI</th><th className="text-left py-1 font-bold">Generación ASGI</th></tr>
                                                        <tr className="border-b border-blue-100"><td className="py-1">Framework</td><td className="py-1">Flask</td><td className="py-1"><strong>FastAPI</strong></td></tr>
                                                        <tr className="border-b border-blue-100"><td className="py-1">Capa HTTP</td><td className="py-1">Werkzeug</td><td className="py-1"><strong>Starlette</strong></td></tr>
                                                        <tr className="border-b border-blue-100"><td className="py-1">Segunda pieza</td><td className="py-1">Jinja2 (plantillas)</td><td className="py-1"><strong>Pydantic</strong> (validación)</td></tr>
                                                        <tr><td className="py-1">Servidor</td><td className="py-1">Gunicorn</td><td className="py-1"><strong>Uvicorn</strong></td></tr>
                                                    </table>
                                                </div></>) }]} />

                                            <p className="text-gray-700 leading-relaxed mb-5">Una aplicación WSGI, en su forma más pura, es simplemente una función <em>callable</em>:</p>

                                            <CodeBlock title="Python" lang="python" code={`# La aplicación WSGI más simple del mundo
def app(environ, start_response):
    """
    environ: diccionario con toda la info de la petición HTTP
    start_response: función para enviar los headers de respuesta
    """
    status = "200 OK"
    headers = [("Content-Type", "text/plain")]
    start_response(status, headers)
    return [b"Hola desde una app WSGI pura"]`} />

                                            <p className="text-gray-700 leading-relaxed mb-5">Nadie escribe aplicaciones así en la práctica. Para eso existen los frameworks —FastAPI hoy, Flask en la generación anterior—, que encapsulan esta complejidad. Lo que acabas de ver es lo que <em>no</em> vas a tener que escribir nunca.</p>

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">1.3 De desarrollo a producción: Uvicorn y Gunicorn</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">Todo framework trae un servidor de desarrollo —<code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">uvicorn --reload</code> en FastAPI, <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">flask run</code> en Flask— y <strong>ninguno de los dos es apto para producción</strong>: recargan el código en caliente, no gestionan varios procesos y no están endurecidos frente a un cliente hostil. En producción se lanza el mismo servidor con otra configuración, o se le pone un gestor de procesos delante:</p>

                                            <CodeBlock title="Terminal" lang="shell" code={`# ── ASGI: lo que usa este curso ──────────────────────────
# Desarrollo: recarga al guardar. NO usar en produccion.
uvicorn app.main:app --reload

# Produccion: varios procesos, sin recarga.
# Es la linea que ira en el Dockerfile de la semana 11.
uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

# ── WSGI: la generacion anterior, para que la reconozcas ─
# Gunicorn con una app Flask
gunicorn --workers 4 --bind 0.0.0.0:8000 app:app

# Waitress (multiplataforma, incluye Windows)
waitress-serve --port=8000 app:app`} />

                                            <p className="text-gray-700 leading-relaxed mb-5">El parámetro <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">--workers 4</code> le dice a Gunicorn que lance 4 procesos independientes de tu aplicación. Cada worker puede atender una petición simultáneamente. Es como tener <strong>4 cocinas paralelas</strong> en el restaurante.</p>

                                        <Quiz titulo="Verificación de Comprensión" preguntas={[
                    { pregunta: (<><span className="inline-block mr-2 px-2 py-0.5 rounded text-[0.65rem] uppercase tracking-wider font-bold bg-primary/10 text-primary">Nivel Medio</span>¿Por qué <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">uvicorn --reload</code> no es adecuado para producción?</>), opciones: [{ texto: (<>Porque Uvicorn no soporta el protocolo HTTP y necesita un adaptador externo para recibir peticiones.</>), correcta: false }, { texto: (<>Porque <code className="font-mono text-xs">--reload</code> vigila el sistema de archivos y reinicia el proceso ante cualquier cambio, arranca un solo worker y desactiva optimizaciones: gasta recursos y deja el servicio caído durante cada reinicio.</>), correcta: true }, { texto: (<>Porque Uvicorn en modo desarrollo solo acepta peticiones POST y no GET.</>), correcta: false }], justificacion: (<><div className="mt-3 text-sm text-indigo-900 border-t border-indigo-200 pt-3 leading-relaxed">
                                                            <strong>Respuesta Correcta: B</strong><br /><br />
                                                            El modo <code className="font-mono text-xs">--reload</code> está diseñado para depuración local: vigila el sistema de archivos y reinicia el proceso cada vez que guardas, lo que en producción significa consumo constante de recursos y un corte del servicio en cada reinicio. Además arranca con un solo worker. El binario es el mismo —en producción se lanza <code className="font-mono text-xs">uvicorn app.main:app --workers 4</code> sin <code className="font-mono text-xs">--reload</code>—, y es esa línea la que acabará en el Dockerfile de la semana 11. Ojo con la trampa de la opción A: Uvicorn <em>sí</em> habla HTTP; eso es justamente lo que hace.
                                                        </div></>) },
                    { pregunta: (<><span className="inline-block mr-2 px-2 py-0.5 rounded text-[0.65rem] uppercase tracking-wider font-bold bg-primary/10 text-primary">Nivel Avanzado</span>Si Gunicorn es un servidor WSGI (síncrono por diseño), ¿cómo es posible que FastAPI, que es asíncrono, funcione correctamente en producción?</>), opciones: [{ texto: (<>FastAPI internamente convierte todas las funciones <code>async</code> a funciones síncronas antes de ejecutarlas.</>), correcta: false }, { texto: (<>Porque FastAPI no usa Gunicorn directamente, sino <strong>Uvicorn</strong>, un servidor ASGI que soporta el event loop asíncrono. En producción se puede usar Gunicorn como gestor de procesos con workers de clase Uvicorn.</>), correcta: true }, { texto: (<>No es posible; FastAPI requiere Apache como servidor exclusivo.</>), correcta: false }], justificacion: (<><div className="mt-3 text-sm text-indigo-900 border-t border-indigo-200 pt-3 leading-relaxed">

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-2">2.1 ¿Qué es el routing?</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">El <em>routing</em> es el mecanismo que conecta una URL con una función de Python. Cuando alguien visita <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">/predict</code>, el framework necesita saber qué función ejecutar. Es el equivalente a un directorio telefónico: dado un "número" (la URL), te conecta con la "persona" (la función) correcta.</p>

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">2.2 Routing en FastAPI</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">Éste es el que vas a usar en el proyecto, así que empezamos por él. FastAPI declara una ruta por cada método HTTP —<code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">@app.get</code>, <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">@app.post</code>— y aprovecha el <em>type hinting</em> que ya usas desde la semana 1: al escribir <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">min_age: int</code> no estás documentando, estás <strong>declarando una validación</strong>. Si llega otra cosa, FastAPI responde 422 —el error que viste en la semana 4— sin que tú escribas una línea:</p>

                                            <CodeBlock title="FastAPI — routing.py" lang="python" code={`from fastapi import FastAPI, Query

app = FastAPI()

# Ruta estática — decorador específico por método HTTP
@app.get("/health")
async def health_check():
    return {"status": "ok"}

# Variable de ruta — el tipo se infiere del type hint
@app.get("/dataset/{dataset_name}/summary")
async def dataset_summary(dataset_name: str):
    return {"dataset": dataset_name, "rows": 1500}

# Query parameters — se definen como argumentos de la función
@app.get("/filter")
async def filter_data(
    min_age: int = Query(default=0, ge=0, description="Edad mínima"),
    max_age: int = Query(default=120, le=150, description="Edad máxima"),
):
    return {"min_age": min_age, "max_age": max_age}`} />

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">2.3 El mismo routing en Flask, para que lo reconozcas</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">Esto es lo que vas a encontrar en la mayor parte del codigo Python que ya esta en produccion, asi que conviene que lo leas sin esfuerzo. Flask usa el mismo decorador <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">@app.route()</code> para todos los metodos HTTP, y los parametros hay que sacarlos y convertirlos a mano: fijate en <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">request.args.get(..., type=int)</code>, que es la linea que en FastAPI no existe porque la escribe el type hint.</p>

                                            <CodeBlock title="Flask — routing.py" lang="python" code={`from flask import Flask, request, jsonify

app = Flask(__name__)

# Ruta estática simple
@app.route("/health")
def health_check():
    return jsonify({"status": "ok"})

# Variable de ruta: captura un valor dinámico de la URL
@app.route("/dataset/<string:dataset_name>/summary")
def dataset_summary(dataset_name: str):
    return jsonify({"dataset": dataset_name, "rows": 1500})

# Query parameters: valores opcionales después del '?'
# Ejemplo: GET /filter?min_age=25&max_age=60
@app.route("/filter")
def filter_data():
    min_age = request.args.get("min_age", default=0, type=int)
    max_age = request.args.get("max_age", default=120, type=int)
    return jsonify({"min_age": min_age, "max_age": max_age})`} />

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-2">3.1 El endpoint <code>/predict</code> en Flask</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">Veamos cómo se implementa un endpoint de predicción con Flask, el framework veterano (2010). Observa la validación manual y la falta de documentación automática:</p>

                                            <CodeBlock title="app_flask.py" lang="python" code={`from flask import Flask, request, jsonify
import numpy as np
import pickle

app = Flask(__name__)

# Cargar modelo pre-entrenado
with open("modelo_credito.pkl", "rb") as f:
    modelo = pickle.load(f)

@app.route("/predict", methods=["POST"])
def predict():
    data = request.get_json()

    # ⚠️ Validación completamente manual
    required = ["income", "debt_ratio", "years_employed"]
    for field in required:
        if field not in data:
            return jsonify({"error": f"Falta el campo: {field}"}), 400

    features = np.array([[data["income"], data["debt_ratio"], data["years_employed"]]])
    probability = modelo.predict_proba(features)[0][1]

    return jsonify({
        "probability": round(float(probability), 4),
        "risk_level": "alto" if probability > 0.5 else "bajo"
    })`} />

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">3.2 El mismo endpoint en FastAPI</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">Ahora veamos cómo el mismo endpoint se reimagina con FastAPI. Observa cómo Pydantic maneja la validación y la documentación se genera automáticamente:</p>

                                            <CodeBlock title="app_fastapi.py" lang="python" code={`from fastapi import FastAPI
from pydantic import BaseModel, Field
import numpy as np
import pickle

app = FastAPI(
    title="API de Riesgo Crediticio",
    description="Modelo de regresión logística para scoring crediticio",
    version="1.0.0",
)

with open("modelo_credito.pkl", "rb") as f:
    modelo = pickle.load(f)

# ✅ Validación automática vía Pydantic
class CreditRequest(BaseModel):
    income: float = Field(..., gt=0, description="Ingreso mensual en USD")
    debt_ratio: float = Field(..., ge=0, le=1, description="Ratio deuda/ingreso")
    years_employed: int = Field(..., ge=0, description="Años de empleo")

class CreditResponse(BaseModel):
    probability: float
    risk_level: str

@app.post("/predict", response_model=CreditResponse)
async def predict(data: CreditRequest):
    features = np.array([[data.income, data.debt_ratio, data.years_employed]])
    probability = float(modelo.predict_proba(features)[0][1])

    return CreditResponse(
        probability=round(probability, 4),
        risk_level="alto" if probability > 0.5 else "bajo",
    )`} />

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">3.3 ¿Por qué migró el ecosistema?</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">No fue una moda. Hay razones técnicas concretas:</p>

from flask import Flask, jsonify

app = Flask(__name__)

def obtener_historial_credito(user_id: str) -> dict:
    time.sleep(0.3)  # Simula consulta a BD externa
    return {"score": 720, "defaults": 0}

def obtener_datos_empleo(user_id: str) -> dict:
    time.sleep(0.2)  # Simula consulta a otro servicio
    return {"years": 5, "income": 55000}

@app.route("/evaluate/<user_id>")
def evaluate(user_id: str):
    # ⚠️ Secuencial: 0.3 + 0.2 = 0.5 segundos mínimo
    credito = obtener_historial_credito(user_id)
    empleo = obtener_datos_empleo(user_id)
    risk_score = credito["score"] * 0.6 + empleo["years"] * 10
    return jsonify({"user": user_id, "risk_score": risk_score})`} />

                                            <CodeBlock title="FastAPI — asíncrono (max(0.3, 0.2) = 0.3s)" lang="python" code={`import asyncio
from fastapi import FastAPI

app = FastAPI()

async def obtener_historial_credito(user_id: str) -> dict:
    await asyncio.sleep(0.3)  # NO bloquea, cede control
    return {"score": 720, "defaults": 0}

async def obtener_datos_empleo(user_id: str) -> dict:
    await asyncio.sleep(0.2)  # NO bloquea, cede control
    return {"years": 5, "income": 55000}

@app.get("/evaluate/{user_id}")
async def evaluate(user_id: str):
    # ✅ Concurrente: ambas consultas en paralelo
    credito, empleo = await asyncio.gather(
        obtener_historial_credito(user_id),
        obtener_datos_empleo(user_id),
    )
    risk_score = credito["score"] * 0.6 + empleo["years"] * 10
    return {"user": user_id, "risk_score": risk_score}`} />
