                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">5.1 Fundamentos</h3>
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">5.1.1 Qué es un modelo anidado</h4>
                                            <p className="text-gray-700 leading-relaxed mb-5">Un modelo anidado es un modelo de Pydantic en el
                                                que el tipo de algún campo es otro modelo, o una lista de ellos. Así se escribe en el
                                                contrato que los datos llegan agrupados: ensayos dentro de sesiones, estudiantes dentro de
                                                cursos, admisiones diarias dentro de hospitales. El ejemplo de esta sección es una sesión de
                                                pruebas en dinamómetro, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">SesionDinamometro</code>, cuyo campo <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ensayos_experimentales</code> es una
                                                lista de <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">EnsayoVehiculo</code>: un ensayo por cada vehículo probado en la sesión.</p>
                                            <p className="text-gray-700 leading-relaxed mb-5">En estadística, esa estructura se llama de <em>datos agrupados</em> o <em>anidados</em>, y es la que describen los diseños anidados y
                                                los modelos multinivel (en inglés, <em>multilevel</em> o <em>mixed-effects models</em>). La
                                                correspondencia llega hasta ahí: el modelo de Pydantic registra <strong>qué unidad pertenece
                                                a qué grupo</strong>, no cómo se asignaron los tratamientos ni qué efectos se estiman. Un
                                                diseño de parcelas divididas (en inglés, <em>split-plot</em>) también anida subparcelas
                                                dentro de parcelas completas, pero además aleatoriza un factor en cada tamaño de unidad, y
                                                eso ningún modelo de Pydantic lo representa.</p>
                                            <Box type="info" label="Definición 5.1 (modelo anidado)">Un modelo anidado es un modelo de Pydantic
                                                con al menos un campo cuyo tipo es otro modelo: uno solo (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">encuestado: Encuestado</code>),
                                                opcional (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">encuestado: Encuestado | None = None</code>) o una colección
                                                (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">List[EnsayoVehiculo]</code>). Al validar el contenedor, Pydantic valida cada submodelo con sus
                                                propias reglas. Con una colección, si \(G\) es el conjunto de grupos y \(U\) el de unidades,
                                                anidar define una función \(g: U \rightarrow G\) que asigna cada unidad a exactamente un
                                                grupo.
                                            </Box>
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">5.1.2 Notación para estructuras
                                                jerárquicas</h4>

                                                • \(Y_&#123;ijk&#125;\) = observación \(k\) del subgrupo \(j\) dentro del grupo \(i\)<br />
                                                • \(\mu\) = media global<br />
                                                • \(\alpha_i\) = efecto del grupo \(i\) (nivel superior)<br />
                                                • \(\beta_&#123;j(i)&#125;\) = efecto del subgrupo \(j\) anidado en \(i\)<br />

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">5.3 Ejemplo completo:
                                                sesiones de dinamómetro con las variables de mtcars</h3>
                                            <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                                <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Contexto del problema
                                                </h4>
                                                <p className="text-gray-700 leading-relaxed mb-5">Un laboratorio registra sesiones de prueba
                                                    en dinamómetro. En cada sesión se ensayan varios vehículos, una vez cada uno, y de cada
                                                    vehículo se anotan cuatro variables con los nombres de <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">mtcars</code> (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">mpg</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">cyl</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">hp</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">wt</code>). La sesión es el grupo y el vehículo la unidad. El contrato tiene que validar las
                                                    reglas de cada nivel —el formato del identificador de la sesión, el rango de cada
                                                    variable— y dos reglas de la lista: cada sesión trae al menos tres vehículos y ninguno
                                                    se repite. Los datos son simulados y no son medidas repetidas, porque ningún vehículo se
                                                    ensaya dos veces.</p>
                                            </div>
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Generación de datos simulados
                                            </h4>
                                            <CodeBlock title="Python" lang="python" code={`import numpy as np
from datetime import datetime, timedelta, timezone
import random

# Semillas fijas para que la simulación salga igual en cada ejecución
np.random.seed(2024)
random.seed(2024)

# Fecha de referencia fija (y no datetime.now()), para que también se repitan las marcas de tiempo
INICIO = datetime(2024, 6, 1, tzinfo=timezone.utc)


# Datos simulados de varias sesiones, tal como llegarían en un JSON
def generar_sesion_prueba(id_sesion: str, n_vehiculos: int) -> dict:
    """Genera una sesión con n_vehiculos ensayos, uno por vehículo."""
    marcas = ['Toyota', 'Honda', 'Ford', 'Chevrolet', 'Nissan', 'Mazda', 'BMW', 'Audi']

    vehiculos = []
    for i in range(n_vehiculos):
        vehiculo = {
            'id_vehiculo': f"{random.choice(marcas)}_{i+1}",
            'millas_por_galon_mpg': round(np.random.uniform(15, 35), 1),
            'cilindros_motor_cyl': random.choice([4, 6, 8]),
            'caballos_fuerza_hp': random.randint(100, 350),
            'peso_wt': round(np.random.uniform(2.0, 5.0), 2)
        }
        vehiculos.append(vehiculo)

    return {
        'id_sesion_laboratorio': id_sesion,
        'marca_tiempo_prueba': (INICIO - timedelta(days=random.randint(0, 30))).isoformat(),
        'investigador_responsable': random.choice(['Dr. Fisher', 'Dra. Pearson', 'Dr. Tukey']),
        'ensayos_experimentales': vehiculos
    }


# Tres sesiones con distinto número de vehículos
sesiones_simuladas = [
    generar_sesion_prueba('SES-2024-AA', 5),
    generar_sesion_prueba('SES-2024-BB', 3),  # justo el mínimo del protocolo
    generar_sesion_prueba('SES-2024-CC', 2),  # se rechazará: menos de 3 vehículos
]

print(f"Generadas {len(sesiones_simuladas)} sesiones de prueba simuladas")
for s in sesiones_simuladas:
    print(f"  {s['id_sesion_laboratorio']}: {len(s['ensayos_experimentales'])} vehículos")`} />
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Implementación paso a paso
                                            </h4>
                                            <p className="text-gray-700 leading-relaxed mb-5">El anidamiento es una sola línea de <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">SesionDinamometro</code>: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ensayos_experimentales: List[EnsayoVehiculo] = Field(min_length=3,
                                                ...)</code>. <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">List[EnsayoVehiculo]</code> dice que cada elemento de la lista se valida como un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">EnsayoVehiculo</code>, con sus propias reglas, y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">min_length=3</code> exige que la lista traiga al
                                                menos tres. Al llamar a <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">model_validate</code> con el diccionario que llega del JSON, Pydantic
                                                convierte cada diccionario de la lista en un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">EnsayoVehiculo</code>. La regla que necesita ver la
                                                lista entera —que ningún vehículo se repita— va en un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@field_validator</code> del campo
                                                lista.</p>
                                            <CodeBlock title="Python" lang="python" code={`# Continúa el bloque anterior: usa su lista \`sesiones_simuladas\` y sus imports de datetime.
from pydantic import BaseModel, Field, field_validator, ValidationError
from typing import List, Dict, Any


# 1. Nivel inferior: el submodelo (la unidad de observación)
class EnsayoVehiculo(BaseModel):
    """La unidad de observación: un vehículo ensayado en una sesión."""
    id_vehiculo: str = Field(
        min_length=2,
        description="Identificador del vehículo; no se repite dentro de la sesión"
    )
    millas_por_galon_mpg: float = Field(
        ...,
        gt=0.0,
        description="Rendimiento de combustible, en millas por galón (mpg)"
    )
    cilindros_motor_cyl: int = Field(
        ...,
        description="Número de cilindros del motor (cyl)"
    )
    caballos_fuerza_hp: int = Field(
        ...,
        gt=0,
        description="Potencia bruta del motor, en caballos de fuerza (hp)"
    )
    peso_wt: float = Field(
        ...,
        gt=0.0, le=10.0,
        description="Peso del vehículo en miles de libras (wt)"
    )

    @field_validator('cilindros_motor_cyl')
    @classmethod
    def validar_cilindros(cls, v: int) -> int:
        """
        Sólo admite 4, 6 u 8 cilindros, los únicos valores que aparecen en mtcars.
        Existen motores de 3, 5, 10 o 12 cilindros: si tus datos pueden traerlos,
        amplía el conjunto.
        """
        if v not in {4, 6, 8}:
            raise ValueError(
                f"{v} cilindros no es un valor admitido; se esperaba 4, 6 u 8 "
                f"(los valores de mtcars)."
            )
        return v


# 2. Nivel superior: el modelo contenedor (el grupo)
class SesionDinamometro(BaseModel):
    """El grupo: una sesión de pruebas que contiene sus ensayos."""
    # Identificador con el formato SES-AAAA-XX
    id_sesion_laboratorio: str = Field(
        pattern=r'^SES-\\d{4}-[A-Z]{2}$',
        description="Formato: SES-AAAA-XX"
    )

    marca_tiempo_prueba: datetime = Field(
        default_factory=lambda: datetime.now(timezone.utc),
        description="Fecha y hora de la prueba (UTC)"
    )

    investigador_responsable: str = Field(
        min_length=3,
        description="Nombre del investigador a cargo"
    )

    # El anidamiento: una lista de submodelos, con al menos 3 elementos
    ensayos_experimentales: List[EnsayoVehiculo] = Field(
        min_length=3,
        description="Regla del protocolo: al menos 3 vehículos por sesión"
    )

    @field_validator('ensayos_experimentales')
    @classmethod
    def validar_vehiculos_unicos(
        cls,
        ensayos: List[EnsayoVehiculo]
    ) -> List[EnsayoVehiculo]:
        """Regla que mira la lista entera: ningún vehículo se repite en la sesión."""
        ids = [e.id_vehiculo for e in ensayos]
        repetidos = sorted({i for i in ids if ids.count(i) > 1})
        if repetidos:
            raise ValueError(
                f"Vehículos repetidos en la sesión: {repetidos}. "
                f"Cada vehículo se ensaya una sola vez."
            )
        return ensayos


# 3. Función que valida una sesión y resume el resultado
def procesar_sesion_experimento(datos_crudos: Dict[str, Any]) -> dict:
    """Valida una sesión completa: la sesión y cada uno de sus vehículos."""
    try:
        sesion_certificada = SesionDinamometro.model_validate(datos_crudos)
        return {
            'estado': 'VALIDADO',
            'sesion': sesion_certificada,
            'n_vehiculos': len(sesion_certificada.ensayos_experimentales)
        }
    except ValidationError as e:
        return {
            'estado': 'RECHAZADO',
            'errores': [
                {'loc': err['loc'], 'mensaje': err['msg'], 'tipo': err['type']}
                for err in e.errors()
            ]
        }


# 4. Procesamiento de las sesiones simuladas
print("\\n" + "=" * 60)
print("RESULTADOS DE LA VALIDACIÓN")
print("=" * 60)

for sesion_data in sesiones_simuladas:
    resultado = procesar_sesion_experimento(sesion_data)
    print(f"\\n📋 Sesión: {sesion_data['id_sesion_laboratorio']}")

    if resultado['estado'] == 'VALIDADO':
        print("   ✅ VALIDADA")
        print(f"   Vehículos procesados: {resultado['n_vehiculos']}")
    else:
        print("   ❌ RECHAZADA")
        for error in resultado['errores']:
            print(f"   • loc: {error['loc']}  ({error['tipo']})")
            print(f"     {error['mensaje']}")`} />

📋 Sesión: SES-2024-CC
   ❌ RECHAZADA
   • loc: ('ensayos_experimentales',)  (too_short)
     List should have at least 3 items after validation, not 2`} />

                                                    resultados</h4>
                                                <p className="text-gray-700 leading-relaxed mb-5">La validación desciende por el árbol:
                                                    primero cada vehículo, con sus propias reglas; después la lista; al final la sesión. La

                                                    de la lista, no de ningún vehículo. Y basta que un solo vehículo falle para que se

                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Cómo se lee el <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">loc</code> de un
                                                error anidado</h4>
                                            <p className="text-gray-700 leading-relaxed mb-5">Cada error de un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ValidationError</code> trae un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">loc</code>: la ruta hasta lo que falló. El bloque siguiente estropea a propósito algunas
                                                sesiones simuladas e imprime, de cada error, su <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">loc</code> y su <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">type</code>.</p>
                                            <CodeBlock title="Python" lang="python" code={`# Continúa el bloque anterior: usa \`SesionDinamometro\` y \`sesiones_simuladas\`.
import copy


def mostrar_errores(datos: dict) -> None:
    """Valida una sesión e imprime, de cada error, su ruta (loc) y su tipo."""
    try:
        SesionDinamometro.model_validate(datos)
        print("   sin errores")
    except ValidationError as e:
        for err in e.errors():
            print(f"   loc={err['loc']}  type={err['type']}")


# a) Un vehículo inválido: la sesión AA con 5 cilindros en su tercer ensayo
sesion = copy.deepcopy(sesiones_simuladas[0])
sesion['ensayos_experimentales'][2]['cilindros_motor_cyl'] = 5
print("a) AA con el ensayo 2 inválido:")
mostrar_errores(sesion)

# b) Un vehículo repetido: la regla de la lista entera
sesion = copy.deepcopy(sesiones_simuladas[0])
sesion['ensayos_experimentales'][4]['id_vehiculo'] = sesion['ensayos_experimentales'][0]['id_vehiculo']
print("b) AA con un vehículo repetido:")
mostrar_errores(sesion)

# c) Dos problemas a la vez: la CC (sólo 2 vehículos) con un vehículo inválido
sesion = copy.deepcopy(sesiones_simuladas[2])
sesion['ensayos_experimentales'][1]['caballos_fuerza_hp'] = -110
print("c) CC con el ensayo 1 inválido:")
mostrar_errores(sesion)

# d) Un error en la sesión y otro en un vehículo: campos hermanos
sesion = copy.deepcopy(sesiones_simuladas[0])
sesion['investigador_responsable'] = 'Dr'
sesion['ensayos_experimentales'][2]['cilindros_motor_cyl'] = 5
print("d) AA con investigador demasiado corto y el ensayo 2 inválido:")
mostrar_errores(sesion)`} />

b) AA con un vehículo repetido:

c) CC con el ensayo 1 inválido:

                                                modelo hasta lo que falló: nombres de campo y, dentro de una lista, la posición del
                                                elemento, contada desde 0. En (a), <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">('ensayos_experimentales', 2,

                                                entera y su <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">loc</code> se queda en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">('ensayos_experimentales',)</code>, igual que el <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">too_short</code> de

                                                prefijo <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"body"</code>: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">["body", "ensayos_experimentales", 2, "cilindros_motor_cyl"]</code> (lo ves en

                                        <section className="usta-card p-6 md:p-8 mb-8">
                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">5.4 Ejercicios de
                                                autoevaluación</h3>
                                            <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                                <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Ejercicio 1: qué pasa
                                                    cuando falla un elemento anidado</h4>
                                                <p className="text-gray-700 leading-relaxed mb-5"><strong>Problema:</strong> Al validar una
                                                    sesión, el décimo elemento de la lista <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ensayos_experimentales</code> trae un dato inválido
                                                    (p. ej., cilindros = 5). ¿Se rechaza toda la sesión o sólo ese vehículo? ¿Qué <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">loc</code> trae el error? Explica por qué se comporta así.</p>
                                                <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                                    <strong>Solución parcial:</strong>
                                                    <p className="text-gray-700 leading-relaxed mb-5">Se rechaza la sesión entera. <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">SesionDinamometro.model_validate</code> lanza un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ValidationError</code> cuyo único error

                                                    <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">La correlación
                                                        intraclase</h4>
                                                    <Box type="info" label="Ecuación 5.2">Coeficiente de correlación intraclase (CCI)<br /><br />
                                                        $$ \text&#123;CCI&#125; = \frac&#123;\sigma^2_&#123;\text&#123;entre&#125;&#125;&#125;&#123;\sigma^2_&#123;\text&#123;entre&#125;&#125; +
                                                        \sigma^2_&#123;\text&#123;dentro&#125;&#125;&#125; $$<br /><br />
                                                        donde<br />

                                                        • \(\sigma^2_&#123;\text&#123;dentro&#125;&#125;\) = varianza dentro de los grupos
                                                    </Box>
                                                    <p className="text-gray-700 leading-relaxed mb-5">El CCI mide qué fracción de la varianza
                                                        total se debe a diferencias entre grupos. Si es alto, las unidades de un mismo grupo
                                                        no son independientes, y analizarlas como si lo fueran suele subestimar los errores
                                                        estándar. Para estimarlo con precisión importa sobre todo el número de grupos, no el
                                                        de observaciones: con dos o tres sesiones, el CCI entre sesiones apenas se puede
                                                        estimar, por muchos vehículos que traiga cada una (Maas y Hox, 2005).</p>
                                                    <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Qué es un modelo
                                                        jerárquico</h4>
                                                    <p className="text-gray-700 leading-relaxed mb-5">Los modelos jerárquicos (también
                                                        llamados multinivel) analizan datos agrupados: individuos dentro de hogares,
                                                        pacientes dentro de hospitales, regiones dentro de países.</p>
                                                    <Box type="info" label="Por qué un modelo jerárquico">Un modelo jerárquico aborda a la vez
                                                        dos problemas opuestos de la estimación:<br /><br />
                                                        &bull; <strong>Alta varianza:</strong> si cada grupo se estima sólo con sus datos,
                                                        los grupos con pocos datos dan estimaciones poco fiables.<br />
                                                        &bull; <strong>Alto sesgo:</strong> si se juntan todos los datos como si fueran de
                                                        un solo grupo, se borra la variación entre grupos.<br /><br />
                                                        La solución jerárquica da a cada grupo sus propios parámetros, pero los trata como
                                                        extraídos de una distribución común de nivel superior. El resultado es un
                                                        compromiso entre ambos extremos que determinan los propios datos.
                                                    </Box>
                                                    <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Qué aportan los modelos

                                                            <tr>
                                                                <td className="px-6 py-4 text-sm text-gray-800"><strong>Efectos de cada
                                                                        nivel</strong></td>
                                                                <td className="px-6 py-4 text-sm text-gray-800">Separa lo que ocurre dentro de
                                                                    los grupos de lo que ocurre entre ellos; así no se atribuye a los

                                                                    ecológica).</td>
                                                                <td className="px-6 py-4 text-sm text-gray-800">Cada nivel tiene sus propias
                                                                    reglas: las del vehículo en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">EnsayoVehiculo</code> y las de la sesión en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">SesionDinamometro</code>.</td>

                                                            <tr>
                                                                <td className="px-6 py-4 text-sm text-gray-800"><strong>Interacciones entre
                                                                        niveles</strong></td>
                                                                <td className="px-6 py-4 text-sm text-gray-800">Permite examinar cómo factores
                                                                    del grupo (nivel superior) modifican relaciones a nivel individual.</td>
                                                                <td className="px-6 py-4 text-sm text-gray-800">Un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@model_validator</code> del
                                                                    contenedor ve a la vez sus campos y los de sus submodelos, así que

                                                            </tr>
                                                            <tr>
                                                                <td className="px-6 py-4 text-sm text-gray-800"><strong>Préstamo de
                                                                        fuerza</strong></td>
                                                                <td className="px-6 py-4 text-sm text-gray-800">Los grupos con pocos datos
                                                                    toman información de los demás (en inglés, <em>borrowing
                                                                        strength</em>): su estimación se acerca a la media global.</td>
                                                                <td className="px-6 py-4 text-sm text-gray-800">Ninguna directa. El préstamo de
                                                                    fuerza ocurre al estimar, no al validar: lo que Pydantic aporta es que
                                                                    cada unidad llegue con el identificador de su grupo. Rellenar un
                                                                    faltante con un valor por defecto (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">default</code> o <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">default_factory</code>) no
                                                                    toma información de ningún otro grupo: es imputar una constante, que

                                                            </tr>

                                                    <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Modelo independiente
                                                        frente a modelo jerárquico</h4>
                                                    <Box type="info" label="Ecuación 5.3">Modelo independiente frente a jerárquico<br /><br />
                                                        <strong>Modelo independiente:</strong> cada grupo \(j\) se estima sólo con sus
                                                        datos:<br />
                                                        $$ \hat&#123;\theta&#125;_j^&#123;\text&#123;indep&#125;&#125; = \bar&#123;y&#125;_j $$<br /><br />
                                                        <strong>Modelo jerárquico (multinivel):</strong> las estimaciones se «encogen» hacia
                                                        la media global:<br />
                                                        $$ \hat&#123;\theta&#125;_j^&#123;\text&#123;jer&#125;&#125; = \lambda_j \bar&#123;y&#125;_j + (1 - \lambda_j)\,\hat&#123;\mu&#125;
                                                        $$<br /><br />
                                                        donde \(\hat&#123;\mu&#125;\) es la estimación de la media global (una media ponderada de las
                                                        medias de los grupos) y<br />
                                                        $$ \lambda_j = \frac&#123;\tau^2&#125;&#123;\tau^2 + \sigma^2/n_j&#125; \in [0, 1] $$<br />
                                                        es el factor de encogimiento (en inglés, <em>shrinkage</em>). Depende del tamaño
                                                        \(n_j\) del grupo, de la varianza dentro de los grupos \(\sigma^2\) y de la varianza
                                                        entre grupos \(\tau^2\). Con pocos datos locales o con grupos muy parecidos entre sí,
                                                        \(\lambda_j \to 0\) y la estimación se apoya en la media global. El mismo
                                                        encogimiento aparece en los modelos mixtos frecuentistas (Gelman y Hill, 2007).
                                                    </Box>
                                                    <p className="text-gray-700 leading-relaxed mb-5">El encogimiento produce estimaciones más
                                                        estables —con menor error cuadrático medio, en promedio sobre los grupos— a cambio
                                                        de un sesgo hacia la media global, sobre todo en los grupos pequeños. Y lo hace el
                                                        modelo de estimación, no Pydantic. Lo que el modelo anidado garantiza es la
                                                        condición previa: que ninguna unidad llegue sin su grupo y que ningún grupo llegue
                                                        con unidades que violan las reglas.</p>
                                                    <p className="text-gray-700 leading-relaxed mb-5">Para una introducción breve y de acceso
                                                        abierto a lo que un modelo multinivel puede y no puede hacer, lee a Gelman

                                            <Accordion items={[{ titulo: "Para profundizar: un caso hipotético con cuatro niveles (regiones y hospitales del NHS)", contenido: (<><div
                                                    className="mt-4 text-sm text-gray-700 border-t border-blue-100 pt-4 space-y-3 leading-relaxed">
                                                    <p className="text-gray-700 leading-relaxed mb-5">Es un caso hipotético con la estructura
                                                        del NHS de Inglaterra, que se organiza en siete regiones; los datos son inventados.
                                                        El modelo tiene cuatro niveles (sistema → región → hospital → admisión diaria) y
                                                        cada nivel aplica sus propias reglas. Las que comparan dos campos (las admisiones a
                                                        UCI no superan las nuevas) o miran una lista entera (no hay dos hospitales con el
                                                        mismo código) usan <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@model_validator(mode="after")</code>, que viste en la sección 4
                                                        («Validar un campo contra otro: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@model_validator</code>»).</p>
                                                    <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Implementación:
                                                        validación en cuatro niveles</h4>
                                            <CodeBlock title="Python" lang="python" code={`# Caso hipotético con la estructura del NHS de Inglaterra: los datos son inventados.
import logging
from datetime import date, timedelta
from enum import Enum
from typing import List

from pydantic import BaseModel, Field, field_validator, model_validator, ValidationError

# ══════════════════════════════════════════════════════════════
# NIVEL 1 (MICRO): la observación
# Unidad de observación: un hospital en un día (Y_ijk)
# ══════════════════════════════════════════════════════════════

class VariantePatogeno(str, Enum):
    """Variantes del SARS-CoV-2 (etiquetas de la OMS) y la cepa original."""
    ALPHA = "alpha"
    DELTA = "delta"
    OMICRON = "omicron"
    ORIGINAL = "original"

class AdmisionDiaria(BaseModel):
    """
    Nivel 1 (micro): las admisiones de un hospital en un día.
    Es la observación Y_ijk de la Ecuación 5.1.
    """
    fecha: date
    admisiones_nuevas: int = Field(
        ..., ge=0,
        description="Número de admisiones nuevas (no puede ser negativo)"
    )
    admisiones_uci: int = Field(
        default=0, ge=0,
        description="Admisiones a UCI (subconjunto de las admisiones nuevas)"
    )
    tasa_ocupacion_camas: float = Field(
        ..., ge=0.0, le=1.0,
        description="Proporción de camas ocupadas [0, 1]"
    )
    variante_dominante: VariantePatogeno = Field(
        default=VariantePatogeno.OMICRON,
        description="Variante predominante del patógeno"
    )

    @model_validator(mode='after')
    def validar_coherencia_admisiones(self):
        """
        Las admisiones a UCI no pueden superar las admisiones nuevas.
        Restricción lógica: UCI ⊆ admisiones nuevas.
        """
        if self.admisiones_uci > self.admisiones_nuevas:
            raise ValueError(
                f"Incoherencia lógica: las admisiones a UCI ({self.admisiones_uci}) "
                f"no pueden superar las admisiones nuevas ({self.admisiones_nuevas})"
            )
        return self


# ══════════════════════════════════════════════════════════════
# NIVEL 2 (MESO): el hospital
# Subgrupo: el hospital, anidado en su región (β_j(i))
# ══════════════════════════════════════════════════════════════

class HospitalNHS(BaseModel):
    """
    Nivel 2 (meso): un hospital de una región, con su serie de admisiones diarias.
    Corresponde al efecto β_j(i) del hospital j dentro de la región i.
    """
    codigo_hospital: str = Field(
        pattern=r'^NHS-[A-Z]{2,4}-\\d{3}$',
        description="Código estandarizado: NHS-XXXX-000"
    )
    nombre_hospital: str = Field(min_length=3)
    capacidad_camas: int = Field(
        ..., gt=0, le=5000,
        description="Capacidad total de camas del hospital"
    )
    registros_diarios: List[AdmisionDiaria] = Field(
        ..., min_length=7,
        description="Regla del protocolo: al menos 7 días de datos"
    )

    @field_validator('registros_diarios')
    @classmethod
    def validar_serie_temporal(
        cls, registros: List[AdmisionDiaria]
    ) -> List[AdmisionDiaria]:
        """
        Verifica que la serie se pueda usar: sin fechas repetidas (cada registro
        es un día distinto) y en orden cronológico. El orden no lo exige ningún
        ajuste —una regresión da lo mismo con las filas desordenadas—; se exige
        para que la serie se lea tal como llega. Si prefieres, ordénala aquí en
        vez de rechazarla.
        """
        fechas = [r.fecha for r in registros]
        if len(set(fechas)) != len(fechas):
            raise ValueError(
                "Fechas duplicadas en la serie: cada registro debe "
                "corresponder a un día distinto."
            )
        if fechas != sorted(fechas):
            raise ValueError("Los registros diarios deben venir en orden cronológico.")
        return registros


# ══════════════════════════════════════════════════════════════
# NIVEL 3 (MACRO): la región sanitaria
# Grupo: la región sanitaria (α_i)
# ══════════════════════════════════════════════════════════════

class RegionNHS(BaseModel):
    """
    Nivel 3 (macro): región sanitaria que contiene sus hospitales.
    Corresponde al efecto α_i de Y_ijk = μ + α_i + β_j(i) + ε_k(ij).

    Esta clase sólo valida. Estimar los efectos (y tomar información de las
    otras regiones cuando ésta trae pocos datos) es trabajo del modelo que se
    ajuste después.
    """
    codigo_region: str = Field(
        pattern=r'^REG-[A-Z]{2,6}$',
        description="Código de región: REG-XXXXXX"
    )
    nombre_region: str = Field(min_length=3)
    poblacion_total: int = Field(
        ..., gt=0,
        description="Población total de la región, para calcular tasas"
    )
    hospitales: List[HospitalNHS] = Field(
        ..., min_length=2,
        description="Al menos 2 hospitales por región: con uno solo no hay "
                    "variación entre hospitales que estimar"
    )
    es_datos_escasos: bool = Field(
        default=False,
        description="Marca las regiones con pocos datos"
    )

    @model_validator(mode='after')
    def validar_estructura_regional(self):
        """Reglas que sólo se ven con todos los hospitales de la región juntos."""
        # Unicidad de los códigos hospitalarios
        codigos = [h.codigo_hospital for h in self.hospitales]
        if len(set(codigos)) != len(codigos):
            raise ValueError(
                "Códigos hospitalarios duplicados en la región. "
                "Cada hospital debe tener un identificador único."
            )

        # Regla del protocolo: al menos 30 registros diarios por región
        total_obs = sum(
            len(h.registros_diarios) for h in self.hospitales
        )
        if total_obs < 30:
            raise ValueError(
                f"La región trae {total_obs} registros diarios y el protocolo "
                f"exige al menos 30."
            )

        return self

    def calcular_tasa_normalizada(self) -> float:
        """Admisiones nuevas por cada 100 000 habitantes de la región."""
        total_admisiones = sum(
            r.admisiones_nuevas
            for h in self.hospitales
            for r in h.registros_diarios
        )
        return (total_admisiones / self.poblacion_total) * 100_000


# ══════════════════════════════════════════════════════════════
# NIVEL 4: el sistema completo
# ══════════════════════════════════════════════════════════════

class SistemaNacionalSalud(BaseModel):
    """
    Contenedor de todas las regiones. Valida lo que sólo se ve con todas
    juntas: que no haya regiones repetidas.
    """
    pais: str = Field(default="England")
    fecha_corte: date
    regiones: List[RegionNHS] = Field(
        ..., min_length=2,
        description="Al menos 2 regiones (regla del protocolo)"
    )

    @model_validator(mode='after')
    def validar_sistema_completo(self):
        """Reglas que sólo se ven con todas las regiones juntas."""
        codigos_region = [r.codigo_region for r in self.regiones]
        if len(set(codigos_region)) != len(codigos_region):
            raise ValueError("Regiones duplicadas en el sistema.")

        # Avisar, sin rechazar, de las regiones marcadas con datos escasos
        regiones_escasas = [
            r.nombre_region for r in self.regiones if r.es_datos_escasos
        ]
        if regiones_escasas:
            logging.getLogger(__name__).warning(
                "Regiones con datos escasos: %s", regiones_escasas
            )

        return self


# ══════════════════════════════════════════════════════════════
# Demostración: 2 regiones x 2 hospitales x 15 días = 30 registros por región
# ══════════════════════════════════════════════════════════════

def serie(n_dias: int) -> list:
    inicio = date(2021, 1, 1)
    return [{'fecha': inicio + timedelta(days=k), 'admisiones_nuevas': 10 + k,
             'admisiones_uci': 2, 'tasa_ocupacion_camas': 0.8} for k in range(n_dias)]


def region(sigla: str, escasa: bool = False) -> dict:
    hospitales = [{'codigo_hospital': f'NHS-{sigla}-00{h}', 'nombre_hospital': f'Hospital {h}',
                   'capacidad_camas': 500, 'registros_diarios': serie(15)} for h in (1, 2)]
    return {'codigo_region': f'REG-{sigla}', 'nombre_region': f'Región {sigla}',
            'poblacion_total': 1_000_000, 'hospitales': hospitales, 'es_datos_escasos': escasa}


sistema = SistemaNacionalSalud(fecha_corte=date(2021, 3, 1),
                               regiones=[region('LON'), region('NE', escasa=True)])
tasa = sistema.regiones[0].calcular_tasa_normalizada()
print(f'{sistema.regiones[0].nombre_region}: {tasa:.1f} admisiones por 100 000 hab.')

                <section className="usta-card p-6 md:p-8 mb-8">
                                        <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">6.1 Fundamentos teóricos</h3>
                                        <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">6.1.1 Qué dice cada código de error</h4>
                                        <p className="text-gray-700 leading-relaxed mb-5">En la semana 4 aprendiste a leer el cuerpo de un 422, y en la semana 6 viste que FastAPI lo construye solo. Esta sección parte de ahí y va un paso más allá: qué código corresponde a cada error del cliente, cómo llega a quien llama a tu API el motivo que escribiste en un validador, cómo hacer que el 422 se explique solo y cómo llevar la cuenta de los rechazos cuando validas un lote fuera de la API.</p>
                                        <Box type="info" label="Definición 6.1 (HTTP 422 Unprocessable Content)">Código de estado que indica que el servidor entiende el tipo de contenido de la petición y que su sintaxis es correcta, pero no puede procesar lo que contiene (RFC 9110, §15.5.21). Hasta 2022 se llamaba <em>Unprocessable Entity</em> (RFC 4918), nombre que todavía verás en documentación antigua. En términos estadísticos: el valor cae fuera del recorrido admisible de la variable —una edad de 200 años— o viola una regla del protocolo —una fecha de alta anterior a la de ingreso—.
                                        </Box>
                                        <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">6.1.2 400, 422 y 409: cuándo va cada uno</h4>
                                        <table className="min-w-full divide-y divide-gray-200 my-8 shadow-sm border border-gray-200 rounded-lg overflow-hidden block md:table overflow-x-auto">
                                        <thead className="bg-gray-100">
                                        <tr>
                                        <th className="px-6 py-4 text-left text-xs font-extrabold text-gray-700 uppercase tracking-wider">Código</th>
                                        <th className="px-6 py-4 text-left text-xs font-extrabold text-gray-700 uppercase tracking-wider">Cuándo</th>
                                        <th className="px-6 py-4 text-left text-xs font-extrabold text-gray-700 uppercase tracking-wider">Quién lo produce en FastAPI</th>
                                        <th className="px-6 py-4 text-left text-xs font-extrabold text-gray-700 uppercase tracking-wider">En un estudio</th>
                                        </tr>
                                        </thead>
                                        <tbody className="bg-white divide-y divide-gray-200">
                                        <tr>
                                        <td className="px-6 py-4 text-sm text-gray-800"><strong>400</strong><br />Bad Request</td>
                                        <td className="px-6 py-4 text-sm text-gray-800">La petición no se puede interpretar, o viola una regla que tu código comprueba y para la que no hay un código más específico.</td>
                                        <td className="px-6 py-4 text-sm text-gray-800">Tú, con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">raise HTTPException(status_code=400, detail=...)</code>. Por su cuenta, FastAPI sólo lo emite cuando no consigue leer el cuerpo por algo que no es un error de sintaxis JSON (p. ej., bytes que no son texto UTF-8, o un formulario ilegible). <strong>Un JSON roto o truncado no da 400, sino 422</strong>, con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"type": "json_invalid"</code>.</td>
                                        <td className="px-6 py-4 text-sm text-gray-800">Una ficha ilegible: no se puede ni leer lo que dice.</td>
                                        </tr>
                                        <tr>
                                        <td className="px-6 py-4 text-sm text-gray-800"><strong>422</strong><br />Unprocessable Content</td>
                                        <td className="px-6 py-4 text-sm text-gray-800">Los datos no cumplen el contrato del modelo: falta un campo, un tipo no corresponde, un valor está fuera de rango. En FastAPI, también un JSON mal formado.</td>
                                        <td className="px-6 py-4 text-sm text-gray-800">FastAPI, automáticamente, cuando falla la validación de lo que declaraste en la firma del endpoint: lanza <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">RequestValidationError</code> y responde 422.</td>
                                        <td className="px-6 py-4 text-sm text-gray-800">Un sujeto con una edad imposible o que no cumple los criterios de inclusión: se rechaza y se documenta el motivo.</td>
                                        </tr>
                                        <tr>
                                        <td className="px-6 py-4 text-sm text-gray-800"><strong>409</strong><br />Conflict</td>
                                        <td className="px-6 py-4 text-sm text-gray-800">La petición es válida, pero choca con el estado actual del recurso: p. ej., registrar un identificador que ya existe.</td>
                                        <td className="px-6 py-4 text-sm text-gray-800">Tú, con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">raise HTTPException(status_code=409, detail=...)</code>.</td>
                                        <td className="px-6 py-4 text-sm text-gray-800">Doble conteo: el sujeto ya estaba reclutado.</td>
                                        </tr>
                                        </tbody>
                                        </table>
                                        <p className="text-gray-700 leading-relaxed mb-5">En la RFC 9110, el 400 es la petición que el servidor no puede entender y el 422 la que entiende pero no puede procesar. FastAPI trata el JSON mal formado como un error de validación más: responde 422 con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"type": "json_invalid"</code> y pone en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">loc</code> la posición del carácter donde se rompió el JSON. Lo verás en «Un 422 que se explica solo».</p>
                                        <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">6.1.3 Qué trae un ValidationError</h4>
                                        <p className="text-gray-700 leading-relaxed mb-5">Cuando la validación falla, Pydantic lanza un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ValidationError</code>. Su método <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">errors()</code> devuelve una lista con un diccionario por error —todos los del registro, no sólo el primero— y cada diccionario trae estas claves:</p>
                                        <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                        <strong>Estructura 6.1:</strong> las claves de cada error de <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ValidationError.errors()</code>
                                        <ul className="list-disc pl-6 space-y-2 mb-6 text-gray-700">
                                        <li className="leading-relaxed"><strong>type</strong>: el código de la regla incumplida: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">missing</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">int_parsing</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">greater_than</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">less_than_equal</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">literal_error</code>…; <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">value_error</code> si lo lanzó tu validador con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ValueError</code>. En Pydantic v2 no existe <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">type_error</code>, que era un prefijo de la v1.</li>
                                        <li className="leading-relaxed"><strong>loc</strong>: la ruta hasta el campo, como tupla: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">('ensayos_experimentales', 9, 'cilindros_motor_cyl')</code>. Los enteros son posiciones en una lista, contadas desde 0. El error de un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@model_validator</code> no es de ningún campo y tiene <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">loc</code> vacía: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">()</code>.</li>
                                        <li className="leading-relaxed"><strong>msg</strong>: el mensaje legible. Si viene de tu <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ValueError</code>, empieza por <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"Value error, "</code>.</li>
                                        <li className="leading-relaxed"><strong>input</strong>: el valor que falló.</li>
                                        <li className="leading-relaxed"><strong>ctx</strong>: los parámetros de la regla, p. ej., <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">&#123;'le': 120&#125;</code>; en un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">value_error</code>, la excepción que lanzaste. No todas las reglas lo traen.</li>
                                        <li className="leading-relaxed"><strong>url</strong>: un enlace a la documentación de ese tipo de error.</li>
                                        </ul>
                                        </div>
                                        <p className="text-gray-700 leading-relaxed mb-5">En la respuesta 422, FastAPI pone esta lista en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">detail</code>, antepone a <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">loc</code> la parte de la petición de donde vino el dato (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"body"</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"query"</code> o <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"path"</code>), la escribe como lista y omite <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">url</code>. Lo ves en la subsección siguiente.</p>
                                        <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">6.1.4 Por qué registrar cada exclusión</h4>
                                        <p className="text-gray-700 leading-relaxed mb-5">Registrar por qué se excluyó cada observación no es un trámite. CONSORT, la guía de publicación de los ensayos clínicos, incluye un diagrama de flujo de participantes, y STROBE, la de los estudios observacionales, pide informar cuántos participantes hay en cada etapa y por qué se pierden, y recomienda ese mismo diagrama. Sin un registro de las exclusiones no se puede reconstruir cuántos sujetos se perdieron en cada paso ni juzgar si su exclusión sesga el resultado.</p>
                                        </section>
                                        <section className="usta-card p-6 md:p-8 mb-8">
                                        <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">6.2 Del validador al cuerpo del 422</h3>
                                        <p className="text-gray-700 leading-relaxed mb-5">Hasta aquí el error ha sido un objeto de Python. En la API lo lee otra persona, y lo lee como JSON. Cuando el modelo está en la firma del endpoint, FastAPI valida el cuerpo antes de ejecutar tu función; si algo falla, no la ejecuta y responde 422 con la lista de errores en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">detail</code>. No hace falta ningún <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">try/except</code>.</p>
                                        <p className="text-gray-700 leading-relaxed mb-5">El ejemplo tiene las dos clases de regla: las de <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field</code> (el rango de la edad, un ingreso finito y no negativo) y un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@field_validator</code> propio para el código de municipio. Para ver la respuesta sin levantar el servidor se usa <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">TestClient</code>, que envía la petición directamente a la app (necesita <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">httpx</code> instalado; lo verás a fondo en la semana 10).</p>
                                        <CodeBlock title="Python" lang="python" code={`import json

from fastapi import FastAPI
from fastapi.testclient import TestClient
from pydantic import BaseModel, Field, field_validator


class Observacion(BaseModel):
    id_sujeto: int
    edad: int = Field(ge=0, le=120, description="Edad en años cumplidos")
    ingreso_mensual: float = Field(ge=0, allow_inf_nan=False, description="Ingreso mensual, en pesos")
    municipio: str = Field(description="Código DIVIPOLA del municipio (5 dígitos)")

    @field_validator("municipio")
    @classmethod
    def codigo_divipola(cls, v: str) -> str:
        if not (len(v) == 5 and v.isdigit()):
            raise ValueError(
                f"municipio={v!r} no es un código DIVIPOLA: se esperan 5 dígitos, "
                "p. ej., '05001' (Medellín). Revisa si llegó el nombre en vez del código."
            )
        return v


app = FastAPI()


@app.post("/observaciones", status_code=201)
def registrar(obs: Observacion) -> Observacion:
    return obs  # sólo se ejecuta si la observación pasó la validación

                                        <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">6.3 Un 422 que se explica solo</h3>
                                        <p className="text-gray-700 leading-relaxed mb-5">El cuerpo por defecto está pensado para programadores: los mensajes de <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field</code> en inglés, el prefijo <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"Value error, "</code>, un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ctx</code> vacío. FastAPI lo produce al lanzar la excepción <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">RequestValidationError</code>; si registras un manejador propio para ella, decides qué ve el cliente y dejas constancia de cada rechazo en el registro del servidor. El manejador <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">rechazo_explicado</code> devuelve, para cada error, el campo, el valor recibido, la regla incumplida y el motivo:</p>
                                        <CodeBlock title="Python" lang="python" code={`# Continúa el bloque anterior: usa su modelo \`Observacion\`.
import logging

from fastapi import FastAPI, Request
from fastapi.exceptions import RequestValidationError
from fastapi.responses import JSONResponse
from fastapi.testclient import TestClient

logging.basicConfig(format="%(levelname)s %(name)s: %(message)s")
bitacora = logging.getLogger("ingesta")

app = FastAPI()  # app nueva: el manejador se registra antes de la primera petición


@app.exception_handler(RequestValidationError)
async def rechazo_explicado(request: Request, exc: RequestValidationError) -> JSONResponse:
    rechazos = []
    for err in exc.errors():
        falta = err["type"] == "missing"  # si falta el campo, no llegó ningún valor
        rechazos.append({
            "campo": ".".join(str(parte) for parte in err["loc"]),  # p. ej., "body.edad"
            "valor_recibido": None if falta else repr(err["input"]),  # texto: el JSON no admite NaN
            "regla": err["type"],
            "motivo": err["msg"].removeprefix("Value error, "),
        })
    bitacora.warning("%s %s rechazado: %s", request.method, request.url.path, rechazos)
    return JSONResponse(status_code=422, content={"rechazos": rechazos})


@app.post("/observaciones", status_code=201)
def registrar(obs: Observacion) -> Observacion:
    return obs


cliente = TestClient(app)
cuerpos = [
    '{"id_sujeto": 7, "edad": 200, "ingreso_mensual": 1800000, "municipio": "Medellín"}',
    '{"id_sujeto": 8, "edad": 30, "ingreso_mensual": NaN}',
    '{"id_sujeto": 9, "edad": 30',
]
for cuerpo in cuerpos:
    r = cliente.post("/observaciones", content=cuerpo, headers={"Content-Type": "application/json"})
    print(r.status_code)
    for rechazo in r.json()["rechazos"]:
        print("  ", rechazo)`} />

                                        <p className="text-gray-700 leading-relaxed mb-5">Lo que conviene notar:</p>
                                        <ul className="list-disc pl-6 space-y-2 mb-6 text-gray-700">
                                        <li className="leading-relaxed">El motivo de tu validador llega sin el prefijo <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"Value error, "</code>, tal como lo escribiste. Los de <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field</code> siguen en inglés; como <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">regla</code> es un código estable (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">less_than_equal</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">missing</code>…), el manejador puede traducirlos si hace falta.</li>
                                        <li className="leading-relaxed"><code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">valor_recibido</code> va como texto, con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">repr</code>: se distingue el número <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">200</code> de la cadena <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">'200'</code>, y cabe cualquier valor, también un NaN. Por eso el manejador no devuelve <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">input</code> tal cual: con el manejador por defecto, la petición con NaN termina en 500 y no en 422, porque Pydantic la rechaza bien (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">finite_number</code>, por <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">allow_inf_nan=False</code>), pero el manejador por defecto copia el NaN en la respuesta y el JSON estándar no admite NaN.</li>
                                        <li className="leading-relaxed">Tampoco copia <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ctx</code>: en un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">value_error</code> guarda la excepción que lanzaste, y un manejador que devuelva <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">exc.errors()</code> sin más falla al convertirla en JSON y también responde 500.</li>
                                        <li className="leading-relaxed">Si falta un campo (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">missing</code>), <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">valor_recibido</code> es <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">None</code>: no llegó nada. Con un JSON mal formado, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">campo</code> es <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">body.27</code>: el número es la posición del carácter donde se rompió el JSON (aquí, el final: falta la llave de cierre). Y el error de un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@model_validator</code>, que no es de ningún campo, sale con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">campo</code> igual a <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">body</code>.</li>
                                        <li className="leading-relaxed">Cada rechazo queda además en el registro del servidor (la línea <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">WARNING ingesta: …</code>), con el método y la ruta: es la bitácora de la API. La subsección siguiente hace lo mismo con un lote.</li>
                                        </ul>
                                        <p className="text-gray-700 leading-relaxed mb-5">El manejador se registra al crear la aplicación, antes de que atienda la primera petición: si lo registras después, FastAPI no lo usa. Por eso el bloque crea una <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">app</code> nueva; en tu proyecto va en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">main.py</code>, junto a <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">app = FastAPI()</code>.</p>
                                        <Box type="warn" label="Cuidado: validar dentro del endpoint">Si en vez de declarar el modelo en la firma lo validas dentro de la función —<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Observacion.model_validate(datos)</code>, p. ej., con las filas de un archivo que sube el usuario—, un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ValidationError</code> que se escape no es un 422 sino un 500. Captúralo y relánzalo con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">raise RequestValidationError(e.errors())</code>: así lo responde tu manejador, igual que los demás rechazos (el campo sale sin <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">body</code>, porque ese error no viene de leer la petición).

                                        <CodeBlock title="Python" lang="python" code={`# Continúa el bloque anterior: consume su lista \`datos_demograficos_simulados\`.
from datetime import datetime
from typing import Annotated, Any, Dict, List, Literal

from pydantic import BaseModel, Field, ValidationError


# 1. El modelo de validación
class ObservacionDemografica(BaseModel):
    """
    Modelo de validación para una observación demográfica.
    Cada campo declara los límites biológicos y lógicos de su variable.
    """
    id_sujeto: int = Field(
        ...,
        description="Identificador único y anónimo del participante"
    )

    edad_biologica: Annotated[int, Field(
        ge=0, le=120,
        description="Edad en años cumplidos (0 a 120)"
    )]

    ingreso_anual_usd: Annotated[float, Field(
        ge=0.0,
        description="Ingreso bruto anual, en dólares (no negativo)"
    )]

    nivel_educativo: Literal['primario', 'secundario', 'universitario', 'posgrado']


# 2. La bitácora: una fila por error, un conteo por observación
class BitacoraAuditoria:
    """
    Registro de exclusiones. Con él se construye el diagrama de flujo
    de participantes (CONSORT, STROBE): cuántos se excluyeron y por qué.
    """
    def __init__(self):
        self.exclusiones: List[Dict[str, Any]] = []  # una fila por ERROR
        self.validaciones_exitosas: List[int] = []
        self.registros_excluidos = 0  # una unidad por OBSERVACIÓN rechazada

    def registrar_exclusion(
        self,
        payload_original: dict,
        errores: list,
        timestamp: str
    ):
        """Registra una observación rechazada: una fila por cada uno de sus errores."""
        self.registros_excluidos += 1
        for error in errores:
            registro = {
                'timestamp': timestamp,
                'id_sujeto': payload_original.get('id_sujeto', 'DESCONOCIDO'),
                'campo_afectado': ' -> '.join(str(x) for x in error['loc']),
                'tipo_error': error['type'],
                'mensaje': error['msg'],
                'valor_input': error.get('input', 'N/A'),
                'payload_completo': payload_original  # el registro, en cuarentena
            }
            self.exclusiones.append(registro)

    def registrar_exito(self, id_sujeto: int):
        self.validaciones_exitosas.append(id_sujeto)

    def generar_reporte_consolidado(self) -> dict:
        """Resume las exclusiones. La tasa cuenta observaciones, no errores."""
        # Conteo por tipo de error (una observación puede tener varios)
        conteo_tipos = {}
        conteo_campos = {}
        for exc in self.exclusiones:
            tipo = exc['tipo_error']
            campo = exc['campo_afectado']
            conteo_tipos[tipo] = conteo_tipos.get(tipo, 0) + 1
            conteo_campos[campo] = conteo_campos.get(campo, 0) + 1

        total_procesados = len(self.validaciones_exitosas) + self.registros_excluidos

        return {
            'total_procesados': total_procesados,
            'validaciones_exitosas': len(self.validaciones_exitosas),
            'total_exclusiones': self.registros_excluidos,
            'total_errores': len(self.exclusiones),
            'tasa_exclusion': self.registros_excluidos / max(total_procesados, 1) * 100,
            'desglose_por_tipo_error': conteo_tipos,
            'desglose_por_campo': conteo_campos
        }


# 3. Validar el lote: los válidos siguen; los rechazados van a la bitácora
def procesar_lote_muestral(
    carga_cruda: List[Dict],
    bitacora: BitacoraAuditoria
) -> List[ObservacionDemografica]:
    """
    Valida un lote de observaciones demográficas. Ningún rechazo se pierde:
    cada uno queda en la bitácora con sus errores.
    """
    sujetos_validados = []

    for registro in carga_cruda:
        timestamp = datetime.now().isoformat()

        try:
            sujeto = ObservacionDemografica.model_validate(registro)
            sujetos_validados.append(sujeto)
            bitacora.registrar_exito(sujeto.id_sujeto)

        except ValidationError as error_auditoria:
            # El registro no se descarta: se guarda con todos sus errores
            errores = error_auditoria.errors()

            print(f"\\n⚠️ EXCLUSIÓN REGISTRADA - Sujeto ID: {registro.get('id_sujeto')}")
            for fallo in errores:
                campo = ' -> '.join(str(x) for x in fallo['loc'])
                print(f"   Campo:  {campo}")
                print(f"   Tipo:   {fallo['type']}")
                print(f"   Motivo: {fallo['msg']}")

            bitacora.registrar_exclusion(registro, errores, timestamp)

    return sujetos_validados


# 4. Ejecución del procesamiento
bitacora = BitacoraAuditoria()
sujetos_validos = procesar_lote_muestral(datos_demograficos_simulados, bitacora)

# 5. Generación del reporte consolidado
reporte = bitacora.generar_reporte_consolidado()

print("\\n" + "="*60)
print("📊 REPORTE CONSOLIDADO DE AUDITORÍA")
print("="*60)
print(f"Total procesados:        {reporte['total_procesados']}")
print(f"Validaciones exitosas:   {reporte['validaciones_exitosas']}")
print(f"Total exclusiones:       {reporte['total_exclusiones']}")
print(f"Total errores:           {reporte['total_errores']}")
print(f"Tasa de exclusión:       {reporte['tasa_exclusion']:.1f}%")
print("\\nDesglose por tipo de error:")
for tipo, cuenta in reporte['desglose_por_tipo_error'].items():
    print(f"  • {tipo}: {cuenta}")
print("\\nDesglose por campo afectado:")
for campo, cuenta in reporte['desglose_por_campo'].items():
    print(f"  • {campo}: {cuenta}")`} />

                                        <section className="usta-card p-6 md:p-8 mb-8">
                                        <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">6.5 Ejercicios de autoevaluación</h3>
                                        <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                        <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Ejercicio 1: leer un error</h4>
                                        <p className="text-gray-700 leading-relaxed mb-5"><strong>Problema:</strong> Tu API rechaza un registro con un 422 y, en el mensaje del <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ValidationError</code>, aparece: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">type=value_error, input_value='not-an-email', input_type=str</code>. ¿Qué revela este error sobre el diseño de la recolección de datos?</p>
                                        <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                        <strong>Solución parcial:</strong>
                                        <p className="text-gray-700 leading-relaxed mb-5">Este error revela que:</p>
                                        <ol className="list-decimal pl-6 space-y-2 mb-6 text-gray-700">
                                        <li className="leading-relaxed">El valor (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">'not-an-email'</code>) es una cadena de texto, así que pasó la comprobación de tipo (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">str</code>).</li>
                                        <li className="leading-relaxed">Sin embargo, violó un validador de formato: un campo <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">EmailStr</code> (que usa la biblioteca email-validator) o un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@field_validator</code> propio que lanza <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ValueError</code>. Una expresión regular declarada con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field(pattern=...)</code> daría otro tipo, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">string_pattern_mismatch</code>.</li>

                                            <Accordion items={[{ titulo: "Guía para el docente: qué debe aparecer en la respuesta (eje 1)", contenido: (<><ul className="list-disc pl-6 space-y-2 mt-3 text-sm text-gray-700">
                                                    <li><strong>Pregunta 1.</strong> Lo acepta y lo guarda como <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">25</code>: en modo laxo Pydantic convierte una cadena que representa un entero. Con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">strict=True</code> no convierte y responde 422 con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">type: "int_type"</code> (sección 3).</li>
                                                    <li><strong>Pregunta 2.</strong> Con la escala en el <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@model_validator</code> de <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">RespuestaEncuesta</code>, la ruta es <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">["body", "respuestas", 2]</code>: el cuerpo de la petición, el campo lista y el índice (la tercera respuesta, porque se cuenta desde 0). No termina en un campo porque la regla es del modelo: compara <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">tipo</code> con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">valor</code>. Si la cota fuera un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field</code> de <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">valor</code>, sería <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">["body", "respuestas", 2, "valor"]</code>.</li>
                                                    <li><strong>Pregunta 3.</strong> Sólo los modelos: se crea <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">SubRespuesta</code> y se añade a <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">RespuestaEncuesta</code> un campo <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">list[SubRespuesta]</code>. El endpoint no cambia, porque FastAPI lee la forma del cuerpo del tipo de su parámetro, y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">/docs</code> se actualiza solo. Un error en una subrespuesta tendrá la ruta <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">["body", "respuestas", 2, "subrespuestas", 0, …]</code>.</li>
