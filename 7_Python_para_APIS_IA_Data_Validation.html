                                            <Accordion items={[{ titulo: "Guía para el docente: qué debe aparecer en la respuesta (eje 2)", contenido: (<><ul className="list-disc pl-6 space-y-2 mt-3 text-sm text-gray-700">
                                                    <li><strong>Pregunta 5.</strong> El validador <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">before</code> recibe el dato crudo, la cadena <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"3"</code>, y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">1 &lt;= "3"</code> lanza un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">TypeError</code>. Pydantic sólo convierte en error de validación los <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ValueError</code> y los <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">AssertionError</code>, así que el <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">TypeError</code> se escapa y FastAPI responde <strong>500</strong>, no 422. Por eso los rangos simples van en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field</code>, que actúa después de la conversión de tipos.</li>
                                                    <li><strong>Pregunta 6.</strong> Las dos cosas: lo que devuelve el validador sustituye al dato, y el original se pierde. Por eso la transformación tiene que ser de forma (mayúsculas, espacios) y no de contenido: corregir el contenido en silencio, como el <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">abs()</code> de la sección 4, es el antipatrón. Si hay que auditar, se guarda también el original.</li>
                                                    <li><strong>Pregunta 7.</strong> <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field(ge=1, le=6)</code> declara un rango simple sin escribir código, sale en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">/docs</code> como <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">minimum</code> y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">maximum</code>, y su error trae un tipo propio (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">greater_than_equal</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">less_than_equal</code>). Comprobar un nombre contra una lista y normalizarlo necesita código: eso es un validador.</li>
                                                    <li><strong>Pregunta 8.</strong> Un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@field_validator</code> trabaja con su campo; <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@model_validator(mode="after")</code> recibe el modelo ya validado, con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">tipo</code> y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">valor</code> a la vez, y devuelve <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">self</code>. (Con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">info.data</code> un validador de campo puede leer los campos declarados antes que él, pero entonces la regla depende del orden en que se declaran los campos.)</li>
                                                </ul></>) }]} />

                                            <Accordion items={[{ titulo: "Guía para el docente: qué debe aparecer en la respuesta (eje 3)", contenido: (<><ul className="list-disc pl-6 space-y-2 mt-3 text-sm text-gray-700">
                                                    <li><strong>Pregunta 9.</strong> Imposible: una edad de 150 o un estrato 9 (rango lógico, en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field</code>); se rechaza en cualquier contexto. Improbable: una edad de 90 si el modelo se ajustó con encuestados de 18 a 75 años (rango estadístico); la observación es posible, y se rechaza aquí porque la API alimenta un modelo ya ajustado y predecir con ella sería extrapolar.</li>
                                                    <li><strong>Pregunta 10.</strong> Bajaría: se excluyen de forma sistemática las edades altas. Que un dato falte dependería de su propio valor (MNAR), así que el sesgo no se corrige con más datos. Al recoger datos, lo raro pero real se marca para revisión y se conserva; sólo lo imposible se rechaza.</li>
                                                    <li><strong>Pregunta 11.</strong> De la muestra con que se ajustó el modelo, declarados como constantes con su fuente: la pregunta es si el modelo puede usar el dato, y eso lo dice la muestra de entrenamiento. Calculados con lo que llega, la regla cambiaría con cada lote; con una sola encuesta no hay desviación estándar que calcular; y un lote con varios valores extremos infla su propia desviación y los deja pasar.</li>

                                            <div className="space-y-5">

                                                <div className="border-l-4 border-primary pl-5 py-2">

                                                    <p className="text-gray-800 leading-relaxed">Envía una encuesta con la edad en 150, el estrato en 9 y un departamento que no existe. ¿Tu API reporta los tres errores a la vez o sólo el primero? Muéstramelo en Swagger UI y lee el motivo de cada uno: ¿se entiende sin ver tu código?</p>

                                                    <p className="text-gray-800 leading-relaxed">Un cliente te manda un JSON al que le falta la llave de cierre. ¿Qué responde FastAPI: 400 o 422? ¿Con qué <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">type</code>?</p>

                                                    <p className="text-gray-800 leading-relaxed">En tu <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">GET /encuestas/resumen</code>, ¿por qué la suma de errores por regla puede ser mayor que el número de encuestas rechazadas? ¿Cuál de los dos números va en un diagrama de flujo de exclusiones?</p>

                                            </div>

                                            <Accordion items={[{ titulo: "Guía para el docente: qué debe aparecer en la respuesta (eje 4)", contenido: (<><ul className="list-disc pl-6 space-y-2 mt-3 text-sm text-gray-700">
                                                    <li><strong>Pregunta 12.</strong> Los tres a la vez: Pydantic valida todos los campos y junta los errores. Rutas <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">["body", "encuestado", "edad"]</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">["body", "encuestado", "estrato"]</code> y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">["body", "encuestado", "departamento"]</code>; tipos <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">less_than_equal</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">less_than_equal</code> y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">value_error</code>. El validador del rango estadístico de la edad no llega a correr, porque la edad ya falló en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field</code>. El motivo se entiende si dice campo, valor y regla.</li>
                                                    <li><strong>Pregunta 13.</strong> 422, con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">type: "json_invalid"</code> y una ruta <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">["body", n]</code> en la que <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">n</code> es la posición del texto donde se cortó la lectura. FastAPI no responde 400 a un JSON mal formado.</li>

                                                    <li><strong>Pregunta 15.</strong> Porque una encuesta rechazada puede traer varios errores: la de la pregunta 12 trae tres. En el diagrama de flujo de participantes que recomienda STROBE se cuentan encuestas excluidas, y los errores por regla dicen por qué. Dividir errores entre encuestas puede dar una «tasa de exclusión» mayor que el 100 %.</li>

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
