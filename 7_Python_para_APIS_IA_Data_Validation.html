                                            </Box>

                                            <Accordion items={[{ titulo: "Inmersión Teórica: Interpretación de la Unión Disjunta", contenido: (<><div
                                                    className="mt-3 text-sm text-indigo-900 leading-relaxed border-t border-indigo-200 pt-3">
                                                    <p>La notación \( \biguplus \) (unión disjunta) es fundamental en la teoría de tipos
                                                        computacional y en la teoría formal de conjuntos. A diferencia de una unión
                                                        clásica \( \cup \), la unión disjunta garantiza estructuralmente que los
                                                        elementos del conjunto \( T \) (por ejemplo, números reales \( \mathbb&#123;R&#125; \))
                                                        jamás se solapan o confunden con el estado de ausencia representado por el
                                                        elemento unitario especial <code>None</code> (nulo).</p>
                                                    <p className="mt-3"><strong>Interpretación Semántica y Estadística:</strong></p>
                                                    <ul className="list-disc pl-5 mt-2 space-y-2">
                                                        <li>Cualquier observación modelada como <code>Optional[T]</code> obliga al
                                                            analista y al motor de evaluación estadístico a procesar <em>explícita y
                                                                obligatoriamente</em> la bifurcación mutuamente excluyente del dato: o
                                                            bien es una observación válida perteneciente a la distribución empírica \( T
                                                            \), o es certera, deliberada y demostrablemente un dato faltante estructural
                                                            (el conjunto <code>&#123;None&#125;</code>).</li>
                                                        <li>Esta separación categórica impide formalmente que un valor nulo sea
                                                            silenciosamente casteado o "coercido" a cero (\( 0 \)) o a <code>NaN</code> durante las operaciones de álgebra matricial subyacentes. Como corolario,

                                                    </ul>

                                                <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Contexto del Problema

                                                <p className="text-gray-700 leading-relaxed mb-5">El dataset mtcars (Motor Trend Car Road

import numpy as np
from typing import List, Union, Optional

                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Implementación Paso a Paso
                                            </h4>
                                            <CodeBlock title="Python" lang="python" code={`# 1. Definición del tipo para matriz de covariables continuas
import numpy.typing as npt

# Anotación de arreglos multidimensionales con precisión especificada
MatrizDisenoCovariables = npt.NDArray[np.float64]

# 2. Definición del modelo de observación tipado
class EspecificacionCoche(BaseModel):
    """
    Modelo de validación para una observación individual del dataset mtcars.
    Cada campo representa una variable del diseño experimental.
    """
    # Identificador nominal del sujeto (puede estar perdido)
    modelo_vehiculo: Optional[str] = Field(
        default=None, 
        description="Identificador nominal del sujeto experimental"
    )
    
    # Caballos de fuerza: permite polimorfismo int/float
    caballos_fuerza_hp: int | float = Field(
        ..., 
        description="Medición de potencia bruta del motor",
        gt=0  # Restricción: debe ser positivo
    )
    
    # Vector de mediciones repetidas del cuarto de milla
    qsec_mediciones_repetidas: List[float] = Field(
        default_factory=list,
        description="Tiempos en cuarto de milla (medidas repetidas)"
    )
    
    # Variable indicadora con restricciones embebidas
    transmision_am_dummy: Annotated[int, Field(
        ge=0, le=1, 
        description="Variable dummy: 0 = Automático, 1 = Manual"
    )]

# 3. Función con firma tipada para ajuste de modelo
def ajustar_modelo_lineal(
    X: MatrizDisenoCovariables,
    y: npt.NDArray[np.float64],
    datos_completos: pd.DataFrame
) -> dict:
    """
    Función que exige matriz de diseño estrictamente numérica flotante.
    Calcula estimadores básicos de regresión lineal.
    """
    n, p = X.shape
    
    # Cálculo de estimadores por mínimos cuadrados ordinarios
# \\( \\hat{\\beta} = (X'X)^{-1}X'y \\)
    XtX_inv = np.linalg.inv(X.T @ X)
    beta_hat = XtX_inv @ (X.T @ y)
    
    # Residuales y estimación de varianza
    y_pred = X @ beta_hat
    residuales = y - y_pred
    sigma2_hat = np.sum(residuales**2) / (n - p)
    
    return {
        'coeficientes': beta_hat,
        'varianza_residual': sigma2_hat,
        'n_observaciones': n,
        'p_parametros': p
    }

# 4. Instanciación y validación de una observación
coche_valido = EspecificacionCoche(
    modelo_vehiculo="Mazda RX4",
    caballos_fuerza_hp=110.0,
    qsec_mediciones_repetidas=[16.46, 16.50, 16.48],
    transmision_am_dummy=1
)

print(f"✅ Vehículo validado: {coche_valido.modelo_vehiculo}")
print(f"   HP: {coche_valido.caballos_fuerza_hp}")
print(f"   Transmisión: {'Manual' if coche_valido.transmision_am_dummy else 'Automático'}")`} />
                                            <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                                <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Interpretación de
                                                    Resultados</h4>
                                                <p className="text-gray-700 leading-relaxed mb-5">La implementación de firmas de tipo
                                                    transforma el código estadístico de una declaración de intenciones implícita a un
                                                    contrato matemático explícito y auditable. Cuando <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">MatrizDisenoCovariables</code> se define explícitamente como <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">npt.NDArray[np.float64]</code>,
                                                    herramientas de análisis estático como mypy o pyright pueden predecir fallos de
                                                    incompatibilidad dimensional o de tipo de datos sin necesidad de ejecutar
                                                    simulaciones costosas. La función <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">ajustar_modelo_lineal</code> garantiza que los cálculos de álgebra lineal (como la inversión de matrices X'X)
                                                    operen exclusivamente sobre datos de punto flotante de 64 bits, optimizando el
                                                    rendimiento del motor BLAS/LAPACK subyacente.</p>

                                                <p className="text-gray-700 leading-relaxed mb-5">El conjunto de datos iris compilado por

                                                    precisas de taxones florales. Es un axioma biológico irrefutable que la longitud de

                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Generación de Datos Simulados
                                            </h4>
                                            <CodeBlock title="Python" lang="python" code={`import numpy as np
import pandas as pd

# Simulación de datos del dataset iris con valores anómalos intencionales
np.random.seed(42)

n_muestras = 15
especies = ['setosa', 'versicolor', 'virginica']

# Generación de datos mayormente válidos con algunos errores
datos_iris_simulados = []
for i in range(n_muestras):
    observacion = {
        'especie': np.random.choice(especies),
        'sepal_length': np.random.uniform(4.3, 7.9),
        'sepal_width': np.random.uniform(2.0, 4.4),
        'petal_length': np.random.uniform(1.0, 6.9),
        'petal_width': np.random.uniform(0.1, 2.5)
    }
    
    # Introducir errores deliberados en algunas observaciones
    if i == 3:  # Valor negativo imposible
        observacion['sepal_length'] = -5.1
    if i == 7:  # Valor excesivamente grande (error de escala)
        observacion['petal_length'] = 85.0
    if i == 11:  # Especie no válida
        observacion['especie'] = 'rosa'
    
    datos_iris_simulados.append(observacion)

print(f"Simuladas {n_muestras} observaciones con errores en índices 3, 7 y 11")`} />

                                                    className="mt-4 text-sm text-amber-900 border-t border-amber-200 pt-4 leading-relaxed space-y-3">
                                                    <p><strong>Bootstrapping</strong> es una técnica estadística de <em>remuestreo</em> introducida por Bradley Efron (1979) que consiste en generar múltiples muestras
                                                        artificiales a partir de una muestra original, extrayendo observaciones <strong>con reemplazo</strong>. Cada muestra generada (llamada <em>muestra
                                                            bootstrap</em>) tiene el mismo tamaño que la original, pero al extraer con
                                                        reemplazo, algunas observaciones se repiten y otras quedan fuera.

import functools
import logging
from typing import ClassVar, List
from pydantic import BaseModel, field_validator, ValidationError

# 1. Decorador para cronometrar rutinas de validación masiva

logging.basicConfig(level=logging.INFO, format='%(asctime)s - %(levelname)s - %(message)s')
logger = logging.getLogger(__name__)

# 1. Decorador mejorado
def cronometrar_bootstrap(func):
    """
    Decorador que mide el tiempo de ejecución de rutinas iterativas
    como validaciones masivas o remuestreos de Bootstrap.
    """
    @functools.wraps(func)
    def envoltorio_tiempo(*args, **kwargs):
        tiempo_inicio = time.perf_counter()
        try:
            resultado = func(*args, **kwargs)
            return resultado
        finally:
            tiempo_fin = time.perf_counter()
            duracion = tiempo_fin - tiempo_inicio
            # Usamos logger en lugar de print
            logger.info(f"La rutina '{func.__name__}' ejecutó en {duracion:.5f} segundos.")
    return envoltorio_tiempo

# 2. Modelo de validación para observaciones del dataset iris
class ObservacionIris(BaseModel):
    """
    Modelo estadístico para validación de observaciones florales.
    Incluye validadores para garantizar axiomas biológicos.
    """
    # Variable dependiente (factor categórico)
    especie_taxonomica: str
    
    # Vector de variables predictoras continuas
    sepal_length: float
    sepal_width: float
    petal_length: float
    petal_width: float
    
    # Constantes de clase: niveles permitidos del factor
    ESPECIES_PERMITIDAS: ClassVar[List[str]] = ["setosa", "versicolor", "virginica"]
    
    @field_validator('especie_taxonomica')
    @classmethod
    def validar_factor_categorico(cls, valor: str) -> str:
        """
        Garantiza que el factor categórico solo contenga niveles
        poblacionales conocidos. Previene 'niveles fantasma' que
        destruirían los grados de libertad en análisis posteriores.
        """
        valor_limpio = valor.strip().lower()
        if valor_limpio not in cls.ESPECIES_PERMITIDAS:
            raise ValueError(
                f"Anomalía Taxonómica. Especie no reconocida: '{valor}'. "
                f"El hiperespacio poblacional permite: {cls.ESPECIES_PERMITIDAS}"
            )
        return valor_limpio
    
    @field_validator('sepal_length', 'sepal_width', 'petal_length', 'petal_width', mode='after')
    @classmethod
    def auditar_axiomas_biologicos(cls, valor: float) -> float:
        """
        Comprueba axiomas del dominio del proceso generador de datos:
        las medidas morfológicas deben ser estrictamente positivas.
        """
        # Restricción teórica: valores positivos
        if valor <= 0:
            raise ValueError(
                "Violación Axiomática: Las mediciones biológicas deben "
                "residir en la región topológica \\\\(0, +\\\\infty\\\\)."
            )

        # Heurística de control de calidad: detectar errores de escala
        if valor > 50.0:
            raise ValueError(
                f"Medición atípica sospechosa ({valor} cm); posible error "
                "de transcripción de milímetros a centímetros."
            )
        return valor

# 3. Simulación de ingesta muestral masiva con manejo de errores
@cronometrar_bootstrap
def simular_ingesta_bootstrap(lista_datos: list) -> dict:
    """
    Procesa una lista de observaciones simulando un pipeline de ingesta
    con validación automatizada y registro de exclusiones.
    """
    observaciones_validas = []
    errores_detectados = []
    total_registros = len(lista_datos)
    
    for i, dato in enumerate(lista_datos):
        try:
            medicion = ObservacionIris(**dato)
            observaciones_validas.append(medicion)
        except ValidationError as error:
            errores_detectados.append({
                'indice': i,
                'dato_original': dato,
                'error': str(error)
            })
            logger.warning(f"⚠️ [Rechazo #{len(errores_detectados)}] Observación índice {i}: {error.errors()[0]['msg'][:50]}...")
    
    return {
        'validas': observaciones_validas,
        'rechazadas': errores_detectados,
        'tasa_exclusion': len(errores_detectados) / len(lista_datos) * 100
    }

# 4. Ejecución de la simulación
if __name__ == "__main__":
    try:
        resultado = simular_ingesta_bootstrap(datos_iris_simulados)
        logger.info(f"\\n📊 Resumen de Validación:")
        logger.info(f"   Aceptadas: {len(resultado['validas'])}")
        logger.info(f"   Rechazadas: {len(resultado['rechazadas'])}")
        logger.info(f"   Tasa de exclusión: {resultado['tasa_exclusion']:.1f}%")
    except Exception as e:
        logger.error(f"Fallo crítico en el pipeline: {e}")`} />

                                                <Accordion items={[{ titulo: "¿Qué son MCAR, MAR y MNAR? La taxonomía de Rubin para datos faltantes", contenido: (<><div
                                                        className="mt-4 text-sm text-amber-900 border-t border-amber-200 pt-4 leading-relaxed space-y-4">
                                                        <p>En 1976, el estadístico Donald B. Rubin propuso una clasificación formal de
                                                            los mecanismos que generan datos faltantes (<em>missing data</em>) en un
                                                            conjunto de datos. Esta <strong>taxonomía de Rubin</strong> es fundamental
                                                            porque el tipo de mecanismo determina qué técnicas de análisis son válidas y
                                                            si las conclusiones estadísticas obtenidas con los datos disponibles son
                                                            generalizables a la población original.</p>

                                                        <p>Formalmente, si \(\mathbf&#123;Y&#125;\) es la matriz completa de datos y
                                                            \(\mathbf&#123;R&#125;\) es la matriz indicadora de observación (donde \(R_&#123;ij&#125; = 1\)
                                                            si el dato \(Y_&#123;ij&#125;\) fue observado y \(R_&#123;ij&#125; = 0\) si está faltante), la
                                                            clasificación se basa en la distribución condicional \(P(\mathbf&#123;R&#125; \mid
                                                            \mathbf&#123;Y&#125;)\):</p>


                                                        <div className="bg-white/70 border border-green-300 rounded-lg p-4">
                                                            <h5 className="font-bold text-green-800 mb-2">MCAR — Missing Completely At
                                                                Random (Faltante Completamente al Azar)</h5>
                                                            <div className="mb-2 text-center text-gray-700">
                                                                $$ P(\mathbf&#123;R&#125; \mid \mathbf&#123;Y&#125;_&#123;\text&#123;obs&#125;&#125;, \mathbf&#123;Y&#125;_&#123;\text&#123;mis&#125;&#125;) =
                                                                P(\mathbf&#123;R&#125;) $$
                                                            </div>
                                                            <p>La probabilidad de que un dato falte <strong>no depende de ningún
                                                                    valor</strong>, ni observado ni faltante. La ausencia es puramente
                                                                aleatoria, como si se lanzara una moneda para decidir qué datos
                                                                eliminar.</p>
                                                            <p className="mt-2"><strong>Ejemplo:</strong> Un sensor de temperatura falla por
                                                                una descarga eléctrica aleatoria que no tiene relación con la
                                                                temperatura que estaba midiendo. Los datos perdidos son una submuestra
                                                                aleatoria de los datos completos.</p>
                                                            <p className="mt-2"><strong>Implicación:</strong> Es el escenario más benigno.
                                                                Los análisis con datos completos (sin los faltantes) producen
                                                                estimadores insesgados, aunque con menor potencia estadística por la
                                                                reducción del tamaño muestral.</p>
                                                        </div>


                                                        <div className="bg-white/70 border border-yellow-300 rounded-lg p-4">
                                                            <h5 className="font-bold text-yellow-800 mb-2">MAR — Missing At Random (Faltante
                                                                al Azar)</h5>
                                                            <div className="mb-2 text-center text-gray-700">
                                                                $$ P(\mathbf&#123;R&#125; \mid \mathbf&#123;Y&#125;_&#123;\text&#123;obs&#125;&#125;, \mathbf&#123;Y&#125;_&#123;\text&#123;mis&#125;&#125;) =
                                                                P(\mathbf&#123;R&#125; \mid \mathbf&#123;Y&#125;_&#123;\text&#123;obs&#125;&#125;) $$
                                                            </div>
                                                            <p>La probabilidad de que un dato falte depende de <strong>otros valores
                                                                    observados</strong>, pero <em>no</em> del valor faltante en sí. El
                                                                nombre es algo engañoso: no es "completamente al azar", sino "al azar <em>condicional</em>" a lo observado.
                                                            </p>
                                                            <p className="mt-2"><strong>Ejemplo:</strong> En una encuesta de ingresos, las
                                                                personas jóvenes (edad observable) tienden a no reportar su salario,
                                                                pero dentro de cada grupo de edad, la probabilidad de no reportar no
                                                                depende del salario real. La ausencia se explica por la edad, no por el
                                                                ingreso.</p>
                                                            <p className="mt-2"><strong>Implicación:</strong> Eliminando simplemente los
                                                                registros incompletos se introduce sesgo. Sin embargo, técnicas como
                                                                imputación múltiple o modelos de máxima verosimilitud que condicionen en
                                                                las variables observadas pueden producir estimaciones válidas.</p>
                                                        </div>


                                                        <div className="bg-white/70 border border-red-300 rounded-lg p-4">
                                                            <h5 className="font-bold text-red-800 mb-2">MNAR — Missing Not At Random
                                                                (Faltante No al Azar)</h5>
                                                            <div className="mb-2 text-center text-gray-700">
                                                                $$ P(\mathbf&#123;R&#125; \mid \mathbf&#123;Y&#125;_&#123;\text&#123;obs&#125;&#125;, \mathbf&#123;Y&#125;_&#123;\text&#123;mis&#125;&#125;)
                                                                \neq P(\mathbf&#123;R&#125; \mid \mathbf&#123;Y&#125;_&#123;\text&#123;obs&#125;&#125;) $$
                                                            </div>
                                                            <p>La probabilidad de que un dato falte depende <strong>del propio valor
                                                                    faltante</strong>, incluso después de condicionar por las variables
                                                                observadas. Este es el mecanismo más problemático.</p>
                                                            <p className="mt-2"><strong>Ejemplo:</strong> En un estudio clínico, los
                                                                pacientes con efectos secundarios más graves abandonan el ensayo y dejan
                                                                de reportar sus síntomas. Los datos faltantes son precisamente los más
                                                                extremos, y su ausencia distorsiona la distribución observada.</p>
                                                            <p className="mt-2"><strong>Implicación:</strong> No existe una solución
                                                                puramente estadística sin supuestos adicionales. Se requieren modelos de
                                                                selección (<em>selection models</em>) o modelos de mezcla de patrones
                                                                (<em>pattern-mixture models</em>) que incorporen hipótesis explícitas
                                                                sobre el mecanismo de ausencia. Sin este tratamiento, cualquier análisis
                                                                producirá estimaciones sesgadas.</p>
                                                        </div>


                                                        <div className="bg-white/70 border border-amber-400 rounded-lg p-4">
                                                            <h5 className="font-bold text-amber-900 mb-2">¿Por qué importa esto en nuestro
                                                                pipeline de validación?</h5>
                                                            <p>Cuando Pydantic rechaza datos, está generando "datos faltantes" de forma
                                                                programática. Si las reglas de validación son puramente estructurales
                                                                (tipo incorrecto, campo vacío), los rechazos tienden a ser MCAR. Pero si
                                                                los rechazos se concentran en valores extremos reales (ej.: rechazar
                                                                edades > 120 elimina centenarios legítimos), el mecanismo se convierte
                                                                en MNAR y el dataset resultante queda sesgado. Por eso la bitácora de
                                                                auditoría y el análisis de patrones de exclusión son indispensables:
                                                                permiten diagnosticar <em>qué tipo de mecanismo de Rubin</em> está
                                                                operando y tomar decisiones informadas antes de proceder con el análisis
                                                                estadístico.</p>
                                                        </div>
                                                    </div></>) }]} />

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">2.4 Ejercicios de
                                                Autoevaluación</h3>
                                            <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                                <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Ejercicio 1: Diferencia
                                                    entre mode='before' y mode='after'</h4>
                                                <p className="text-gray-700 leading-relaxed mb-5"><strong>Problema:</strong> Explicar la
                                                    diferencia axiomática y pragmática entre parametrizar <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">mode='before'</code> y <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">mode='after'</code> en un @field_validator cuando se enfrenta a la limpieza de distribuciones empíricas
                                                    ruidosas que pueden contener valores como "1,234.56" (coma como separador de miles),
                                                    "-25" (edad negativa), o "NA" (dato faltante no estandarizado).</p>
                                                <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                                    <strong>Solución Parcial:</strong>
                                                    <p className="text-gray-700 leading-relaxed mb-5">La configuración <code
                                                            className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">mode='before'</code> recibe el punto de datos crudo y potencialmente no tipado antes de cualquier
                                                        coerción. Es ideal para:</p>
                                                    <ul className="list-disc pl-6 space-y-2 mb-6 text-gray-700">
                                                        <li className="leading-relaxed">Estandarizar formatos de ingreso exóticos (convertir
                                                            "1,234.56" a "1234.56")</li>
                                                        <li className="leading-relaxed">Manejar representaciones no estandarizadas de datos
                                                            faltantes (convertir "NA", "N/A", "-" a None)</li>
                                                        <li className="leading-relaxed">Corregir problemas de internacionalización (comas
                                                            vs. puntos decimales)</li>
                                                    </ul>
                                                    <p className="text-gray-700 leading-relaxed mb-5">Por el contrario, <code
                                                            className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">mode='after'</code> opera sobre un dato ya coercido y tipado, permitiendo enfocarse exclusivamente

                                                            <p className="font-bold text-amber-800 mb-1">1. "Isomorfo" &mdash; La idea
                                                                central</p>
                                                            <p>En matemáticas, dos cosas son <strong>isomorfas</strong> cuando tienen <em>la misma forma</em> aunque parezcan diferentes por fuera. Imagine

                                            <Box type="info" label="Definición 3.1 (Modelo Anidado)">Un modelo anidado es una estructura de

                                                dependientes (nivel inferior), estableciendo una relación de composición que refleja la
                                                estructura jerárquica del diseño experimental. Matemáticamente, si \(B\) es el conjunto de
                                                bloques y \(U\) es el conjunto de unidades observacionales, entonces existe una función
                                                \(f: U
                                                \rightarrow B\) que asigna cada unidad a su bloque correspondiente.
                                            </Box>

                                            <Box type="info" label="Ecuación 3.2">Coeficiente de Correlación Intra-Clase (ICC)<br /><br />

                                                donde <br />
                                                • \( \sigma^2_&#123;\text&#123;entre&#125;&#125; \) = varianza entre bloques y<br />
                                                • \( \sigma^2_&#123;\text&#123;dentro&#125;&#125; \) = varianza dentro de bloques

                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">3.1.5 Modelos Jerárquicos en
                                                Ciencia de Datos y Políticas Públicas</h4>
                                            <p className="text-gray-700 leading-relaxed mb-5">Los modelos jerárquicos (también denominados
                                                modelos multinivel o <em>multilevel models</em>) constituyen una herramienta estadística
                                                fundamental para analizar datos agrupados o anidados en contextos de políticas públicas
                                                y ciencia de datos aplicada. Según Dhada y Labra Montes (2024), las sociedades modernas
                                                son complejas e interconectadas, y el análisis de datos desempeña un papel crítico en la
                                                comprensión de tendencias sociales. La estructura jerárquica surge naturalmente cuando
                                                las observaciones se organizan en niveles: individuos dentro de hogares, hogares dentro
                                                de vecindarios, pacientes dentro de hospitales, regiones dentro de países.</p>

                                            <Box type="info" label="Definición 3.2 (Modelo Jerárquico Multinivel)">Un modelo jerárquico
                                                aborda simultáneamente dos problemas antagónicos fundamentales de la estimación
                                                estadística:<br /><br />
                                                &bull; <strong>Alta varianza:</strong> Datos individuales insuficientes impiden
                                                predicciones confiables a nivel local.<br />
                                                &bull; <strong>Alto sesgo:</strong> Agrupar (poolear) todos los datos borra la variación
                                                individual y no representa fielmente a las poblaciones reales.<br /><br />
                                                La solución jerárquica modela los datos de nivel inferior con modelos individuales cuyos
                                                parámetros se derivan de distribuciones compartidas de nivel superior, logrando un
                                                equilibrio óptimo entre ambos extremos.

                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">3.1.8 Modelo Independiente
                                                vs. Modelo Jerárquico</h4>
                                            <p className="text-gray-700 leading-relaxed mb-5">La distinción fundamental entre un modelo
                                                independiente y uno jerárquico tiene implicaciones directas en cómo diseñamos nuestros
                                                esquemas de validación de datos:</p>
                                            <Box type="info" label="Ecuación 3.3">Modelo Independiente vs. Jerárquico<br /><br />
                                                <strong>Modelo Independiente:</strong> Cada grupo \( j \) se estima aisladamente:<br />
                                                $$ \hat&#123;\theta&#125;_j^&#123;\text&#123;indep&#125;&#125; = \bar&#123;y&#125;_j \quad \text&#123;(estimador basado solo en datos
                                                locales)&#125; $$<br /><br />
                                                <strong>Modelo Jerárquico (Bayesiano):</strong> Las estimaciones se "encogen" hacia la
                                                media global:<br />
                                                $$ \hat&#123;\theta&#125;_j^&#123;\text&#123;hier&#125;&#125; = \lambda_j \bar&#123;y&#125;_j + (1 - \lambda_j)
                                                \bar&#123;y&#125;_&#123;\text&#123;global&#125;&#125; $$<br /><br />
                                                donde \( \lambda_j \in [0, 1] \) es el factor de encogimiento (<em>shrinkage</em>), que
                                                depende del tamaño muestral del grupo \( j \). Con pocos datos locales, \( \lambda_j \to
                                                0 \) y la estimación se apoya más en la distribución global.<br /><br />
                                                <strong>Interpretación de \( \hat&#123;\theta&#125;_j^&#123;\text&#123;hier&#125;&#125; \):</strong> Es el <em>estimador jerárquico</em> del parámetro \( \theta \) para el grupo \( j \). A
                                                diferencia del estimador independiente \( \hat&#123;\theta&#125;_j^&#123;\text&#123;indep&#125;&#125; \), que utiliza
                                                únicamente los datos locales del grupo, \( \hat&#123;\theta&#125;_j^&#123;\text&#123;hier&#125;&#125; \) es una <em>media ponderada</em> entre la estimación local \( \bar&#123;y&#125;_j \) y la media global \(
                                                \bar&#123;y&#125;_&#123;\text&#123;global&#125;&#125; \). El superíndice "hier" indica que proviene de un modelo
                                                jerárquico (multinivel), en el cual los grupos no se tratan como entidades aisladas sino
                                                como miembros de una población común. Esto produce estimaciones más estables y precisas,
                                                especialmente en grupos con tamaños muestrales pequeños, gracias al principio de <em>borrowing strength</em> (préstamo de fuerza estadística) entre grupos.
                                            </Box>
                                            <p className="text-gray-700 leading-relaxed mb-5">Este principio de "préstamo de fuerza
                                                estadística" (<em>borrowing strength</em>) es exactamente lo que motiva el diseño de
                                                modelos Pydantic anidados: al encapsular las unidades observacionales dentro de sus
                                                bloques experimentales, preservamos la información contextual del nivel superior que
                                                permite realizar inferencias más robustas incluso cuando los datos individuales son
                                                escasos.</p>

                                        </section>

                                            <CodeBlock title="Python" lang="python" code={`import numpy as np
from datetime import datetime, timedelta
import random

# Configuración de semilla para reproducibilidad

# Generación de datos simulados para múltiples sesiones de prueba
def generar_sesion_prueba(id_sesion: str, n_vehiculos: int) -> dict:
    """Genera una sesión completa con múltiples ensayos de vehículos."""
    marcas = ['Toyota', 'Honda', 'Ford', 'Chevrolet', 'Nissan', 'Mazda', 'BMW', 'Audi']
    modelos = ['Sedan', 'SUV', 'Coupe', 'Hatchback']
    
    vehiculos = []
    for i in range(n_vehiculos):
        vehiculo = {
            'id_vehiculo': f"{random.choice(marcas)}_{i+1}",
            'millas_por_galon_mpg': round(np.random.uniform(15, 35), 1),
            'cilindros_motor_cyl': random.choice([4, 6, 8]),
            'caballos_fuerza_hp': random.randint(100, 350),
            'peso_wt': round(np.random.uniform(2.0, 5.0), 2)
        }
        vehiculos.append(vehiculo)
    
    return {
        'id_sesion_laboratorio': id_sesion,
        'marca_tiempo_prueba': (datetime.now() - timedelta(days=random.randint(0, 30))).isoformat(),
        'investigador_responsable': random.choice(['Dr. Fisher', 'Dra. Pearson', 'Dr. Tukey']),
        'ensayos_experimentales': vehiculos
    }

# Generar 3 sesiones con diferentes números de vehículos
sesiones_simuladas = [
    generar_sesion_prueba('SES-2024-AA', 5),
    generar_sesion_prueba('SES-2024-BB', 3),  # Mínimo permitido
    generar_sesion_prueba('SES-2024-CC', 2),  # Debería fallar por tamaño insuficiente
]

print(f"Generadas {len(sesiones_simuladas)} sesiones de prueba simuladas")
for s in sesiones_simuladas:
    print(f"  {s['id_sesion_laboratorio']}: {len(s['ensayos_experimentales'])} vehículos")`} />
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Implementación Paso a Paso
                                            </h4>
                                            <CodeBlock title="Python" lang="python" code={`from pydantic import BaseModel, Field, field_validator, ValidationError
from typing import List, Dict, Any
from datetime import datetime

# 1. NIVEL MICRO: Sub-modelo dependiente (Unidad observacional)
class EnsayoVehiculo(BaseModel):
    """
    Modelo para una unidad observacional individual (Nivel 1).
    Equivalente al sujeto muestral base en un diseño jerárquico.
    """
    id_vehiculo: str = Field(
        min_length=2, 
        description="Nomenclatura única del automotor"
    )
    millas_por_galon_mpg: float = Field(
        ..., 
        gt=0.0,
        description="Eficiencia termodinámica del combustible"
    )
    cilindros_motor_cyl: int = Field(
        ..., 
        description="Topología geométrica de la cámara de combustión"
    )
    caballos_fuerza_hp: int = Field(
        ..., 
        gt=0,
        description="Potencia bruta del motor"
    )
    peso_wt: float = Field(
        ..., 
        gt=0.0, le=10.0,
        description="Peso del vehículo en miles de libras"
    )
    
    @field_validator('cilindros_motor_cyl')
    @classmethod
    def auditar_arquitectura_motor(cls, v: int) -> int:
        """
        Filtro axiomático: Solo permite arquitecturas de motores
        de combustión interna empíricamente fabricadas.
        """
        arquitecturas_validas = {4, 6, 8}
        if v not in arquitecturas_validas:
            raise ValueError(
                f"Fallo Paramétrico. Arquitectura geométrica atípica: "
                f"{v} cilindros. Valores permitidos: {arquitecturas_validas}"
            )
        return v

# 2. NIVEL MACRO: Modelo Principal Contenedor (Bloque experimental)
class SesionDinamometro(BaseModel):
    """
    Modelo para el bloque experimental completo (Nivel 2).
    Representa la parcela entera en un diseño de parcelas divididas.
    """
    # Identificador con patrón estandarizado riguroso
    id_sesion_laboratorio: str = Field(
        pattern=r'^SES-\\d{4}-[A-Z]{2}$',
        description="Formato: SES-AAAA-XX"
    )
    
    marca_tiempo_prueba: datetime = Field(
        default_factory=datetime.utcnow,
        description="Sello temporal GMT de calibración"
    )
    
    investigador_responsable: str = Field(
        min_length=3,
        description="Nombre del investigador a cargo"
    )
    
    # ESTRUCTURA DE ANIDAMIENTO CORE:
# Lista tipada que alberga múltiples objetos de la clase dependiente
    ensayos_experimentales: List[EnsayoVehiculo]
    
    @field_validator('ensayos_experimentales')
    @classmethod
    def validar_potencia_muestral_del_bloque(
        cls, 
        ensayos_vector: List[EnsayoVehiculo]
    ) -> List[EnsayoVehiculo]:
        """
        Comprobación estadística macroscópica de los requerimientos
        de tamaño de muestra (Power Analysis) a nivel del bloque completo.
        
        Requiere mínimo 3 unidades para estimar varianza residual
        intra-bloque con fiabilidad asintótica.
        """
        if len(ensayos_vector) < 3:
            raise ValueError(
                f"Insuficiencia de Grados de Libertad: El diseño estadístico "
                f"exige al menos 3 vehículos por sesión. Recibidos: {len(ensayos_vector)}"
            )
        return ensayos_vector

# 3. Función para procesar sesiones con manejo de errores jerárquico
def procesar_sesion_experimento(datos_crudos: Dict[str, Any]) -> dict:
    """
    Procesa una sesión experimental completa, validando tanto
    el nivel macro (sesión) como el nivel micro (vehículos anidados).
    """
    try:
        sesion_certificada = SesionDinamometro.model_validate(datos_crudos)
        return {
            'estado': 'VALIDADO',
            'sesion': sesion_certificada,
            'n_vehiculos': len(sesion_certificada.ensayos_experimentales)
        }
    except ValidationError as e:
        errores = e.errors()
        return {
            'estado': 'RECHAZADO',
            'errores': [
                {
                    'campo': ' -> '.join(str(x) for x in err['loc']),
                    'mensaje': err['msg'],
                    'tipo': err['type']
                }
                for err in errores
            ]
        }

# 4. Procesamiento de las sesiones simuladas
print("\\n" + "="*60)
print("RESULTADOS DE VALIDACIÓN JERÁRQUICA")
print("="*60)

for sesion_data in sesiones_simuladas:
    resultado = procesar_sesion_experimento(sesion_data)
    print(f"\\n📋 Sesión: {sesion_data['id_sesion_laboratorio']}")
    
    if resultado['estado'] == 'VALIDADO':
        print(f"   ✅ VALIDADA")
        print(f"   Vehículos procesados: {resultado['n_vehiculos']}")
    else:
        print(f"   ❌ RECHAZADA")
        for error in resultado['errores']:
            print(f"   • Campo: {error['campo']}")
            print(f"     Error: {error['mensaje'][:60]}...")`} />

                                                    de forma recursiva, descendiendo por el árbol de datos para verificar cada supuesto

                                                    2 vehículos, violando el requisito de mínimo 3 unidades para estimar la varianza

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">3.4 Caso Aplicado:

                                            <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                                <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Contexto del Problema
                                                </h4>
                                                <p className="text-gray-700 leading-relaxed mb-5">Inspirado en el caso de estudio de Dhada y
                                                    Labra Montes (2024), donde se analizan tasas de admisión hospitalaria por COVID-19
                                                    en siete regiones del NHS en Inglaterra, el siguiente ejemplo implementa un sistema
                                                    de validación jerárquica de datos epidemiológicos. La estructura de tres niveles
                                                    refleja la organización natural del sistema de salud: <strong>Observaciones
                                                        individuales</strong> (admisiones diarias) anidadas en <strong>Hospitales</strong>, anidados a su vez en <strong>Regiones
                                                        sanitarias</strong>.

from typing import List, Optional
from datetime import date
from enum import Enum
import numpy as np

# ══════════════════════════════════════════════════════════════
# NIVEL 1 (MICRO): Observación Epidemiológica Individual
# Equivalente: Unidad observacional en diseño de parcelas divididas
# Referencia: Dhada & Labra Montes (2024) - Admisiones diarias
# ══════════════════════════════════════════════════════════════

class VariantePatogeno(str, Enum):
    """Variantes epidemiológicas reconocidas por la OMS."""
    ALPHA = "alpha"
    DELTA = "delta"
    OMICRON = "omicron"
    ORIGINAL = "original"

class AdmisionDiaria(BaseModel):
    """
    Nivel 1 (Micro): Registro individual de admisiones hospitalarias.
    Análogo a la observación unitaria Y_ijk en el modelo jerárquico.
    """
    fecha: date
    admisiones_nuevas: int = Field(
        ..., ge=0,
        description="Número de admisiones nuevas (no puede ser negativo)"
    )
    admisiones_uci: int = Field(
        default=0, ge=0,
        description="Admisiones a UCI (subconjunto de admisiones nuevas)"
    )
    tasa_ocupacion_camas: float = Field(
        ..., ge=0.0, le=1.0,
        description="Proporción de camas ocupadas [0, 1]"
    )
    variante_dominante: VariantePatogeno = Field(
        default=VariantePatogeno.OMICRON,
        description="Variante predominante del patógeno"
    )

    @model_validator(mode='after')
    def validar_coherencia_admisiones(self):
        """
        Las admisiones UCI no pueden superar las admisiones totales.
        Restricción lógica: UCI ⊆ Admisiones Nuevas.
        """
        if self.admisiones_uci > self.admisiones_nuevas:
            raise ValueError(
                f"Incoherencia lógica: admisiones UCI ({self.admisiones_uci}) "
                f"no puede superar admisiones totales ({self.admisiones_nuevas})"
            )
        return self


# ══════════════════════════════════════════════════════════════
# NIVEL 2 (MESO): Hospital dentro de una Región NHS
# Equivalente: Sub-parcela en diseño de parcelas divididas
# ══════════════════════════════════════════════════════════════

class HospitalNHS(BaseModel):
    """
    Nivel 2 (Meso): Hospital individual perteneciente a una región.
    Contiene series temporales de admisiones diarias.
    Análogo al efecto β_j(i) anidado en el bloque i.
    """
    codigo_hospital: str = Field(
        pattern=r'^NHS-[A-Z]{2,4}-\\d{3}$',
        description="Código estandarizado: NHS-XXXX-000"
    )
    nombre_hospital: str = Field(min_length=3)
    capacidad_camas: int = Field(
        ..., gt=0, le=5000,
        description="Capacidad total de camas del hospital"
    )
    registros_diarios: List[AdmisionDiaria] = Field(
        ..., min_length=7,
        description="Mínimo 7 días de datos para estimación polinomial"
    )

    @field_validator('registros_diarios')
    @classmethod
    def validar_serie_temporal(
        cls, registros: List[AdmisionDiaria]
    ) -> List[AdmisionDiaria]:
        """
        Verifica que la serie temporal sea cronológicamente consistente.
        En modelado jerárquico (Dhada & Labra Montes, 2024),
        se usaron polinomios de tercer grado para modelar segmentos
        temporales, requiriendo datos ordenados y sin duplicados.
        """
        fechas = [r.fecha for r in registros]
        if len(set(fechas)) != len(fechas):
            raise ValueError(
                "Fechas duplicadas detectadas en la serie temporal. "
                "Cada registro debe corresponder a un día único."
            )
        if fechas != sorted(fechas):
            raise ValueError(
                "La serie temporal debe estar ordenada cronológicamente "
                "para permitir ajuste polinomial secuencial."
            )
        return registros


# ══════════════════════════════════════════════════════════════
# NIVEL 3 (MACRO): Región Sanitaria del NHS
# Equivalente: Parcela entera (Whole-Plot) / Bloque experimental
# Referencia: 7 regiones NHS analizadas por Dhada & Labra Montes
# ══════════════════════════════════════════════════════════════

class RegionNHS(BaseModel):
    """
    Nivel 3 (Macro): Región sanitaria que contiene múltiples hospitales.
    Análogo al efecto α_i del nivel superior en Y_ijk = μ + α_i + β_j(i) + ε_k(ij)

    En el modelo jerárquico de Dhada & Labra Montes (2024), cada región
    NHS comparte parámetros de una distribución Gaussiana de nivel superior,
    implementando el concepto de 'borrowing strength'.
    """
    codigo_region: str = Field(
        pattern=r'^REG-[A-Z]{2,6}$',
        description="Código de región: REG-XXXXXX"
    )
    nombre_region: str = Field(min_length=3)
    poblacion_total: int = Field(
        ..., gt=0,
        description="Población total de la región para normalización"
    )
    hospitales: List[HospitalNHS] = Field(
        ..., min_length=2,
        description="Mínimo 2 hospitales para estimar varianza intra-región"
    )
    es_datos_escasos: bool = Field(
        default=False,
        description="Indica si la región tiene datos limitados (sparse data)"
    )

    @model_validator(mode='after')
    def validar_estructura_regional(self):
        """
        Validaciones a nivel macro que verifican la coherencia
        del bloque experimental completo.
        """
        # Verificar unicidad de códigos hospitalarios
        codigos = [h.codigo_hospital for h in self.hospitales]
        if len(set(codigos)) != len(codigos):
            raise ValueError(
                "Códigos hospitalarios duplicados en la región. "
                "Cada hospital debe tener un identificador único."
            )

        # Calcular total de observaciones para Power Analysis
        total_obs = sum(
            len(h.registros_diarios) for h in self.hospitales
        )
        if total_obs < 30:
            raise ValueError(
                f"Insuficientes observaciones regionales ({total_obs}). "
                f"Se requieren mínimo 30 para estimación robusta del ICC."
            )

        return self

    def calcular_tasa_normalizada(self) -> float:
        """
        Calcula la tasa de admisión normalizada por población,
        como en la Figura 2 de Dhada & Labra Montes (2024).
        """
        total_admisiones = sum(
            r.admisiones_nuevas
            for h in self.hospitales
            for r in h.registros_diarios
        )
        return (total_admisiones / self.poblacion_total) * 100_000


# ══════════════════════════════════════════════════════════════
# NIVEL 4 (SUPER-MACRO): Sistema Nacional de Salud Completo
# Encapsula todas las regiones para análisis jerárquico global
# ══════════════════════════════════════════════════════════════

class SistemaNacionalSalud(BaseModel):
    """
    Nivel Superior: Contenedor de todas las regiones sanitarias.
    Permite comparaciones inter-regionales y la implementación
    del 'borrowing strength' descrito en el artículo.
    """
    pais: str = Field(default="England")
    fecha_corte: date
    regiones: List[RegionNHS] = Field(
        ..., min_length=2,
        description="Mínimo 2 regiones para modelo jerárquico"
    )

    @model_validator(mode='after')
    def validar_sistema_completo(self):
        """
        Validaciones sistémicas para garantizar que el dataset
        cumple los requisitos del modelado jerárquico multinivel.
        """
        # Verificar unicidad de regiones
        codigos_region = [r.codigo_region for r in self.regiones]
        if len(set(codigos_region)) != len(codigos_region):
            raise ValueError("Regiones duplicadas en el sistema.")

        # Alertar sobre regiones con datos escasos
        regiones_escasas = [
            r.nombre_region for r in self.regiones if r.es_datos_escasos
        ]
        if regiones_escasas:
            print(
                f"⚠ Regiones con datos escasos detectadas: "
                f"{regiones_escasas}. El modelo jerárquico aplicará "
                f"'borrowing strength' desde regiones con datos completos."
            )

        return self`} />

                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">4.1.2 Diferenciación entre
                                                Errores HTTP 400 y HTTP 422</h4>
                                            <table
                                                className="min-w-full divide-y divide-gray-200 my-8 shadow-sm border border-gray-200 rounded-lg overflow-hidden block md:table overflow-x-auto">
                                                <thead className="bg-gray-100">
                                                    <tr>
                                                        <th
                                                            className="px-6 py-4 text-left text-xs font-extrabold text-gray-700 uppercase tracking-wider">
                                                            Código</th>
                                                        <th
                                                            className="px-6 py-4 text-left text-xs font-extrabold text-gray-700 uppercase tracking-wider">
                                                            Categoría</th>
                                                        <th
                                                            className="px-6 py-4 text-left text-xs font-extrabold text-gray-700 uppercase tracking-wider">
                                                            Descripción Técnica</th>
                                                        <th
                                                            className="px-6 py-4 text-left text-xs font-extrabold text-gray-700 uppercase tracking-wider">
                                                            Equivalente Metodológico</th>
                                                    </tr>
                                                </thead>
                                                <tbody className="bg-white divide-y divide-gray-200">
                                                    <tr>
                                                        <td className="px-6 py-4 text-sm text-gray-800"><strong>HTTP 400</strong><br />(Bad
                                                            Request)</td>
                                                        <td className="px-6 py-4 text-sm text-gray-800">Fallo Sintáctico Estructural</td>
                                                        <td className="px-6 py-4 text-sm text-gray-800">El motor de ingestión detecta daños
                                                            lógicos severos: ausencia de comilla de cierre en JSON, fragmentación del
                                                            paquete en tránsito, texto truncado antes de cargar a RAM.</td>
                                                        <td className="px-6 py-4 text-sm text-gray-800">Ficha física de paciente destruida,
                                                            incinerada o desintegrada; pérdida total de un bloque de data empírica.</td>
                                                    </tr>
                                                    <tr>
                                                        <td className="px-6 py-4 text-sm text-gray-800"><strong>HTTP
                                                                422</strong><br />(Unprocessable Entity)</td>
                                                        <td className="px-6 py-4 text-sm text-gray-800">Fallo Semántico de Índice</td>
                                                        <td className="px-6 py-4 text-sm text-gray-800">El parseo crudo del JSON finaliza
                                                            exitosamente, pero los validadores paramétricos detectan violaciones de
                                                            dominio (ej. edad = 200 años, valor fuera de rango permitido).</td>
                                                        <td className="px-6 py-4 text-sm text-gray-800">Sujeto que no cumple estrictamente
                                                            con los criterios de inclusión protocolar; requiere rechazo formal
                                                            documentado.</td>
                                                    </tr>
                                                    <tr>
                                                        <td className="px-6 py-4 text-sm text-gray-800"><strong>HTTP
                                                                409</strong><br />(Conflict)</td>
                                                        <td className="px-6 py-4 text-sm text-gray-800">Anomalía de Estado Causal</td>
                                                        <td className="px-6 py-4 text-sm text-gray-800">El sistema detecta duplicidad de
                                                            llave primaria, forzando retroceso (rollback) del commit.</td>
                                                        <td className="px-6 py-4 text-sm text-gray-800">Doble conteo; el sujeto ya fue
                                                            reclutado previamente y asignado a un grupo poblacional.</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">4.1.3 Estructura del Objeto
                                                ValidationError</h4>
                                            <p className="text-gray-700 leading-relaxed mb-5">Cuando Pydantic detecta una violación de
                                                validación, genera un objeto ValidationError que transporta metadatos forenses sumamente
                                                precisos:</p>
                                            <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                                <strong>Estructura 4.1:</strong> Campos del objeto ValidationError<br /><br />
                                                ValidationError.errors() → List[Dict]<br />
                                                Cada diccionario contiene:<br />
                                                • <strong>loc</strong>: Tupla con la ruta del campo fallido (ej. ['ensayos', 2,
                                                'cilindros'])<br />
                                                • <strong>msg</strong>: Mensaje descriptivo de la violación<br />
                                                • <strong>type</strong>: Clasificador del tipo de error (ej. 'value_error',
                                                'type_error')<br />
                                                • <strong>input</strong>: Valor que causó el fallo (opcional)<br />
                                            </div>
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">4.1.4 Importancia
                                                Metodológica del Registro de Exclusiones</h4>
                                            <p className="text-gray-700 leading-relaxed mb-5">El registro granular de la razón por la cual
                                                un sujeto muestral fue excluido del pipeline es existencialmente crucial para cumplir
                                                con normas internacionales de publicación como las guías CONSORT o la declaración STROBE
                                                en epidemiología. Sin un registro sistemático de las exclusiones, es imposible reportar
                                                el flujo completo de participantes a través del estudio, lo cual constituye mala praxis
                                                estadística.</p>
                                        </section>

from typing import Literal, List, Dict, Any
from typing_extensions import Annotated
from datetime import datetime

# 1. Definición del Modelo Paramétrico
class ObservacionDemografica(BaseModel):
    """
    Modelo de validación para observaciones demográficas continuas.
    Incluye restricciones axiomáticas basadas en límites biológicos
    y lógicos del dominio poblacional.
    """
    id_sujeto: int = Field(
        ..., 
        description="Llave primaria única y anónima del participante"
    )
    
    edad_biologica: Annotated[int, Field(
        ge=0, le=120,
        description="Edad fisiológicamente comprobable en especie humana"
    )]
    
    ingreso_anual_usd: Annotated[float, Field(
        ge=0.0,
        description="Flujo de ingresos brutos anualizados en USD (no negativo)"
    )]
    
    nivel_educativo: Literal['primario', 'secundario', 'universitario', 'posgrado']

# 2. Clase para gestionar la bitácora de auditoría
class BitacoraAuditoria:
    """
    Sistema de registro de exclusiones para cumplimiento
    con protocolos CONSORT/STROBE.
    """
    def __init__(self):
        self.exclusiones: List[Dict[str, Any]] = []
        self.validaciones_exitosas: List[int] = []
    
    def registrar_exclusion(
        self, 
        payload_original: dict, 
        errores: list,
        timestamp: str
    ):
        """Registra una exclusión con metadatos forenses completos."""
        for error in errores:
            registro = {
                'timestamp': timestamp,
                'id_sujeto': payload_original.get('id_sujeto', 'DESCONOCIDO'),
                'campo_afectado': ' -> '.join(str(x) for x in error['loc']),
                'tipo_error': error['type'],
                'mensaje': error['msg'],
                'valor_input': error.get('input', 'N/A'),
                'payload_completo': payload_original
            }
            self.exclusiones.append(registro)
    
    def registrar_exito(self, id_sujeto: int):
        self.validaciones_exitosas.append(id_sujeto)
    
    def generar_reporte_consolidado(self) -> dict:
        """Genera resumen estadístico de las exclusiones."""
        if not self.exclusiones:
            return {'total_exclusiones': 0, 'tasa_exclusion': 0.0}
        
        # Conteo por tipo de error
        conteo_tipos = {}
        conteo_campos = {}
        for exc in self.exclusiones:
            tipo = exc['tipo_error']
            campo = exc['campo_afectado']
            conteo_tipos[tipo] = conteo_tipos.get(tipo, 0) + 1
            conteo_campos[campo] = conteo_campos.get(campo, 0) + 1
        
        total_procesados = len(self.validaciones_exitosas) + len(set(
            e['id_sujeto'] for e in self.exclusiones
        ))
        
        return {
            'total_procesados': total_procesados,
            'validaciones_exitosas': len(self.validaciones_exitosas),
            'total_exclusiones': len(self.exclusiones),
            'tasa_exclusion': len(self.exclusiones) / max(total_procesados, 1) * 100,
            'desglose_por_tipo_error': conteo_tipos,
            'desglose_por_campo': conteo_campos
        }

# 3. Función de procesamiento con captura forense
def procesar_lote_muestral(
    carga_cruda: List[Dict], 
    bitacora: BitacoraAuditoria
) -> List[ObservacionDemografica]:
    """
    Procesa un lote de observaciones demográficas con captura
    forense de errores y registro en bitácora de auditoría.
    """
    sujetos_validados = []
    
    for i, registro in enumerate(carga_cruda):
        timestamp = datetime.now().isoformat()
        
        try:
# Intento de validación
            sujeto = ObservacionDemografica.model_validate(registro)
            sujetos_validados.append(sujeto)
            bitacora.registrar_exito(sujeto.id_sujeto)
            
        except ValidationError as error_auditoria:
            # Captura y análisis forense del fallo
            errores = error_auditoria.errors()
            
            print(f"\\n⚠️ EXCLUSIÓN REGISTRADA - Sujeto ID: {registro.get('id_sujeto')}")
            for fallo in errores:
                campo = ' -> '.join(str(x) for x in fallo['loc'])
                print(f"   Campo: {campo}")
                print(f"   Tipo:  {fallo['type']}")
                print(f"   Msg:   {fallo['msg'][:60]}...")
            
            # Registrar en bitácora
            bitacora.registrar_exclusion(registro, errores, timestamp)
    
    return sujetos_validados

# 4. Ejecución del procesamiento
bitacora = BitacoraAuditoria()
sujetos_validos = procesar_lote_muestral(datos_demograficos_simulados, bitacora)

# 5. Generación de reporte consolidado
reporte = bitacora.generar_reporte_consolidado()

print("\\n" + "="*60)
print("📊 REPORTE CONSOLIDADO DE AUDITORÍA")
print("="*60)
print(f"Total procesados:        {reporte['total_procesados']}")
print(f"Validaciones exitosas:   {reporte['validaciones_exitosas']}")
print(f"Total exclusiones:       {reporte['total_exclusiones']}")
print(f"Tasa de exclusión:       {reporte['tasa_exclusion']:.1f}%")
print(f"\\nDesglose por tipo de error:")
for tipo, cuenta in reporte['desglose_por_tipo_error'].items():
    print(f"  • {tipo}: {cuenta}")
print(f"\\nDesglose por campo afectado:")
for campo, cuenta in reporte['desglose_por_campo'].items():
    print(f"  • {campo}: {cuenta}")`} />
