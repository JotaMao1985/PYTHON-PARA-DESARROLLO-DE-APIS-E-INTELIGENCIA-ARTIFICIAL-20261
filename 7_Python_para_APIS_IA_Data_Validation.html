                                            <p className="text-gray-700 leading-relaxed mb-5">La primera instancia pasa: <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">satisfaccion="4"</code> llegó como texto y quedó
                                                como el entero 4, y el código postal conserva su cero inicial. La segunda acumula siete
                                                errores, uno por campo, y Pydantic los devuelve todos a la vez.</p>
                                            <p className="text-gray-700 leading-relaxed mb-5">Que <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">"4"</code> pase a 4 es el modo laxo, el de defecto: convierte lo inequívoco (<code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">"4"</code>, <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">4.0</code> o <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">" 4 "</code> dan 4), rechaza lo que obligaría a adivinar (<code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">4.5</code>, <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">"4O"</code> (con la letra O), <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">"cuatro"</code>) y no corrige erratas. El modo estricto
                                                (<code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">ConfigDict(strict=True)</code> en el modelo o <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Field(strict=True)</code> en un campo) rechaza la conversión automática de tipos: con él, <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">"4"</code> deja de ser un entero válido. La sección 4 compara los dos modos.</p>
                                            <p className="text-gray-700 leading-relaxed mb-5">Fíjate ahora en <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">ingreso</code>.
                                                Un <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">float</code> de Pydantic acepta por defecto <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">NaN</code> e infinito, incluso si llegan como texto («NaN») o como el literal <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">NaN</code> dentro del JSON. Cualquier cota (<code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">ge</code>, <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">le</code>, <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">gt</code>, <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">lt</code>)
                                                rechaza el <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">NaN</code>,
                                                porque no cumple ninguna comparación; pero con sólo <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">ge=0</code> un infinito positivo pasa. Si la variable no los admite, dilo con <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">allow_inf_nan=False</code>,
                                                que rechaza los dos con «Input should be a finite number». Un matiz de FastAPI: si el <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">NaN</code> llega como literal del JSON (no es JSON estándar, aunque Python lo lea) y se rechaza, el
                                                manejador por defecto no puede escribirlo en el cuerpo del 422 y responde con un 500. La
                                                sección 6 lo resuelve en «Un 422 que se explica solo».</p>
                                            <p className="text-gray-700 leading-relaxed mb-5">Y en <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">peso_kg</code>: el <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">| None</code> admite el <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">null</code>; el <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">= None</code> permite que el campo no venga. Son dos cosas distintas: en Pydantic v2, un <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">float | None</code> sin valor por defecto es obligatorio —hay que mandarlo, aunque sea como <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">null</code>— y, si falta, da «Field required». En Pydantic v1 no era así.</p>
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Lo que añade description</h4>
                                            <p className="text-gray-700 leading-relaxed mb-5"><code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">description</code> no valida nada. Es el texto que acompaña al campo en el esquema JSON que FastAPI publica
                                                en <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">/docs</code> (semana 6), junto con las reglas de <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Field</code>,
                                                que ahí se llaman <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">minimum</code> y <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">maximum</code>.
                                                Es lo que el syllabus te pide esta semana como trabajo autónomo: añadir rangos lógicos y
                                                descripciones a los esquemas de tu proyecto, para que quien use tu API sepa qué mandar
                                                antes de equivocarse.</p>
                                            <CodeBlock title="Python" lang="python" code={`# Continúa el bloque anterior: usa su modelo Encuestado.

                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Anotar una función no es
                                                validar</h4>
                                            <p className="text-gray-700 leading-relaxed mb-5">La misma anotación dice cosas distintas según
                                                dónde la escribas. En la firma de una función es documentación: la lee mypy y Python la
                                                ignora al ejecutar. En un campo de un <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">BaseModel</code> es una comprobación que corre con cada dato:</p>
                                            <CodeBlock title="Python" lang="python" code={`# Continúa el bloque anterior: usa Likert, BaseModel y ValidationError.

# 1. La anotación en una función: nadie la comprueba al ejecutar
def media_likert(respuestas: list[Likert]) -> float:
    return sum(respuestas) / len(respuestas)


print(media_likert([4, 5, 9]))


# 2. La misma anotación en un modelo: se comprueba con cada dato
class Respuestas(BaseModel):
    valores: list[Likert]


try:
    Respuestas(valores=[4, 5, 9])
except ValidationError as e:
    err = e.errors()[0]
    print(err["loc"], "→", err["msg"])`} />
                                            <CodeBlock title="Salida" lang="text" code={`6.0
('valores', 2) → Input should be less than or equal to 5`} />
                                            <p className="text-gray-700 leading-relaxed mb-5">La función devuelve 6.0, una media imposible en una escala de 1 a 5, sin una
                                                queja, y mypy tampoco avisa: para él, <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Likert</code> es un <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">int</code> y las reglas de <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Field</code> no las lee. El modelo, con la misma anotación,
                                                rechaza el 9 y dice dónde está: la posición 2 de <code
                                                    className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">valores</code>. Por eso, en
                                                una API, lo que llega del cliente entra por un modelo, y lo que se calcula después
                                                trabaja con datos que ya pasaron el control.</p>

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">3.4 Ejemplo completo:
                                                anotación del conjunto mtcars</h3>
                                            <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                                <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Contexto del problema
                                                </h4>
                                                <p className="text-gray-700 leading-relaxed mb-5">El conjunto mtcars (<em>Motor Trend Car
                                                        Road Tests</em>) reúne 11 variables de diseño y rendimiento de 32 modelos de
                                                    automóvil de 1973–1974, publicadas por la revista <em>Motor Trend</em> en 1974
                                                    (Henderson y Velleman, 1981): millas por galón (mpg), cilindros (cyl), caballos de
                                                    fuerza (hp), peso (wt) o tipo de transmisión (am), entre otras. Son datos
                                                    observacionales, pruebas de una revista, no un experimento. El ejemplo escribe un
                                                    modelo de Pydantic para una fila y, al lado, una función anotada que ajusta una
                                                    regresión por mínimos cuadrados, para que compares las dos clases de
                                                    anotación.</p>
                                            </div>
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Generación de datos simulados
                                            </h4>
                                            <p className="text-gray-700 leading-relaxed mb-5">Los datos del bloque son simulados: tienen el
                                                nombre y un rango parecido al de cuatro variables de mtcars, pero se generan al azar y
                                                sin relación entre sí.</p>
                                            <CodeBlock title="Python" lang="python" code={`import numpy as np
from typing import Annotated, List, Optional
from pydantic import BaseModel, Field

# Datos simulados con algunas variables de mtcars (no son los datos reales)
np.random.seed(42)

# Muestra simulada de 10 vehículos
n_vehiculos = 10
datos_simulados = {
    'modelo': [f'Auto_{i}' for i in range(n_vehiculos)],
    'mpg': np.random.uniform(10.4, 33.9, n_vehiculos).round(1),
    'cyl': np.random.choice([4, 6, 8], n_vehiculos),
    'hp': np.random.randint(52, 335, n_vehiculos),
    'wt': np.random.uniform(1.5, 5.4, n_vehiculos).round(2)
}

print("Datos simulados generados:")
for clave, valores in datos_simulados.items():
    print(f"  {clave}: {valores[:5]}...")`} />
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Implementación paso a paso
                                            </h4>
                                            <CodeBlock title="Python" lang="python" code={`# Continúa el bloque anterior: reutiliza sus imports de numpy, pydantic y typing.
# 1. Alias de tipo para la matriz de diseño (documenta; no valida)
import numpy.typing as npt

MatrizDisenoCovariables = npt.NDArray[np.float64]

# 2. Modelo de Pydantic para una fila del conjunto de datos
class EspecificacionCoche(BaseModel):
    """
    Modelo de validación para una fila del conjunto mtcars.
    Cada campo es una variable del conjunto de datos.
    """
    # Nombre del modelo (puede faltar)
    modelo_vehiculo: Optional[str] = Field(default=None,
                                           description="Nombre del modelo de automóvil")

    # Caballos de fuerza: acepta int o float (unión de tipos), siempre positivo
    caballos_fuerza_hp: int | float = Field(..., gt=0,
                                            description="Potencia bruta del motor, en hp")

    # Campo inventado para ilustrar List[float]: en mtcars, qsec es un único tiempo
    qsec_mediciones_repetidas: List[float] = Field(
        default_factory=list,
        description="Tiempos en el cuarto de milla, en segundos"
    )

    # Variable indicadora con su rango dentro de la anotación
    transmision_am_dummy: Annotated[int, Field(ge=0, le=1,
                                               description="0 = automática, 1 = manual")]

# 3. Función con firma tipada para el ajuste por mínimos cuadrados
def ajustar_modelo_lineal(
    X: MatrizDisenoCovariables,
    y: npt.NDArray[np.float64]
) -> dict:
    """
    Declara (no impone) una matriz de diseño float64: Python no comprueba
    las anotaciones al ejecutar.
    Calcula estimadores básicos de regresión lineal.
    """
    n, p = X.shape

    # Estimador MCO: beta_hat = (X'X)^(-1) X'y, resuelto sin invertir X'X
    beta_hat = np.linalg.solve(X.T @ X, X.T @ y)

    # Residuales y estimación de varianza
    y_pred = X @ beta_hat
    residuales = y - y_pred
    sigma2_hat = np.sum(residuales**2) / (n - p)

    return {
        'coeficientes': beta_hat,
        'varianza_residual': sigma2_hat,
        'n_observaciones': n,
        'p_parametros': p
    }

# 4. Instanciación y validación de una observación
coche_valido = EspecificacionCoche(
    modelo_vehiculo="Mazda RX4",
    caballos_fuerza_hp=110.0,
    qsec_mediciones_repetidas=[16.46, 16.50, 16.48],
    transmision_am_dummy=1
)

print(f"✅ Vehículo validado: {coche_valido.modelo_vehiculo}")
print(f"   HP: {coche_valido.caballos_fuerza_hp}")
print(f"   Transmisión: {'Manual' if coche_valido.transmision_am_dummy else 'Automático'}")

# 5. Ajuste de mpg sobre hp y wt con los datos simulados. Ojo: mpg se simuló
#    sin relación con hp ni wt, así que los coeficientes verdaderos son 0 y lo
#    estimado es ruido de una muestra de 10.
X = np.column_stack([np.ones(n_vehiculos), datos_simulados['hp'], datos_simulados['wt']])
ajuste = ajustar_modelo_lineal(X, datos_simulados['mpg'])
gl = ajuste['n_observaciones'] - ajuste['p_parametros']
print(f"   beta_hat = {np.round(ajuste['coeficientes'], 3)}")
print(f"   sigma2_hat = {ajuste['varianza_residual']:.2f} con {gl} g.l.")`} />

   HP: 110.0
   Transmisión: Manual
   beta_hat = [13.075 -0.023  3.9  ]
   sigma2_hat = 35.22 con 7 g.l.`} />
                                            <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                                <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Interpretación de
                                                    resultados</h4>
                                                <p className="text-gray-700 leading-relaxed mb-5">El modelo <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">EspecificacionCoche</code> se valida al construirse: <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">modelo_vehiculo</code> puede faltar (tiene <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">default=None</code>), <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">caballos_fuerza_hp</code> acepta un entero o un decimal, pero positivo, y <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">transmision_am_dummy</code> sólo admite 0 o 1. <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">qsec_mediciones_repetidas</code> es un campo inventado para mostrar <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">List[float]</code>: en mtcars, qsec es un único tiempo.</p>
                                                <p className="text-gray-700 leading-relaxed mb-5">La función <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">ajustar_modelo_lineal</code> es otra cosa. Su anotación <code

                                                    comprueba nada (con una matriz de enteros, NumPy convierte y calcula igual), y mypy no
                                                    ve dimensiones, así que no avisará si <code

                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">float</code> es binario de 64 bits (IEEE 754): <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">0.1 + 0.2</code> no da exactamente <code
                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">0.3</code>.

                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Decimal</code>,

                                                        className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">float</code> es lo correcto: NumPy, SciPy y statsmodels trabajan con él. Los p-valores diminutos

                                                        <td className="px-6 py-4 text-sm text-gray-800"><strong>Estricto</strong> (<em>strict</em>)</td>
                                                        <td className="px-6 py-4 text-sm text-gray-800">Rechaza la conversión automática de
                                                            tipos. Sólo admite conversiones sin pérdida (un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">int</code> en un campo <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">float</code>) y, desde JSON, las que el formato impone (una fecha llega
                                                            como texto). Se activa con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">model_config = ConfigDict(strict=True)</code> o, para un campo, con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field(strict=True)</code>.</td>
                                                        <td className="px-6 py-4 text-sm text-gray-800"><code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"4"</code> → rechazo. <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">4</code> en un campo <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">float</code> → 4.0.</td>
                                                        <td className="px-6 py-4 text-sm text-gray-800">El protocolo que devuelve todo
                                                            formulario que no venga en el formato pactado, aunque se entienda.</td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                            <p className="text-gray-700 leading-relaxed mb-5">Ninguno de los dos modos imputa: un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">None</code> en un campo <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">int</code> se rechaza en los dos (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">int_type</code>).</p>
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">4.1.3 Antes o después de la conversión</h4>
                                            <p className="text-gray-700 leading-relaxed mb-5">Un validador puede ejecutarse <em>antes</em> (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">mode='before'</code>) o <em>después</em> (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">mode='after'</code>, el modo por defecto) de la conversión de tipos.
                                                Hay otros dos modos, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">wrap</code> y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">plain</code>, que este curso no usa.</p>
                                            <Box type="info" label="Ecuación 4.1">Recorrido de un valor<br /><br />
                                                $$ \text&#123;Dato crudo&#125; \xrightarrow&#123;\text&#123;before&#125;&#125; \text&#123;Conversión de tipos y Field&#125;
                                                \xrightarrow&#123;\text&#123;after&#125;&#125; \text&#123;Valor validado&#125; $$
                                            </Box>
                                            <ul className="list-disc pl-6 space-y-2 mb-6 text-gray-700">
                                                <li className="leading-relaxed"><strong>mode='before':</strong> recibe el dato crudo, sin convertir. Sirve
                                                    para normalizar formatos, extraer subcadenas con expresiones regulares o traducir
                                                    marcas de faltante.</li>
                                                <li className="leading-relaxed"><strong>mode='after':</strong> recibe el dato ya convertido al tipo
                                                    declarado. Sirve para comprobar reglas: un rango que depende de algo, un conjunto de
                                                    niveles, una coherencia.</li>
                                            </ul>
                                            <p className="text-gray-700 leading-relaxed mb-5">Dos detalles que la semana 4 no contó. Las restricciones de <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field</code> (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ge</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">gt</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">le</code>…) se comprueban en la conversión, antes
                                                de cualquier validador <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">after</code>: si <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ge=0</code> falla, los <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">after</code> ni se ejecutan. Y si un campo tiene varios validadores, los <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">before</code> se ejecutan
                                                en orden inverso al de definición y los <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">after</code>, en el orden en que los
                                                escribiste.</p>
                                            <p className="text-gray-700 leading-relaxed mb-5">El ejemplo de la semana 4 usaba <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">before</code> para la coma decimal. Éste
                                                añade las marcas de faltante y una precaución que en Colombia es imprescindible: declarar
                                                la convención numérica de cada fuente antes de limpiar.</p>
                                            <CodeBlock title="Python" lang="python" code={`import re
from typing import Optional

from pydantic import BaseModel, Field, ValidationError, field_validator

# Esta fuente declara su formato: coma de miles y punto decimal ("1,234.56").
MILES_CON_COMA = re.compile(r"\\d{1,3}(,\\d{3})+(\\.\\d+)?")
MARCAS_DE_FALTANTE = {"", "NA", "N/A", "-"}


class RegistroIngreso(BaseModel):
    ingreso_mensual: Optional[float] = Field(default=None, ge=0)

    @field_validator("ingreso_mensual", mode="before")
    @classmethod
    def normalizar_formato(cls, v):
        # mode="before": recibe el dato crudo (str, int, None...), sin convertir
        if isinstance(v, str):
            v = v.strip()
            if v.upper() in MARCAS_DE_FALTANTE:
                return None  # faltante declarado: None, nunca un 0
            if MILES_CON_COMA.fullmatch(v):
                return v.replace(",", "")  # "1,234.56" -> "1234.56"
        return v  # lo demás lo decide la conversión de tipos


for crudo in ("1,234.56", "NA", "12,5", "-25", "mil"):
    try:
        valor = RegistroIngreso(ingreso_mensual=crudo).ingreso_mensual
        print(f"{crudo!r:>10} -> {valor}")
    except ValidationError as e:
        print(f"{crudo!r:>10} -> rechazado [{e.errors()[0]['type']}]")`} />
                                            <CodeBlock title="Salida" lang="text" code={`'1,234.56' -> 1234.56
      'NA' -> None
    '12,5' -> rechazado [float_parsing]
     '-25' -> rechazado [greater_than_equal]
     'mil' -> rechazado [float_parsing]`} />
                                            <p className="text-gray-700 leading-relaxed mb-5">Fíjate en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"12,5"</code>: en Colombia es doce coma cinco, y una regla que
                                                borrara todas las comas lo convertiría en 125 (y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"1.234,56"</code> en 1.23456) sin
                                                avisar. Esta regla sólo quita comas colocadas cada tres cifras, que es el formato que esta
                                                fuente declara; <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"12,5"</code> no encaja, llega tal cual a la conversión y se rechaza.
                                                Si tu fuente usa la convención colombiana, la regla es otra, como la de la semana 4; lo que
                                                no se puede es adivinar. El <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"-25"</code> tampoco lo toca el validador: lo rechaza <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ge=0</code> después de la conversión. Un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">before</code> limpia el formato; no
                                                arregla valores.</p>
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">4.1.4 Rendimiento: validar una vez, en la entrada</h4>
                                            <p className="text-gray-700 leading-relaxed mb-5">El núcleo de Pydantic v2, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">pydantic-core</code>, está escrito en Rust y
                                                valida bastante más rápido que Pydantic v1: su propio README habla de unas 17 veces en su
                                                banco de pruebas. En una API eso significa que validar cada petición cuesta poco frente al
                                                resto del trabajo. No lo conviertas por eso en una herramienta de cálculo: se valida una
                                                vez, en la entrada. Las réplicas de un bootstrap, los pliegues de una validación cruzada o
                                                las extracciones de un MCMC se generan a partir de datos que ya pasaron el control, y
                                                validarlos de nuevo sólo gasta tiempo.</p>
                                            <Accordion items={[{ titulo: "Para profundizar: el bootstrap, el MCMC y por qué no se validan sus réplicas", contenido: (<><div
                                                    className="mt-4 text-sm text-amber-900 border-t border-amber-200 pt-4 leading-relaxed space-y-3">
                                                    <p>El <strong>bootstrap</strong> (Efron, 1979) aproxima la distribución muestral de un
                                                        estadístico remuestreando la muestra observada: se extraen B muestras del mismo
                                                        tamaño n, <strong>con reemplazo</strong>, se calcula el estadístico en cada una y la
                                                        dispersión de esos B valores estima su error estándar o sus intervalos de
                                                        confianza, sin suponer una distribución teórica.</p>
                                                    <p>El <strong>MCMC</strong> (Monte Carlo por cadenas de Markov) se usa en inferencia
                                                        bayesiana cuando la distribución a posteriori sólo se conoce salvo una constante de
                                                        normalización que no se puede calcular. Construye una cadena de Markov cuya
                                                        distribución estacionaria es la a posteriori; las extracciones de la cadena, que
                                                        son dependientes entre sí, aproximan esa distribución.</p>
                                                    <p>En los dos casos los valores los genera tu propio código a partir de datos que ya
                                                        pasaron la validación. Volver a validarlos no detecta nada nuevo: la validación va
                                                        en la entrada de la API, una vez por dato.</p>
                                                </div></>) }]} />

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">4.3 Ejemplo completo: validación del conjunto iris</h3>
                                            <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                                <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Contexto del problema</h4>
                                                <p className="text-gray-700 leading-relaxed mb-5">El conjunto iris —recogido por Edgar Anderson y popularizado por Ronald
                                                    Fisher en 1936— tiene 150 flores de tres especies y cuatro medidas en centímetros:
                                                    largo y ancho del sépalo y del pétalo. Ninguna de esas medidas puede ser cero ni
                                                    negativa, y la especie sólo puede ser una de tres. El ejemplo simula 15 observaciones
                                                    con tres errores sembrados y escribe dos validadores de campo para atraparlos. Un
                                                    decorador mide cuánto tarda el lote.</p>
                                                <p className="text-gray-700 leading-relaxed mb-5">La positividad podría escribirse con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field(gt=0)</code>, como en la
                                                    semana 4, y quedaría además publicada en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">/docs</code>; la especie, con un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Literal</code>, como viste en la sección 3 («Anotaciones que Pydantic sí
                                                    comprueba»). Aquí se escriben como validadores para poder devolver un mensaje propio,
                                                    que diga qué se sospecha, y para normalizar la especie («Setosa » → «setosa»). Ése es
                                                    el criterio: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field</code> para los rangos, y un validador cuando la regla o el
                                                    mensaje no caben en un rango.</p>

                                            <CodeBlock title="Python" lang="python" code={`import numpy as np

# 15 observaciones con el formato de iris y tres errores sembrados a propósito
np.random.seed(42)

n_muestras = 15
especies = ['setosa', 'versicolor', 'virginica']

datos_iris_simulados = []
for i in range(n_muestras):
    observacion = {
        'especie_taxonomica': np.random.choice(especies),
        'sepal_length': np.random.uniform(4.3, 7.9),
        'sepal_width': np.random.uniform(2.0, 4.4),
        'petal_length': np.random.uniform(1.0, 6.9),
        'petal_width': np.random.uniform(0.1, 2.5),
    }

    if i == 3:   # imposible: una longitud negativa
        observacion['sepal_length'] = -5.1
    if i == 7:   # de escala: 85 cm parece un dato en milímetros
        observacion['petal_length'] = 85.0
    if i == 11:  # un nivel que no existe en el factor
        observacion['especie_taxonomica'] = 'rosa'

    datos_iris_simulados.append(observacion)

print(f"Simuladas {n_muestras} observaciones con errores en los índices 3, 7 y 11")`} />
                                            <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Implementación paso a paso</h4>
                                            <CodeBlock title="Python" lang="python" code={`# Continúa el bloque anterior: consume su lista \`datos_iris_simulados\`.
import functools
import logging
import math
import time
from typing import ClassVar

from pydantic import BaseModel, ValidationError, field_validator

# logger en lugar de print: cada mensaje sale con su nivel (INFO, WARNING)
logging.basicConfig(level=logging.INFO, format='%(levelname)s - %(message)s')
logger = logging.getLogger(__name__)


# 1. Decorador que cronometra la validación del lote
def cronometrar(func):
    """Registra cuánto tarda en ejecutarse la función decorada."""
    @functools.wraps(func)
    def envoltorio(*args, **kwargs):
        inicio = time.perf_counter()
        try:
            return func(*args, **kwargs)
        finally:
            duracion = time.perf_counter() - inicio
            logger.info(f"'{func.__name__}' tardó {duracion:.5f} s")
    return envoltorio


# 2. Modelo de una observación de iris
class ObservacionIris(BaseModel):
    """Una observación de iris: la especie y cuatro medidas en cm."""
    especie_taxonomica: str   # factor con tres niveles
    sepal_length: float       # las cuatro medidas, en centímetros
    sepal_width: float
    petal_length: float
    petal_width: float

    ESPECIES_PERMITIDAS: ClassVar[tuple[str, ...]] = ('setosa', 'versicolor', 'virginica')

    @field_validator('especie_taxonomica')
    @classmethod
    def validar_especie(cls, valor: str) -> str:
        """Evita niveles espurios del factor (p. ej. 'rosa'), que en un
        ANOVA añadirían un grupo de una sola observación."""
        valor_limpio = valor.strip().lower()
        if valor_limpio not in cls.ESPECIES_PERMITIDAS:
            raise ValueError(
                f"Especie no reconocida: '{valor}'. "
                f"Valores admitidos: {', '.join(cls.ESPECIES_PERMITIDAS)}."
            )
        return valor_limpio

    @field_validator('sepal_length', 'sepal_width', 'petal_length', 'petal_width')
    @classmethod
    def validar_medida(cls, valor: float) -> float:
        """Comprueba que la medida sea finita, positiva y de una escala plausible."""
        # Rango lógico: NaN e infinito no son medidas, y una longitud no es <= 0
        if not math.isfinite(valor) or valor <= 0:
            raise ValueError(
                f"La medida debe ser un número finito mayor que 0 cm; se recibió {valor}."
            )
        # Heurística de escala: en la muestra de Fisher ninguna medida pasa de 7,9 cm
        if valor > 10.0:
            raise ValueError(
                f"Medida de {valor} cm, fuera de lo plausible para iris "
                "(ninguna flor de la muestra de Fisher pasa de 7,9 cm); "
                "¿se registró en milímetros?"
            )
        return valor


# 3. Validación del lote: separa las válidas de las rechazadas, con su motivo
@cronometrar
def validar_lote(lista_datos: list[dict]) -> dict:
    validas, rechazadas = [], []
    for i, dato in enumerate(lista_datos):
        try:
            validas.append(ObservacionIris(**dato))
        except ValidationError as error:
            motivos = [(e['loc'][0], e['msg']) for e in error.errors()]
            rechazadas.append({'indice': i, 'dato_original': dato, 'motivos': motivos})
            for campo, mensaje in motivos:
                logger.warning(f"Rechazo índice {i}, campo {campo}: {mensaje}")
    return {
        'validas': validas,
        'rechazadas': rechazadas,
        'tasa_exclusion': len(rechazadas) / len(lista_datos) * 100,
    }


# 4. Ejecución
resultado = validar_lote(datos_iris_simulados)
logger.info(f"Aceptadas: {len(resultado['validas'])}")
logger.info(f"Rechazadas: {len(resultado['rechazadas'])}")
logger.info(f"Tasa de exclusión: {resultado['tasa_exclusion']:.1f} %")`} />

                                                <p className="text-gray-700 leading-relaxed mb-5"><strong>Qué ve quien llama.</strong> Si este modelo es el cuerpo de un
                                                    endpoint de FastAPI y un validador lanza <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ValueError</code>, el cliente recibe un
                                                    422 con una entrada como ésta: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">&#123;"type": "value_error", "loc": ["body",
                                                    "sepal_length"], "msg": "Value error, La medida debe ser un número finito mayor que 0
                                                    cm; se recibió -5.1.", "input": -5.1, "ctx": &#123;"error": &#123;&#125;&#125;&#125;</code>. <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">loc</code> dice qué campo falló y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">msg</code> lleva tu mensaje, precedido de «Value error, ». <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ctx</code> sale vacío porque FastAPI no sabe pasar la excepción a JSON (en
                                                    «Rango lógico y rango estadístico» verás cómo poner ahí los números de la regla). Es la
                                                    única explicación que va a recibir quien consume tu API, así que escríbela para esa
                                                    persona: qué campo, qué valor llegó y qué se esperaba. Un aviso: si el <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">NaN</code> llega en el JSON (el lector de JSON de FastAPI acepta ese literal), el
                                                    validador lo rechaza, pero el manejador por defecto no puede escribir <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"input": NaN</code> en la respuesta y devuelve un 500. La sección 6 muestra el
                                                    cuerpo completo del 422 («Del validador al cuerpo del 422») y cómo evitar ese 500
                                                    («Un 422 que se explica solo»).</p>

                                                <p className="text-gray-700 leading-relaxed mb-5"><strong>Implicación estadística de la tasa de exclusión:</strong> un 20 %
                                                    es deliberadamente alto, para que el ejemplo tenga qué mostrar. Como regla práctica,
                                                    cuando se excluye más de un 5 % de los registros conviene preguntarse por el mecanismo
                                                    que produce esas exclusiones (MCAR, MAR o MNAR, en la clasificación de Rubin, que se
                                                    resume en el recuadro siguiente). Si dependen de las propias variables, y sobre todo
                                                    del valor rechazado, el análisis de los casos que pasan puede quedar sesgado y dejar de
                                                    representar a la población de partida.</p>

                                                <Accordion items={[{ titulo: "Para profundizar: MCAR, MAR y MNAR (la clasificación de Rubin)", contenido: (<><div
                                                        className="mt-4 text-sm text-amber-900 border-t border-amber-200 pt-4 leading-relaxed space-y-4">
                                                        <p>Rubin (1976) clasificó los mecanismos que producen datos faltantes. El
                                                            mecanismo decide qué análisis son válidos con los datos disponibles y si sus
                                                            conclusiones se pueden generalizar a la población de partida.</p>

                                                        <p>Formalmente, si \(\mathbf&#123;Y&#125;\) es la matriz completa de datos y
                                                            \(\mathbf&#123;R&#125;\) es la matriz indicadora de observación (\(R_&#123;ij&#125; = 1\) si el dato
                                                            \(Y_&#123;ij&#125;\) se observó y \(R_&#123;ij&#125; = 0\) si falta), la clasificación mira la
                                                            distribución condicional \(P(\mathbf&#123;R&#125; \mid \mathbf&#123;Y&#125;)\):</p>

                                                        <div className="bg-white/70 border border-green-300 rounded-lg p-4">
                                                            <h5 className="font-bold text-green-800 mb-2">MCAR: faltante completamente al azar
                                                                (<em>missing completely at random</em>)</h5>
                                                            <div className="mb-2 text-center text-gray-700">
                                                                $$ P(\mathbf&#123;R&#125; \mid \mathbf&#123;Y&#125;_&#123;\text&#123;obs&#125;&#125;, \mathbf&#123;Y&#125;_&#123;\text&#123;mis&#125;&#125;) =
                                                                P(\mathbf&#123;R&#125;) $$
                                                            </div>
                                                            <p>La probabilidad de que un dato falte <strong>no depende de ningún
                                                                    valor</strong>, ni observado ni faltante, como si se lanzara una moneda
                                                                para decidir qué datos se pierden.</p>
                                                            <p className="mt-2"><strong>Ejemplo:</strong> un sensor de temperatura falla por
                                                                una descarga eléctrica que no tiene relación con la temperatura que medía.
                                                                Los datos perdidos son una submuestra aleatoria de los completos.</p>
                                                            <p className="mt-2"><strong>Implicación:</strong> es el escenario más benigno. El
                                                                análisis de los casos completos da estimadores insesgados, aunque menos
                                                                precisos, porque la muestra es más pequeña.</p>
                                                        </div>

                                                        <div className="bg-white/70 border border-yellow-300 rounded-lg p-4">
                                                            <h5 className="font-bold text-yellow-800 mb-2">MAR: faltante al azar (<em>missing
                                                                    at random</em>)</h5>
                                                            <div className="mb-2 text-center text-gray-700">
                                                                $$ P(\mathbf&#123;R&#125; \mid \mathbf&#123;Y&#125;_&#123;\text&#123;obs&#125;&#125;, \mathbf&#123;Y&#125;_&#123;\text&#123;mis&#125;&#125;) =
                                                                P(\mathbf&#123;R&#125; \mid \mathbf&#123;Y&#125;_&#123;\text&#123;obs&#125;&#125;) $$
                                                            </div>
                                                            <p>La probabilidad de que un dato falte depende de <strong>otros valores
                                                                    observados</strong>, pero <em>no</em> del valor faltante. El nombre
                                                                engaña: no es «completamente al azar», sino al azar <em>condicional</em> a
                                                                lo observado.</p>
                                                            <p className="mt-2"><strong>Ejemplo:</strong> en una encuesta de ingresos, las
                                                                personas jóvenes (edad observada) tienden a no reportar su salario, pero
                                                                dentro de cada grupo de edad la probabilidad de no reportarlo no depende
                                                                del salario real.</p>
                                                            <p className="mt-2"><strong>Implicación:</strong> eliminar los registros
                                                                incompletos puede introducir sesgo. No siempre: en una regresión en la que
                                                                la probabilidad de faltar depende sólo de las covariables, y no de la
                                                                respuesta, los coeficientes de los casos completos siguen siendo
                                                                insesgados. La imputación múltiple o la máxima verosimilitud condicionando
                                                                en lo observado producen estimaciones válidas.</p>
                                                        </div>

                                                        <div className="bg-white/70 border border-red-300 rounded-lg p-4">
                                                            <h5 className="font-bold text-red-800 mb-2">MNAR: faltante no al azar
                                                                (<em>missing not at random</em>)</h5>
                                                            <div className="mb-2 text-center text-gray-700">
                                                                $$ P(\mathbf&#123;R&#125; \mid \mathbf&#123;Y&#125;_&#123;\text&#123;obs&#125;&#125;, \mathbf&#123;Y&#125;_&#123;\text&#123;mis&#125;&#125;)
                                                                \neq P(\mathbf&#123;R&#125; \mid \mathbf&#123;Y&#125;_&#123;\text&#123;obs&#125;&#125;) $$
                                                            </div>
                                                            <p>La probabilidad de que un dato falte depende <strong>del propio valor
                                                                    faltante</strong>, incluso después de condicionar por lo observado. Es
                                                                el mecanismo más problemático.</p>
                                                            <p className="mt-2"><strong>Ejemplo:</strong> en un estudio clínico, los pacientes
                                                                con efectos secundarios más graves abandonan el ensayo y dejan de reportar
                                                                sus síntomas. Faltan justo los valores más extremos, y su ausencia
                                                                distorsiona la distribución observada.</p>
                                                            <p className="mt-2"><strong>Implicación:</strong> no hay solución puramente
                                                                estadística sin supuestos adicionales. Hacen falta modelos de selección
                                                                (<em>selection models</em>) o de mezcla de patrones (<em>pattern-mixture
                                                                models</em>), con hipótesis explícitas sobre el mecanismo. Sin ese
                                                                tratamiento, el análisis de los casos observados suele salir sesgado.</p>
                                                        </div>

                                                        <div className="bg-white/70 border border-amber-400 rounded-lg p-4">
                                                            <h5 className="font-bold text-amber-900 mb-2">¿Por qué importa esto al validar?</h5>
                                                            <p>Cuando Pydantic rechaza un registro, crea un dato faltante. Si las reglas
                                                                son puramente de formato (tipo incorrecto, campo vacío), los rechazos
                                                                pueden ser MCAR, siempre que el error no dependa de nada relacionado con el
                                                                estudio; si se concentran en una fuente —un hospital, un encuestador—, ya
                                                                no lo son. Y si los rechazos caen sobre valores extremos reales (p. ej.,
                                                                rechazar edades por encima de 100 elimina a los centenarios, que existen),
                                                                el mecanismo es MNAR y la muestra queda sesgada. La bitácora de rechazos
                                                                muestra dónde se concentran; lo que no puede es demostrar el mecanismo:
                                                                MAR y MNAR no se distinguen con los datos observados, así que el mecanismo
                                                                se argumenta con lo que sabes de cómo se recogieron los datos, no se deduce
                                                                mirando los registros.</p>
                                                        </div>
                                                    </div></>) }]} />

                                                <p className="text-gray-700 leading-relaxed mb-5"><strong>Rol del decorador <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@cronometrar</code>:</strong> mide cuánto
                                                    tarda en validarse el lote. Si validar 15 observaciones toma \(t\) segundos, validar
                                                    10 000 tomará del orden de \(667 \times t\) (10 000 / 15), porque el coste crece más o
                                                    menos en proporción al número de registros. Si esa cifra no cabe en el tiempo que
                                                    tienes, el remedio no es quitar validación, sino validar una sola vez, en la entrada
                                                    (4.1.4).</p>

                                                <p className="text-gray-700 leading-relaxed mb-5"><strong>Valor del diccionario de retorno:</strong> la función <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">validar_lote</code> devuelve un diccionario con tres claves: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">validas</code> (lista de instancias <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ObservacionIris</code>), <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">rechazadas</code> (lista de diccionarios con el índice, el dato original y los
                                                    motivos, cada uno como par campo-mensaje) y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">tasa_exclusion</code> (porcentaje).
                                                    Es una bitácora mínima que permite reconstruir qué se descartó y por qué, y es la base
                                                    del diagrama de flujo de exclusiones que exige CONSORT (ensayos clínicos) y recomienda
                                                    STROBE (estudios observacionales). La sección 6 vuelve sobre esta bitácora.</p>
                                            </div>
                                        </section>
                                        <section className="usta-card p-6 md:p-8 mb-8">
                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">4.4 Validar un campo contra otro: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@model_validator</code></h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">Un validador de campo ve un solo valor. La regla «la fecha de alta no puede ser
                                                anterior a la de ingreso» necesita dos, así que va en un validador de modelo, el que la
                                                semana 4 dejó pendiente: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@model_validator(mode="after")</code> se ejecuta cuando
                                                todos los campos ya pasaron su propia validación y recibe la instancia completa en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">self</code>.</p>
                                            <CodeBlock title="Python" lang="python" code={`from datetime import date

from pydantic import BaseModel, ValidationError, model_validator


class Estancia(BaseModel):
    fecha_ingreso: date
    fecha_alta: date

    @model_validator(mode="after")
    def alta_posterior_al_ingreso(self) -> "Estancia":
        if self.fecha_alta < self.fecha_ingreso:
            raise ValueError(
                f"fecha_alta ({self.fecha_alta}) es anterior a fecha_ingreso "
                f"({self.fecha_ingreso}); la duración de la estancia saldría negativa."
            )
        return self


print(Estancia(fecha_ingreso="2024-03-01", fecha_alta="2024-03-09"))
for datos in (
    {"fecha_ingreso": "2024-03-09", "fecha_alta": "2024-03-01"},
    {"fecha_ingreso": "2024-03-09", "fecha_alta": "9 de marzo"},
):
    try:
        Estancia(**datos)
    except ValidationError as e:
        for err in e.errors():
            print(err["type"], err["loc"], err["msg"])`} />
                                            <CodeBlock title="Salida" lang="text" code={`fecha_ingreso=datetime.date(2024, 3, 1) fecha_alta=datetime.date(2024, 3, 9)
value_error () Value error, fecha_alta (2024-03-01) es anterior a fecha_ingreso (2024-03-09); la duración de la estancia saldría negativa.
date_from_datetime_parsing ('fecha_alta',) Input should be a valid date or datetime, invalid character in year`} />
                                            <ul className="list-disc pl-6 space-y-2 mb-6 text-gray-700">
                                                <li className="leading-relaxed"><strong>Sólo corre si los campos pasan.</strong> En la tercera prueba, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"9 de marzo"</code> no es una fecha: sale el error del campo y el validador de
                                                    modelo ni se ejecuta, porque no tiene con qué comparar.</li>
                                                <li className="leading-relaxed"><strong>No lleva <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@classmethod</code> y devuelve <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">self</code>.</strong> Trabaja sobre la instancia, no sobre la clase. Si olvidas
                                                    el <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">return self</code>, al construir el modelo a mano Pydantic sólo avisa
                                                    (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">UserWarning</code>), pero en FastAPI el endpoint recibe <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">None</code> en
                                                    lugar del modelo.</li>
                                                <li className="leading-relaxed"><strong>Su error no es de ningún campo.</strong> En Pydantic sale con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">loc</code> vacío, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">()</code>, y en el 422 de FastAPI con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"loc":
                                                    ["body"]</code>, sin nombre de campo. Por eso el mensaje tiene que nombrar los dos
                                                    campos y decir qué pasaría si se aceptara el dato.</li>
                                            </ul>
                                            <p className="text-gray-700 leading-relaxed mb-5">En la sección 5 verás validadores de modelo sobre modelos anidados.</p>
                                        </section>
                                        <section className="usta-card p-6 md:p-8 mb-8">
                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">4.5 Rango lógico y rango estadístico</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">Hasta aquí, todos los rechazos eran de <strong>rango lógico</strong>: valores
                                                que no pueden ser ciertos —una longitud negativa, un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">NaN</code>, una especie que no
                                                existe, una edad de −5—. Se declaran con <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field(ge=…, le=…, gt=…)</code> y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">allow_inf_nan=False</code> (Pydantic acepta <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">NaN</code> e infinito en un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">float</code> si no se lo prohíbes), o con un validador cuando el mensaje propio
                                                importa, y se rechazan siempre.</p>
                                            <p className="text-gray-700 leading-relaxed mb-5">El <strong>rango estadístico</strong> es otra cosa: lo posible pero fuera de lo
                                                que respalda el modelo. Piensa en una API que sirve un modelo ya ajustado: una regresión
                                                que predice el ancho del pétalo de una <em>Iris setosa</em> a partir de su largo, ajustada
                                                con las 50 setosas de Fisher (1936), cuyos largos van de 1,0 a 1,9 cm. Un largo de 2,4 cm
                                                es un pétalo real (una versicolor lo tiene), pero para este modelo es una extrapolación:
                                                está a 5,4 desviaciones estándar de la media con la que se ajustó. Lo honesto es no
                                                predecir y decir por qué.</p>
                                            <CodeBlock title="Python" lang="python" code={`from pydantic import BaseModel, Field, ValidationError, field_validator
from pydantic_core import PydanticCustomError

# Referencia: las 50 flores de I. setosa de Fisher (1936) con las que se ajustó el
# modelo. Media y desviación estándar muestral (ddof=1) del largo del pétalo, en cm.
MEDIA_REF, DE_REF = 1.462, 0.1737
Z_MAX = 3.0  # regla declarada; supone una distribución aproximadamente normal


class EntradaPrediccion(BaseModel):
    id_planta: str
    # Rango lógico: mayor que 0 y finito (allow_inf_nan=False cierra el paso a NaN e inf)
    petal_length: float = Field(gt=0, allow_inf_nan=False)

    @field_validator('petal_length')  # mode='after': ya es un float positivo y finito
    @classmethod
    def en_rango_estadistico(cls, valor: float) -> float:
        z = (valor - MEDIA_REF) / DE_REF
        if abs(z) > Z_MAX:
            raise PydanticCustomError(
                'fuera_de_rango_estadistico',
                'petal_length = {valor} cm está a {z} desviaciones estándar de la media de '
                'referencia ({media} cm, 50 setosas de Fisher); se admiten como máximo {z_max}. '
                'Predecir aquí sería extrapolar: revisa la medida y su unidad.',
                {'valor': valor, 'z': round(abs(z), 1), 'media': MEDIA_REF, 'z_max': Z_MAX},
            )
        return valor


for valor in (1.5, 2.4, 0.0, float('nan')):
    try:
        print('aceptada: ', EntradaPrediccion(id_planta='S-01', petal_length=valor))
    except ValidationError as e:
        err = e.errors()[0]
        print(f"rechazada [{err['type']}]: {err['msg']}")`} />
                                            <CodeBlock title="Salida" lang="text" code={`aceptada:  id_planta='S-01' petal_length=1.5
rechazada [fuera_de_rango_estadistico]: petal_length = 2.4 cm está a 5.4 desviaciones estándar de la media de referencia (1.462 cm, 50 setosas de Fisher); se admiten como máximo 3.0. Predecir aquí sería extrapolar: revisa la medida y su unidad.
rechazada [greater_than]: Input should be greater than 0
rechazada [finite_number]: Input should be a finite number`} />
                                            <ul className="list-disc pl-6 space-y-2 mb-6 text-gray-700">
                                                <li className="leading-relaxed"><strong>El rango lógico lo pone <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">Field</code>.</strong> El 0 y el <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">NaN</code> se rechazan con los mensajes estándar de Pydantic
                                                    (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">greater_than</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">finite_number</code>) antes de que el validador se
                                                    ejecute.</li>
                                                <li className="leading-relaxed"><strong>El rango estadístico lo pone el validador</strong>, con la regla
                                                    escrita en el código: |z| &gt; 3 respecto de la media y la desviación estándar <strong>de referencia</strong>. Son las de la muestra con la que se ajustó el modelo,
                                                    declaradas como constantes, nunca las del lote que llega: una petición sola no tiene
                                                    lote, y en un lote los propios errores inflan la desviación con la que se los mide.
                                                    Con la media y la desviación de un lote de cinco largos —1,4, 1,5, 1,3, 14 y 15, los
                                                    dos últimos en milímetros—, los errores quedan a 1,0 y 1,2 desviaciones y pasan.</li>
                                                <li className="leading-relaxed"><strong>El supuesto se declara.</strong> La regla |z| &gt; 3 supone una
                                                    distribución aproximadamente normal. Con la muestra de Fisher no rechaza ninguna de
                                                    las 50 setosas (la más alejada está a 2,66 desviaciones) y rechaza las 100 versicolor
                                                    y virginica. Si no quieres suponer normalidad, usa como soporte el rango observado en
                                                    el entrenamiento (de 1,0 a 1,9 cm).</li>
                                                <li className="leading-relaxed"><strong><code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">PydanticCustomError</code> en lugar de <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ValueError</code>.</strong> El mensaje sale sin el prefijo «Value error, », el <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">type</code> es tuyo (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">fuera_de_rango_estadistico</code>, que un programa
                                                    puede distinguir de un error de formato) y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">ctx</code> lleva los números de la
                                                    regla. En el 422 de FastAPI llega así: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">&#123;"type": "fuera_de_rango_estadistico",
                                                    "loc": ["body", "petal_length"], "msg": "petal_length = 2.4 cm está a 5.4
                                                    desviaciones…", "input": 2.4, "ctx": &#123;"valor": 2.4, "z": 5.4, "media": 1.462,
                                                    "z_max": 3.0&#125;&#125;</code>.</li>
                                            </ul>
                                            <Box type="info" label="Cómo se redacta un rechazo">Un buen motivo contesta cuatro preguntas: <strong>qué campo</strong>, <strong>qué valor llegó</strong>, <strong>qué regla o
                                                referencia incumple</strong> y <strong>qué debe revisar</strong> quien lo envió. Lo lee
                                                otra persona, o un programa, que no ve tu código.
                                                <ul className="list-disc pl-6 space-y-2 mb-6 text-gray-700">
                                                    <li className="leading-relaxed">Mal: «Error» o «Valor fuera de rango» (ni campo, ni valor, ni regla).
                                                        Bien: «La medida debe ser un número finito mayor que 0 cm; se recibió -5.1.»</li>
                                                    <li className="leading-relaxed">Mal: «Violación axiomática del dominio» (jerga, sin valor ni regla).
                                                        Bien: «Especie no reconocida: 'rosa'. Valores admitidos: setosa, versicolor,
                                                        virginica.»</li>
                                                    <li className="leading-relaxed">Bien, para un rango estadístico: el mensaje de <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">EntradaPrediccion</code>, que dice el valor, la referencia, el límite y qué
                                                        revisar.</li>
                                                </ul>
                                                Tres reglas más: el campo ya va en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">loc</code>, pero nómbralo en el mensaje si va a
                                                acabar en un registro; nada de LaTeX ni de jerga; y no lo recortes al registrarlo
                                                (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">msg[:50]</code>): el motivo es justo lo que se corta.
                                            </Box>
                                            <Box type="warn" label="⚠ Atención: al recoger datos, lo raro se marca, no se rechaza">El
                                                rechazo por rango estadístico tiene sentido en la entrada de un modelo ya ajustado, donde
                                                lo que se evita es extrapolar. Al recoger datos —una encuesta, un registro clínico— es un
                                                error: lo raro pero real también es un dato, y rechazarlo lo convierte en un faltante que
                                                depende de su propio valor (MNAR). La muestra pierde justo sus extremos y los análisis
                                                salen sesgados: rechazar edades por encima de 100 elimina a los centenarios, que existen.
                                                Ahí sólo se aplica el rango lógico; lo raro se acepta y se marca para revisión (un campo <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">revisar</code> o una entrada en la bitácora), y una persona decide después. La
                                                clasificación MCAR, MAR y MNAR está en el «Para profundizar» del ejemplo de iris.
                                            </Box>
                                        </section>
                                        <section className="usta-card p-6 md:p-8 mb-8">
                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">4.6 Ejercicios de autoevaluación</h3>
                                            <div className="bg-white p-6 rounded-xl border border-gray-100 my-6 shadow-sm">
                                                <h4 className="text-lg md:text-xl font-medium mb-3 text-navy mt-6">Ejercicio 1: diferencia entre mode='before' y mode='after'</h4>
                                                <p className="text-gray-700 leading-relaxed mb-5"><strong>Problema:</strong> explica la diferencia entre <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">mode='before'</code> y <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">mode='after'</code> en un <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">@field_validator</code> cuando hay que limpiar datos crudos que pueden traer

                                                    negativa) o <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"NA"</code> (un faltante sin estandarizar).</p>

                                                    <p className="text-gray-700 leading-relaxed mb-5">La configuración <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">mode='before'</code> recibe el dato crudo, antes de
                                                        cualquier conversión. Sirve para:</p>
                                                    <ul className="list-disc pl-6 space-y-2 mb-6 text-gray-700">
                                                        <li className="leading-relaxed">Normalizar la notación numérica antes de convertir. Ojo: <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"1,234.56"</code> (coma de miles y punto decimal) no se escribe igual

                                                            Colombia. Una regla que borre todas las comas convierte 12,5 en 125; antes de

                                                        <li className="leading-relaxed">Convertir en <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">None</code> las marcas de faltante no
                                                            estandarizadas (<code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"NA"</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"N/A"</code>, <code className="bg-gray-100 text-pink-600 px-1.5 py-0.5 rounded font-mono text-xs border border-gray-200">"-"</code>).</li>
