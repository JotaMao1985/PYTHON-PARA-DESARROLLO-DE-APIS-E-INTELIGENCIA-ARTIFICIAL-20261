                                <h3>3.2 Configuración tipada con Pydantic Settings</h3>
                                <p>Una buena práctica, ya esbozada en la Semana IV, consiste en exponer toda la configuración
                                    a través de un objeto Pydantic. Eso unifica la lectura de variables y deja todo el
                                    sistema de tipos como fuente de verdad:</p>

                <CodeBlock title="app/config.py" lang="python" code={`# app/config.py
                from functools import lru_cache
                from pydantic import Field
                from pydantic_settings import BaseSettings, SettingsConfigDict

                class Configuracion(BaseSettings):
                    model_config = SettingsConfigDict(
                        env_file=".env",
                        env_prefix="APP_",
                        extra="ignore",
                    )

                    # Generales
                    entorno: str = Field(default="development")        # development | production
                    debug: bool = Field(default=True)
                    log_level: str = Field(default="INFO")

                    # Persistencia
                    bd_url: str = Field(default="sqlite:///./encuestas.db")

                    # Numéricos del dominio estadístico
                    seed: int = Field(default=2026, ge=0)
                    nivel_confianza: float = Field(default=0.95, gt=0.5, lt=1.0)

                @lru_cache
                def obtener_config() -> Configuracion:
                    return Configuracion()`} />

                                <p>El estudiante reconocerá el patrón: <code>obtener_config</code> se inyecta con <code>Depends</code> en cualquier endpoint y la cache asegura que la lectura ocurre una
                                    sola vez por proceso.</p>

                                <h3>3.3 Archivos <code>.env</code> y <code>.env.example</code></h3>
                                <p>El archivo <code>.env</code> queda en la raíz del proyecto y <strong>se ignora en git</strong>.
                                    En su lugar se versiona una plantilla <code>.env.example</code> con los nombres de las
                                    variables y valores ficticios. La estructura típica es:</p>

                <CodeBlock title=".env.example" lang="text" code={`# .env.example  (versionado, sin valores reales)
                APP_ENTORNO=development
                APP_DEBUG=true
                APP_LOG_LEVEL=INFO
                APP_BD_URL=sqlite:///./encuestas.db
                APP_SEED=2026
                APP_NIVEL_CONFIANZA=0.95`} />

                                <p>El <code>.gitignore</code> debe contener al menos:</p>

                <CodeBlock lang="text" code={`# .gitignore
                .env
                .env.*.local
                __pycache__/
                *.pyc
                .venv/
                encuestas.db`} />

                                <Box type="warn" label="Errores frecuentes">

                                    Subir <code>.env</code> al repositorio expone credenciales. Aun después de eliminarlo,
                                    los secretos quedan en el historial de git: lo correcto es <em>rotarlos</em> en el
                                    proveedor antes de continuar. Por la misma razón nunca se incluyen secretos en el <code>Dockerfile</code> con <code>ENV</code>; se inyectan en tiempo de ejecución.
                                </Box>

                                <h3>3.4 Variables en Render</h3>
                                <p>Ambos proveedores ofrecen un panel donde se definen las variables y se inyectan al

                <CodeBlock lang="shell" code={`# Variables configuradas en el panel del PaaS (no en el repositorio)
                APP_ENTORNO=production
                APP_DEBUG=false
                APP_LOG_LEVEL=INFO
                APP_BD_URL=postgresql+psycopg://usuario:secreto@host:5432/encuestas
                APP_SEED=2026
                APP_NIVEL_CONFIANZA=0.95
                # PORT lo inyecta automáticamente el proveedor; no debe definirse a mano`} />

                                <p>Cuando se aprovisiona una base de datos PostgreSQL gestionada (un servicio de base de datos de Render), el proveedor expone una variable como <code>DATABASE_URL</code> que puede referenciarse desde la configuración:</p>

                <CodeBlock lang="text" code={`# Render permite referenciar variables de otros servicios:
                APP_BD_URL=\${{Postgres.DATABASE_URL}}`} />  /* TODO revisar lang */

                                <h3>3.5 El puerto en producción: <code>$PORT</code></h3>
                                <p>Una diferencia operativa importante: el PaaS decide en qué puerto el contenedor debe
                                    escuchar y comunica esa decisión por la variable <code>PORT</code>. El comando de
                                    arranque debe usar esa variable, no un número fijo. Para Uvicorn:</p>

                <CodeBlock lang="dockerfile" code={`# Comando de arranque dentro del Dockerfile
                CMD ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port \${PORT:-8000}"]`} />

                                <p>La sintaxis <code>$&#123;PORT:-8000&#125;</code> es la expansión POSIX habitual: si <code>PORT</code> no está definida, se usa <code>8000</code>. Esto mantiene compatibilidad con <code>docker run -p 8000:8000</code> en local y con la inyección del proveedor en
                                    producción.</p>

                                <Box type="tip" label="Bind a 0.0.0.0, no a 127.0.0.1">

                                    En desarrollo se trabaja con <code>127.0.0.1</code> porque sólo el propio equipo se
                                    conecta. En un contenedor de producción, el tráfico llega desde fuera del contenedor:
                                    Uvicorn debe escuchar en <code>0.0.0.0</code> para aceptarlo. Si no, el proveedor
                                    reportará el servicio como caído.
                                </Box>
            </div>
        );

        const CicdSection = () => (
            <div className="prose-lp">
                <h3>4.1 ¿Qué es CI/CD?</h3>
                                <p>El acrónimo combina dos prácticas relacionadas:</p>
                                <ul>
                                    <li><strong>CI (Continuous Integration / Integración Continua):</strong> en cada cambio
                                        que se sube al repositorio, un servidor automatizado instala dependencias, ejecuta
                                        las pruebas y reporta el resultado. El objetivo es detectar regresiones antes de que
                                        lleguen a la rama principal.</li>
                                    <li><strong>CD (Continuous Delivery / Continuous Deployment):</strong> cuando los
                                        cambios fusionan en la rama principal, se construye el artefacto (imagen Docker) y se
                                        publica en producción <em>de forma automática</em>. <em>Delivery</em> deja el
                                        artefacto listo y un humano lo aprueba; <em>Deployment</em> publica directamente.</li>
                                </ul>

                                <h3>4.2 El pipeline completo</h3>

                                <p>El reparto concreto de responsabilidades entre GitHub Actions (la pieza CI) y el PaaS
                                    (la pieza CD) se detalla en §4.5; aquí basta con visualizar el orden temporal del
                                    flujo, desde que el estudiante hace <code>git push</code> hasta que la nueva versión
                                    queda publicada.</p>

                                <div className="pipeline" role="img" aria-label="Pipeline CI/CD: push, tests, build, deploy">
                                    <div className="pipeline-step">
                                        <span className="num">01</span>git push <span className="desc">El estudiante sube cambios a GitHub.</span>
                                    </div>
                                    <div className="pipeline-arrow" aria-hidden="true">›</div>
                                    <div className="pipeline-step">
                                        <span className="num">02</span>CI: pytest <span className="desc">Actions instala deps y ejecuta la suite.</span>
                                    </div>
                                    <div className="pipeline-arrow" aria-hidden="true">›</div>
                                    <div className="pipeline-step">
                                        <span className="num">03</span>Merge a main <span className="desc">Si pasa, se acepta el PR.</span>
                                    </div>
                                    <div className="pipeline-arrow" aria-hidden="true">›</div>
                                    <div className="pipeline-step">
                                        <span className="num">04</span>CD: build + deploy <span className="desc">Render reconstruye y publica.</span>
                                    </div>
                                </div>

                                <p>En la práctica del curso, GitHub Actions se ocupa del paso de CI (ejecutar <code>pytest</code> y, opcionalmente, construir la imagen) y el PaaS se ocupa del paso
                                    de CD (reconstruir y publicar al detectar un push en <code>main</code>).</p>

                                <p>La Figura 4.1 cuantifica el costo en tiempo de cada fase, distinguiendo la primera
                                    ejecución de las posteriores (cuando la caché de <code>pip</code> y la caché de capas
                                    de Docker están calientes). Conocer estos órdenes de magnitud ayuda a interpretar la
                                    duración de un workflow y a identificar cuellos de botella reales.</p>

                                <GraficaCicd caption="Figura 4.1 — La caché de pip activada por actions/setup-python@v5 y la caché de capas de Docker reducen drásticamente el tiempo del pipeline. El cuello de botella estable suele ser pytest, que no se acelera por caché. Valores aproximados, dependientes del tamaño del proyecto y la región del runner." />

                                <h3>4.3 Anatomía de un workflow de GitHub Actions</h3>
                                <p>Los workflows son archivos YAML alojados en <code>.github/workflows/</code>. Cada uno declara:</p>
                                <ul>
                                    <li><strong>Disparadores</strong> (<code>on</code>): qué evento lo dispara
                                        (<code>push</code>, <code>pull_request</code>, <code>schedule</code>, …).</li>
                                    <li><strong>Trabajos</strong> (<code>jobs</code>): unidades que se ejecutan en una máquina
                                        virtual <em>runner</em>.</li>
                                    <li><strong>Pasos</strong> (<code>steps</code>): comandos o acciones reutilizables, una
                                        tras otra dentro del trabajo.</li>
                                </ul>

                                <p>Para la API <code>encuestas-api</code>, un workflow mínimo que ejecuta <code>pytest</code> en cada <em>push</em> y cada <em>pull request</em> hacia <code>main</code> tiene esta forma:</p>

                <CodeBlock title=".github/workflows/ci.yml" lang="yaml" code={`# .github/workflows/ci.yml
                name: CI - tests

                on:
                  push:
                    branches: [main]
                  pull_request:
                    branches: [main]

                jobs:
                  tests:
                    runs-on: ubuntu-latest
                    steps:
                      - name: Clonar repositorio
                        uses: actions/checkout@v4

                      - name: Configurar Python 3.11.9
                        uses: actions/setup-python@v5
                        with:
                          python-version: "3.11.9"
                          cache: "pip"

                      - name: Instalar dependencias
                        run: |
                          python -m pip install --upgrade pip
                          pip install -r requirements.txt

                      - name: Ejecutar suite con pytest
                        env:
                          APP_ENTORNO: test
                          APP_DEBUG: "false"
                          APP_LOG_LEVEL: WARNING
                          APP_BD_URL: sqlite:///./test.db
                        run: pytest -ra --maxfail=1`} />

                                <h4>Lectura del workflow paso a paso</h4>
                                <ol>
                                    <li><code>actions/checkout@v4</code> clona el repositorio dentro del runner.</li>
                                    <li><code>actions/setup-python@v5</code> instala exactamente Python 3.11.9, la misma
                                        versión usada en desarrollo y dentro del Dockerfile.</li>
                                    <li>El paso <em>Instalar dependencias</em> aprovecha la caché de <code>pip</code>: en
                                        ejecuciones siguientes, sólo descarga lo nuevo.</li>
                                    <li>Las variables de entorno se inyectan en el bloque <code>env</code> de la última
                                        etapa para que la suite encuentre la configuración esperada.</li>
                                    <li><code>pytest -ra --maxfail=1</code> reporta todos los resultados y se detiene en el
                                        primer fallo, lo cual deja el log más legible.</li>
                                </ol>

                                <h3>4.4 Proteger la rama principal</h3>
                                <p>Por sí sola, la presencia de un workflow no impide que un cambio defectuoso entre en <code>main</code>. Para que CI sea efectivo, en la configuración del repositorio se
                                    define una <em>regla de protección de rama</em> que exige:</p>
                                <ul>
                                    <li>Todos los cambios entran a <code>main</code> sólo a través de pull request.</li>
                                    <li>El check <code>tests</code> debe estar en estado verde antes de fusionar.</li>
                                    <li>Opcionalmente, se requiere al menos una revisión humana del PR.</li>
                                </ul>

                                <p>Con esta protección activada, un compañero o el propio estudiante no puede fusionar un
                                    cambio que rompa una prueba; el botón de <em>merge</em> aparece deshabilitado.</p>

                                <h3>4.5 Conexión del PaaS con GitHub: la pieza CD</h3>
                                <p>El despliegue automático se configura una sola vez:</p>

                                <ol>
                                    <li>En Render se selecciona <em>Deploy from GitHub repo</em> y se autoriza el
                                        acceso al repositorio.</li>
                                    <li>Se elige la rama de seguimiento (típicamente <code>main</code>).</li>
                                    <li>Se configuran las variables de entorno productivas en el panel.</li>
                                    <li>El proveedor instala un <em>webhook</em> en GitHub: cada <em>push</em> al branch
                                        seguido dispara automáticamente un <em>build</em> y un <em>deploy</em>.</li>
                                </ol>

                                <p>El estudiante observará que, al fusionar un PR aprobado, en cuestión de uno o dos minutos
                                    Render compila el Dockerfile y publica la nueva versión. Si los tests del PR
                                    pasaron, hay una probabilidad muy alta de que el despliegue también lo haga.</p>

                                <Box type="info" label="Patrón didáctico recomendado">

                                    Para un curso de pregrado, <strong>CI con GitHub Actions + CD nativo del PaaS</strong> cubre el 95 % de los casos sin complicaciones. Los workflows de Actions con pasos de <code>docker login</code> + <code>docker push</code> a un registro propio son posibles,
                                    pero suelen ser una fuente de fallos por permisos y se reservan para etapas más
                                    avanzadas.
                                </Box>

                                <h3>4.6 Workflow extendido: lint y cobertura</h3>
                                <p>Cuando la suite crece, conviene añadir verificaciones complementarias en el mismo
                                    workflow:</p>

                <CodeBlock lang="yaml" code={`      - name: Lint con ruff
                        run: |
                          pip install ruff==0.5.0
                          ruff check app tests

                      - name: Cobertura mínima del 85 %
                        run: |
                          pip install pytest-cov==5.0.0
                          pytest --cov=app --cov-report=term-missing --cov-fail-under=85`} />

                                <p>El parámetro <code>--cov-fail-under=85</code> hace fallar el workflow si la cobertura
                                    cae por debajo del umbral, materializando una política objetiva sobre el repositorio.</p>
            </div>
        );

            <div className="prose-lp">
                <h3>5.1 ¿Por qué <code>print</code> no es suficiente en producción?</h3>
                                <p>Durante el desarrollo es habitual usar <code>print</code> para inspeccionar el flujo del
                                    programa. En producción, sin embargo, esa práctica acarrea problemas:</p>
                                <ul>
                                    <li>No hay forma de filtrar por severidad (no se distingue una advertencia inofensiva
                                        de un error crítico).</li>
                                    <li>No incluyen marca de tiempo, módulo origen ni identificador de proceso.</li>
                                    <li>No se pueden silenciar selectivamente sin tocar el código.</li>
                                    <li>No tienen contexto consistente entre módulos: en un servicio con muchos endpoints
                                        es imposible saber con certeza qué archivo o función emitió cada mensaje.</li>
                                </ul>

                                <p>El módulo <code>logging</code> de la biblioteca estándar resuelve los cuatro puntos.</p>

                                <h3>5.2 Niveles de severidad</h3>
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Nivel</th>
                                            <th>Valor numérico</th>
                                            <th>Cuándo emitirlo</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td><code>DEBUG</code></td><td>10</td>
                                            <td>Detalle interno útil sólo al depurar (valor de un coeficiente intermedio).</td>
                                        </tr>
                                        <tr>
                                            <td><code>INFO</code></td><td>20</td>
                                            <td>Eventos normales (petición recibida, modelo ajustado correctamente).</td>
                                        </tr>
                                        <tr>
                                            <td><code>WARNING</code></td><td>30</td>
                                            <td>Situación inusual pero recuperable (matriz de diseño cercana a singular).</td>
                                        </tr>
                                        <tr>
                                            <td><code>ERROR</code></td><td>40</td>
                                            <td>Una operación falló pero el servicio sigue arriba (excepción no controlada
                                                en un endpoint).</td>
                                        </tr>
                                        <tr>
                                            <td><code>CRITICAL</code></td><td>50</td>
                                            <td>Falla que pone en riesgo el servicio completo (BD inalcanzable).</td>
                                        </tr>
                                    </tbody>
                                </table>

                                <p>La Figura 5.1 ilustra la distribución típica de eventos por severidad en una API
                                    estadística saludable. La forma esperada es altamente asimétrica: <code>INFO</code> domina por volumen, mientras que <code>ERROR</code> y <code>CRITICAL</code> son raros
                                    pero precisamente por eso merecen alertas inmediatas. Una distribución muy distinta
                                    (por ejemplo, 20 % de ERROR) sería un síntoma claro de un problema en producción.</p>

                                <GraficaLogs caption="Figura 5.1 — En una API estadística sana, INFO concentra cerca del 95 % de los eventos. La escala logarítmica permite ver simultáneamente niveles que difieren en órdenes de magnitud: ERROR y CRITICAL son menos del 1 %, pero su cantidad absoluta y tendencia diaria son métricas clave de observabilidad." />

                                <h3>5.3 Configuración mínima para FastAPI</h3>
                                <p>El siguiente módulo configura el logging al inicio del proceso. La política es:</p>
                                <ul>
                                    <li>El nivel se lee de <code>APP_LOG_LEVEL</code>.</li>
                                    <li>El destino es la salida estándar (<code>sys.stdout</code>); el PaaS la captura.</li>
                                    <li>El formato incluye timestamp ISO, nivel, módulo y mensaje.</li>
                                </ul>

                <CodeBlock title="app/logs.py" lang="python" code={`# app/logs.py
                import logging
                import sys
                from app.config import obtener_config

                def configurar_logging() -> None:
                    config = obtener_config()
                    nivel = getattr(logging, config.log_level.upper(), logging.INFO)

                    formato = "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
                    fecha = "%Y-%m-%dT%H:%M:%S%z"

                    handler = logging.StreamHandler(sys.stdout)
                    handler.setFormatter(logging.Formatter(formato, datefmt=fecha))

                    root = logging.getLogger()
                    root.setLevel(nivel)
                    root.handlers = [handler]
                    # Acalla el ruido de Uvicorn por debajo de WARNING en producción
                    logging.getLogger("uvicorn.access").setLevel(
                        logging.WARNING if config.entorno == "production" else logging.INFO
                    )`} />

                                <p>Y en el módulo principal de la aplicación se invoca antes de instanciar FastAPI:</p>

                <CodeBlock title="app/main.py" lang="python" code={`# app/main.py
                from fastapi import FastAPI
                from app.logs import configurar_logging

                configurar_logging()
                app = FastAPI(title="encuestas-api", version="0.5.0")`} />

                                <h3>5.4 Emisión de logs desde un endpoint</h3>
                                <p>El logger se obtiene por nombre de módulo (<code>__name__</code>) y se emiten mensajes
                                    con el nivel correspondiente. Es importante <em>no concatenar</em> strings: se usa el <em>lazy formatting</em> de <code>%</code>, que solo formatea si el log se emite:</p>

                <CodeBlock title="app/api/regresion.py" lang="python" code={`# app/api/regresion.py
                import logging
                from fastapi import APIRouter, HTTPException
                from app.schemas import RegresionInput  # modelo Pydantic con campos x, y

                logger = logging.getLogger(__name__)
                router = APIRouter()

                @router.post("/modelos/regresion")
                def ajustar(payload: RegresionInput):
                    logger.info("Ajuste solicitado: n=%d", len(payload.x))

                    try:
                        resultado = ajuste_ols(payload.x, payload.y)
                    except ValueError as e:
                        logger.warning("Datos inadecuados: %s", e)
                        raise HTTPException(status_code=422, detail=str(e))
                    except Exception:
                        logger.exception("Fallo inesperado en ajuste")
                        raise HTTPException(status_code=500, detail="Error interno")

                    logger.info("Ajuste OK: R2=%.4f", resultado.r2)
                    return resultado`} />

                                <p>El método <code>logger.exception</code> registra el mensaje y, automáticamente, la traza
                                    completa de la excepción en curso. Es la forma correcta de capturar fallas inesperadas
                                    sin perder información para el diagnóstico posterior.</p>

                                <Box type="warn" label="Nunca se registran datos sensibles">

                                    Los logs son leídos por administradores, copiados a sistemas de búsqueda y, eventualmente,
                                    archivados. No deben contener: credenciales, tokens, números de identificación
                                    personales, ni los datos crudos de las observaciones cuando el conjunto sea
                                    confidencial. Sí se registran tamaños, identificadores anónimos y resúmenes
                                    estadísticos.
                                </Box>

                                <h3>5.5 Cómo se ven los logs en producción</h3>
                                <p>Una traza típica de la API en Render durante una petición exitosa luce así (los
                                    colores corresponden al nivel):</p>

                                <div className="log-window" role="log" aria-label="Ejemplo de logs en producción">
                <span className="log-time">2026-04-30T14:22:11+0000</span> | <span className="log-info">INFO    </span> | app.main          | Aplicación inicializada en entorno=production <span className="log-time">2026-04-30T14:22:42+0000</span> | <span className="log-info">INFO    </span> | app.api.regresion | Ajuste solicitado: n=128 <span className="log-time">2026-04-30T14:22:42+0000</span> | <span className="log-info">INFO    </span> | app.api.regresion | Ajuste OK: R2=0.8731 <span className="log-time">2026-04-30T14:22:55+0000</span> | <span className="log-warn">WARNING </span> | app.api.regresion | Datos inadecuados: longitudes desiguales x=10, y=12 <span className="log-time">2026-04-30T14:23:09+0000</span> | <span className="log-error">ERROR   </span> | app.api.regresion | Fallo inesperado en ajuste <span className="log-time">                          </span>   <span className="log-debug">Traceback (most recent call last):</span>
                <span className="log-time">                          </span>   <span className="log-debug">  File "/app/app/stats.py", line 47, in ajuste_ols</span>
                <span className="log-time">                          </span>   <span className="log-debug">    XtX_inv = numpy.linalg.inv(XtX)</span>

                                <h3>5.6 Logs estructurados (opcional)</h3>

                                <h3>5.7 Lectura de logs en Render</h3>
                                <p>Ambos paneles ofrecen una vista en vivo de la salida estándar y estándar de error del

            <div className="prose-lp">
                <h3>6.1 ¿Cómo deciden estos PaaS qué construir?</h3>
                                <p>Cuando se conecta un repositorio a Render, el proveedor inspecciona los
                                    archivos de la raíz para decidir el método de construcción:</p>

                                <div className="ascii-diagram">¿Existe Dockerfile en la raíz?
                   │
                   ├── Sí ──► Construir con `docker build .`        ◄──── ruta usada en este curso
                   │
                   └── No  ──► Detectar lenguaje (Python, Node, ...)
                                  ├── requirements.txt    → buildpack Python
                                  ├── package.json        → buildpack Node
                                  └── go.mod              → buildpack Go</div>

                                <p>Cuando hay un Dockerfile, los <em>buildpacks</em> (Nixpacks en Railway, sistema propio en
                                    Render) se ignoran. Esto da control total sobre la imagen y deja al proveedor sólo el
                                    rol de construir, ejecutar y exponer.</p>

                                <h3>6.2 Requisitos del Dockerfile para Render</h3>
                                <p>El Dockerfile multi-stage de la semana anterior ya cumple casi todo lo necesario. Sólo
                                    requiere dos confirmaciones:</p>
                                <ol>
                                    <li>El comando <code>CMD</code> debe usar la variable <code>$PORT</code>.</li>
                                    <li>El proceso debe escuchar en <code>0.0.0.0</code>.</li>
                                </ol>

                                <p>Una versión productiva completa, compatible con ambos proveedores, es:</p>

                <CodeBlock lang="dockerfile" code={`# ============================ Etapa de construcción
                FROM python:3.11.9-slim-bookworm AS builder

                ENV PYTHONDONTWRITEBYTECODE=1 \\
                    PYTHONUNBUFFERED=1 \\
                    PIP_NO_CACHE_DIR=1 \\
                    PIP_DISABLE_PIP_VERSION_CHECK=1

                WORKDIR /build

                COPY requirements.txt .
                RUN pip install --prefix=/install -r requirements.txt

                # ============================ Etapa final
                FROM python:3.11.9-slim-bookworm

                ENV PYTHONDONTWRITEBYTECODE=1 \\
                    PYTHONUNBUFFERED=1

                # Usuario sin privilegios
                RUN useradd --create-home --uid 1000 api
                USER api

                WORKDIR /app

                COPY --from=builder /install /usr/local
                COPY --chown=api:api app ./app

                # El proveedor inyecta PORT; en local cae a 8000
                EXPOSE 8000
                CMD ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port \${PORT:-8000}"]`} />

                                <Box type="info" label="Por qué PYTHONUNBUFFERED=1">

                                    Sin esta variable, Python amortigua su salida estándar y los logs aparecen en bloques
                                    grandes y con retraso en el panel del proveedor. Con <code>PYTHONUNBUFFERED=1</code>,
                                    cada <code>logger.info(...)</code> se ve casi en tiempo real.
                                </Box>

                                <h3>6.3 Flujo de despliegue en Render</h3>
                                <p>El procedimiento típico, ya en posesión del Dockerfile anterior, es:</p>
                                <ol>
                                    <li>Crear cuenta en <code>render.com</code> y autorizar el acceso al repositorio
                                        GitHub.</li>

                                        de la API.</li>
                                    <li>Render detecta el <code>Dockerfile</code> y construye la primera versión sin
                                        intervención adicional.</li>
                                    <li>En <em>Variables</em> se introducen <code>APP_ENTORNO=production</code>, <code>APP_DEBUG=false</code>, <code>APP_LOG_LEVEL=INFO</code>, <code>APP_BD_URL</code>, etc. La variable <code>PORT</code> se inyecta automáticamente
                                        y no debe definirse a mano.</li>
                                    <li>En <em>Settings ▸ Networking</em> se genera un dominio público
                                        (<code>encuestas-api.onrender.com</code>). Opcionalmente se asigna uno propio.</li>
                                    <li>Cualquier <em>push</em> futuro a la rama elegida dispara un nuevo <em>build</em> + <em>deploy</em>.</li>
                                </ol>

                                <p>Dos detalles de Render que conviene tener presentes desde el primer despliegue:</p>
                                <ol>
                                    <li>Render distingue entre <em>Web Service</em> (servicio HTTP) y otros tipos
                                        (background worker, cron job, base de datos). Para la API se elige <em>Web Service</em>.</li>
                                    <li>El plan gratuito <em>suspende</em> el servicio tras 15 minutos sin tráfico; la
                                        primera petición tras la suspensión tarda algunos segundos en arrancar el
                                        contenedor. Para evitarlo, se cambia al plan pagado o se mantiene un <em>health check</em> periódico desde un servicio externo.</li>
                                </ol>

                                    aprendas aquí se traslada a cualquiera de ellas: detectar el Dockerfile, inyectar <code>PORT</code> y desplegar desde GitHub es el patrón común. Este curso trabaja
                                    y evalúa sobre <strong>Render</strong>, que es la plataforma que declara el syllabus.
                                </Box>

                from fastapi import APIRouter

                router = APIRouter()

                @router.get("/healthz")
                def salud():
                    return {"status": "ok"}`} />

                                    En Render se configura en <em>Settings ▸ Health Check Path = /healthz</em>. El nombre <code>/healthz</code> es una convención de Kubernetes adoptada por la comunidad: la <code>z</code> al final reduce la probabilidad de colisión con un endpoint de negocio.</p>

                                    disponibilidad del proceso, que la base de datos responde. Discútase qué código de
                                    estado se devuelve cuando la BD no responde y por qué importa la distinción con <code>/healthz</code>.
                                </Box>
                                <details>
                                    <summary>Solución 7.6</summary>
                <CodeBlock lang="python" code={`from fastapi import APIRouter, Depends, HTTPException
                from sqlalchemy import text
                from app.db import obtener_sesion

                router = APIRouter()

                @router.get("/readyz")
                def listo(sesion = Depends(obtener_sesion)):
                    try:
                        sesion.execute(text("SELECT 1"))
                    except Exception:
                        raise HTTPException(status_code=503, detail="BD no disponible")
                    return {"status": "ready"}`} />
                                    <p>Distinción clave: <code>/healthz</code> (<em>liveness</em>) responde mientras el
                                        proceso esté vivo y permite al PaaS decidir si reiniciar el contenedor; <code>/readyz</code> (<em>readiness</em>) responde sólo si el servicio está en
                                        condiciones de atender tráfico, lo cual incluye dependencias externas. Devolver <code>503</code> en <code>/readyz</code> permite al balanceador <em>retirar</em> la
                                        instancia del pool sin matarla, esperando a que la BD vuelva.</p>
                                </details>

                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg lp-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/40 border-t border-white/10">
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>Pseudocódigo · Python · R · VBA</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full lp-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white lp-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white lp-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="lp-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            {CONFIG.lema}
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · {CONFIG.asignatura}
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            {CONFIG.notaPie}
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
