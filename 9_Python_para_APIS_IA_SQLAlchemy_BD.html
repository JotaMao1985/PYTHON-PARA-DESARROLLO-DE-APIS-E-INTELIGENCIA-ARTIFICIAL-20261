                                            <p className="text-gray-700 leading-relaxed mb-5">Hasta ahora tu aplicación FastAPI recibe datos, los valida con Pydantic, y devuelve respuestas. Pero hay una pieza que falta: <strong>¿dónde se guardan esos datos cuando el servidor se apaga?</strong> Si reinicias la app, todo desaparece. Necesitas una <strong>base de datos</strong>, y necesitas una forma elegante de conectar tu código Python con ella. De eso trata esta guía.</p>

                                            <p className="text-gray-700 leading-relaxed mb-5">Vamos a explicar cada concepto clave en términos simples antes de entrar en código:</p>

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">¿Qué es SQL?</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5"><strong>SQL</strong> (Structured Query Language) es el idioma que usan las bases de datos relacionales. Piensa en la base de datos como una colección de hojas de cálculo muy potentes (llamadas <em>tablas</em>), y SQL es el lenguaje con el que le dices qué hacer: "tráeme todos los usuarios que se registraron ayer", "guarda este pedido nuevo", "elimina los registros antiguos". Es un lenguaje universal — ya sea que uses PostgreSQL, MySQL o SQLite, las instrucciones básicas son las mismas.</p>

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">¿Qué es un ORM y por qué existe?</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">Imagina que hablas español y necesitas comunicarte con alguien que solo habla japonés. Podrías aprender japonés (escribir SQL directamente), o podrías usar un <strong>traductor</strong> que convierte lo que dices al idioma del otro. Un <strong>ORM</strong> (Object-Relational Mapper) es exactamente ese traductor: te permite trabajar con <strong>objetos Python normales</strong> — clases, atributos, listas — y el ORM traduce todo eso a instrucciones SQL detrás de escena.</p>

                                            <p className="text-gray-700 leading-relaxed mb-5">En lugar de escribir <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">INSERT INTO usuarios (nombre, email) VALUES ('Ada', 'ada@mail.com')</code>, simplemente escribes:</p>

                                            <div className="bg-gray-900 text-gray-100 rounded-xl p-5 font-mono text-sm leading-relaxed my-4 shadow-lg">
                <CodeBlock lang="text" code={`usuario = Usuario(nombre="Ada", email="ada@mail.com")
                session.add(usuario)
                session.commit()`} />  /* TODO revisar lang */
                                            </div>

                                            <p className="text-gray-700 leading-relaxed mb-5">El ORM genera el SQL por ti. Esto tiene ventajas enormes: tu IDE te avisa si escribes mal un nombre de columna, no necesitas memorizar la sintaxis SQL exacta de cada motor, y — lo más importante — <strong>te protege automáticamente contra ataques de SQL Injection</strong> (cuando alguien intenta "inyectar" código malicioso a través de los datos de entrada).</p>

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">¿Qué es SQLAlchemy?</h3>

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">¿Y SQLite? ¿Por qué empezar con él?</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5"><strong>SQLite</strong> es el motor de base de datos relacional más sencillo para empezar: no necesitas instalar nada (ya viene con Python), no requiere un servidor corriendo, y guarda todo en <strong>un solo archivo</strong> (como <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">app.db</code>) que puedes explorar con <strong>SQLite Browser</strong> directamente desde tu escritorio. Es perfecto para aprender y desarrollar localmente. Cuando tu proyecto crezca, puedes cambiar a PostgreSQL simplemente cambiando una variable de entorno — sin tocar tu código.</p>

                                            <p className="text-gray-700 leading-relaxed mb-5">Un ORM (Object-Relational Mapper) actúa como un <strong>traductor</strong> entre el mundo de los objetos Python y el mundo de las tablas SQL. En lugar de escribir <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">INSERT INTO usuarios ...</code>, creas un objeto <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Usuario(nombre="Ada")</code> y el ORM genera el SQL por ti, incluyendo la parametrización segura de valores.</p>

                                            <p className="text-gray-700 leading-relaxed mb-5">SQL en crudo te da control total sobre la consulta, pero viene con dos riesgos: <strong>SQL Injection</strong> si interpolas valores directamente, y <strong>fragilidad</strong> porque los strings de SQL no se validan en tiempo de desarrollo.</p>

                                            <CodeBlock title="demo_orm_vs_raw.py" lang="python" code={`from sqlalchemy import create_engine, text, String, select
                from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, Session

                engine = create_engine("sqlite://", echo=True)

                class Base(DeclarativeBase):
                    pass

                class Usuario(Base):
                    __tablename__ = "usuarios"
                    id: Mapped[int] = mapped_column(primary_key=True)
                    nombre: Mapped[str] = mapped_column(String(50))
                    email: Mapped[str] = mapped_column(String(255), unique=True)

                Base.metadata.create_all(engine)

                # ═══ ENFOQUE 1: ORM — el "traductor" trabaja por ti ═══
                with Session(engine) as session:
                    nuevo = Usuario(nombre="Ada Lovelace", email="ada@example.com")
                    session.add(nuevo)
                    session.commit()

                    stmt = select(Usuario).where(Usuario.nombre == "Ada Lovelace")
                    usuario = session.scalars(stmt).first()
                    print(f"ORM → {usuario.nombre}, {usuario.email}")

                # ═══ ENFOQUE 2: Raw SQL con text() — SEGURO ═══
                with engine.connect() as conn:
                    conn.execute(
                        text("INSERT INTO usuarios (nombre, email) VALUES (:nombre, :email)"),
                        {"nombre": "Grace Hopper", "email": "grace@example.com"}
                    )
                    conn.commit()

                # ═══ ❌ ANTI-PATRÓN: SQL con f-string — ¡NUNCA! ═══
                # entrada = "'; DROP TABLE usuarios; --"
                # query = f"SELECT * FROM usuarios WHERE nombre = '{entrada}'"
                # ↑ Esto ejecutaría DROP TABLE. Usa SIEMPRE parámetros.`} />

                                            <p className="text-gray-700 leading-relaxed mb-5">SQLAlchemy no es "un ORM" — es una <strong>biblioteca de dos capas</strong>. <strong>Core</strong> (planta baja) es un toolkit de SQL que trabaja con objetos <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Table</code>, <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Column</code> y <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">MetaData</code>, ejecuta consultas a través de <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Engine</code>/<code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Connection</code>, y devuelve objetos <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Row</code> ligeros. <strong>ORM</strong> (primer piso) mapea clases Python sobre los <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Table</code> de Core y agrega gestión de sesiones, relaciones y hooks del ciclo de vida.</p>

                                            <p className="text-gray-700 leading-relaxed mb-5">En SQLAlchemy 2.x, <strong>ambas capas usan la misma función <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">select()</code></strong> — la diferencia es qué le pasas: una clase ORM o un objeto Table.</p>

                                            <CodeBlock title="demo_core_vs_orm.py" lang="python" code={`from sqlalchemy import create_engine, select, Table, MetaData, String
                from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, Session

                engine = create_engine("sqlite://")

                class Base(DeclarativeBase):
                    pass

                class Producto(Base):
                    __tablename__ = "productos"
                    id: Mapped[int] = mapped_column(primary_key=True)
                    nombre: Mapped[str] = mapped_column(String(100))
                    precio: Mapped[float]

                Base.metadata.create_all(engine)

                # ═══ CORE: trabajas con Table y Connection, recibes Rows ═══
                metadata = MetaData()
                productos_table = Table("productos", metadata, autoload_with=engine)

                with engine.connect() as conn:
                    stmt = select(productos_table).where(productos_table.c.precio > 100)
                    for fila in conn.execute(stmt):
                        print(f"Core → {fila.nombre}: \${fila.precio}")

                # ═══ ORM: trabajas con la clase y Session, recibes objetos ═══
                with Session(engine) as session:
                    stmt = select(Producto).where(Producto.precio > 100)
                    for producto in session.scalars(stmt):
                        print(f"ORM  → {producto.nombre}: \${producto.precio}")

                # Observa: el select() es IDÉNTICO en estructura.
                # Core recibe un Table, ORM recibe una clase mapeada.`} />

                                            <Box type="warn" label="⚠️ Punto de Atención: execute() vs scalars()."><code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">session.execute(stmt)</code> devuelve objetos <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Row</code> (tuplas). <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">session.scalars(stmt)</code> devuelve directamente las instancias del modelo ORM. Usa <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">scalars()</code> el 90% del tiempo cuando trabajas con el ORM.

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-4">3.1 Sintaxis Moderna: <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">DeclarativeBase</code>, <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Mapped</code> y <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">mapped_column</code></h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">SQLAlchemy 2.0 introdujo un sistema donde tus <strong>type hints de Python definen las columnas de la base de datos</strong>. <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Mapped[int]</code> genera <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">INTEGER NOT NULL</code>. <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Mapped[Optional[str]]</code> genera un <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">VARCHAR</code> nullable. La antigua función <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">declarative_base()</code> y el uso directo de <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Column()</code> se consideran <strong>legacy</strong> (heredados) y han sido reemplazados por este nuevo enfoque — aún funcionan, pero la documentación oficial recomienda la sintaxis moderna para proyectos nuevos.</p>

                                            <CodeBlock title="app/models.py — Modelos con relaciones" lang="python" code={`from typing import List, Optional
                from datetime import datetime
                from sqlalchemy import String, ForeignKey, DateTime, func
                from sqlalchemy.orm import DeclarativeBase, Mapped, mapped_column, relationship

                class Base(DeclarativeBase):
                    pass

                class Autor(Base):
                    __tablename__ = "autores"

                    # Mapped[int] + primary_key → INTEGER NOT NULL PRIMARY KEY
                    id: Mapped[int] = mapped_column(primary_key=True)
                    nombre: Mapped[str] = mapped_column(String(100))
                    email: Mapped[str] = mapped_column(String(255), unique=True, index=True)
                    # Mapped[Optional[str]] → VARCHAR, nullable
                    bio: Mapped[Optional[str]]
                    creado_en: Mapped[datetime] = mapped_column(
                        DateTime(timezone=True), server_default=func.now()
                    )

                    # Relación uno-a-muchos: un Autor tiene muchos Artículos
                    articulos: Mapped[List["Articulo"]] = relationship(
                        back_populates="autor", cascade="all, delete-orphan"
                    )

                class Articulo(Base):
                    __tablename__ = "articulos"

                    id: Mapped[int] = mapped_column(primary_key=True)
                    titulo: Mapped[str] = mapped_column(String(200))
                    contenido: Mapped[str]
                    autor_id: Mapped[int] = mapped_column(ForeignKey("autores.id"))

                    # Mapped["Autor"] (sin List) → relación escalar (un solo objeto)
                    autor: Mapped["Autor"] = relationship(back_populates="articulos")`} />

                                            <CodeBlock title="app/database.py" lang="python" code={`import os
                from sqlalchemy import create_engine, event, Engine
                from sqlalchemy.orm import sessionmaker, DeclarativeBase

                # URL configurable — SQLite en dev, PostgreSQL en prod
                DATABASE_URL = os.getenv("DATABASE_URL", "sqlite:///./app.db")

                # check_same_thread=False es necesario para SQLite con FastAPI.
                # SQLite solo permite acceso desde el thread que creó la conexión,
                # pero FastAPI despacha endpoints síncronos (def) a un threadpool.
                # La seguridad se mantiene creando una sesión nueva por request (get_db).
                connect_args = {}
                if DATABASE_URL.startswith("sqlite"):
                    connect_args["check_same_thread"] = False

                engine = create_engine(DATABASE_URL, connect_args=connect_args)
                SessionLocal = sessionmaker(autocommit=False, autoflush=False, bind=engine)

                class Base(DeclarativeBase):
                    pass

                # ═══ CRÍTICO: Activar foreign keys en SQLite ═══
                # Sin esto, puedes insertar registros huérfanos sin error
                @event.listens_for(Engine, "connect")
                def activar_fk_sqlite(dbapi_conn, connection_record):
                    import sqlite3
                    if isinstance(dbapi_conn, sqlite3.Connection):
                        cursor = dbapi_conn.cursor()
                        cursor.execute("PRAGMA foreign_keys=ON")
                        cursor.close()

                def get_db():
                    """Inyecta una sesión por request. yield + finally = limpieza garantizada."""
                    db = SessionLocal()
                    try:
                        yield db
                    finally:
                        db.close()`} />

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">4.3 Schemas Pydantic Separados de Modelos ORM</h3>
                                            <p className="text-gray-700 leading-relaxed mb-5">Esta separación es fundamental. Los modelos SQLAlchemy definen <em>almacenamiento</em>; los schemas Pydantic controlan <em>qué cruza la frontera de la API</em>. El puente entre ambos es <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">ConfigDict(from_attributes=True)</code> — el reemplazo de <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">orm_mode</code> en Pydantic v2.</p>

                                            <CodeBlock title="app/schemas.py" lang="python" code={`from pydantic import BaseModel, ConfigDict, field_validator
                from datetime import datetime

                class ArticuloCreate(BaseModel):
                    titulo: str
                    contenido: str

                    @field_validator("titulo")
                    @classmethod
                    def titulo_no_vacio(cls, v: str) -> str:
                        if len(v.strip()) < 3:
                            raise ValueError("El título debe tener al menos 3 caracteres")
                        return v.strip()

                class ArticuloResponse(BaseModel):
                    id: int
                    titulo: str
                    contenido: str
                    publicado: bool
                    autor_id: int
                    # from_attributes=True reemplaza a orm_mode de Pydantic v1
                    model_config = ConfigDict(from_attributes=True)

                class AutorBase(BaseModel):
                    nombre: str
                    email: str

                class AutorCreate(AutorBase):
                    """Acepta nombre y email al crear. Sin id ni fecha."""
                    pass

                class AutorResponse(AutorBase):
                    id: int
                    creado_en: datetime
                    articulos: list[ArticuloResponse] = []
                    model_config = ConfigDict(from_attributes=True)`} />

                                            <h3 className="text-xl md:text-2xl font-semibold mb-4 text-secondary mt-8">4.4 Endpoint con <code className="bg-gray-100 text-pink-600 px-2 py-0.5 rounded font-mono text-sm border border-gray-200">Depends(get_db)</code></h3>

                                            <CodeBlock title="app/routers/autores.py" lang="sql" code={`from typing import Annotated
                from fastapi import APIRouter, Depends, HTTPException
                from sqlalchemy.orm import Session, selectinload
                from sqlalchemy import select
                from app.database import get_db
                from app import models, schemas

                router = APIRouter(prefix="/autores", tags=["autores"])
                DBSession = Annotated[Session, Depends(get_db)]

                @router.post("/", response_model=schemas.AutorResponse, status_code=201)
                def crear_autor(autor: schemas.AutorCreate, db: DBSession):
                    """
                    Flujo completo:
                    1. FastAPI recibe JSON → 2. Pydantic valida →
                    3. Depends inyecta sesión → 4. ORM persiste →
                    5. response_model serializa con from_attributes=True
                    """
                    db_autor = models.Autor(nombre=autor.nombre, email=autor.email)
                    db.add(db_autor)
                    db.commit()
                    db.refresh(db_autor)
                    return db_autor

                @router.get("/{autor_id}", response_model=schemas.AutorResponse)
                def obtener_autor(autor_id: int, db: DBSession):
                    stmt = (
                        select(models.Autor)
                        .options(selectinload(models.Autor.articulos))  # ← Evita N+1
                        .where(models.Autor.id == autor_id)
                    )
                    db_autor = db.scalars(stmt).first()
                    if db_autor is None:
                        raise HTTPException(status_code=404, detail="Autor no encontrado")
                    return db_autor`} />

                                                        <p className="text-gray-600 mb-3 text-sm">Guía oficial de integración FastAPI con SQLAlchemy, incluyendo el patrón get_db con Depends y sesiones por request.</p>
                                                        <div className="flex flex-wrap gap-2 mb-3">
                                                            <span className="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">FastAPI</span>
                                                            <span className="text-xs bg-purple-100 text-purple-700 px-2 py-0.5 rounded-full">Depends</span>
                                                        </div>
                                                    </blockquote>
                                                </div>
                                                <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                                                    <blockquote className="border-l-4 pl-4" style={{ borderLeftColor: '#ED1E79' }}>
                                                        <p className="text-gray-800 font-medium text-lg mb-2">Pydantic v2 — ConfigDict &amp; from_attributes</p>
                                                        <p className="text-gray-600 mb-1"><strong>Autor:</strong> Samuel Colvin / Pydantic Team</p>
                                                        <p className="text-gray-600 mb-3 text-sm">Documentación sobre ConfigDict(from_attributes=True), el reemplazo moderno de orm_mode para serialización de objetos ORM.</p>
                                                        <div className="flex flex-wrap gap-2 mb-3">
                                                            <span className="text-xs bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">Pydantic V2</span>
                                                            <span className="text-xs bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">Serialización</span>
                                                        </div>
                                                    </blockquote>
                                                </div>
                                                <div className="bg-white p-6 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow">
                                                    <blockquote className="border-l-4 pl-4" style={{ borderLeftColor: '#FDB913' }}>
                                                        <p className="text-gray-800 font-medium text-lg mb-2">SQLAlchemy — Session Basics</p>
                                                        <p className="text-gray-600 mb-1"><strong>Autor:</strong> SQLAlchemy Team</p>
                                                        <p className="text-gray-600 mb-3 text-sm">Ciclo de vida de la sesión, Unit of Work, Identity Map, y cuándo hacer commit, flush y close.</p>
                                                        <div className="flex flex-wrap gap-2 mb-3">
                                                            <span className="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full">Session</span>
                                                            <span className="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full">Unit of Work</span>
                                                        </div>
                                                    </blockquote>
                                                </div>
                                            </div>
                                        </section>
            </div>
        );
        /* === SECCIONES FIN === */

        const curriculum = [
            { id: 'portada', title: '1. Antes de empezar', icon: 'BookOpen', component: AperturaSection },
            { id: 'modulo-intro', title: '2. Introducción: de qué trata esta guía', icon: 'Workflow', component: IntroSection },
            { id: 'modulo-0', title: '3. Objetivos de aprendizaje y mapa de ruta', icon: 'Grid', component: ObjetivosSection },
            { id: 'modulo-1', title: '4. ORM frente a SQL en crudo', icon: 'Repeat', component: OrmSqlSection },
            { id: 'modulo-2', title: '5. SQLAlchemy Core y ORM: dos pisos, un edificio', icon: 'Layers', component: CoreOrmSection },
            { id: 'modulo-3', title: '6. Modelado de BD y migraciones con Alembic', icon: 'ArrowDownUp', component: AlembicSection },
            { id: 'modulo-4', title: '7. SQLite local e integración con FastAPI', icon: 'FileCode', component: SqliteSection },
            { id: 'modulo-5', title: '8. Ejercicio integrador: tareas con categorías', icon: 'FunctionSquare', component: IntegradorSection },
            { id: 'modulo-eval', title: '9. Guía de evaluación: taller en parejas', icon: 'Award', component: EvaluacionTallerSection },
            { id: 'preguntas-sustentacion', title: '10. Preguntas de sustentación', icon: 'Calculator', component: SustentacionSection },
            { id: 'glosario', title: '11. Glosario de términos', icon: 'Table', component: GlosarioSection },
            { id: 'modulo-6', title: '12. Bibliografía y recursos consultados', icon: 'BookOpen', component: BibliografiaSection },
        ];

        /* ============================================================
           APP — barra lateral, progreso, navegación y reanudación
        ============================================================ */
        const App = () => {
            const [activeLessonIndex, setActiveLessonIndex] = useState(() => {
                const saved = parseInt(localStorage.getItem(CONFIG.storageKey), 10);
                return Number.isInteger(saved) && saved >= 0 ? saved : 0;
            });
            // La barra es hermana flex del contenido: no lo superpone, lo
            // COMPRIME. Abierta ocupa 18 rem, así que en un viewport de 375 px
            // dejaría el texto en 79 px, ilegible. Arranca abierta solo desde
            // el punto de corte `lg` de Tailwind, que es el que usa `irA` para
            // cerrarla al navegar.
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            useEffect(() => {
                localStorage.setItem(CONFIG.storageKey, String(safeIndex));
                typesetMath();
                const cont = document.getElementById('contenido-scroll');
                if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
            }, [safeIndex]);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen overflow-hidden relative">
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all hover:scale-110 lp-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col lp-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            {/* contraste-ok: el gold va sobre el navy de `lp-header`, no sobre el fondo claro */}
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">
                                {CONFIG.asignatura}
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Capítulo {CONFIG.numero} · <span className="text-secondary font-semibold">{CONFIG.titulo}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg lp-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/40 border-t border-white/10">
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>Pseudocódigo · Python · R · VBA</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full lp-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white lp-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white lp-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="lp-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            {CONFIG.lema}
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · {CONFIG.asignatura}
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            {CONFIG.notaPie}
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
