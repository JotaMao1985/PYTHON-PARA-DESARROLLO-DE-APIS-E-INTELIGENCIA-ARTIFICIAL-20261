                <h3>La Anatomía de una Petición HTTP & Autenticación</h3>

                <p>HTTP es el lenguaje universal de la web. Para un Data Scientist, entenderlo es vital para extraer datos (<span class='tooltip'>Scraping<span class='tooltip-text'>Extracción automatizada de datos desde el HTML de webs.</span></span>/<span class='tooltip'>APIs<span class='tooltip-text'>Interfaz para que programas intercambien datos de forma estructurada.</span></span>) o desplegar modelos (<span class='tooltip'>Flask<span class='tooltip-text'>Framework web ligero (micro) de Python. Ideal para prototipos.</span></span>/<span class='tooltip'>FastAPI<span class='tooltip-text'>Framework moderno de alto rendimiento enfocado en APIs y tipado.</span></span>).</p>
                <p><strong>1. Verbos (La Acción):</strong><br />• <strong>GET:</strong> Solicitar datos. <em>Ej: Descargar dataset.</em><br />• <strong>POST:</strong> Enviar datos. <em>Ej: Inferencia de modelo.</em></p>
                <p><strong>2. Headers & Autenticación (El Pase VIP):</strong><br />La mayoría de APIs comerciales requieren identificarse. Los métodos más comunes son:<br />• <strong>Basic Auth:</strong> Usuario y contraseña en cada petición (Inseguro, 'vieja escuela').<br />• <strong>API Key:</strong> Un código único (token) que te identifica. Se envía en Headers (<code>X-API-Key: abc12345</code>).<br />• <strong>Bearer Token (OAuth2):</strong> El estándar moderno. Obtienes un token temporal (como una manilla de hotel) que expira.</p>
                <p><strong>3. Status Codes (El Resultado):</strong></p>
                <p><span class='font-bold text-indigo-700'>🟢 2xx (Éxito - Todo bien)</span><br />• <strong>200 OK:</strong> Petición exitosa estándar.<br />• <strong>201 Created:</strong> Recurso creado (ej: Usuario registrado).<br />• <strong>202 Accepted:</strong> Petición aceptada para proceso en <em>background</em> (ej: Entrenar un modelo pesado).</p>
                <p><span class='font-bold text-orange-600'>🟠 4xx (Error Cliente - Culpa tuya)</span><br />• <strong>400 Bad Request:</strong> Enviaste datos mal formados (JSON roto).<br />• <strong>401 Unauthorized:</strong> No tienes credenciales (Token).<br />• <strong>403 Forbidden:</strong> Tienes token, pero no permisos para esto.<br />• <strong>404 Not Found:</strong> El endpoint o recurso no existe.<br />• <strong>422 Unprocessable Entity:</strong> Datos semánticamente erróneos (ej: Enviar texto donde va un número).<br />• <strong>429 Too Many Requests:</strong> Calma, estás saturando la API (Rate Limit).</p>
                <p><span class='font-bold text-red-600'>🔴 5xx (Error Servidor - Culpa de ellos)</span><br />• <strong>500 Internal Server Error:</strong> El código del servidor falló.<br />• <strong>503 Service Unavailable:</strong> Servidor caído o en mantenimiento.</p>

                <Box type="tip" label="Analogía Postal">
                <p>• <strong>URL:</strong> La dirección de la casa.<br />• <strong>Verbo:</strong> Lo que quieres hacer (Entregar paquete, Recoger carta).<br />• <strong>Headers:</strong> Las estampillas y etiquetas ('Fragil', 'Prioritario').<br />• <strong>Auth (Token):</strong> Tu carnet de empleado postal que te deja entrar al edificio.<br />• <strong>Body:</strong> El contenido de la caja (solo en POST/PUT).<br />• <strong>Status Code:</strong> El acuse de recibo ('Entregado', 'Dirección no existe').</p>
                </Box>

                <Box type="warn" label="Seguridad">
                <p>Nunca envíes contraseñas o tokens (API Keys) en la URL (Query Params), ya que quedan guardados en el historial del navegador/proxy. Úsalo siempre en los <strong>Headers</strong> o en el <strong>Body</strong> (POST).</p>
                </Box>

                <table><thead><tr><th>Opción</th><th>A favor</th><th>En contra</th><th>Mejor para</th></tr></thead><tbody><tr><td>GET (Leer) 🔍</td><td><ul><li>Simple y rápido</li><li>Cacheable por el navegador</li><li>Se puede guardar en favoritos</li></ul></td><td><ul><li>No seguro para datos sensibles</li><li>Límite de longitud en URL</li><li>Solo envía texto</li></ul></td><td>Consultas de datos, Búsquedas, Filtros</td></tr><tr><td>POST (Escribir) 📝</td><td><ul><li>Seguro (datos en el cuerpo)</li><li>Sin límite de tamaño</li><li>Soporta binarios (archivos, imágenes)</li></ul></td><td><ul><li>No cacheable por defecto</li><li>Más complejo de construir manualmente</li></ul></td><td>Login, Subir archivos, Enviar formularios, Inferencia de modelos</td></tr></tbody></table>

                <CodeBlock title="Cliente API Robusto (OOP + Session)" lang="python" code={`import requests
                from typing import Optional, Dict, Any

                class APIClient:
                    """
                    Cliente profesional para interactuar con APIs.
                    Encapsula la configuración (URL, Claves) para no repetirla.
                    """

                    def __init__(self, base_url: str, api_key: str):
                        """
                        El CONSTRUCTOR: Se ejecuta automáticamente al crear la clase.
                        Aquí configuramos lo que el robot necesita 'recordar': la URL y la Llave.
                        """
                        self.base_url = base_url

                        # Session: Un 'Túnel Permanente' (Conexión TCP) con el servidor.
                        # Mejora el rendimiento al no tener que reconectar en cada petición.
                        self.session = requests.Session()

                        # Headers Globales: Se enviarán en TODAS las peticiones de esta sesión.
                        # Así no tenemos que escribir 'Authorization' en cada función.
                        self.session.headers.update({
                            "Authorization": f"Bearer {api_key}",
                            "Content-Type": "application/json",
                            "User-Agent": "MiAppDataScience/1.0"
                        })

                    def get_data(self, endpoint: str, params: Optional[Dict] = None) -> Dict:
                        """
                        Método para LEER datos (Verbo HTTP: GET).
                        :param endpoint: La parte final de la URL (ej: 'usuarios/1')
                        :param params: Filtros opcionales (ej: {'page': 2})
                        """
                        try:
                            url = f"{self.base_url}/{endpoint}"
                            # Usamos self.session.get en lugar de requests.get
                            response = self.session.get(url, params=params, timeout=10)

                            # ¡IMPORTANTE! Valida si el código es 200 OK.
                            # Si es 4xx o 5xx, lanza una excepción (salta al 'except').
                            response.raise_for_status() 

                            return response.json() # Convierte el texto JSON a Diccionario Python

                        except requests.exceptions.HTTPError as err:
                            # Manejo de errores específicos según el código de estado
                            if response.status_code == 401:
                                print("⛔ Error: Credenciales inválidas (Token vencido o incorrecto).")
                            elif response.status_code == 429:
                                print("⏳ Error: Rate Limit. Estás haciendo muchas peticiones muy rápido.")
                            else:
                                print(f"❌ Error HTTP Genérico: {err}")
                            return {}

                        except Exception as e:
                            print(f"🔥 Error crítico (Red, Timeout, etc): {e}")
                            return {}

                    def predict(self, features: Dict[str, Any]) -> float:
                        """
                        Método para ENVIAR datos y recibir predicción (Verbo HTTP: POST).
                        :param features: Diccionario con los datos del modelo (ej: {'edad': 30})
                        """
                        try:
                            url = f"{self.base_url}/predict"
                            # 'json=features' convierte automáticamente el dict a JSON válido
                            response = self.session.post(url, json=features, timeout=5)
                            response.raise_for_status()

                            # Asumimos que la API devuelve algo como: {"prediction": 4500.50}
                            return response.json().get('prediction', 0.0)

                        except Exception as e:
                            print(f"❌ Error en predicción: {e}")
                            return 0.0

                # --- EJEMPLO DE USO ---

            <div className="prose-lp">
                <h3>Serialización: Congelando Objetos</h3>

                <p>Para guardar un objeto de Python (un diccionario, un modelo entrenado) en un archivo o enviarlo por red, debemos <span class='tooltip'>Serializarlo<span class='tooltip-text'>Convertir un objeto en memoria a una secuencia de bytes o texto para guardarlo o transmitirlo.</span></span>. El proceso inverso es la <span class='tooltip'>Deserialización<span class='tooltip-text'>Reconstruir el objeto original en memoria a partir de los bytes o texto guardados.</span></span>.</p>
                <p><strong>1. JSON (El Estándar Web):</strong><br />Es texto plano, legible por humanos y compatible con casi todos los lenguajes (Python, JS, Java).<br />❌ <em>Limitación:</em> Solo entiende tipos simples (texto, números, listas, booleanos). <strong>NO</strong> soporta fechas (`datetime`), tuplas o clases personalizadas directamente.</p>
                <p><strong>2. Pickle (La Magia de Python):</strong><br />Es un formato binario (no legible por humanos) específico de Python.<br />✅ <em>Ventaja:</em> Puede guardar casi <strong>CUALQUIER</strong> objeto de Python: funciones, clases, modelos de Machine Learning (Scikit-Learn), DataFrames de Pandas, etc.<br />❌ <em>Peligro:</em> <strong>Nunca</strong> cargues un archivo `.pkl` de internet. Al deserializarlo, puede ejecutar código malicioso en tu PC.</p>

                <Box type="tip" label="Analogía del Envío">
                <p>• <strong>JSON:</strong> Es una carta escrita en inglés. Cualquiera puede leerla, pero no puedes enviar cosas físicas, solo descripciones.<br />• <strong>Pickle:</strong> Es un teletransportador de ciencia ficción. Desintegra el objeto (átomo por átomo) y lo reconstruye idéntico al otro lado. Pero si te envían una bomba teletransportada, explotará al reconstruirse.</p>
                </Box>

                <Box type="warn" label="Seguridad Crítica">
                <p>`pickle.load()` es inseguro por diseño. Solo úsalo con archivos que TÚ mismo creaste o en los que confías plenamente.</p>
                </Box>

                <table><thead><tr><th>Opción</th><th>A favor</th><th>En contra</th><th>Mejor para</th></tr></thead><tbody><tr><td>JSON 📄</td><td><ul><li>Legible por humanos (Texto)</li><li>Universal (Interoperable)</li><li>Seguro (Solo datos)</li></ul></td><td><ul><li>Pierde tipos complejos (Tuplas -> Listas, Fechas -> Strings)</li><li>Más lento con grandes volúmenes numéricos</li></ul></td><td>APIs REST, Configuración, Compartir datos entre lenguajes</td></tr><tr><td>Pickle 🥒</td><td><ul><li>Guarda TODO (Funciones, Clases, Modelos)</li><li>Mantiene tipos exactos</li><li>Binario (Eficiente para objetos Python)</li></ul></td><td><ul><li>Solo Python (No sirve para Java/JS)</li><li>Inseguro (Ejecución de código arbitrario)</li><li>Frágil entre versiones de librerías</li></ul></td><td>Persistencia de Modelos ML, Pausar/Reanudar procesos, Caché local</td></tr></tbody></table>

                <CodeBlock title="El Problema de las Fechas (Type Loss)" lang="python" code={`import json
                import pickle
                from datetime import datetime

                # Datos con tipos complejos (Fecha)
                data = {
                    "evento": "Clase de Python",
                    "fecha": datetime.now(), # <--- Objeto complejo
                    "asistentes": ("Juan", "Maria") # <--- Tupla
                }

                print(f"🐍 Original: {type(data['fecha'])} - {type(data['asistentes'])}")

                # --- INTENTO 1: JSON ---
                try:
                    # json.dumps(data) # ❌ Error: Object of type datetime is not JSON serializable

                    # Solución: Convertir a String manualmente
                    data_json = data.copy()
                    data_json['fecha'] = str(data['fecha']) 

                    texto_json = json.dumps(data_json)
                    print(f"📄 JSON: {texto_json}")

                    # Al recuperar... ¡perdimos los tipos!
                    recuperado = json.loads(texto_json)
                    print(f"💔 Recuperado: {type(recuperado['fecha'])} (Ahora es str) y {type(recuperado['asistentes'])} (Ahora es list)")
                except Exception as e:
                    print(e)

                # --- INTENTO 2: PICKLE ---
                # Pickle guarda el objeto TAL CUAL (Binario)
                bytes_pickle = pickle.dumps(data)
                print(f"🥒 Pickle (Bytes): {bytes_pickle[:20]}...")

                recuperado_pkl = pickle.loads(bytes_pickle)
                print(f"✨ Restaurado: {type(recuperado_pkl['fecha'])} y {type(recuperado_pkl['asistentes'])}")
                print("¡Conservó la Fecha y la Tupla exactas!")`} />

        const PydanticSection = () => (
            <div className="prose-lp">
                <h3>El Cadenero de tus Datos: De 'Garbage In' a Datos Confiables</h3>

                <p>En estadística existe un dicho famoso: <strong>'Garbage In, Garbage Out'</strong> (entra basura, sale basura). Si alimentas tu modelo con datos corruptos — tipos incorrectos (texto 'veinte' donde va el número 20), valores faltantes inesperados, o datos fuera de rango (una probabilidad de 1.5) — tus conclusiones serán erróneas sin importar qué tan sofisticado sea tu algoritmo.</p>
                <p>Python es de tipado dinámico, genial para prototipar pero peligroso en producción. En la era antigua llenábamos el código de <code>if type(x) != int: raise Error</code>. Pydantic reemplaza esto por una <span class='tooltip'>Validación Declarativa<span class='tooltip-text'>Defines QUÉ quieres (el contrato), no CÓMO validarlo paso a paso.</span></span>: describes QUÉ forma deben tener tus datos y Pydantic se encarga del CÓMO.</p>
                <p>Pydantic actúa como el <strong>Cadenero (Bouncer)</strong> de tu script. Tú le das las reglas del club (el <span class='tooltip'>Esquema<span class='tooltip-text'>La estructura y tipos esperados de los datos.</span></span>) y él se encarga de revisar a todos en la entrada. Si alguien llega con 'zapatos equivocados', Pydantic intenta arreglarlos (<span class='tooltip'>Coerción<span class='tooltip-text'>Transformación automática de datos, ej: recibir el texto '5' y convertirlo al número 5.</span></span>). Pero a diferencia de otras librerías, Pydantic no solo valida: intenta <em>parsear</em> (convertir) los datos al tipo correcto si es posible. Si no puede, los expulsa con un error detallado.</p>
                <p><strong>Conceptos Clave del Módulo:</strong><br />• <strong>BaseModel:</strong> Al heredar de <code>BaseModel</code>, tu clase gana constructor automático (sin escribir <code>__init__</code>), serialización (<code>.model_dump()</code>), y protección de tipos en tiempo de ejecución.<br />• <strong>Field:</strong> Restricciones numéricas declarativas (<code>gt</code>, <code>le</code>, <code>ge</code>) y <code>description</code> para documentación automática.<br />• <strong>Campos Opcionales:</strong> <code>Optional[float] = None</code> permite manejar datos faltantes (<em>NaN</em>) explícitamente — vital en estadística para no sesgar promedios con ceros falsos.<br />• <strong>@field_validator:</strong> Limpieza (<code>mode='before'</code>) para datos sucios (ej. coma decimal '12,5') y reglas de negocio (<code>mode='after'</code>) para lógica que Pydantic no conoce.<br />• <strong>Validación de DataFrames:</strong> Patrón fila-por-fila con <code>try/except</code> para separar registros buenos de erróneos sin detener el proceso.</p>

                <Box type="tip" label="Analogía">
                <p>• <strong>Validación Manual:</strong> Es como un guardia que tiene que revisar cada bolsillo manualmente y preguntar '¿Eres mayor de edad?'. Lento y propenso a errores.<br />• <strong>Pydantic:</strong> Es un escáner biométrico de aeropuerto. Pasas (los datos), y automáticamente verifica identidad, pasaporte y equipaje en milisegundos. Si algo falla, te dice exactamente qué (ej: 'Pasaporte vencido').</p>
                </Box>

                <Box type="tip" label="Tip Moderno">
                <p>Pydantic V2 está escrito en Rust, lo que lo hace extremadamente rápido. Úsalo para validar filas de DataFrames, respuestas de APIs o configuraciones complejas. Instálalo con: <code>pip install pydantic</code></p>
                </Box>

                <table><thead><tr><th>Opción</th><th>A favor</th><th>En contra</th><th>Mejor para</th></tr></thead><tbody><tr><td>Validación Manual 🚧</td><td><ul><li>No requiere librerías extra</li></ul></td><td><ul><li>Verbosidad extrema (muchos `if/else`)</li><li>Difícil de leer y mantener</li><li>Reinventa la rueda en cada función</li></ul></td><td>Scripts diminutos sin dependencias</td></tr><tr><td>Pydantic 🛡️</td><td><ul><li>Declarativo (Legible)</li><li>Coerción automática (Str -> Int)</li><li>Mensajes de error estandarizados</li><li>Serialización (.model_dump())</li></ul></td><td><ul><li>Requiere instalar librería</li><li>Curva de aprendizaje inicial</li></ul></td><td>APIs (FastAPI), Pipelines de Datos, Configuración</td></tr></tbody></table>

                <CodeBlock title="Contrato de Datos Completo: Field, Optional, Validadores y DataFrames" lang="python" code={`from pydantic import BaseModel, Field, field_validator, ValidationError
                from typing import Optional, List
                import pandas as pd

                # ══════════════════════════════════════════════════
                # 1. MODELO CON FIELD, OPTIONAL Y VALIDADOR
                # ══════════════════════════════════════════════════

                class VariableEstadistica(BaseModel):
                    # Campo obligatorio con restricción de longitud
                    nombre: str = Field(..., min_length=2, description="Nombre de la variable")

                    # Restricción numérica: gt = mayor que 0 (la desviación no puede ser negativa)
                    desviacion_std: float = Field(..., gt=0, description="Desviación estándar positiva")

                    # Restricción de rango: ge=0, le=1 (probabilidad entre 0 y 1)
                    probabilidad: float = Field(..., ge=0, le=1, description="Probabilidad [0,1]")

                    # Campo NULLABLE (puede ser None) → Dato faltante en estadística
                    # Diferencia clave: None (no medido) vs 0 (medido con valor cero)
                    n_muestras: Optional[int] = Field(default=None, ge=1)

                    # Campo con valor por defecto
                    activa: bool = True

                    # VALIDADOR mode='before': Limpieza de datos sucios
                    # Se ejecuta ANTES de verificar el tipo → Ideal para arreglar formatos
                    @field_validator('desviacion_std', mode='before')
                    @classmethod
                    def corregir_coma_decimal(cls, v):
                        if isinstance(v, str):
                            return float(v.replace(',', '.'))  # "2,5" → 2.5
                        return v

                    # VALIDADOR mode='after': Regla de negocio (post-tipado)
                    @field_validator('nombre')
                    @classmethod
                    def normalizar_nombre(cls, v: str) -> str:
                        return v.strip().lower()  # "  Edad  " → "edad"

                # --- Prueba del Modelo ---
                try:
                    v1 = VariableEstadistica(
                        nombre="  Peso  ", desviacion_std="12,5",  # Coma decimal (dato sucio)
                        probabilidad=0.95, n_muestras=None          # Dato faltante explícito
                    )
                    print(f"✅ Modelo: {v1}")
                    print(f"📦 Dict:  {v1.model_dump()}")
                except ValidationError as e:
                    print(f"❌ ERROR: {e}")

                # ══════════════════════════════════════════════════
                # 2. VALIDACIÓN DE DATAFRAME (PANDAS)
                # ══════════════════════════════════════════════════

                class Transaccion(BaseModel):
                    id_tx: int
                    monto: float = Field(gt=0)
                    categoria: str

                df = pd.DataFrame([
                    {"id_tx": 1,   "monto": 100.50, "categoria": "comida"},     # ✅ OK
                    {"id_tx": "2", "monto": 200,    "categoria": "transporte"}, # ✅ Coerción str→int
                    {"id_tx": 3,   "monto": "abc",  "categoria": "ocio"},       # ❌ Monto inválido
                ])

                limpios, errores = [], []
                for i, fila in df.iterrows():
                    try:
                        dato = Transaccion(**fila.to_dict())
                        limpios.append(dato.model_dump())
                    except ValidationError as e:
                        errores.append({"fila": i, "error": str(e)})

                print(f"\\n📊 Válidos: {len(limpios)} | Fallidos: {len(errores)}")
                df_final = pd.DataFrame(limpios)
                print(df_final)`} />

                <h4>🔍 Análisis del Modelo Completo</h4>

                <Accordion items={[{ titulo: "1. BaseModel (El Núcleo)", contenido: (<><p>Al heredar de <code>BaseModel</code>, la clase <code>VariableEstadistica</code> gana superpoderes automáticos: constructor sin escribir <code>__init__</code>, serialización con <code>.model_dump()</code> (ideal para exportar a dicts/JSON/Pandas), y protección de tipos en tiempo de ejecución.</p></>) }, { titulo: "2. Field (Restricciones Declarativas)", contenido: (<><p>Usamos <code>Field(gt=0)</code> para 'mayor que 0', <code>Field(ge=0, le=1)</code> para 'entre 0 y 1', y <code>description</code> para documentar qué significa cada variable. Cuando usas <code>Field(...)</code> (tres puntos), el campo es <strong>requerido</strong>. Esto reemplaza docenas de líneas de <code>if/else</code>.</p></>) }, { titulo: "3. Campos Opcionales y Nulos", contenido: (<><p><code>Optional[int] = None</code> permite que un valor sea nulo explícitamente (<em>dato faltante</em>). <strong>Nota estadística:</strong> diferenciar entre <code>0</code> (valor observado) y <code>None</code> (dato perdido) es vital para no sesgar promedios. Si un paciente no reporta cuántos cigarrillos fuma y ponemos 0, bajamos el promedio falsamente.</p></>) }, { titulo: "4. Validadores @field_validator", contenido: (<><p><strong>mode='before':</strong> Limpieza de datos sucios. Se ejecuta ANTES de la validación de tipo, ideal para corregir formatos (coma decimal '12,5' → 12.5). <strong>mode='after':</strong> Reglas post-tipado como normalizar texto a minúsculas. Ambos usan <code>@classmethod</code> porque no necesitan instancia creada.</p></>) }, { titulo: "5. Patrón de Validación de DataFrames", contenido: (<><p>La integración con Pandas usa un bucle <code>for fila in df.iterrows()</code> con <code>try/except</code>. Cada fila se valida individualmente: las buenas van a <code>limpios</code>, las malas a <code>errores</code> con detalle de qué falló. Así no se detiene el pipeline por una fila corrupta.</p></>) }]} />

                <Accordion items={[{ titulo: "🗂️ Glosario: Validación con Pydantic", contenido: (<><table><thead><tr><th>Término</th><th>Definición</th></tr></thead><tbody><tr><td><code>Esquema (Schema)</code></td><td>La definición formal de la estructura de tus datos. Qué campos existen y qué tipos tienen.</td></tr><tr><td><code>BaseModel</code></td><td>Clase base de Pydantic. Al heredar de ella, tu clase gana constructor automático, serialización (<code>.model_dump()</code>), y validación de tipos sin escribir código extra.</td></tr><tr><td><code>Type Hinting</code></td><td>Sintaxis de Python (<code>x: int</code>) para indicar el tipo de dato esperado. Pydantic usa esto para saber cómo validar.</td></tr><tr><td><code>Coerción</code></td><td>La conversión automática y forzada de un tipo de dato a otro (ej. String -> Integer) para cumplir con el esquema.</td></tr><tr><td><code>Field</code></td><td>Función de Pydantic para añadir restricciones (<code>gt</code>, <code>le</code>, <code>min_length</code>) y metadatos (<code>description</code>) a cada campo de un modelo.</td></tr><tr><td><code>Optional / Nullable</code></td><td><code>Optional[float] = None</code> o <code>float | None = None</code>. Permite que un campo sea explícitamente nulo, crucial para representar datos faltantes en estadística.</td></tr><tr><td><code>@field_validator</code></td><td>Decorador para lógica personalizada. <code>mode='before'</code> limpia datos antes de la validación de tipo; <code>mode='after'</code> aplica reglas de negocio post-tipado.</td></tr><tr><td><code>Declarativo</code></td><td>Estilo de programación donde describes QUÉ quieres lograr (ej. 'edad > 18') en lugar de CÓMO hacerlo paso a paso.</td></tr></tbody></table></>) }]} />

            <div className="prose-lp">
                <h3>La Receta Exacta y la Cocina Aislada</h3>

                <p>Tu código no vive en el vacío; vive sobre una montaña de librerías (pandas, numpy, scikit-learn). Pero... ¿Qué pasa si el Proyecto A necesita `pandas 1.0` y el Proyecto B necesita `pandas 2.0`? Si instalas todo globalmente, tendrás un conflicto (<span class='tooltip'>Dependency Hell<span class='tooltip-text'>Situación donde paquetes incompatibles rompen tu entorno.</span></span>).</p>
                <p>Para evitar esto, usamos <span class='tooltip'>Entornos Virtuales (venv)<span class='tooltip-text'>Una carpeta aislada que contiene su propia copia de Python y librerías para un proyecto específico.</span></span>.</p>

                <Box type="tip" label="Analogía">
                <p>• <strong>Global:</strong> Una sola cocina comunitaria donde todos cocinan a la vez. Si alguien tira sal al puré, ¡arruina el pastel de al lado!<br />• <strong>Entorno Virtual:</strong> Cada chef tiene su propia cocina privada y cerrada. Lo que pasa en la cocina A, se queda en la cocina A.</p>
                </Box>

                <Box type="warn" label="Práctica Vital">
                <p>Nunca uses `pip install` en tu sistema global. Crea siempre un entorno virtual (`python -m venv .venv`) antes de empezar.</p>
                </Box>

                <table><thead><tr><th>Opción</th><th>A favor</th><th>En contra</th><th>Mejor para</th></tr></thead><tbody><tr><td>Instalación Global 🌍</td><td><ul><li>Fácil al principio (solo `pip install`)</li></ul></td><td><ul><li>Conflictos de versiones entre proyectos</li><li>Rompe el sistema operativo</li><li>Irreproducible</li></ul></td><td>Nada (Evitar siempre)</td></tr><tr><td>Entorno Virtual 📦</td><td><ul><li>Aislamiento total</li><li>Reproducible (requirements.txt)</li><li>Seguro</li></ul></td><td><ul><li>Requiere pasos extra (activar)</li></ul></td><td>Todos los proyectos de Python</td></tr></tbody></table>

                <CodeBlock title="Flujo de Trabajo Profesional" lang="bash" code={`# 1. CREAR el entorno virtual (solo una vez)
                # (Esto crea una carpeta .venv oculta)
                python -m venv .venv

                # 2. ACTIVAR el entorno (Cada vez que trabajes)
                # Mac/Linux:
                source .venv/bin/activate
                # Windows:
                # .\\.venv\\Scripts\\activate

                # (Verás que tu terminal cambia: "(.venv) user@mac:~$")

                # 3. INSTALAR librerías (Se guardan en .venv, no en el sistema)
                pip install pandas==2.0.3 numpy scikit-learn

                # 4. CONGELAR versiones para compartir
                pip freeze > requirements.txt

                # --- Contenido generado en requirements.txt ---
                # numpy==1.24.3
                # pandas==2.0.3
                # ...`} />

                <h3>El Poder de las Funciones</h3>

                <p>Una función es un bloque de código reutilizable que realiza una tarea específica. En lugar de copiar y pegar el mismo código (lo cual es propenso a errores), definimos una función y la llamamos cuando la necesitamos. Esto sigue el principio DRY: <strong>Don't Repeat Yourself</strong>.</p>
                <p><strong>Estructura:</strong><br />• <code>def</code>: La palabra clave para definirla.<br />• <strong>Nombre:</strong> Descriptivo y en <code>snake_case</code>.<br />• <strong>Argumentos:</strong> Los 'ingredientes' que recibe entre paréntesis.<br />• <strong>Cuerpo:</strong> El código indentado que ejecuta.<br />• <code>return</code>: El valor que 'devuelve' al final.</p>

                <Box type="tip" label="La Receta de Cocina">
                <p>Imagina una función como una máquina de hacer pasta.<br />• <strong>Input (Argumentos):</strong> Harina y huevos.<br />• <strong>Proceso (Cuerpo):</strong> Mezclar, amasar, cortar.<br />• <strong>Output (Return):</strong> Fettuccine fresco.<br />Tú no necesitas saber cómo funciona la máquina por dentro cada vez que la usas; solo le das los ingredientes y obtienes el resultado.</p>
                </Box>

                <Box type="warn" label="Scope (Alcance)">
                <p>Las variables creadas <em>dentro</em> de una función son locales; no existen fuera de ella. ¡Es como lo que pasa en Las Vegas!</p>
                </Box>

                <table><thead><tr><th>Opción</th><th>A favor</th><th>En contra</th><th>Mejor para</th></tr></thead><tbody><tr><td>Copy-Paste 📋</td><td><ul><li>Rápido para una vez</li></ul></td><td><ul><li>Código duplicado</li><li>Difícil de mantener</li><li>Errores se multiplican</li></ul></td><td>Nunca en producción</td></tr><tr><td>Funciones 🛠️</td><td><ul><li>Reutilizable</li><li>Legible</li><li>Fácil de testear</li></ul></td><td><ul><li>Requiere pensar la abstracción</li></ul></td><td>Todo bloque de lógica repetida</td></tr></tbody></table>

                return Number.isInteger(saved) && saved >= 0 ? saved : 0;
            });
            // La barra es hermana flex del contenido: no lo superpone, lo
            // COMPRIME. Abierta ocupa 18 rem, así que en un viewport de 375 px
            // dejaría el texto en 79 px, ilegible. Arranca abierta solo desde
            // el punto de corte `lg` de Tailwind, que es el que usa `irA` para
            // cerrarla al navegar.
            const [sidebarOpen, setSidebarOpen] = useState(() => window.innerWidth >= 1024);

            const safeIndex = Math.min(activeLessonIndex, curriculum.length - 1);
            const activeLesson = curriculum[safeIndex];
            const ActiveComponent = activeLesson.component;
            const progreso = Math.round(((safeIndex + 1) / curriculum.length) * 100);

            useEffect(() => {
                localStorage.setItem(CONFIG.storageKey, String(safeIndex));
                typesetMath();
                const cont = document.getElementById('contenido-scroll');
                if (cont) cont.scrollTo({ top: 0, behavior: 'smooth' });
            }, [safeIndex]);

            const irA = (idx) => {
                setActiveLessonIndex(idx);
                if (window.innerWidth < 1024) setSidebarOpen(false);
            };

            return (
                <div className="flex h-screen overflow-hidden relative">
                    <button onClick={() => setSidebarOpen(p => !p)}
                        className="fixed top-4 left-4 z-50 p-2.5 rounded-full shadow-lg text-white transition-all hover:scale-110 lp-gradient"
                        title={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'} aria-label={sidebarOpen ? 'Ocultar menú' : 'Mostrar menú'}>
                        <i className={`fas ${sidebarOpen ? 'fa-times' : 'fa-bars'} text-sm`}></i>
                    </button>

                    {sidebarOpen && <div className="fixed inset-0 bg-black/20 z-30 lg:hidden" onClick={() => setSidebarOpen(false)} />}

                    <aside className="flex-shrink-0 overflow-y-auto z-40 flex flex-col lp-header"
                        style={{
                            width: sidebarOpen ? '18rem' : '0', minWidth: sidebarOpen ? '18rem' : '0',
                            opacity: sidebarOpen ? 1 : 0, transition: 'width 0.3s ease, min-width 0.3s ease, opacity 0.25s ease',
                            overflow: sidebarOpen ? 'visible auto' : 'hidden'
                        }}>
                        <div className="p-6 pt-16 border-b border-white/10">
                            {/* contraste-ok: el gold va sobre el navy de `lp-header`, no sobre el fondo claro */}
                            <p className="text-[0.65rem] uppercase tracking-widest text-gold font-bold">Universidad Santo Tomás</p>
                            <h1 className="text-white font-bold text-lg tracking-tight mt-1">
                                {CONFIG.asignatura}
                            </h1>
                            <p className="text-xs text-white/60 mt-1">
                                Capítulo {CONFIG.numero} · <span className="text-secondary font-semibold">{CONFIG.titulo}</span>
                            </p>
                        </div>

                        <nav className="p-4 space-y-2 flex-1">
                            {curriculum.map((lesson, idx) => (
                                <button key={lesson.id} onClick={() => irA(idx)}
                                    className={`w-full flex items-start gap-3 px-3 py-3 text-sm rounded-lg transition-all text-left ${safeIndex === idx ? 'text-white shadow-lg lp-gradient' : 'text-white/60 hover:text-white hover:bg-white/10'}`}>
                                    <span className="flex-shrink-0 mt-0.5" style={{ width: 18, height: 18 }}>{renderIcon(lesson.icon, 18)}</span>
                                    <span className="font-medium leading-tight break-words">{lesson.title}</span>
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 text-[10px] text-white/40 border-t border-white/10">
                            <p>{CONFIG.ra} · {CONFIG.horas} horas</p>
                            <p>Pseudocódigo · Python · R · VBA</p>
                        </div>
                    </aside>

                    <main className="flex-1 flex flex-col overflow-hidden bg-bg">
                        <div className="h-1.5 bg-gray-200 flex-shrink-0">
                            <div className="h-full lp-gradient transition-all duration-500" style={{ width: `${progreso}%` }}></div>
                        </div>

                        <div id="contenido-scroll" className="flex-1 overflow-y-auto p-6 lg:p-12">
                            <div className="max-w-4xl mx-auto w-full">
                                <div className="mb-6 flex items-center justify-between flex-wrap gap-3">
                                    <span className="text-xs font-bold tracking-wider text-secondary uppercase">
                                        Lección {safeIndex + 1} de {curriculum.length} · {progreso} %
                                    </span>
                                    <div className="flex gap-2">
                                        <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full hover:bg-gray-100 disabled:opacity-30 transition-colors text-sm font-medium text-navy">
                                            {renderIcon('ChevronLeft', 18)} Anterior
                                        </button>
                                        <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                            className="flex items-center gap-1 px-3 py-2 rounded-full text-white lp-gradient disabled:opacity-30 transition-colors text-sm font-medium">
                                            Siguiente {renderIcon('ChevronRight', 18)}
                                        </button>
                                    </div>
                                </div>

                                <SectionHeader title={activeLesson.title} icon={Icons[activeLesson.icon]} />

                                {safeIndex === 0 && (
                                    <div className="mb-8 text-center bg-white p-7 rounded-2xl shadow-sm border border-gray-100">
                                        <p className="text-xs uppercase tracking-widest text-secondary font-bold mb-2">
                                            Capítulo {CONFIG.numero} · {CONFIG.horas} horas · {CONFIG.ra}
                                        </p>
                                        <h1 className="text-2xl font-bold text-primary mb-2">{CONFIG.titulo}</h1>
                                        <p className="text-gray-600 font-light">{CONFIG.subtitulo}</p>
                                        <div className="flex justify-center flex-wrap gap-2 mt-4 text-xs">
                                            {CONFIG.temas.map(t => (
                                                <span key={t} className="px-3 py-1 rounded-full bg-primary/10 text-primary">{t}</span>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                <div className="animate-fade-in" key={activeLesson.id}>
                                    <ActiveComponent />
                                </div>

                                <div className="mt-12 flex items-center justify-between gap-3">
                                    <button disabled={safeIndex === 0} onClick={() => setActiveLessonIndex(c => c - 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl border border-gray-300 bg-white hover:bg-gray-50 disabled:opacity-30 text-sm font-medium text-navy">
                                        {renderIcon('ChevronLeft', 18)}
                                        <span className="hidden sm:inline">{safeIndex > 0 ? curriculum[safeIndex - 1].title : 'Inicio'}</span>
                                        <span className="sm:hidden">Anterior</span>
                                    </button>
                                    <button disabled={safeIndex === curriculum.length - 1} onClick={() => setActiveLessonIndex(c => c + 1)}
                                        className="flex items-center gap-2 px-4 py-2.5 rounded-xl text-white lp-gradient hover:opacity-90 disabled:opacity-30 text-sm font-medium">
                                        <span className="hidden sm:inline">{safeIndex < curriculum.length - 1 ? curriculum[safeIndex + 1].title : 'Fin'}</span>
                                        <span className="sm:hidden">Siguiente</span>
                                        {renderIcon('ChevronRight', 18)}
                                    </button>
                                </div>

                                <footer className="mt-16 pt-8 border-t border-gray-200">
                                    <div className="lp-header rounded-xl p-6 text-center">
                                        <p className="text-white font-medium text-sm">
                                            <strong>Capítulo {CONFIG.numero} · {CONFIG.titulo}</strong>
                                        </p>
                                        <p className="text-xs mt-1 text-white/80 italic">
                                            {CONFIG.lema}
                                        </p>
                                        <p className="text-xs mt-2 text-white/70">
                                            Universidad Santo Tomás · {CONFIG.asignatura}
                                        </p>
                                        <p className="text-xs text-white/70">
                                            Docente y diseño del material: {CONFIG.docente}
                                        </p>
                                        <p className="text-[10px] mt-2 text-white/50">
                                            {CONFIG.notaPie}
                                        </p>
                                    </div>
                                </footer>
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
